---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>小红播霸</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* 原有样式保持不变 ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: transparent; }
        #app { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; transition: background 0.2s, color 0.2s; --bg-body: #0a0a0f; --bg-surface: #14141e; --bg-card: #1c1c26; --bg-card-hover: #252532; --bg-elevated: #1e1e2a; --border: #2c2c3a; --text-primary: #f0f0f3; --text-secondary: #a0a0b0; --text-muted: #6e6e80; --accent: #f97316; --accent-hover: #fd7e2e; --shadow-sm: 0 4px 12px rgba(0,0,0,0.3); --shadow-md: 0 8px 24px rgba(0,0,0,0.4); --radius-card: 10px; --radius-md: 16px; --radius-sm: 12px; background: var(--bg-body); color: var(--text-primary); }
        #app[data-theme="dark"] { --bg-body: #000000; --bg-surface: #0a0a0f; --bg-card: #111115; --bg-card-hover: #1a1a20; --bg-elevated: #15151c; --border: #2a2a33; --text-primary: #ffffff; --text-secondary: #c0c0cf; --text-muted: #8a8a99; --accent: #f97316; --accent-hover: #fd7e2e; --shadow-sm: 0 4px 12px rgba(0,0,0,0.5); --shadow-md: 0 8px 24px rgba(0,0,0,0.6); }
        #app[data-theme="light"] { --bg-body: #f8fafc; --bg-surface: #ffffff; --bg-card: #ffffff; --bg-card-hover: #f8fafc; --bg-elevated: #f1f5f9; --border: #e2e8f0; --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #64748b; --accent: #f97316; --accent-hover: #ea580c; --shadow-sm: 0 2px 6px rgba(0,0,0,0.05); --shadow-md: 0 8px 20px rgba(0,0,0,0.08); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .view { transition: opacity 0.2s; }
        .view.hidden { display: none; }
        .toolbar { background: transparent; padding: 8px 0 12px 0; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: thin; }
        .toolbar::-webkit-scrollbar { height: 3px; }
        .toolbar select, .toolbar input, .toolbar button { border-radius: 40px; padding: 8px 16px; font-weight: 500; font-size: 13px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); outline: none; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
        .toolbar select { min-width: 140px; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236e6e80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 12px center; appearance: none; padding-right: 36px; }
        .toolbar input { max-width: 200px; flex: 1; }
        .toolbar button { background: var(--accent); border: none; color: white; cursor: pointer; font-weight: 600; }
        .toolbar button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .toolbar .secondary-btn { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .toolbar .secondary-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
        .status-bar { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 24px; padding: 0; background: transparent; border: none; box-shadow: none; }
        .cat-filters { display: flex; gap: 8px; align-items: center; width: 100%; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
        .cat-filters::-webkit-scrollbar { height: 3px; }
        .cat-badge { background: var(--bg-elevated); padding: 3px 6px; border-radius: 40px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); transition: all 0.1s; white-space: nowrap; flex-shrink: 0; color: var(--text-primary); }
        .cat-badge.active, .cat-badge:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .action-buttons { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
        .action-buttons button { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 40px; padding: 3px 6px; cursor: pointer; color: var(--text-primary); font-size: 13px; white-space: nowrap; flex-shrink: 0; }
        .action-buttons button:hover { background: var(--accent); color: white; }
        /* ========== 新增高亮样式 ========== */
        .action-buttons button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        /* ================================ */
        .clear-all-btn { background: #e74c3c !important; color: white !important; border: none !important; }
        .clear-all-btn:hover { background: #c0392b !important; }
        .video-grid { display: grid; gap: 10px; margin-top: 8px; }
        @media (max-width: 767px) { .video-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; } }
        @media (min-width: 768px) { .video-grid { grid-template-columns: repeat(6, 1fr); gap: 10px; } }
        .video-card { background: var(--bg-card); border-radius: var(--radius-card); overflow: hidden; cursor: pointer; transition: all 0.25s ease; border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: relative; }
        .video-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); border-color: var(--accent); }
        .video-poster { aspect-ratio: 2/3; width: 100%; object-fit: cover; background: linear-gradient(145deg, #2a2a35, #1a1a22); display: block; }
        .video-info { padding: 12px; }
        .video-title-row { display: flex; align-items: flex-start; gap: 6px; }
        .fav-home-btn { background: transparent; border: none; font-size: 16px; cursor: pointer; transition: transform 0.1s; padding: 2px 0; color: var(--text-secondary); flex-shrink: 0; line-height: 1.4; }
        .fav-home-btn:hover { transform: scale(1.1); color: var(--accent); }
        .video-title { font-weight: 600; font-size: 13px; line-height: 1.4; color: var(--text-primary); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .video-progress {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .delete-item-btn { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border: none; border-radius: 30px; width: 28px; height: 28px; font-size: 16px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: 0.1s; }
        .delete-item-btn:hover { background: #e74c3c; }
        .source-label { position: absolute; top: 6px; right: 6px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.8); font-size: 10px; background: transparent; border: none; z-index: 2; max-width: calc(100% - 50px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 36px; flex-wrap: wrap; }
        .pagination button { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 14px; border-radius: 40px; cursor: pointer; font-weight: 500; transition: all 0.1s; }
        .pagination button.active { background: var(--accent); border-color: var(--accent); color: white; }
        .pagination button:hover:not(:disabled) { background: var(--accent-hover); color: white; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .player-layout { display: flex; flex-direction: column; gap: 28px; }
        .player-container { background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
        .video-detail { background: var(--bg-surface); border-radius: var(--radius-md); padding: 24px; border: 1px solid var(--border); }
        .detail-header { display: flex; gap: 24px; flex-wrap: wrap; }
        .detail-poster { width: 140px; border-radius: var(--radius-sm); aspect-ratio: 2/3; object-fit: cover; box-shadow: var(--shadow-sm); }
        .detail-info { flex: 1; }
        .detail-title { font-size: 26px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
        .detail-meta { display: flex; gap: 20px; flex-wrap: wrap; margin: 12px 0; color: var(--text-secondary); font-size: 14px; }
        .detail-desc { margin-top: 16px; line-height: 1.5; color: var(--text-secondary); font-size: 14px; }
        .episodes-section { margin-top: 28px; }
        .episodes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
        .source-switch { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 40px; padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--text-primary); }
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 10px; max-height: 340px; overflow-y: auto; padding: 4px 0; }
        .episode-item { background: var(--bg-elevated); border-radius: 40px; padding: 6px 10px; font-size: 13px; cursor: pointer; transition: all 0.1s; border: 1px solid var(--border); color: var(--text-secondary); }
        .episode-item:hover, .episode-item.current-ep { background: var(--accent); color: white; border-color: var(--accent); }
        .back-home { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: var(--bg-card); padding: 8px 20px; border-radius: 40px; cursor: pointer; width: fit-content; border: 1px solid var(--border); font-weight: 500; transition: 0.1s; color: var(--text-primary); }
        .back-home:hover { background: var(--accent); color: white; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); background: var(--bg-surface); border-radius: var(--radius-md); }
        .preload-bar { height: 3px; background: var(--border); border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
        .preload-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
        .copyright { text-align: center; margin-top: 40px; padding: 12px 0; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }
        .copyright a { color: var(--accent); text-decoration: none; }
        .copyright a:hover { text-decoration: underline; }
        @media (max-width: 640px) { #app { padding: 10px; } .detail-header { flex-direction: column; align-items: center; text-align: center; } .toolbar { padding: 6px 0; gap: 8px; } .toolbar select, .toolbar input, .toolbar button { padding: 3px 6px; font-size: 12px; } .toolbar select { min-width: 100px; } .toolbar input { max-width: 100px; } .delete-item-btn { width: 24px; height: 24px; font-size: 14px; top: 6px; left: 6px; } .source-label { font-size: 9px; top: 4px; right: 4px; } .copyright { margin-top: 30px; } }
    </style>
</head>
<body>
<div id="app" data-theme="dark">
    <!-- 首页视图 -->
    <div id="homeView" class="view">
        <div class="toolbar">
            <select id="sourceSelect"></select>
            <input type="text" id="searchInput" placeholder="影片名">
            <button id="searchBtn">🔍 搜索</button>
            <button id="stopSearchBtn" style="display:none">⏹️ 停止</button>
            <button id="themeToggleBtn" class="secondary-btn" title="切换主题"></button>
        </div>
        <div class="preload-bar" id="preloadBar" style="display:none"><div class="preload-fill" id="preloadFill"></div></div>
        <div class="status-bar">
            <div id="catBar" class="cat-filters"></div>
            <div class="action-buttons">
                <button id="historyBtn">🕒 最近</button>
                <button id="favoritesBtn">❤️ 收藏</button>
                <button id="bookmarksBtn">📌 影签</button>
                <button id="searchResultBtn">🔍 结果</button>
                <button id="clearSpecialBtn" class="clear-all-btn" style="display:none;">清空</button>
            </div>
        </div>
        <div id="homeContent" class="video-grid"></div>
        <div id="homePagination" class="pagination"></div>
        <div id="footer" style="text-align:center; margin-top:40px; font-size:12px; color:var(--text-muted);"></div>
    </div>

    <!-- 播放页视图 -->
    <div id="playerView" class="view hidden">
        <div class="back-home" id="backHomeBtn">← 返回首页</div>
        <div class="player-layout">
            <div class="player-container">
                <video id="detailPlayer" style="width:100%;height:100%;display:block" controls playsinline></video>
            </div>
            <div class="video-detail">
                <div class="detail-header">
                    <img id="detailPoster" class="detail-poster" alt="海报">
                    <div class="detail-info">
                        <div class="detail-title" id="detailTitle"></div>
                        <div class="detail-meta">
                            <span id="detailEpCount"></span>
                            <span id="detailPlayable"></span>
                            <span id="detailSource"></span>
                        </div>
                        <div class="detail-desc" id="detailDesc"></div>
                        <div style="margin-top: 20px; gap: 12px;">
                            <button id="detailBookmarkBtn" style="background:var(--bg-elevated); border:none; padding:8px 18px; border-radius:40px; cursor:pointer; font-weight:500; color:var(--text-primary);">📌 影签</button>
                            <button id="detailNextEpBtn" style="background:var(--bg-elevated); border:1px solid var(--border); padding:8px 18px; border-radius:40px; cursor:pointer; color:var(--text-primary);">⏩ 下集</button>
                        </div>
                    </div>
                </div>
                <div class="episodes-section">
                    <div class="episodes-header">
                        <span style="font-weight:600;">📺 剧集列表</span>
                        <select id="sourceSwitchSelect" class="source-switch"></select>
                    </div>
                    <div id="episodesList" class="episodes-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮播放器 -->
    <div id="floatPlayer" style="position:fixed; bottom:20px; right:20px; width:320px; background:rgba(0,0,0,0.9); border-radius:16px; display:none; z-index:9999;">
        <div style="display:flex; justify-content:space-between; padding:8px 12px; background:#16213e; border-radius:16px 16px 0 0;">
            <span id="floatTitle">浮窗播放</span>
            <div><button id="floatBackBtn" style="margin-right:8px;">←</button><button id="floatCloseBtn">✖</button></div>
        </div>
        <video id="floatVideo" style="width:100%; aspect-ratio:16/9;" playsinline></video>
    </div>

    <!-- 底部版权信息 -->
    <div class="copyright">
        小红播霸 by <a href="https://snowhoo.net" target="_blank" rel="noopener noreferrer">SnowHoo.NET</a> 小红故事 · <span id="currentYear"></span>
    </div>
</div>

<script>
(function(){
    // ---------- 存储与核心变量 ----------
    const STORAGE = { HISTORY:'tvbox_history', FAVORITES:'tvbox_favorites', BOOKMARKS:'tvbox_bookmarks', SEARCH:'tvbox_search_results', THEME:'tvbox_theme' };
    const PAGE_SIZE = 12, CONCURRENT = 10;
    let sourceIndex=[], loadedSources={}, sourceMeta={}, currentData=null, currentPrefix='', currentFilePage=1, currentPage=1, currentFiltered=[], currentCategory='';
    let currentSearchKeyword='', currentSearchResults=[], currentSearchCategory='', isSearching=false, searchVersion=0;
    let currentPlayingVideo=null, currentPlayingEpIndex=0, currentOpenVideo=null, currentEpNext=null, currentHls=null, playerInFloat=false;
    
    let fullVideosCache = {};
    let currentSpecialType = null;
    let currentSpecialFullData = [];
    let currentSpecialCategory = '';
    let currentView = 'home';
    let currentPlayerVideo = null;
    let currentPlayerEpisodes = [];
    let currentPlayerSourceKey = '';
    let currentPlayerSourceName = '';
    
    // 新增：用于续播的临时变量
    let pendingRestoreEpIndex = null;
    let pendingRestoreProgress = null;

    // DOM 元素
    const homeView = document.getElementById('homeView');
    const playerView = document.getElementById('playerView');
    const sourceSelect = document.getElementById('sourceSelect');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const stopSearchBtn = document.getElementById('stopSearchBtn');
    const themeToggle = document.getElementById('themeToggleBtn');
    const historyBtn = document.getElementById('historyBtn');
    const favoritesBtn = document.getElementById('favoritesBtn');
    const bookmarksBtn = document.getElementById('bookmarksBtn');
    const searchResultBtn = document.getElementById('searchResultBtn');
    const clearSpecialBtn = document.getElementById('clearSpecialBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const catBar = document.getElementById('catBar');
    const homeContent = document.getElementById('homeContent');
    const homePagination = document.getElementById('homePagination');
    const preloadBar = document.getElementById('preloadBar');
    const preloadFill = document.getElementById('preloadFill');
    const detailPlayer = document.getElementById('detailPlayer');
    const detailPoster = document.getElementById('detailPoster');
    const detailTitle = document.getElementById('detailTitle');
    const detailEpCount = document.getElementById('detailEpCount');
    const detailPlayable = document.getElementById('detailPlayable');
    const detailSource = document.getElementById('detailSource');
    const detailDesc = document.getElementById('detailDesc');
    const detailBookmarkBtn = document.getElementById('detailBookmarkBtn');
    const detailNextEpBtn = document.getElementById('detailNextEpBtn');
    const episodesList = document.getElementById('episodesList');
    const sourceSwitchSelect = document.getElementById('sourceSwitchSelect');
    
    const $ = id => document.getElementById(id);
    const escHtml = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const escAttr = s => String(s).replace(/[&"']/g, m => ({'&':'&amp;','"':'&quot;',"'":'&#39;'}[m]));
    const setStatus = txt => { const st = document.getElementById('statusText'); if(st) st.textContent = txt; };
    
    // 辅助函数：格式化时间（秒 -> 分:秒 或 时:分:秒）
    function formatTime(sec) {
        if (!sec || sec <= 0) return '';
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        return `${m}:${s.toString().padStart(2,'0')}`;
    }
    
    // 设置当前年份
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    
    // 主题
    function initTheme() {
        const saved = localStorage.getItem(STORAGE.THEME);
        const wrap = document.getElementById('app');
        let theme = saved || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        wrap.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        themeToggle.title = theme === 'dark' ? '切换到明亮模式' : '切换到暗黑模式';
    }
    function toggleTheme() {
        const wrap = document.getElementById('app');
        const cur = wrap.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        wrap.setAttribute('data-theme', next);
        localStorage.setItem(STORAGE.THEME, next);
        themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        themeToggle.title = next === 'dark' ? '切换到明亮模式' : '切换到暗黑模式';
    }
    themeToggle.addEventListener('click', toggleTheme);
    initTheme();
    
    // 高亮顶部按钮
    function setActiveButton(type) {
        [historyBtn, favoritesBtn, bookmarksBtn, searchResultBtn].forEach(btn => btn.classList.remove('active'));
        if (type === '__history__') historyBtn.classList.add('active');
        else if (type === '__favorites__') favoritesBtn.classList.add('active');
        else if (type === '__bookmarks__') bookmarksBtn.classList.add('active');
        else if (type === '__search_result__') searchResultBtn.classList.add('active');
    }
    
    // 存储操作
    const getStorage = key => { try{ return JSON.parse(localStorage.getItem(key))||(key===STORAGE.HISTORY?{}:[]); }catch(e){ return key===STORAGE.HISTORY?{}:[]; } };
    const setStorage = (key,val) => localStorage.setItem(key,JSON.stringify(val));
    const saveHistory = (key,val) => { let h=getStorage(STORAGE.HISTORY); h[key]=val; setStorage(STORAGE.HISTORY,h); };
    const isFavorited = (k,n) => getStorage(STORAGE.FAVORITES).some(f=> f.videoName===n && (!f.sourceKey||!k||f.sourceKey===k));
    const addFavorite = (v) => { if(isFavorited(v.sourceKey, v.vod_name)) return; let fav=getStorage(STORAGE.FAVORITES); fav.push({ videoName:v.vod_name, sourceKey:v.sourceKey, sourceName:v.sourceName, vodPic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class }); setStorage(STORAGE.FAVORITES,fav); };
    const removeFavorite = (k,n) => setStorage(STORAGE.FAVORITES, getStorage(STORAGE.FAVORITES).filter(f=> !(f.videoName===n && (!f.sourceKey||!k||f.sourceKey===k))));
    const getBookmarks = () => getStorage(STORAGE.BOOKMARKS);
    const saveBookmarks = list => setStorage(STORAGE.BOOKMARKS,list);
    const addBookmark = (video,epIdx,prog,note) => { 
        let list=getBookmarks();
        let fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
        let epsCopy=fresh.episodes?fresh.episodes.map(e=>({title:e.title,url:e.url,playable:e.playable})):[];
        list.unshift({ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||epsCopy.length, playable_count:fresh.playable_count||epsCopy.filter(e=>e.playable).length, episodes:epsCopy, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, note:note||'', createdAt:Date.now() }); 
        saveBookmarks(list);
    };
    const updateHistory = (video,epIdx,prog) => { 
        let key=video.sourceKey+'_'+video.vod_name;
        let fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
        let eps=fresh.episodes?fresh.episodes.map(e=>({title:e.title,url:e.url,playable:e.playable})):[];
        saveHistory(key,{ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||eps.length, playable_count:fresh.playable_count||eps.filter(e=>e.playable).length, episodes:eps, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, updatedAt:Date.now() });
    };
    function findVideoInCache(sKey,vName){
        for(let k in loadedSources){
            let d=loadedSources[k];
            if(d?.videos){
                let f=d.videos.find(v=>v.vod_name===vName);
                if(f) return f;
            }
        }
        return null;
    }
    
    // IndexedDB 缓存
    let CACHE_DB = null, CACHE_READY = false;
    function initCacheDB(cb){
        if(CACHE_READY && CACHE_DB){ cb(CACHE_DB); return; }
        let req = indexedDB.open('tvbox_cache', 1);
        req.onupgradeneeded = e => { e.target.result.createObjectStore('files', { keyPath: 'file' }); };
        req.onsuccess = e => { CACHE_DB = e.target.result; CACHE_READY = true; cb(CACHE_DB); };
        req.onerror = () => { CACHE_DB=null; CACHE_READY=true; cb(null); };
    }
    function loadFromCache(file, cb){
        initCacheDB(db=>{ if(!db){ cb(null); return; }
            let tx = db.transaction('files','readonly'), req = tx.objectStore('files').get(file);
            req.onsuccess = ()=> cb(req.result?._d || null);
            req.onerror = ()=> cb(null);
        });
    }
    function saveToCache(file, data){
        if(!data) return;
        initCacheDB(db=>{ if(!db) return;
            let entry = { file:file, _d:data, _t:Date.now() };
            let tx = db.transaction('files','readwrite');
            tx.objectStore('files').put(entry);
        });
    }
    function loadData(file, cb, to=4000){
        if(file !== 'index.js'){
            loadFromCache(file, cached => {
                if(cached){
                    if(!loadedSources[file]) loadedSources[file] = cached;
                    setTimeout(()=> cb(cached), 0);
                    loadFresh(file, null);
                    return;
                }
                loadFresh(file, cb, to);
            });
        } else loadFresh(file, cb, to);
    }
    function loadFresh(file, cb, to=4000){
        let key = file==='index.js'?'_TVBOX_INDEX':'_TVBOX_SITE_DATA';
        let s = document.createElement('script');
        let t = setTimeout(()=>{ s.onerror=s.onload=null; s.remove(); if(cb) cb(null); }, to);
        s.onerror = ()=>{ clearTimeout(t); if(cb) cb(null); };
        s.onload = ()=>{
            clearTimeout(t);
            let d = window[key]; delete window[key];
            if(d && file !== 'index.js') saveToCache(file, d);
            if(d) loadedSources[file] = d;
            if(cb) cb(d);
        };
        let bp = (typeof window.__SC_BASE_PATH !== 'undefined' ? window.__SC_BASE_PATH : '');
        s.src = bp + 'data/' + file;
        document.head.appendChild(s);
    }
    
    function startPreload(){
        if(!sourceIndex.length) return;
        let files=new Set();
        sourceIndex.forEach(s=>{ let pc=s.page_count||1, base=(sourceMeta[s.prefix]?.fileBase)||s.prefix;
            for(let i=1;i<=pc;i++) files.add(base+'-'+String(i).padStart(2,'0')+'.js');
        });
        let arr=Array.from(files);
        let total=arr.length, done=0;
        preloadBar.style.display='block';
        arr.forEach(f=>{
            loadFromCache(f, cached=>{ if(cached && !loadedSources[f]) loadedSources[f]=cached; done++; preloadFill.style.width = Math.floor(done/total*100)+'%'; if(done===total) setTimeout(()=>{ preloadBar.style.display='none'; }, 400); });
        });
    }
    
    // 搜索
    function doSearch(){
        let kw=searchInput.value.trim();
        if(!kw) return;
        if(isSearching) stopSearch();
        currentSearchKeyword=kw; currentSearchResults=[]; currentSearchCategory=''; isSearching=true; searchVersion++;
        let ver=searchVersion;
        searchBtn.style.display='none'; stopSearchBtn.style.display='inline';
        renderHomeSearch(true);
        if(!sourceIndex.length){ let wait=setInterval(()=>{ if(sourceIndex.length){ clearInterval(wait); searchImpl(kw,ver); } },200); }
        else searchImpl(kw,ver);
    }
    function searchImpl(kw,ver){
        let tasks=[];
        sourceIndex.forEach(src=>{ let pc=src.page_count||1; for(let p=1;p<=pc;p++){ let base=(sourceMeta[src.prefix]?.fileBase)||src.prefix; tasks.push({ fname:base+'-'+String(p).padStart(2,'0')+'.js' }); } });
        let results=[], doneCount=0, total=tasks.length, needRender=false, idx=0, running=0;
        function searchOne(data,fname){
            if(data?.videos){
                data.videos.forEach(v=>{ if(v.vod_name.includes(kw)||(v.vod_class||'').includes(kw)){ results.push({ vod_name:v.vod_name, vod_pic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class, sourceKey:fname, sourceName:data.name }); needRender=true; } });
            }
        }
        function flushRender(){ if(ver===searchVersion && needRender){ currentSearchResults=results.slice(); renderHomeSearch(false); needRender=false; } }
        function finish(){
            if(ver!==searchVersion) return;
            isSearching=false;
            searchBtn.style.display='inline';
            stopSearchBtn.style.display='none';
            if(currentSearchResults.length){
                searchResultBtn.click();
            } else {
                renderSpecialView('__search_result__');
            }
        }
        function loadNext(){
            if(ver!==searchVersion) return;
            while(idx<tasks.length && running<CONCURRENT){
                let task=tasks[idx++];
                if(loadedSources[task.fname]){ searchOne(loadedSources[task.fname],task.fname); doneCount++; flushRender(); loadNext(); }
                else{
                    running++;
                    loadData(task.fname, data=>{ if(data) loadedSources[task.fname]=data; if(data) searchOne(data,task.fname); doneCount++; running--; flushRender(); loadNext(); },5000);
                }
            }
            if(idx>=tasks.length && running===0) finish();
        }
        for(let i=0;i<CONCURRENT;i++) loadNext();
    }
    function stopSearch(){ if(!isSearching) return; searchVersion++; isSearching=false; searchBtn.style.display='inline'; stopSearchBtn.style.display='none'; if(currentSearchKeyword) renderHomeSearch(false); }
    
    function renderHomeSearch(loading){
        if(loading && (!currentSearchResults.length||isSearching)){
            homeContent.innerHTML='<div class="empty-state">🔍 搜索中，请稍候...</div>';
            homePagination.innerHTML=''; catBar.innerHTML=''; setStatus('搜索中...');

            clearSpecialBtn.style.display = 'none';

        }

    // 全量分类统计
    function ensureFullCategoryStats(prefix, callback) {
        if (fullVideosCache[prefix] && fullVideosCache[prefix].ready) {
            if (callback) callback(fullVideosCache[prefix]);
            return;
        }
        const meta = sourceMeta[prefix];
        if (!meta) { if(callback) callback(null); return; }
        const pageCount = meta.page_count || 1;
        const baseFile = (meta.fileBase) || prefix;
        let allVideos = [];
        let catMap = {};
        let totalVideos = 0;
        let playableVideos = 0;
        let loadedPages = 0;
        
        function processPage(p) {
            if (p > pageCount) {
                fullVideosCache[prefix] = {
                    videos: allVideos,
                    categories: catMap,
                    total: totalVideos,
                    playable: playableVideos,
                    ready: true
                };
                if (callback) callback(fullVideosCache[prefix]);
                return;
            }
            const fname = baseFile + '-' + String(p).padStart(2, '0') + '.js';
            if (loadedSources[fname]) {
                collectFromPage(loadedSources[fname], fname);
                loadedPages++;
                processPage(p+1);
            } else {
                loadData(fname, function(data) {
                    if (data) loadedSources[fname] = data;
                    if (data) collectFromPage(data, fname);
                    loadedPages++;
                    processPage(p+1);
                }, 5000);
            }
        }
        
        function collectFromPage(data, fname) {
            if (!data?.videos) return;
            totalVideos += data.videos.length;
            data.videos.forEach(v => {
                if (v.playable_count > 0) playableVideos++;
                allVideos.push({
                    vod_name: v.vod_name,
                    vod_pic: v.vod_pic,
                    ep_count: v.ep_count,
                    playable_count: v.playable_count,
                    episodes: v.episodes,
                    vod_class: v.vod_class,
                    sourceKey: fname,
                    sourceName: data.name
                });
                let cls = v.vod_class;
                if (Array.isArray(cls)) cls = cls.join(',');
                cls = (cls || '').trim();
                if (!cls) {
                    catMap['未分类'] = (catMap['未分类'] || 0) + 1;
                } else {
                    cls.split(',').forEach(c => {
                        let cc = c.trim();
                        if (cc) catMap[cc] = (catMap[cc] || 0) + 1;
                    });
                }
            });
        }
        
        processPage(1);
    }
    
    function buildFullCatBar(prefix) {
        const cache = fullVideosCache[prefix];
        if (!cache || !cache.ready) {
            catBar.innerHTML = '<span class="cat-badge">统计分类中...</span>';
            return;
        }
        const cats = cache.categories;
        let html = '';
        html += `<span class="cat-badge ${currentCategory === '' ? 'active' : ''}" data-cat="">全部 (${cache.total})</span>`;
        Object.keys(cats).sort((a,b) => cats[b] - cats[a]).forEach(c => {
            html += `<span class="cat-badge ${currentCategory === c ? 'active' : ''}" data-cat="${c.replace(/&/g,'&amp;')}">${c} (${cats[c]})</span>`;
        });
        catBar.innerHTML = html;
        document.querySelectorAll('.cat-badge').forEach(el => {
            el.addEventListener('click', () => {
                const cat = el.dataset.cat || '';
                filterByCategory(prefix, cat);
            });
        });
    }
    
    function filterByCategory(prefix, category) {
        const cache = fullVideosCache[prefix];
        if (!cache || !cache.ready) {
            setStatus('分类数据加载中，请稍后...');
            return;
        }
        currentCategory = category;
        let filteredVideos = [];
        if (category === '') {
            filteredVideos = cache.videos.slice();
        } else if (category === '未分类') {
            filteredVideos = cache.videos.filter(v => !(v.vod_class || '').trim());
        } else {
            filteredVideos = cache.videos.filter(v => {
                let cls = v.vod_class || '';
                if (Array.isArray(cls)) cls = cls.join(',');
                return cls.split(',').some(c => c.trim() === category);
            });
        }
        currentFiltered = filteredVideos;
        currentPage = 1;
        renderHomeGrid();
        setStatus(`${category || '全部'}分类 · 共 ${filteredVideos.length} 部影片`);
        document.querySelectorAll('.cat-badge').forEach(el => {
            const catVal = el.dataset.cat || '';
            if (catVal === category) el.classList.add('active');
            else el.classList.remove('active');
        });
    }
    
    function switchSource(){
        if(isSearching) stopSearch();
        let val=sourceSelect.value;
        if(!val || val === '') return;
        currentPrefix=val; 
        currentFilePage=1; 
        currentPage=1; 
        searchInput.value='';
        clearSpecialBtn.style.display = 'none';
        currentCategory = '';
        currentSpecialType = null;
        setActiveButton(null);
        
        homeContent.innerHTML='<div class="empty-state">⏳ 加载数据中...</div>';
        catBar.innerHTML = '<span class="cat-badge">统计分类中...</span>';
        
        const meta = sourceMeta[val];
        if (meta) {
            const baseFile = (meta.fileBase) || val;
            const firstPageFile = baseFile + '-01.js';
            if (loadedSources[firstPageFile]) {
                useSourceDataQuick(loadedSources[firstPageFile], firstPageFile, 1);
            } else {
                loadData(firstPageFile, function(data) {
                    if (data) loadedSources[firstPageFile] = data;
                    useSourceDataQuick(data, firstPageFile, 1);
                });
            }
        }
        
        ensureFullCategoryStats(val, function(cache) {
            if (currentPrefix === val) {
                buildFullCatBar(val);
                if (currentCategory === '' && currentFiltered && currentFiltered.length !== cache.videos.length) {
                    currentFiltered = cache.videos.slice();
                    currentPage = 1;
                    renderHomeGrid();
                    setStatus(`${meta.name} — 共 ${cache.total} 部影片`);
                } else if (currentCategory !== '') {
                    filterByCategory(val, currentCategory);
                } else {
                    if (currentFiltered && currentFiltered.length !== cache.videos.length) {
                        currentFiltered = cache.videos.slice();
                        currentPage = 1;
                        renderHomeGrid();
                    }
                }
            }
        });
    }
    
    function useSourceDataQuick(data, file, page) {
        if (!data?.videos) { setStatus('数据格式错误'); return; }
        currentData = data;
        currentFilePage = page;
        currentFiltered = data.videos.map(v => ({ ...v, sourceKey: file, sourceName: data.name }));
        currentPage = 1;
        renderHomeGrid();
        setStatus(`${data.name} — 第${page}页（正在统计全部分类...）`);
    }
    
    // 播放页函数（增加续播支持）
    function openPlayerView(video){
        currentPlayerVideo = video;
        currentPlayerSourceKey = video.sourceKey;
        currentPlayerSourceName = video.sourceName;
        currentPlayerEpisodes = video.episodes || [];
        currentPlayingVideo = video;
        
        // 确定要播放的剧集索引和进度
        let restoreEp = (pendingRestoreEpIndex !== null && pendingRestoreEpIndex < currentPlayerEpisodes.length) ? pendingRestoreEpIndex : 0;
        let savedProgress = (pendingRestoreProgress !== null && pendingRestoreProgress > 0) ? pendingRestoreProgress : 0;
        currentPlayingEpIndex = restoreEp;
        
        detailPoster.src = video.vod_pic || '';
        detailTitle.textContent = video.vod_name;
        detailEpCount.textContent = `${video.ep_count || 0}集`;
        detailPlayable.textContent = `${video.playable_count || 0}可播放`;
        detailSource.textContent = `来源：${video.sourceName || '未知'}`;
        detailDesc.textContent = video.vod_class ? `分类：${video.vod_class}` : '暂无简介';
        renderEpisodesList();
        // 高亮当前剧集
        setTimeout(() => {
            let items = document.querySelectorAll('#episodesList .episode-item');
            if(items[restoreEp]) items[restoreEp].classList.add('current-ep');
        }, 50);
        buildSourceSwitchOptions();
        homeView.classList.add('hidden');
        playerView.classList.remove('hidden');
        currentView = 'player';
        if(currentHls) currentHls.destroy();
        detailPlayer.pause(); detailPlayer.removeAttribute('src');
        if(currentPlayerEpisodes.length && currentPlayerEpisodes[restoreEp]){
            let ep = currentPlayerEpisodes[restoreEp];
            if(ep.playable !== false){
                playEpInPlayer(ep.url, ep.title, restoreEp, savedProgress);
            } else {
                let firstPlayable = currentPlayerEpisodes.find(e=>e.playable!==false) || currentPlayerEpisodes[0];
                if(firstPlayable) playEpInPlayer(firstPlayable.url, firstPlayable.title, currentPlayerEpisodes.indexOf(firstPlayable), 0);
            }
        } else if(currentPlayerEpisodes.length){
            let firstPlayable = currentPlayerEpisodes.find(e=>e.playable!==false) || currentPlayerEpisodes[0];
            if(firstPlayable) playEpInPlayer(firstPlayable.url, firstPlayable.title, 0, 0);
        }
        // 清除续播标记，避免下次误用
        pendingRestoreEpIndex = null;
        pendingRestoreProgress = null;
    }
    
    function renderEpisodesList(){
        if(!currentPlayerEpisodes.length){ episodesList.innerHTML='<div class="empty-state" style="padding:20px;">暂无剧集信息</div>'; return; }
        let html='';
        currentPlayerEpisodes.forEach((ep,idx)=>{
            let isCurr = (idx === currentPlayingEpIndex);
            html+=`<div class="episode-item ${isCurr?'current-ep':''}" data-url="${escAttr(ep.url)}" data-title="${escAttr(ep.title)}" data-idx="${idx}" data-playable="${ep.playable!==false}">${escHtml(ep.title)} ${!ep.playable?'🚫':''}</div>`;
        });
        episodesList.innerHTML=html;
        document.querySelectorAll('.episode-item').forEach(el=>{
            el.addEventListener('click',()=>{
                let url=el.dataset.url, title=el.dataset.title, idx=parseInt(el.dataset.idx);
                if(el.dataset.playable==='false'){ setStatus('⚠️ 该集无法播放'); return; }
                playEpInPlayer(url, title, idx, 0);
            });
        });
    }
    
    function playEpInPlayer(url, title, idx, seekTo = 0){
        if(currentHls) currentHls.destroy();
        detailPlayer.pause(); detailPlayer.removeAttribute('src');
        if(url.includes('.m3u8') && window.Hls?.isSupported()){
            let hls=new Hls();
            hls.loadSource(url);
            hls.attachMedia(detailPlayer);
            if(seekTo > 0){
                hls.on(Hls.Events.MANIFEST_PARSED, function(){
                    detailPlayer.currentTime = seekTo;
                });
            }
            currentHls=hls;
        } else {
            detailPlayer.src=url;
            if(seekTo > 0){
                detailPlayer.addEventListener('loadedmetadata', function once(){
                    detailPlayer.removeEventListener('loadedmetadata', once);
                    detailPlayer.currentTime = seekTo;
                });
            }
        }
        detailPlayer.play().catch(e=>setStatus('播放失败，请检查链接'));
        setStatus(`▶ ${title}`);
        currentPlayingEpIndex=idx;
        document.querySelectorAll('.episode-item').forEach(el=>el.classList.remove('current-ep'));
        if(episodesList.children[idx]) episodesList.children[idx].classList.add('current-ep');
        let nextIdx=idx+1;
        while(nextIdx<currentPlayerEpisodes.length && currentPlayerEpisodes[nextIdx].playable===false) nextIdx++;
        currentEpNext = (nextIdx<currentPlayerEpisodes.length) ? {url:currentPlayerEpisodes[nextIdx].url, title:currentPlayerEpisodes[nextIdx].title, idx:nextIdx} : null;
        detailNextEpBtn.style.display = currentEpNext?'inline-block':'none';
        if(currentPlayingVideo) updateHistory(currentPlayingVideo, idx, 0);
    }
    
    function buildSourceSwitchOptions(){
        if(!currentPlayerVideo) return;
        let sameNameVideos = [];
        for(let key in loadedSources){
            let src=loadedSources[key];
            if(src?.videos){
                let found=src.videos.find(v=>v.vod_name===currentPlayerVideo.vod_name);
                if(found){
                    sameNameVideos.push({ sourceKey:key, sourceName:src.name, episodes:found.episodes, vod_pic:found.vod_pic, ep_count:found.ep_count, playable_count:found.playable_count });
                }
            }
        }
        let html='<option value="">切换数据源</option>';
        sameNameVideos.forEach((item,idx)=>{
            html+=`<option value="${idx}" ${item.sourceKey===currentPlayerSourceKey?'selected':''}>${item.sourceName} (${item.ep_count||0}集)</option>`;
        });
        sourceSwitchSelect.innerHTML=html;
        sourceSwitchSelect.onchange=(e)=>{
            let idx=e.target.value;
            if(idx==='') return;
            let selected = sameNameVideos[parseInt(idx)];
            if(selected){
                currentPlayerSourceKey = selected.sourceKey;
                currentPlayerSourceName = selected.sourceName;
                currentPlayerEpisodes = selected.episodes || [];
                currentPlayerVideo.episodes = currentPlayerEpisodes;
                currentPlayerVideo.sourceKey = selected.sourceKey;
                currentPlayerVideo.sourceName = selected.sourceName;
                currentPlayerVideo.ep_count = selected.ep_count;
                currentPlayerVideo.playable_count = selected.playable_count;
                detailSource.textContent = `来源：${selected.sourceName}`;
                detailEpCount.textContent = `${selected.ep_count||0}集`;
                detailPlayable.textContent = `${selected.playable_count||0}可播放`;
                renderEpisodesList();
                // 重置剧集索引
                currentPlayingEpIndex = 0;
                if(currentPlayerEpisodes.length && currentPlayerEpisodes[0]){
                    playEpInPlayer(currentPlayerEpisodes[0].url, currentPlayerEpisodes[0].title, 0, 0);
                }
            }
        };
    }
    detailNextEpBtn.addEventListener('click',()=>{
        if(currentEpNext){
            playEpInPlayer(currentEpNext.url, currentEpNext.title, currentEpNext.idx, 0);
        }
    });
    detailBookmarkBtn.addEventListener('click',()=>{
        if(!currentPlayingVideo || currentPlayingEpIndex===undefined){ setStatus('请先选择剧集'); return; }
        let prog=Math.floor(detailPlayer.currentTime);
        updateHistory(currentPlayingVideo, currentPlayingEpIndex, prog);
        let note=prompt('影签备注：');
        if(note!==null) addBookmark(currentPlayingVideo, currentPlayingEpIndex, prog, note);
        setStatus('影签已添加');
    });
    detailPlayer.addEventListener('ended',()=>{
        if(currentPlayingVideo) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
        if(currentEpNext) detailNextEpBtn.click();
    });
    detailPlayer.addEventListener('pause',()=>{
        if(currentPlayingVideo && detailPlayer.currentTime>5) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
    });
    
    backHomeBtn.addEventListener('click',()=>{
        homeView.classList.remove('hidden');
        playerView.classList.add('hidden');
        currentView = 'home';
        if(currentHls) currentHls.destroy();
        detailPlayer.pause();
        if(sourceSelect.value && sourceMeta[sourceSelect.value]) switchSource();
        else loadIndexData();
        clearSpecialBtn.style.display = 'none';
    });
    
    function loadIndexData(){
        loadData('index.js',data=>{
            if(!data){ homeContent.innerHTML='<div class="empty-state">❌ 暂无数据源！</div>'; return; }
            sourceIndex=data;
            sourceSelect.innerHTML='';
            let hintOption = document.createElement('option');
            hintOption.value = '';
            hintOption.textContent = '选择数据源';
            hintOption.disabled = true;
            hintOption.selected = true;
            sourceSelect.appendChild(hintOption);
            sourceIndex.forEach(s=>{ 
                let opt = new Option(`📀 ${s.name}`, s.prefix);
                sourceSelect.appendChild(opt);
                sourceMeta[s.prefix]={ page_count:s.page_count||1, name:s.name, fileBase:s.file.replace(/\.js$/,'').replace(/-\d+$/,''), prefix:s.prefix };
            });
            startPreload();
            // 添加统计信息
            let totalAddress = 0, playableTotal = 0;
            sourceIndex.forEach(s => {
                totalAddress += s.total || 0;
                playableTotal += s.playable || 0;
            });
            const footerDiv = document.getElementById('footer');
            if (footerDiv) {
                footerDiv.innerHTML = `<span>数据源 ${sourceIndex.length}</span> | <span>总地址 ${totalAddress}</span> | <span>可播放 ${playableTotal}</span>`;
            }
            if(sourceIndex.length) {
                sourceSelect.value = '';
                renderSpecialView('__history__');
            } else {
                homeContent.innerHTML='<div class="empty-state">❌ 暂无数据源！</div>';
            }
        });
    }
    
    searchBtn.addEventListener('click', doSearch);
    stopSearchBtn.addEventListener('click', stopSearch);
    sourceSelect.addEventListener('change', switchSource);
    historyBtn.addEventListener('click',()=>{ renderSpecialView('__history__'); });
    favoritesBtn.addEventListener('click',()=>{ renderSpecialView('__favorites__'); });
    bookmarksBtn.addEventListener('click',()=>{ renderSpecialView('__bookmarks__'); });
    searchResultBtn.addEventListener('click',()=>{ renderSpecialView('__search_result__'); });
    
    window.addEventListener('beforeunload',()=>{
        if(currentPlayingVideo && detailPlayer.currentTime>5) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
    });
    
    loadIndexData();
})();
</script>
</body>
</html>
