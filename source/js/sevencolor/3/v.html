---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>影迹 · 多源影视</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.2s, color 0.2s;
        }

        /* 主容器 - 主题变量 */
        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 48px;
            --bg-body: #0a0a0f;
            --bg-surface: #14141e;
            --bg-card: #1c1c26;
            --bg-card-hover: #252532;
            --bg-elevated: #1e1e2a;
            --border: #2c2c3a;
            --text-primary: #f0f0f3;
            --text-secondary: #a0a0b0;
            --text-muted: #6e6e80;
            --accent: #f97316;
            --accent-hover: #fd7e2e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --radius-card: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        #app[data-theme="light"] {
            --bg-body: #f5f7fb;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-elevated: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* 全局滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* 视图切换 */
        .view {
            transition: opacity 0.2s;
        }
        .view.hidden {
            display: none;
        }

        /* 工具栏 */
        .toolbar {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .toolbar select, .toolbar input, .toolbar button {
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }
        .toolbar select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236e6e80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            appearance: none;
            padding-right: 36px;
        }
        .toolbar button {
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .toolbar button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .toolbar .secondary-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .toolbar .secondary-btn:hover {
            background: var(--bg-card-hover);
            transform: translateY(-1px);
        }

        /* 状态栏 */
        .status-bar {
            background: var(--bg-surface);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 60px;
            margin: 16px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--border);
        }
        .cat-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .cat-badge {
            background: var(--bg-elevated);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.1s;
        }
        .cat-badge.active, .cat-badge:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 影片网格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }
        .video-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        .video-poster {
            aspect-ratio: 2/3;
            width: 100%;
            object-fit: cover;
            background: linear-gradient(145deg, #2a2a35, #1a1a22);
            display: block;
        }
        .video-info {
            padding: 14px;
        }
        .video-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .video-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fav-home-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.1s;
            color: var(--text-secondary);
        }
        .fav-home-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.1s;
        }
        .pagination button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .pagination button:hover:not(:disabled) {
            background: var(--accent-hover);
            color: white;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 播放页布局 */
        .player-layout {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .player-container {
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .video-detail {
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            padding: 24px;
            border: 1px solid var(--border);
        }
        .detail-header {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .detail-poster {
            width: 140px;
            border-radius: var(--radius-sm);
            aspect-ratio: 2/3;
            object-fit: cover;
            box-shadow: var(--shadow-sm);
        }
        .detail-info {
            flex: 1;
        }
        .detail-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .detail-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 12px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .detail-desc {
            margin-top: 16px;
            line-height: 1.5;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .episodes-section {
            margin-top: 28px;
        }
        .episodes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .source-switch {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-primary);
        }
        .episodes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .episode-item {
            background: var(--bg-elevated);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.1s;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .episode-item:hover, .episode-item.current-ep {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            width: fit-content;
            border: 1px solid var(--border);
            font-weight: 500;
            transition: 0.1s;
        }
        .back-home:hover {
            background: var(--accent);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border-radius: var(--radius-md);
        }
        .preload-bar {
            height: 3px;
            background: var(--border);
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .preload-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: width 0.2s;
        }

        @media (max-width: 640px) {
            #app { padding: 12px; }
            .video-grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .detail-header { flex-direction: column; align-items: center; text-align: center; }
            .toolbar { padding: 12px; }
            .status-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div id="app" data-theme="dark">
    <!-- 首页视图 -->
    <div id="homeView" class="view">
        <div class="toolbar">
            <select id="sourceSelect"></select>
            <input type="text" id="searchInput" placeholder="搜索影片、演员、分类...">
            <button id="searchBtn">🔍 搜索</button>
            <button id="stopSearchBtn" style="display:none">⏹️ 停止</button>
            <button id="themeToggleBtn" class="secondary-btn">🌓 主题</button>
        </div>
        <div class="preload-bar" id="preloadBar" style="display:none"><div class="preload-fill" id="preloadFill"></div></div>
        <div class="status-bar">
            <div id="catBar" class="cat-filters"></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="historyBtn" class="secondary-btn" style="padding:6px 14px;">🕒 最近观看</button>
                <button id="favoritesBtn" class="secondary-btn" style="padding:6px 14px;">❤️ 收藏</button>
                <button id="bookmarksBtn" class="secondary-btn" style="padding:6px 14px;">📌 影签</button>
                <button id="clearSearchBtn" class="secondary-btn" style="display:none; padding:6px 14px;">清空搜索</button>
            </div>
        </div>
        <div id="homeContent" class="video-grid"></div>
        <div id="homePagination" class="pagination"></div>
        <div id="footer" style="text-align:center; margin-top:40px; font-size:12px; color:var(--text-muted);"></div>
    </div>

    <!-- 播放页视图 -->
    <div id="playerView" class="view hidden">
        <div class="back-home" id="backHomeBtn">← 返回首页</div>
        <div class="player-layout">
            <div class="player-container">
                <video id="detailPlayer" style="width:100%;height:100%;display:block" controls playsinline></video>
            </div>
            <div class="video-detail">
                <div class="detail-header">
                    <img id="detailPoster" class="detail-poster" alt="海报">
                    <div class="detail-info">
                        <div class="detail-title" id="detailTitle"></div>
                        <div class="detail-meta">
                            <span id="detailEpCount"></span>
                            <span id="detailPlayable"></span>
                            <span id="detailSource"></span>
                        </div>
                        <div class="detail-desc" id="detailDesc"></div>
                        <div style="margin-top: 20px; display: flex; gap: 12px;">
                            <button id="detailBookmarkBtn" style="background:var(--accent); border:none; padding:8px 18px; border-radius:40px; cursor:pointer; color:white; font-weight:500;">📌 影签</button>
                            <button id="detailNextEpBtn" style="background:var(--bg-elevated); border:1px solid var(--border); padding:8px 18px; border-radius:40px; cursor:pointer;">⏩ 下集</button>
                        </div>
                    </div>
                </div>
                <div class="episodes-section">
                    <div class="episodes-header">
                        <span style="font-weight:600;">📺 剧集列表</span>
                        <select id="sourceSwitchSelect" class="source-switch"></select>
                    </div>
                    <div id="episodesList" class="episodes-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮播放器（保留，但未默认启用） -->
    <div id="floatPlayer" style="position:fixed; bottom:20px; right:20px; width:320px; background:rgba(0,0,0,0.9); border-radius:16px; display:none; z-index:9999;">
        <div style="display:flex; justify-content:space-between; padding:8px 12px; background:#16213e; border-radius:16px 16px 0 0;">
            <span id="floatTitle">浮窗播放</span>
            <div><button id="floatBackBtn" style="margin-right:8px;">←</button><button id="floatCloseBtn">✖</button></div>
        </div>
        <video id="floatVideo" style="width:100%; aspect-ratio:16/9;" playsinline></video>
    </div>
</div>

<script>
(function(){
    // ---------- 存储与核心变量（完全保留原版所有功能） ----------
    const STORAGE = { HISTORY:'tvbox_history', FAVORITES:'tvbox_favorites', BOOKMARKS:'tvbox_bookmarks', SEARCH:'tvbox_search_results', THEME:'tvbox_theme' };
    const PAGE_SIZE = 12, CONCURRENT = 10;
    let sourceIndex=[], loadedSources={}, sourceMeta={}, currentData=null, currentPrefix='', currentFilePage=1, currentPage=1, currentFiltered=[], currentCategory='';
    let currentSearchKeyword='', currentSearchResults=[], currentSearchCategory='', isSearching=false, searchVersion=0;
    let currentPlayingVideo=null, currentPlayingEpIndex=0, currentOpenVideo=null, currentEpNext=null, currentHls=null, playerInFloat=false;
    
    // 视图状态
    let currentView = 'home';
    let currentPlayerVideo = null;
    let currentPlayerEpisodes = [];
    let currentPlayerSourceKey = '';
    let currentPlayerSourceName = '';

    // DOM 元素
    const homeView = document.getElementById('homeView');
    const playerView = document.getElementById('playerView');
    const sourceSelect = document.getElementById('sourceSelect');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const stopSearchBtn = document.getElementById('stopSearchBtn');
    const themeToggle = document.getElementById('themeToggleBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const historyBtn = document.getElementById('historyBtn');
    const favoritesBtn = document.getElementById('favoritesBtn');
    const bookmarksBtn = document.getElementById('bookmarksBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const catBar = document.getElementById('catBar');
    const homeContent = document.getElementById('homeContent');
    const homePagination = document.getElementById('homePagination');
    const footer = document.getElementById('footer');
    const preloadBar = document.getElementById('preloadBar');
    const preloadFill = document.getElementById('preloadFill');
    const detailPlayer = document.getElementById('detailPlayer');
    const detailPoster = document.getElementById('detailPoster');
    const detailTitle = document.getElementById('detailTitle');
    const detailEpCount = document.getElementById('detailEpCount');
    const detailPlayable = document.getElementById('detailPlayable');
    const detailSource = document.getElementById('detailSource');
    const detailDesc = document.getElementById('detailDesc');
    const detailBookmarkBtn = document.getElementById('detailBookmarkBtn');
    const detailNextEpBtn = document.getElementById('detailNextEpBtn');
    const episodesList = document.getElementById('episodesList');
    const sourceSwitchSelect = document.getElementById('sourceSwitchSelect');
    
    // 辅助函数
    const $ = id => document.getElementById(id);
    const escHtml = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const escAttr = s => String(s).replace(/[&"']/g, m => ({'&':'&amp;','"':'&quot;',"'":'&#39;'}[m]));
    const setStatus = txt => { const st = document.getElementById('statusText'); if(st) st.textContent = txt; };
    
    // 主题
    function initTheme() {
        const saved = localStorage.getItem(STORAGE.THEME);
        const wrap = document.getElementById('app');
        let theme = saved || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        wrap.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️ 明亮' : '🌙 暗黑';
    }
    function toggleTheme() {
        const wrap = document.getElementById('app');
        const cur = wrap.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        wrap.setAttribute('data-theme', next);
        localStorage.setItem(STORAGE.THEME, next);
        themeToggle.textContent = next === 'dark' ? '☀️ 明亮' : '🌙 暗黑';
    }
    themeToggle.addEventListener('click', toggleTheme);
    initTheme();
    
    // 存储操作（原版）
    const getStorage = key => { try{ return JSON.parse(localStorage.getItem(key))||(key===STORAGE.HISTORY?{}:[]); }catch(e){ return key===STORAGE.HISTORY?{}:[]; } };
    const setStorage = (key,val) => localStorage.setItem(key,JSON.stringify(val));
    const saveHistory = (key,val) => { let h=getStorage(STORAGE.HISTORY); h[key]=val; setStorage(STORAGE.HISTORY,h); };
    const isFavorited = (k,n) => getStorage(STORAGE.FAVORITES).some(f=> f.videoName===n && (!f.sourceKey||!k||f.sourceKey===k));
    const addFavorite = (v) => { if(isFavorited(v.sourceKey, v.vod_name)) return; let fav=getStorage(STORAGE.FAVORITES); fav.push({ videoName:v.vod_name, sourceKey:v.sourceKey, sourceName:v.sourceName, vodPic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class }); setStorage(STORAGE.FAVORITES,fav); };
    const removeFavorite = (k,n) => setStorage(STORAGE.FAVORITES, getStorage(STORAGE.FAVORITES).filter(f=> !(f.videoName===n && (!f.sourceKey||!k||f.sourceKey===k))));
    const getBookmarks = () => getStorage(STORAGE.BOOKMARKS);
    const saveBookmarks = list => setStorage(STORAGE.BOOKMARKS,list);
    const addBookmark = (video,epIdx,prog,note) => { 
        let list=getBookmarks();
        let fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
        let epsCopy=fresh.episodes?fresh.episodes.map(e=>({title:e.title,url:e.url,playable:e.playable})):[];
        list.unshift({ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||epsCopy.length, playable_count:fresh.playable_count||epsCopy.filter(e=>e.playable).length, episodes:epsCopy, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, note:note||'', createdAt:Date.now() }); 
        saveBookmarks(list);
    };
    const updateHistory = (video,epIdx,prog) => { 
        let key=video.sourceKey+'_'+video.vod_name;
        let fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
        let eps=fresh.episodes?fresh.episodes.map(e=>({title:e.title,url:e.url,playable:e.playable})):[];
        saveHistory(key,{ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||eps.length, playable_count:fresh.playable_count||eps.filter(e=>e.playable).length, episodes:eps, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, updatedAt:Date.now() });
    };
    function findVideoInCache(sKey,vName){
        for(let k in loadedSources){
            let d=loadedSources[k];
            if(d?.videos){
                let f=d.videos.find(v=>v.vod_name===vName);
                if(f) return f;
            }
        }
        return null;
    }
    
    // IndexedDB 缓存
    let CACHE_DB = null, CACHE_READY = false;
    function initCacheDB(cb){
        if(CACHE_READY && CACHE_DB){ cb(CACHE_DB); return; }
        let req = indexedDB.open('tvbox_cache', 1);
        req.onupgradeneeded = e => { e.target.result.createObjectStore('files', { keyPath: 'file' }); };
        req.onsuccess = e => { CACHE_DB = e.target.result; CACHE_READY = true; cb(CACHE_DB); };
        req.onerror = () => { CACHE_DB=null; CACHE_READY=true; cb(null); };
    }
    function loadFromCache(file, cb){
        initCacheDB(db=>{ if(!db){ cb(null); return; }
            let tx = db.transaction('files','readonly'), req = tx.objectStore('files').get(file);
            req.onsuccess = ()=> cb(req.result?._d || null);
            req.onerror = ()=> cb(null);
        });
    }
    function saveToCache(file, data){
        if(!data) return;
        initCacheDB(db=>{ if(!db) return;
            let entry = { file:file, _d:data, _t:Date.now() };
            let tx = db.transaction('files','readwrite');
            tx.objectStore('files').put(entry);
        });
    }
    function loadData(file, cb, to=4000){
        if(file !== 'index.js'){
            loadFromCache(file, cached => {
                if(cached){
                    if(!loadedSources[file]) loadedSources[file] = cached;
                    setTimeout(()=> cb(cached), 0);
                    loadFresh(file, null);
                    return;
                }
                loadFresh(file, cb, to);
            });
        } else loadFresh(file, cb, to);
    }
    function loadFresh(file, cb, to=4000){
        let key = file==='index.js'?'_TVBOX_INDEX':'_TVBOX_SITE_DATA';
        let s = document.createElement('script');
        let t = setTimeout(()=>{ s.onerror=s.onload=null; s.remove(); if(cb) cb(null); }, to);
        s.onerror = ()=>{ clearTimeout(t); if(cb) cb(null); };
        s.onload = ()=>{
            clearTimeout(t);
            let d = window[key]; delete window[key];
            if(d && file !== 'index.js') saveToCache(file, d);
            if(d) loadedSources[file] = d;
            if(cb) cb(d);
        };
        let bp = (typeof window.__SC_BASE_PATH !== 'undefined' ? window.__SC_BASE_PATH : '');
        s.src = bp + 'data/' + file;
        document.head.appendChild(s);
    }
    
    // 预加载
    function startPreload(){
        if(!sourceIndex.length) return;
        let files=new Set();
        sourceIndex.forEach(s=>{ let pc=s.page_count||1, base=(sourceMeta[s.prefix]?.fileBase)||s.prefix;
            for(let i=1;i<=pc;i++) files.add(base+'-'+String(i).padStart(2,'0')+'.js');
        });
        let arr=Array.from(files);
        let total=arr.length, done=0;
        preloadBar.style.display='block';
        arr.forEach(f=>{
            loadFromCache(f, cached=>{ if(cached && !loadedSources[f]) loadedSources[f]=cached; done++; preloadFill.style.width = Math.floor(done/total*100)+'%'; if(done===total) setTimeout(()=>{ preloadBar.style.display='none'; }, 400); });
        });
    }
    
    // 搜索
    function doSearch(){
        let kw=searchInput.value.trim();
        if(!kw) return;
        if(isSearching) stopSearch();
        currentSearchKeyword=kw; currentSearchResults=[]; currentSearchCategory=''; isSearching=true; searchVersion++;
        let ver=searchVersion;
        searchBtn.style.display='none'; stopSearchBtn.style.display='inline';
        renderHomeSearch(true);
        if(!sourceIndex.length){ let wait=setInterval(()=>{ if(sourceIndex.length){ clearInterval(wait); searchImpl(kw,ver); } },200); }
        else searchImpl(kw,ver);
    }
    function searchImpl(kw,ver){
        let tasks=[];
        sourceIndex.forEach(src=>{ let pc=src.page_count||1; for(let p=1;p<=pc;p++){ let base=(sourceMeta[src.prefix]?.fileBase)||src.prefix; tasks.push({ fname:base+'-'+String(p).padStart(2,'0')+'.js' }); } });
        let results=[], doneCount=0, total=tasks.length, needRender=false, idx=0, running=0;
        function searchOne(data,fname){
            if(data?.videos){
                data.videos.forEach(v=>{ if(v.vod_name.includes(kw)||(v.vod_class||'').includes(kw)){ results.push({ vod_name:v.vod_name, vod_pic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class, sourceKey:fname, sourceName:data.name }); needRender=true; } });
            }
        }
        function flushRender(){ if(ver===searchVersion && needRender){ currentSearchResults=results.slice(); renderHomeSearch(false); needRender=false; } }
        function finish(){ if(ver!==searchVersion) return; isSearching=false; searchBtn.style.display='inline'; stopSearchBtn.style.display='none'; currentSearchResults=results.slice(); setStatus(`✅ 搜索完成 · ${kw} 共 ${results.length} 条`); renderHomeSearch(false); }
        function loadNext(){
            if(ver!==searchVersion) return;
            while(idx<tasks.length && running<CONCURRENT){
                let task=tasks[idx++];
                if(loadedSources[task.fname]){ searchOne(loadedSources[task.fname],task.fname); doneCount++; flushRender(); loadNext(); }
                else{
                    running++;
                    loadData(task.fname, data=>{ if(data) loadedSources[task.fname]=data; if(data) searchOne(data,task.fname); doneCount++; running--; flushRender(); loadNext(); },5000);
                }
            }
            if(idx>=tasks.length && running===0) finish();
        }
        for(let i=0;i<CONCURRENT;i++) loadNext();
    }
    function stopSearch(){ if(!isSearching) return; searchVersion++; isSearching=false; searchBtn.style.display='inline'; stopSearchBtn.style.display='none'; if(currentSearchKeyword) renderHomeSearch(false); }
    
    // 首页渲染
    function renderHomeSearch(loading){
        if(loading && (!currentSearchResults.length||isSearching)){
            homeContent.innerHTML='<div class="empty-state">🔍 搜索中，请稍候...</div>';
            homePagination.innerHTML=''; catBar.innerHTML=''; setStatus('搜索中...'); return;
        }
        if(!currentSearchResults.length){ homeContent.innerHTML='<div class="empty-state">✨ 暂无搜索结果，尝试其他关键词</div>'; homePagination.innerHTML=''; catBar.innerHTML=''; return; }
        buildSearchCatBar();
        let filtered = currentSearchCategory==='' ? currentSearchResults.slice() : currentSearchCategory==='未分类' ? currentSearchResults.filter(v=>!(v.vod_class||'').trim()) : currentSearchResults.filter(v=>(v.vod_class||'').split(',').some(c=>c.trim()===currentSearchCategory));
        currentFiltered = filtered; currentPage=1;
        renderHomeGrid();
        sourceSelect.value='__search_result__';
    }
    function buildSearchCatBar(){
        let cats={};
        currentSearchResults.forEach(v=>{ let cls=v.vod_class||''; if(!cls.trim()) cats['未分类']=(cats['未分类']||0)+1; else cls.split(',').forEach(c=>{ let cc=c.trim(); if(cc) cats[cc]=(cats[cc]||0)+1; }); });
        let html='';
        Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).forEach(c=>{
            html+=`<span class="cat-badge ${c===currentSearchCategory?'active':''}" data-cat="${c}">${c} (${cats[c]})</span>`;
        });
        catBar.innerHTML=html;
        document.querySelectorAll('.cat-badge').forEach(el=>{
            el.addEventListener('click',()=>{
                let cat=el.dataset.cat;
                currentSearchCategory = (currentSearchCategory===cat) ? '' : cat;
                renderHomeSearch(false);
            });
        });
    }
    function renderHomeGrid(){
        let total=currentFiltered.length, pages=Math.ceil(total/PAGE_SIZE)||1;
        if(currentPage>pages) currentPage=pages;
        let start=(currentPage-1)*PAGE_SIZE, items=currentFiltered.slice(start,start+PAGE_SIZE);
        let html='';
        items.forEach(v=>{
            let img=v.vod_pic||`https://picsum.photos/seed/${encodeURIComponent(v.vod_name)}/300/400`;
            let isFav=isFavorited(v.sourceKey, v.vod_name);
            html+=`<div class="video-card" data-name="${escAttr(v.vod_name)}" data-sourcekey="${escAttr(v.sourceKey)}" data-sourcename="${escAttr(v.sourceName||'')}" data-pic="${escAttr(img)}" data-epcount="${v.ep_count||0}" data-playable="${v.playable_count||0}" data-episodes='${escAttr(JSON.stringify(v.episodes||[]))}' data-class="${escAttr(v.vod_class||'')}">
                <img class="video-poster" src="${img}" loading="lazy" onerror="this.src='https://picsum.photos/seed/default/300/400'">
                <div class="video-info">
                    <div class="video-title">${escHtml(v.vod_name)}</div>
                    <div class="video-meta">
                        <span>${v.ep_count||0}集 · ${v.playable_count||0}可播</span>
                        <button class="fav-home-btn" data-sourcekey="${escAttr(v.sourceKey)}" data-name="${escAttr(v.vod_name)}">${isFav?'❤️ 已藏':'🤍 收藏'}</button>
                    </div>
                </div>
            </div>`;
        });
        homeContent.innerHTML=html || '<div class="empty-state">📺 暂无影片</div>';
        let pgHtml='';
        if(pages>1){
            pgHtml+=`<button class="page-go" data-page="1" ${currentPage<=1?'disabled':''}>«</button><button class="page-go" data-page="${currentPage-1}" ${currentPage<=1?'disabled':''}>‹</button>`;
            for(let i=Math.max(1,currentPage-2); i<=Math.min(pages,currentPage+2); i++) pgHtml+=`<button class="page-go ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
            pgHtml+=`<button class="page-go" data-page="${currentPage+1}" ${currentPage>=pages?'disabled':''}>›</button><button class="page-go" data-page="${pages}" ${currentPage>=pages?'disabled':''}>»</button>`;
        }
        homePagination.innerHTML=pgHtml;
        document.querySelectorAll('.page-go').forEach(btn=>btn.addEventListener('click',e=>{ let pg=parseInt(btn.dataset.page); if(!isNaN(pg)){ currentPage=pg; renderHomeGrid(); } }));
        // 卡片点击与收藏
        document.querySelectorAll('.video-card').forEach(card=>{
            card.addEventListener('click',(e)=>{
                if(e.target.classList.contains('fav-home-btn')) return;
                let videoData = {
                    vod_name: card.dataset.name,
                    sourceKey: card.dataset.sourcekey,
                    sourceName: card.dataset.sourcename,
                    vod_pic: card.dataset.pic,
                    ep_count: parseInt(card.dataset.epcount),
                    playable_count: parseInt(card.dataset.playable),
                    episodes: JSON.parse(card.dataset.episodes),
                    vod_class: card.dataset.class
                };
                openPlayerView(videoData);
            });
            card.querySelector('.fav-home-btn')?.addEventListener('click',(e)=>{
                e.stopPropagation();
                let sKey=card.dataset.sourcekey, vName=card.dataset.name;
                if(isFavorited(sKey,vName)){ removeFavorite(sKey,vName); e.target.textContent='🤍 收藏'; if(currentPrefix==='__favorites__') renderSpecialView('__favorites__'); }
                else{ addFavorite({ sourceKey:sKey, vod_name:vName, vod_pic:card.dataset.pic, sourceName:card.dataset.sourcename, ep_count:parseInt(card.dataset.epcount), playable_count:parseInt(card.dataset.playable), episodes:JSON.parse(card.dataset.episodes), vod_class:card.dataset.class }); e.target.textContent='❤️ 已藏'; }
            });
        });
    }
    
    // 播放页
    function openPlayerView(video){
        currentPlayerVideo = video;
        currentPlayerSourceKey = video.sourceKey;
        currentPlayerSourceName = video.sourceName;
        currentPlayerEpisodes = video.episodes || [];
        currentPlayingVideo = video;
        currentPlayingEpIndex = 0;
        detailPoster.src = video.vod_pic || '';
        detailTitle.textContent = video.vod_name;
        detailEpCount.textContent = `${video.ep_count || 0}集`;
        detailPlayable.textContent = `${video.playable_count || 0}可播放`;
        detailSource.textContent = `来源：${video.sourceName || '未知'}`;
        detailDesc.textContent = video.vod_class ? `分类：${video.vod_class}` : '暂无简介';
        renderEpisodesList();
        buildSourceSwitchOptions();
        homeView.classList.add('hidden');
        playerView.classList.remove('hidden');
        currentView = 'player';
        if(currentHls) currentHls.destroy();
        detailPlayer.pause(); detailPlayer.removeAttribute('src');
        if(currentPlayerEpisodes.length){
            let firstPlayable = currentPlayerEpisodes.find(e=>e.playable!==false) || currentPlayerEpisodes[0];
            if(firstPlayable) playEpInPlayer(firstPlayable.url, firstPlayable.title, 0);
        }
    }
    function renderEpisodesList(){
        if(!currentPlayerEpisodes.length){ episodesList.innerHTML='<div class="empty-state" style="padding:20px;">暂无剧集信息</div>'; return; }
        let html='';
        currentPlayerEpisodes.forEach((ep,idx)=>{
            let isCurr = (idx === currentPlayingEpIndex);
            html+=`<div class="episode-item ${isCurr?'current-ep':''}" data-url="${escAttr(ep.url)}" data-title="${escAttr(ep.title)}" data-idx="${idx}" data-playable="${ep.playable!==false}">${escHtml(ep.title)} ${!ep.playable?'🚫':''}</div>`;
        });
        episodesList.innerHTML=html;
        document.querySelectorAll('.episode-item').forEach(el=>{
            el.addEventListener('click',()=>{
                let url=el.dataset.url, title=el.dataset.title, idx=parseInt(el.dataset.idx);
                if(el.dataset.playable==='false'){ setStatus('⚠️ 该集无法播放'); return; }
                playEpInPlayer(url, title, idx);
            });
        });
    }
    function playEpInPlayer(url, title, idx){
        if(currentHls) currentHls.destroy();
        detailPlayer.pause(); detailPlayer.removeAttribute('src');
        if(url.includes('.m3u8') && window.Hls?.isSupported()){
            let hls=new Hls();
            hls.loadSource(url);
            hls.attachMedia(detailPlayer);
            currentHls=hls;
        } else detailPlayer.src=url;
        detailPlayer.play().catch(e=>setStatus('播放失败，请检查链接'));
        setStatus(`▶ ${title}`);
        currentPlayingEpIndex=idx;
        document.querySelectorAll('.episode-item').forEach(el=>el.classList.remove('current-ep'));
        if(episodesList.children[idx]) episodesList.children[idx].classList.add('current-ep');
        let nextIdx=idx+1;
        while(nextIdx<currentPlayerEpisodes.length && currentPlayerEpisodes[nextIdx].playable===false) nextIdx++;
        currentEpNext = (nextIdx<currentPlayerEpisodes.length) ? {url:currentPlayerEpisodes[nextIdx].url, title:currentPlayerEpisodes[nextIdx].title, idx:nextIdx} : null;
        detailNextEpBtn.style.display = currentEpNext?'inline-block':'none';
        if(currentPlayingVideo) updateHistory(currentPlayingVideo, idx, 0);
    }
    function buildSourceSwitchOptions(){
        if(!currentPlayerVideo) return;
        let sameNameVideos = [];
        for(let key in loadedSources){
            let src=loadedSources[key];
            if(src?.videos){
                let found=src.videos.find(v=>v.vod_name===currentPlayerVideo.vod_name);
                if(found){
                    sameNameVideos.push({ sourceKey:key, sourceName:src.name, episodes:found.episodes, vod_pic:found.vod_pic, ep_count:found.ep_count, playable_count:found.playable_count });
                }
            }
        }
        let html='<option value="">切换数据源</option>';
        sameNameVideos.forEach((item,idx)=>{
            html+=`<option value="${idx}" ${item.sourceKey===currentPlayerSourceKey?'selected':''}>${item.sourceName} (${item.ep_count||0}集)</option>`;
        });
        sourceSwitchSelect.innerHTML=html;
        sourceSwitchSelect.onchange=(e)=>{
            let idx=e.target.value;
            if(idx==='') return;
            let selected = sameNameVideos[parseInt(idx)];
            if(selected){
                currentPlayerSourceKey = selected.sourceKey;
                currentPlayerSourceName = selected.sourceName;
                currentPlayerEpisodes = selected.episodes || [];
                currentPlayerVideo.episodes = currentPlayerEpisodes;
                currentPlayerVideo.sourceKey = selected.sourceKey;
                currentPlayerVideo.sourceName = selected.sourceName;
                currentPlayerVideo.ep_count = selected.ep_count;
                currentPlayerVideo.playable_count = selected.playable_count;
                detailSource.textContent = `来源：${selected.sourceName}`;
                detailEpCount.textContent = `${selected.ep_count||0}集`;
                detailPlayable.textContent = `${selected.playable_count||0}可播放`;
                renderEpisodesList();
            }
        };
    }
    detailNextEpBtn.addEventListener('click',()=>{
        if(currentEpNext){
            playEpInPlayer(currentEpNext.url, currentEpNext.title, currentEpNext.idx);
        }
    });
    detailBookmarkBtn.addEventListener('click',()=>{
        if(!currentPlayingVideo || currentPlayingEpIndex===undefined){ setStatus('请先选择剧集'); return; }
        let prog=Math.floor(detailPlayer.currentTime);
        updateHistory(currentPlayingVideo, currentPlayingEpIndex, prog);
        let note=prompt('影签备注：');
        if(note!==null) addBookmark(currentPlayingVideo, currentPlayingEpIndex, prog, note);
        setStatus('影签已添加');
    });
    detailPlayer.addEventListener('ended',()=>{
        if(currentPlayingVideo) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
        if(currentEpNext) detailNextEpBtn.click();
    });
    detailPlayer.addEventListener('pause',()=>{
        if(currentPlayingVideo && detailPlayer.currentTime>5) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
    });
    
    // 特殊视图（历史/收藏/影签）
    function renderSpecialView(type){
        currentPrefix=type; currentCategory='';
        let list=[];
        if(type==='__history__'){ let histObj=getStorage(STORAGE.HISTORY); list=Object.keys(histObj).map(k=>{ let v=histObj[k]; if(!v.sourceKey){ let i=k.lastIndexOf('_'); if(i>0) v.sourceKey=k.slice(0,i); } return v; }).sort((a,b)=>b.updatedAt-a.updatedAt); }
        else if(type==='__favorites__') list=getStorage(STORAGE.FAVORITES);
        else if(type==='__bookmarks__') list=getBookmarks();
        if(!list.length){ homeContent.innerHTML='<div class="empty-state">暂无记录</div>'; homePagination.innerHTML=''; catBar.innerHTML=''; setStatus('0条记录'); return; }
        currentFiltered = list.map(item=>{
            let base={ sourceKey:item.sourceKey, sourceName:item.sourceName, vod_name:item.videoName, vod_pic:item.vodPic, ep_count:item.ep_count, playable_count:item.playable_count, episodes:item.episodes };
            if(type==='__history__'){ base.isHistory=true; base.historyEpIndex=item.epIndex; base.historyProgress=item.progress; }
            else if(type==='__bookmarks__'){ base.isBookmark=true; base.bookmarkNote=item.note; base.bookmarkProgress=item.progress; base.bookmarkEpIndex=item.epIndex; }
            return base;
        });
        currentPage=1; renderHomeGrid();
        catBar.innerHTML='';
        setStatus(`${type==='__history__'?'最近观看':type==='__favorites__'?'收藏':'影签'} · ${list.length}条`);
    }
    
    // 数据源切换（仅数据源）
    function switchSource(){
        if(isSearching) stopSearch();
        let val=sourceSelect.value;
        if(!val) return;
        // 历史/收藏/影签已移除，仅数据源
        currentPrefix=val; currentFilePage=1; currentPage=1; searchInput.value='';
        loadPageFile(val,1);
    }
    function loadPageFile(prefix,page){
        let base=(sourceMeta[prefix]?.fileBase)||prefix;
        let fname=base+'-'+String(page).padStart(2,'0')+'.js';
        if(loadedSources[fname]) useSourceData(loadedSources[fname],fname,page);
        else { homeContent.innerHTML='<div class="empty-state">⏳ 加载数据中...</div>'; loadData(fname,data=>{ if(data) loadedSources[fname]=data; useSourceData(data,fname,page); }); }
    }
    function useSourceData(data,file,page){
        if(!data?.videos){ setStatus('数据格式错误'); return; }
        currentData=data; currentFilePage=page; currentCategory='';
        currentFiltered=data.videos.map(v=>({ ...v, sourceKey:file, sourceName:data.name }));
        currentPage=1; renderHomeGrid();
        buildSimpleCatBar(data);
        setStatus(`${data.name} — 第${page}页`);
    }
    function buildSimpleCatBar(data){
        let cats={};
        data.videos.forEach(v=>{ let cls=v.vod_class||''; if(!cls.trim()) cats['未分类']=(cats['未分类']||0)+1; else cls.split(',').forEach(c=>{ let cc=c.trim(); if(cc) cats[cc]=(cats[cc]||0)+1; }); });
        let html='';
        Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).forEach(c=>{
            html+=`<span class="cat-badge" data-cat="${c}">${c} (${cats[c]})</span>`;
        });
        catBar.innerHTML=html;
        document.querySelectorAll('.cat-badge').forEach(el=>{
            el.addEventListener('click',()=>{
                let selected=el.dataset.cat;
                if(!selected){ currentFiltered=currentData.videos.map(v=>({ ...v, sourceKey:currentData.fileName||currentPrefix, sourceName:currentData.name })); currentPage=1; renderHomeGrid(); return; }
                let filtered=currentData.videos.filter(v=>{ let cls=v.vod_class||''; if(selected==='未分类') return !cls.trim(); return cls.split(',').some(c=>c.trim()===selected); });
                currentFiltered=filtered.map(v=>({ ...v, sourceKey:currentData.fileName||currentPrefix, sourceName:currentData.name })); currentPage=1; renderHomeGrid();
                document.querySelectorAll('.cat-badge').forEach(b=>b.classList.remove('active'));
                el.classList.add('active');
            });
        });
    }
    
    // 加载索引
    function loadIndexData(){
        loadData('index.js',data=>{
            if(!data){ homeContent.innerHTML='<div class="empty-state">❌ 无数据源，请检查 data/ 目录</div>'; return; }
            sourceIndex=data;
            sourceSelect.innerHTML='';
            sourceIndex.forEach(s=>{ sourceSelect.appendChild(new Option(`📀 ${s.name}`,s.prefix)); sourceMeta[s.prefix]={ page_count:s.page_count||1, name:s.name, fileBase:s.file.replace(/\.js$/,'').replace(/-\d+$/,''), prefix:s.prefix }; });
            startPreload();
            if(sourceIndex.length) {
                sourceSelect.value = sourceIndex[0].prefix;
                switchSource();
            } else {
                homeContent.innerHTML='<div class="empty-state">暂无数据源，请运行爬虫生成 data/ 目录</div>';
            }
        });
    }
    
    // 事件绑定
    searchBtn.addEventListener('click', doSearch);
    stopSearchBtn.addEventListener('click', stopSearch);
    sourceSelect.addEventListener('change', switchSource);
    historyBtn.addEventListener('click',()=>{ renderSpecialView('__history__'); });
    favoritesBtn.addEventListener('click',()=>{ renderSpecialView('__favorites__'); });
    bookmarksBtn.addEventListener('click',()=>{ renderSpecialView('__bookmarks__'); });
    clearSearchBtn.addEventListener('click',()=>{ currentSearchResults=[]; renderHomeSearch(false); });
    backHomeBtn.addEventListener('click',()=>{
        homeView.classList.remove('hidden');
        playerView.classList.add('hidden');
        currentView = 'home';
        if(currentHls) currentHls.destroy();
        detailPlayer.pause();
        // 刷新当前首页状态
        if(sourceSelect.value && sourceMeta[sourceSelect.value]) switchSource();
        else loadIndexData();
    });
    
    // 离开保存进度
    window.addEventListener('beforeunload',()=>{
        if(currentPlayingVideo && detailPlayer.currentTime>5) updateHistory(currentPlayingVideo, currentPlayingEpIndex, Math.floor(detailPlayer.currentTime));
    });
    
    loadIndexData();
})();
</script>
</body>
</html>
