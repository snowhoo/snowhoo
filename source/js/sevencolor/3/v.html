<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>影迹 · 全端视界</title>
    <!-- HLS.js 播放核心 (与原版完全一致) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ========== 全新视觉样式，不改变任何功能逻辑 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b12;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px 24px 48px;
        }

        /* 主容器 —— 完全保留原有 ID 和结构，仅样式升级 */
        #player-wrap {
            max-width: 1400px;
            margin: 0 auto;
            --bg-page: #0f0f14;
            --bg-card: #18181f;
            --bg-card-hover: #20202a;
            --bg-eplist: #101015;
            --bg-eplist-alt: #1a1a22;
            --bg-player: #000;
            --bg-toolbar: #14141c;
            --bg-input: #1c1c24;
            --text-primary: #efeff1;
            --text-secondary: #a8a8b5;
            --text-muted: #6c6c7a;
            --border: #2a2a33;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --badge-playable-bg: #10b981;
            --badge-playable-text: #fff;
            --badge-unplayable-bg: #4b4b56;
            --badge-unplayable-text: #c0c0cf;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            --card-radius: 20px;
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
        }

        #player-wrap[data-theme="light"] {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --bg-eplist: #f1f5f9;
            --bg-eplist-alt: #e6edf4;
            --bg-player: #1e1e2a;
            --bg-toolbar: #ffffffcc;
            --bg-input: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --badge-playable-bg: #10b981;
            --badge-unplayable-bg: #cbd5e1;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        /* 工具栏美化 */
        .pw-toolbar {
            background: var(--bg-toolbar);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }

        .pw-toolbar select, .pw-toolbar input, .pw-toolbar button {
            border-radius: 40px !important;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .pw-toolbar select {
            background: var(--bg-input) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236c6c7a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") no-repeat right 16px center;
            appearance: none;
            padding-right: 40px;
            cursor: pointer;
        }

        .pw-toolbar button {
            background: var(--accent);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border: none;
            cursor: pointer;
        }

        .pw-toolbar button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        /* 分类栏精致卡片 */
        .pw-cat-bar {
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .pw-status-bar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 60px;
            margin: 16px 0;
            font-weight: 500;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }

        /* 视频网格 */
        .pw-video-grid {
            gap: 20px;
            margin-top: 24px;
        }

        .pw-video-card {
            border-radius: 24px;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s;
            background: var(--bg-card);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
        }

        .pw-video-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .pw-poster-wrap {
            position: relative;
            background: linear-gradient(145deg, #2a2a35, #1a1a22);
            overflow: hidden;
        }

        .pw-poster {
            transition: transform 0.4s ease;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pw-video-card:hover .pw-poster {
            transform: scale(1.03);
        }

        .pw-card-badge {
            backdrop-filter: blur(12px);
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 40px;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            font-size: 11px;
        }

        .pw-fav-btn, .pw-card-delete {
            backdrop-filter: blur(12px);
            border-radius: 40px !important;
            font-weight: 600;
            transition: 0.15s;
            border: none;
            cursor: pointer;
        }

        /* 剧集面板 */
        .pw-ep-panel {
            background: var(--bg-eplist);
            border-radius: 0 0 24px 24px;
            border-top: 1px solid var(--border);
            max-height: 280px;
            overflow-y: auto;
        }

        .pw-ep-item {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.1s;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .pw-ep-item.pw-current {
            background: var(--accent);
            color: white;
        }

        .pw-player-box {
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            background: #000;
            aspect-ratio: 16/9;
        }

        /* 浮动播放器 */
        .pw-float-player {
            border-radius: 24px;
            backdrop-filter: blur(20px);
            background: rgba(20,20,30,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            width: 360px;
            z-index: 9999;
        }

        .pw-float-header {
            background: rgba(0,0,0,0.6);
            padding: 10px 14px;
        }

        /* 分页按钮 */
        .pw-pagination {
            margin: 30px 0 20px;
            gap: 8px;
        }

        .pw-pagination button {
            border-radius: 40px !important;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .pw-pagination button.pw-active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 空状态 */
        .pw-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 32px;
            margin-top: 20px;
        }

        /* 窄屏适配 */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .pw-toolbar { padding: 12px; }
            .pw-video-grid { gap: 12px; }
            .pw-float-player { width: 280px; right: 12px; bottom: 12px; }
            .pw-card-title { font-size: 12px; }
        }
    </style>
</head>
<body>
<div id="player-wrap">
    <!-- 完全保留原始 DOM 结构，仅添加极简布局包裹，不影响任何 JS 选择器 -->
    <div class="pw-toolbar">
        <select id="pwSourceSelect"></select>
        <input type="text" id="pwSearchInput" placeholder="全局搜索影片...">
        <button id="pwSearchBtn">搜索</button>
        <button id="pwStopSearchBtn" style="display:none">停止</button>
    </div>
    <div class="pw-preload-bar" id="pwPreloadProgressBar"><div class="pw-preload-fill" id="pwPreloadProgressFill"></div></div>
    <div class="pw-player-box"><video id="pwPlayer" style="width:100%;height:100%;display:block" controls playsinline></video></div>
    <div class="pw-float-player" id="pwFloatPlayer" style="display:none">
        <div class="pw-float-header"><span class="pw-float-title" id="pwFloatPlayerTitle">正在播放</span><button class="pw-float-btn" id="pwFloatBackBtn">←</button><button class="pw-float-btn pw-float-close" id="pwFloatCloseBtn">✖</button></div>
        <video id="pwFloatVideo" playsinline></video>
    </div>
    <div id="pwStatus" class="pw-status-bar">
        <div class="pw-cat-bar" id="pwCatBar"></div>
        <span id="pwStatusText">[STOP] 选择一个数据源</span>
        <div style="display:flex; gap:6px"><button id="pwClearSearchResultBtn" class="pw-clear-search-btn" style="display:none">清空</button><button id="pwBookmarkBtn" class="pw-next-ep-btn" style="display:none">影签</button><button id="pwNextEpBtn" class="pw-next-ep-btn">下集</button></div>
    </div>
    <div id="pwContent"></div>
    <div class="pw-pagination" id="pwPagination"></div>
    <div class="pw-tvbox-footer" id="pwTvboxFooter"></div>
</div>

<script>
// ==================== 以下为原始完整 JS 逻辑，一字未改（仅保证功能） ====================
(function() {
var STORAGE = { HISTORY:'tvbox_history', FAVORITES:'tvbox_favorites', BOOKMARKS:'tvbox_bookmarks', SEARCH:'tvbox_search_results' };
var PAGE_SIZE = 12, CONCURRENT = 10;
var sourceIndex=[], loadedSources={}, sourceMeta={}, currentData=null, currentPrefix='', currentFilePage=1, currentPage=1, currentFiltered=[], currentCategory='';
var currentSearchKeyword='', currentSearchResults=[], currentSearchCategory='', isSearching=false, searchVersion=0;
var currentPlayingVideo=null, currentPlayingEpIndex=0, currentOpenVideo=null, currentEpNext=null, currentHls=null, playerInFloat=false, floatReturn=null;
var categoryStatsLoading=false;
var pw$ = function(sel) { return document.querySelector('#player-wrap ' + sel); };
var $ = function(id) { return document.getElementById(id); };
var escHtml = function(s) { return String(s).replace(/[&<>]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; }); };
var escAttr = function(s) { return String(s).replace(/[&"']/g, function(m) { return {'&':'&amp;','"':'&quot;',"'":'&#39;'}[m]; }); };
var setStatus = function(t) { $('pwStatusText').textContent = t; };
var getStorage = function(key) { try{ return JSON.parse(localStorage.getItem(key))||(key===STORAGE.HISTORY?{}:[]); }catch(e){ return key===STORAGE.HISTORY?{}:[]; } };
var setStorage = function(key,val) { localStorage.setItem(key,JSON.stringify(val)); };
var saveHistory = function(key,val) { var h=getStorage(STORAGE.HISTORY); h[key]=val; setStorage(STORAGE.HISTORY,h); };
var isFavorited = function(k,n) { return getStorage(STORAGE.FAVORITES).some(function(f){ return f.videoName===n&&(!f.sourceKey||!k||f.sourceKey===k); }); };
var addFavorite = function(v) { if(isFavorited(v.sourceKey,v.vod_name)) return; var fav=getStorage(STORAGE.FAVORITES); fav.push({ videoName:v.vod_name, sourceKey:v.sourceKey, sourceName:v.sourceName, vodPic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class }); setStorage(STORAGE.FAVORITES,fav); };
var removeFavorite = function(k,n) { setStorage(STORAGE.FAVORITES, getStorage(STORAGE.FAVORITES).filter(function(f){ return !(f.videoName===n&&(!f.sourceKey||!k||f.sourceKey===k)); })); };
var getBookmarks = function() { return getStorage(STORAGE.BOOKMARKS); };
var saveBookmarks = function(list) { setStorage(STORAGE.BOOKMARKS,list); };
var addBookmark = function(video,epIdx,prog,note) { 
  var list=getBookmarks();
  var fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
  var epsCopy=fresh.episodes?fresh.episodes.map(function(e){ return {title:e.title,url:e.url,playable:e.playable}; }):[];
  list.unshift({ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||epsCopy.length, playable_count:fresh.playable_count||epsCopy.filter(function(e){ return e.playable; }).length, episodes:epsCopy, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, note:note||'', createdAt:Date.now() }); saveBookmarks(list); };
var updateHistory = function(video,epIdx,prog) { 
  var key=video.sourceKey+'_'+video.vod_name;
  var fresh=findVideoInCache(video.sourceKey, video.vod_name)||video;
  var eps=fresh.episodes?fresh.episodes.map(function(e){ return {title:e.title,url:e.url,playable:e.playable}; }):[];
  saveHistory(key,{ videoName:fresh.vod_name, sourceKey:video.sourceKey, sourceName:video.sourceName, vodPic:fresh.vod_pic, ep_count:fresh.ep_count||eps.length, playable_count:fresh.playable_count||eps.filter(function(e){ return e.playable; }).length, episodes:eps, epIndex:epIdx, epTitle:(fresh.episodes||[])[epIdx]?.title||'', epUrl:(fresh.episodes||[])[epIdx]?.url||'', progress:prog, updatedAt:Date.now() }); };

function findVideoInCache(sKey,vName){
  for(var k in loadedSources){
    var d=loadedSources[k];
    if(d?.videos){
      var f=d.videos.find(function(v){ return v.vod_name===vName; });
      if(f) return f;
    }
  }
  return null;
}

// ===== IndexedDB 缓存 =====
var CACHE_DB = null;
var CACHE_DB_READY = false;

function initCacheDB(cb){
  if(CACHE_DB_READY && CACHE_DB){ cb(CACHE_DB); return; }
  var req = indexedDB.open('tvbox_cache', 1);
  req.onupgradeneeded = function(e){ e.target.result.createObjectStore('files', { keyPath: 'file' }); };
  req.onsuccess = function(e){
    CACHE_DB = e.target.result;
    CACHE_DB_READY = true;
    cb(CACHE_DB);
  };
  req.onerror = function(){ CACHE_DB = null; CACHE_DB_READY = true; cb(null); };
}

function loadFromCache(file, cb){
  initCacheDB(function(db){
    if(!db){ cb(null); return; }
    try {
      var tx = db.transaction('files','readonly');
      var req = tx.objectStore('files').get(file);
      req.onsuccess = function(){ var r=req.result; cb(r&&r._d?r._d:null); };
      req.onerror = function(){ cb(null); };
    } catch(e){ cb(null); }
  });
}

function saveToCache(file, data){
  if(!data) return;
  var now = Date.now();
  try { localStorage.setItem('tvbox_fsize_'+file, JSON.stringify(data).length + '|' + now); } catch(e){}
  initCacheDB(function(db){
    if(!db) return;
    var fp = (data.videos?data.videos.length:0)+'|'+((data.videos||[])[0]?.vod_name||'');
    var entry = { file:file, _d:data, _fp:fp, _t:now };
    var MAX_CACHE=520;
    try {
      var tx=db.transaction('files','readwrite');
      var countReq=db.transaction('files','readonly').objectStore('files').count();
      countReq.onsuccess=function(){
        if(countReq.result>=MAX_CACHE){
          var delReq=db.transaction('files','readwrite').objectStore('files').openCursor();
          var deleted=0;
          delReq.onsuccess=function(e2){
            var cursor=e2.target.result;
            if(cursor&&deleted<Math.ceil(MAX_CACHE/4)){ cursor.delete(); deleted++; cursor.continue(); }
            else if(!delReq._done){ delReq._done=true; try{db.transaction('files','readwrite').objectStore('files').put(entry);}catch(_){} }
          };
        }else{ try{db.transaction('files','readwrite').objectStore('files').put(entry);}catch(_){} }
      };
    } catch(e){}
  });
}

function loadData(file,cb,to){
  if (typeof to === 'undefined') to = 3000;
  if(file !== 'index.js'){
    loadFromCache(file, function(cached){
      if(cached){
        if(!loadedSources[file]) loadedSources[file] = cached;
        setTimeout(function(){ cb(cached); }, 0);
        loadFresh(file);
        return;
      }
      loadFresh(file, cb, to);
    });
    return;
  }
  loadFresh(file, cb, to);
}

function loadFresh(file, cb, to){
  if (typeof to === 'undefined') to = 3000;
  var key = file==='index.js'?'_TVBOX_INDEX':'_TVBOX_SITE_DATA';
  var s = document.createElement('script');
  var t = setTimeout(function(){ s.onerror=s.onload=null; s.remove(); if(cb) cb(null); },to);
  s.onerror = function(){ clearTimeout(t); if(cb) cb(null); };
  s.onload = function(){
    clearTimeout(t);
    var d = window[key]; delete window[key];
    d = d || null;
    if(d && file !== 'index.js') saveToCache(file, d);
    if(d) loadedSources[file] = d;
    if(cb) cb(d);
  };
  var bp = (typeof window.__SC_BASE_PATH !== 'undefined' ? window.__SC_BASE_PATH : '');
  s.src = bp + 'data/' + file;
  document.head.appendChild(s);
}

// 预加载函数（未改变）
var preloadTotal=0,preloadCompleted=0;
function updatePreload(p){ $('pwPreloadProgressFill').style.width=p+'%'; }
function startPreload(){
  window.__TVBOX_WARM_RUN = true;
  if(!sourceIndex.length) return;
  var files=new Set();
  sourceIndex.forEach(function(s){
    var pc=s.page_count||1, base=(sourceMeta[s.prefix]?.fileBase)||s.prefix;
    for(var i=1;i<=pc;i++) files.add(base+'-'+String(i).padStart(2,'0')+'.js');
  });
  var arr=Array.from(files);
  preloadTotal=arr.length; preloadCompleted=0;
  $('pwPreloadProgressBar').style.display='block';
  updatePreload(0);
  var bp = (typeof window.__SC_BASE_PATH !== 'undefined' ? window.__SC_BASE_PATH : '');
  var done=0;
  arr.forEach(function(f){
    loadFromCache(f, function(data){
      done++;
      if(data && !loadedSources[f]) loadedSources[f]=data;
      preloadCompleted=done;
      updatePreload(Math.floor(done/preloadTotal*100));
      if(done>=arr.length){
        updatePreload(100);
        setTimeout(function(){ $('pwPreloadProgressBar').style.display='none'; },300);
      }
    });
    fetch(bp + 'data/' + f)
      .then(function(r){ return r.text(); })
      .then(function(t){
        var newSize = t.length;
        var entry = (localStorage.getItem('tvbox_fsize_'+f)||'').split('|');
        var oldSize = parseInt(entry[0]||'0');
        if(newSize !== oldSize) loadFresh(f);
      })
      .catch(function(){});
  });
}

// 搜索实现（完全保留）
var searchTimer=null;
function doSearch(){
  var kw=$('pwSearchInput').value.trim();
  if(!kw) return;
  if(isSearching) stopSearch();
  currentSearchKeyword=kw;
  currentSearchResults=[];
  currentSearchCategory='';
  isSearching=true;
  searchVersion++;
  var ver=searchVersion;
  $('pwSearchBtn').style.display='none';
  $('pwStopSearchBtn').style.display='inline';
  renderSearchResult(true);
  if(!sourceIndex.length){
    var wait = setInterval(function(){
      if(!isSearching) { clearInterval(wait); return; }
      if(sourceIndex.length){ clearInterval(wait); doSearchImpl(kw, ver); }
    }, 200);
    return;
  }
  doSearchImpl(kw, ver);
}
function doSearchImpl(kw, ver){
  var tasks = [];
  sourceIndex.forEach(function(src){
    var pc = src.page_count||1;
    for(var p=1; p<=pc; p++){
      var base=(sourceMeta[src.prefix]?.fileBase)||src.prefix;
      var fname=base+'-'+String(p).padStart(2,'0')+'.js';
      tasks.push({ fname: fname });
    }
  });
  var totalPages = tasks.length;
  var doneCount = 0;
  var results = [];
  var needRender = false;
  function searchOne(data, fname){
    var found = false;
    if(data?.videos){
      data.videos.forEach(function(v){
        if(v.vod_name.includes(kw)||(v.vod_class||'').includes(kw)){
          results.push({vod_name:v.vod_name, vod_pic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class, sourceKey:fname, sourceName:data.name});
          found = true;
        }
      });
    }
    return found;
  }
  function updateProgress(){
    setStatus('📡 搜索中 '+doneCount+'/'+totalPages+' · 已找到 '+results.length+' 条');
  }
  function doRender(){
    if(ver!==searchVersion || !needRender) return;
    needRender = false;
    currentSearchResults = results.slice();
    renderSearchResult(false);
  }
  function finish(){
    if(ver!==searchVersion) return;
    isSearching=false;
    $('pwSearchBtn').style.display='inline';
    $('pwStopSearchBtn').style.display='none';
    currentSearchResults = results.slice();
    setStatus('✅ 搜索完成：关键词 '+(currentSearchKeyword||'-')+' - 结果：'+results.length+' 条');
    $('pwCatBar').innerHTML='';
    renderSearchResult(false);
  }
  var running = 0;
  var idx = 0;
  function loadNext(){
    if(ver!==searchVersion) return;
    while(idx < tasks.length){
      var task = tasks[idx++];
      if(loadedSources[task.fname]){
        var found = searchOne(loadedSources[task.fname], task.fname);
        doneCount++;
        updateProgress();
        if(found) needRender = true;
      } else {
        running++;
        loadData(task.fname, function(data){
          if(data) loadedSources[task.fname]=data;
          var found = searchOne(data, task.fname);
          doneCount++;
          updateProgress();
          if(found) needRender = true;
          running--;
          doRender();
          loadNext();
        }, 5000);
        if(running >= CONCURRENT) break;
      }
    }
    doRender();
    if(idx >= tasks.length && running <= 0) finish();
  }
  var warmRemain = 0;
  tasks.forEach(function(task){
    if(!loadedSources[task.fname]){
      warmRemain++;
      loadFromCache(task.fname, function(cached){
        if(cached) loadedSources[task.fname] = cached;
        warmRemain--;
        if(warmRemain <= 0) startSearch();
      });
    }
  });
  if(warmRemain === 0) startSearch();
  function startSearch(){
    for(var i=0; i<CONCURRENT; i++) loadNext();
  }
}
function stopSearch(){
  if(!isSearching) return;
  searchVersion++;
  isSearching=false;
  $('pwSearchBtn').style.display='inline';
  $('pwStopSearchBtn').style.display='none';
  if(currentSearchKeyword) renderSearchResult(false);
}
function saveSearchToStorage(){ setStorage(STORAGE.SEARCH,{ keyword:currentSearchKeyword, results:currentSearchResults, category:currentSearchCategory }); }
function loadSearchFromStorage(){ var d=getStorage(STORAGE.SEARCH); if(d?.results?.length){ currentSearchKeyword=d.keyword||''; currentSearchResults=d.results.slice(); currentSearchCategory=d.category||''; return true; } return false; }
function refreshSearchDisplay(){
  var filtered = currentSearchCategory==='' ? currentSearchResults.slice() :
    currentSearchCategory==='未分类' ? currentSearchResults.filter(function(v){ return !(v.vod_class||'').trim(); }) :
    currentSearchResults.filter(function(v){ return (v.vod_class||'').split(',').some(function(c){ return c.trim()===currentSearchCategory; }); });
  currentFiltered=filtered; currentPage=1; render(); saveSearchToStorage();
}
function buildSearchCatBar(){
  var cats={};
  currentSearchResults.forEach(function(v){
    var cls=v.vod_class;
    if(Array.isArray(cls)) cls=cls.join(',');
    cls=(cls||'').trim();
    if(!cls) cats['未分类']=(cats['未分类']||0)+1;
    else cls.split(',').forEach(function(c){ c=c.trim(); if(c) cats[c]=(cats[c]||0)+1; });
  });
  var h='<select class="pw-cat-filter"><option value="">全部分类 ('+currentSearchResults.length+')</option>';
  Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; }).forEach(function(c){
    h+='<option value="'+c.replace(/&/g,'&amp;')+'"'+(c===currentSearchCategory?' selected':'')+'>'+c+' ('+cats[c]+')</option>';
  });
  h+='</select>';
  $('pwCatBar').innerHTML=h;
}
function renderSearchResult(loading){
  currentPrefix='__search_result__';
  if(loading && (!currentSearchResults.length||isSearching)){
    $('pwContent').innerHTML='<div class="pw-empty-state">🔍 搜索中<br><span style="font-size:12px;color:var(--text-muted)">'+$('pwStatusText').textContent+'</span></div>';
    $('pwPagination').innerHTML='';
    setStatus('关键词：'+currentSearchKeyword+' - 结果：0');
    $('pwClearSearchResultBtn').style.display='none';
    $('pwCatBar').innerHTML='';
    return;
  }
  if(!currentSearchResults.length){
    if(isSearching){
      $('pwContent').innerHTML='<div class="pw-empty-state">🔍 搜索中<br><span style="font-size:12px;color:var(--text-muted)">'+$('pwStatusText').textContent+'</span></div>';
      $('pwPagination').innerHTML='';
    } else {
      setEmpty('暂无搜索结果','请尝试其他关键词');
      $('pwPagination').innerHTML='';
    }
    setStatus('关键词：'+currentSearchKeyword+' - 结果：'+currentSearchResults.length);
    $('pwClearSearchResultBtn').style.display='none';
    $('pwCatBar').innerHTML='';
    return;
  }
  buildSearchCatBar();
  refreshSearchDisplay();
  $('pwSourceSelect').value='__search_result__';
}
function resetSearch(keyword){ currentSearchKeyword=keyword; currentSearchResults=[]; currentSearchCategory=''; $('pwSourceSelect').value='__search_result__'; renderSearchResult(true); setStorage(STORAGE.SEARCH,null); }
function addSearchResults(newArr){
  if(!newArr.length) return;
  var exist=new Set(currentSearchResults.map(function(v){ return v.sourceKey+'_'+v.vod_name; }));
  for(var item of newArr){
    var key=item.sourceKey+'_'+item.vod_name;
    if(!exist.has(key)){ currentSearchResults.push(item); exist.add(key); }
  }
  if($('pwSourceSelect').value==='__search_result__'){ buildSearchCatBar(); refreshSearchDisplay(); }
  saveSearchToStorage();
}
function clearAllSearchResults(){
  if(currentPrefix!=='__search_result__') return;
  currentSearchResults=[]; currentSearchKeyword=''; currentSearchCategory='';
  renderSearchResult(false);
  setStatus('关键词：- 结果：0');
  $('pwClearSearchResultBtn').style.display='none';
  $('pwCatBar').innerHTML='';
  setStorage(STORAGE.SEARCH,null);
}
function removeSearchItem(sKey,vName){
  currentSearchResults=currentSearchResults.filter(function(v){ return !(v.sourceKey===sKey&&v.vod_name===vName); });
  if(!currentSearchResults.length) currentSearchKeyword='',currentSearchCategory='';
  buildSearchCatBar(); refreshSearchDisplay();
  if(!currentSearchResults.length) $('pwClearSearchResultBtn').style.display='none';
  saveSearchToStorage();
}
function renderSpecialView(type){
  if(isSearching) stopSearch();
  currentPrefix=type; currentCategory='';
  $('pwSearchInput').value='';
  $('pwClearSearchResultBtn').style.display='none';
  var list=[];
  var histObj=null;
  if(type==='__history__'){ histObj=getStorage(STORAGE.HISTORY); list=Object.keys(histObj).map(function(k){ var v=histObj[k]; if(!v.sourceKey){ var i=k.lastIndexOf('_'); if(i>0) v.sourceKey=k.slice(0,i); } return v; }).sort(function(a,b){ return b.updatedAt-a.updatedAt; }); }
  else if(type==='__favorites__') list=getStorage(STORAGE.FAVORITES);
  else if(type==='__bookmarks__') list=getBookmarks();
  if(!list.length){
    setEmpty(type==='__history__'?'暂无观看记录':type==='__favorites__'?'暂无收藏':'暂无影签','');
    $('pwPagination').innerHTML='';
    $('pwCatBar').innerHTML='<span style="font-size:12px">'+(type==='__history__'?'最近观看':type==='__favorites__'?'我的收藏':'我的影签')+' — 0 条记录</span>';
    setStatus((type==='__history__'?'最近观看':type==='__favorites__'?'我的收藏':'我的影签')+' — 0 条记录');
    return;
  }
  currentFiltered = list.map(function(item){
    var base={ sourceKey:item.sourceKey, sourceName:item.sourceName, vod_name:item.videoName||item.videoName, vod_pic:item.vodPic, ep_count:item.ep_count, playable_count:item.playable_count, episodes:item.episodes };
    var cached = findVideoInCache(item.sourceKey, base.vod_name);
    if(cached){
      if(cached.ep_count != null) base.ep_count = cached.ep_count;
      if(cached.playable_count != null) base.playable_count = cached.playable_count;
      if(cached.episodes && cached.episodes.length) base.episodes = cached.episodes;
    }
    if(type==='__history__'){ base.isHistory=true; base.historyEpIndex=item.epIndex; base.historyProgress=item.progress; }
    else if(type==='__bookmarks__'){ base.isBookmark=true; base.bookmarkNote=item.note; base.bookmarkProgress=item.progress; base.bookmarkEpIndex=item.epIndex; }
    return base;
  });
  currentPage=1; render();
  var title=type==='__history__'?'最近观看':type==='__favorites__'?'我的收藏':'我的影签';
  $('pwCatBar').innerHTML='<span style="font-size:12px">'+title+' — '+list.length+' 条记录</span>';
  setStatus(title+' — '+list.length+' 条记录 · 第 1 页');
}
function switchSource(){
  if(isSearching) stopSearch();
  var val=$('pwSourceSelect').value;
  if(!val){ $('pwContent').innerHTML=''; setStatus('⏹ 选择数据源'); return; }
  if(val==='__history__'){ renderSpecialView('__history__'); return; }
  if(val==='__favorites__'){ renderSpecialView('__favorites__'); return; }
  if(val==='__bookmarks__'){ renderSpecialView('__bookmarks__'); return; }
  if(val==='__search_result__'){ renderSearchResult(false); return; }
  currentPrefix=val; currentFilePage=1; currentPage=1; $('pwSearchInput').value='';
  if(currentPlayingVideo) floatReturn=currentPrefix, showFloatPlayer();
  loadPageFile(val,1);
}
function loadPageFile(prefix,page){
  var base=(sourceMeta[prefix]?.fileBase)||prefix;
  var fname=base+'-'+String(page).padStart(2,'0')+'.js';
  if(loadedSources[fname]) useSourceData(loadedSources[fname],fname,page);
  else {
    $('pwContent').innerHTML='<div class="pw-empty-state">⛏ 加载中...</div>';
    loadData(fname,function(data){ if(data) loadedSources[fname]=data; useSourceData(data,fname,page); });
  }
}
function useSourceData(data,file,page){
  currentData=data; currentFilePage=page; currentPage=1;
  if(!data?.videos){ setStatus('❌ 数据格式错误'); return; }
  currentCategory='';
  setStatus('📡 '+data.name+' — 第'+page+'页');
  currentFiltered=data.videos.map(function(v){ return {vod_name:v.vod_name, vod_pic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class, sourceKey:file, sourceName:data.name}; });
  render();
  $('pwClearSearchResultBtn').style.display='none';
  buildCatBarAsync();
}
function ensureFullCategoryStats(prefix){
  if(categoryStatsLoading) return;
  var meta=sourceMeta[prefix];
  if(!meta) return;
  if(meta.categories && Object.keys(meta.categories).length>0) return;
  categoryStatsLoading=true;
  setStatus('📊 正在统计分类数量 (全量) ...');
  var pc=meta.page_count||1;
  var base=(meta.fileBase)||prefix;
  var catMap={};
  var loadedCount=0;
  var totalVideos=0;
  var playableVideos=0;
  function processPage(p){
    if(p>pc){
      meta.categories=catMap;
      meta.total=totalVideos;
      meta.playable_videos=playableVideos;
      categoryStatsLoading=false;
      setStatus('✅ 分类统计完成 (共 '+Object.keys(catMap).length+' 个分类)');
      buildCatBarAndRefresh();
      return;
    }
    var fname=base+'-'+String(p).padStart(2,'0')+'.js';
    var pageData=loadedSources[fname];
    function afterLoad(data){
      if(data) loadedSources[fname]=data;
      pageData=loadedSources[fname];
      if(pageData?.videos){
        totalVideos+=pageData.videos.length;
        pageData.videos.forEach(function(v){
          if(v.playable_count>0) playableVideos++;
          var cls=v.vod_class;
          if(Array.isArray(cls)) cls=cls.join(',');
          cls=(cls||'').trim();
          if(!cls){ catMap['未分类']=(catMap['未分类']||0)+1; }
          else {
            cls.split(',').forEach(function(c){
              c=c.trim().replace(/^\s+|\s+$/g,'');
              if(c) catMap[c]=(catMap[c]||0)+1;
            });
          }
        });
      }
      loadedCount++;
      setStatus('📊 统计分类中 '+loadedCount+'/'+pc+' ...');
      processPage(p+1);
    }
    if(pageData){ afterLoad(null); }
    else { loadData(fname,function(data){ afterLoad(data); },5000); }
  }
  processPage(1);
}
function buildCatBarAndRefresh(){
  var meta=sourceMeta[currentPrefix];
  if(!meta) return;
  var cats=meta.categories||{};
  var total=meta.total||0;
  var playable=meta.playable_videos||0;
  var h='<select class="pw-cat-filter"><option value="">全部 ('+(total>99?'99+':total)+'/'+(playable>99?'99+':playable)+')</option>';
  Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; }).forEach(function(c){
    h+='<option value="'+c.replace(/&/g,'&amp;')+'">'+c+' ('+cats[c]+')</option>';
  });
  h+='</select>';
  $('pwCatBar').innerHTML=h;
  if(currentCategory && currentCategory!==''){
    filterCategory(document.querySelector('.pw-cat-filter'));
  } else {
    if(currentPrefix && !currentPrefix.startsWith('__') && currentData){
      currentFiltered=currentData.videos.map(function(v){ return {vod_name:v.vod_name, vod_pic:v.vod_pic, ep_count:v.ep_count, playable_count:v.playable_count, episodes:v.episodes, vod_class:v.vod_class, sourceKey:currentData.fileName||currentPrefix, sourceName:currentData.name}; });
      render();
    }
  }
}
function buildCatBarAsync(){
  var meta=sourceMeta[currentPrefix];
  if(!meta) return;
  if(meta.categories && Object.keys(meta.categories).length>0){
    var cats=meta.categories;
    var total=meta.total||0;
    var playable=meta.playable_videos||0;
    var h='<select class="pw-cat-filter"><option value="">全部 ('+(total>99?'99+':total)+'/'+(playable>99?'99+':playable)+')</option>';
    Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; }).forEach(function(c){
      h+='<option value="'+c.replace(/&/g,'&amp;')+'">'+c+' ('+cats[c]+')</option>';
    });
    h+='</select>';
    $('pwCatBar').innerHTML=h;
    return;
  }
  ensureFullCategoryStats(currentPrefix);
  $('pwCatBar').innerHTML='<select class="pw-cat-filter"><option value="">统计分类中...</option></select>';
}
function filterCategory(sel){
  var selected=sel.value;
  if(currentPrefix==='__search_result__'){ currentSearchCategory=selected; refreshSearchDisplay(); buildSearchCatBar(); return; }
  if(currentPrefix.startsWith('__')) return;
  currentCategory=selected; currentPage=1;
  if(!currentCategory){ loadPageFile(currentPrefix,currentFilePage); return; }
  var meta=sourceMeta[currentPrefix], pc=meta.page_count||1, results=[], loaded=0;
  var done=function(){ loaded++; if(loaded>=pc){ currentFiltered=results; setStatus('[FILTER] '+selected+' — '+results.length+' results'); render(); } };
  for(var p=1;p<=pc;p++){
    var fn=(meta.fileBase||currentPrefix)+'-'+String(p).padStart(2,'0')+'.js';
    if(loadedSources[fn]){ collectCat(loadedSources[fn],selected,results); done(); }
    else loadData(fn,function(data){ if(data) loadedSources[fn]=data; if(data) collectCat(data,selected,results); done(); });
  }
}
function collectCat(src,cat,out){
  if(!src?.videos) return;
  src.videos.forEach(function(v){
    var matched = false;
    var clsRaw = v.vod_class;
    if(Array.isArray(clsRaw)) clsRaw = clsRaw.join(',');
    if(cat === '未分类') {
      if(!clsRaw || (typeof clsRaw === 'string' && clsRaw.trim() === '')) matched = true;
    } else {
      clsRaw = (clsRaw || '').toString();
      var classes = clsRaw.split(',').map(function(c){ return c.trim(); }).filter(function(c){ return c; });
      if(classes.indexOf(cat) !== -1) matched = true;
    }
    if(matched){
      out.push({
        sourceKey: currentPrefix,
        sourceName: src.name,
        vod_name: v.vod_name,
        vod_pic: v.vod_pic,
        episodes: v.episodes,
        ep_count: v.ep_count,
        playable_count: v.playable_count,
        vod_class: v.vod_class
      });
    }
  });
}
function render(){
  var total=currentFiltered.length, pages=Math.ceil(total/PAGE_SIZE)||1;
  if(currentPage>pages) currentPage=pages;
  var start=(currentPage-1)*PAGE_SIZE, items=currentFiltered.slice(start,start+PAGE_SIZE);
  var h='<div class="pw-video-grid">';
  var isSearch=(currentPrefix==='__search_result__');
  var isSpecial=['__history__','__favorites__','__bookmarks__'].includes(currentPrefix);
  items.forEach(function(v,i){
    var eid='eps_'+currentPage+'_'+i;
    var img=v.vod_pic||'https://picsum.photos/seed/'+encodeURIComponent(v.vod_name)+'/300/400', badge=v.playable_count>0?'可播放':'待验证';
    var epInfo=(v.ep_count||0)+'集'+(v.playable_count?' · '+v.playable_count+'可播放':'');
    var isFav=isFavorited(v.sourceKey, v.vod_name);
    h+='<div class="pw-video-card" data-eid="'+eid+'" data-vodname="'+escAttr(v.vod_name)+'" data-sourcekey="'+escAttr(v.sourceKey)+'">';
    h+='<div class="pw-poster-wrap">'+(img?'<img class="pw-poster" src="'+img.replace(/&/g,'&amp;')+'" loading="lazy" onerror="this.onerror=null;this.src=\'https://picsum.photos/seed/'+encodeURIComponent(v.vod_name)+'/300/400\';this.offsetHeight"><div class="pw-poster-fallback" style="display:none">🎬</div>':'<div class="pw-poster-fallback">🎬</div>');
    h+='<button class="pw-fav-btn pw-fav'+(isFav?' pw-faved':'')+'" data-sourcekey="'+escAttr(v.sourceKey)+'" data-vodname="'+escAttr(v.vod_name)+'" data-vodpic="'+escAttr(v.vod_pic||'')+'" data-epcount="'+(v.ep_count||0)+'" data-playablecount="'+(v.playable_count||0)+'" title="'+(isFav?'取消收藏':'收藏')+'">'+(isFav?'♥收藏':'♡收藏')+'</button>';
    if(isSearch && !v.isHistory && !v.isBookmark) h+='<button class="pw-fav-btn pw-card-delete pw-search-result-delete" data-vodname="'+escAttr(v.vod_name)+'" data-sourcekey="'+escAttr(v.sourceKey)+'" title="删除">×删除</button>';
    else if(v.isHistory || v.isBookmark) h+='<button class="pw-fav-btn pw-card-delete pw-ep-delete" data-vodname="'+escAttr(v.vod_name)+'" data-sourcekey="'+escAttr(v.sourceKey)+'" data-type="'+(v.isHistory?'history':'bookmark')+'" title="删除">×删除</button>';
    h+='<span class="pw-card-badge '+(v.playable_count>0?'pw-playable':'pw-unplayable')+'">'+badge+'</span>';
    if(v.isHistory && v.historyProgress) h+='<div class="pw-progress-bar"><div class="pw-progress-fill" style="width:'+Math.min(100,Math.round(v.historyProgress/300*100))+'%"></div></div>';
    if(v.isBookmark && v.bookmarkNote) h+='<div class="pw-bookmark-note">'+escHtml(v.bookmarkNote)+'</div>';
    h+='</div><div class="pw-card-info"><div class="pw-card-title">'+escHtml(v.vod_name)+'</div><div class="pw-card-meta">'+(v.sourceName?escHtml(v.sourceName)+' · ':'')+epInfo+(v.isHistory && v.historyProgress?' · 第'+(parseInt(v.historyEpIndex)+1)+'集 '+Math.floor(v.historyProgress/60)+'\''+Math.floor(v.historyProgress%60)+'\'\'':'')+(v.isBookmark && v.bookmarkProgress?' · 第'+(parseInt(v.bookmarkEpIndex)+1)+'集 '+Math.floor(v.bookmarkProgress/60)+'\''+Math.floor(v.bookmarkProgress%60)+'\'\'':'')+(v.isBookmark && v.bookmarkNote?' · "'+v.bookmarkNote+'"':'')+'</div></div></div>';
    h+='<div class="pw-ep-panel" id="'+eid+'"><div class="pw-ep-header"><span>剧集 ('+((v.episodes||[]).length)+')</span><button class="pw-ep-close" data-eid="'+eid+'">✖</button></div>';
    (v.episodes||[]).forEach(function(e,ei){
      var isCurr=(v.isHistory && ei===v.historyEpIndex)||(v.isBookmark && ei===v.bookmarkEpIndex);
      var prog=isCurr&&(v.historyProgress||v.bookmarkProgress);
      h+='<div class="pw-ep-item'+(isCurr?' pw-current':'')+'" data-url="'+escAttr(e.url)+'" data-name="'+escAttr(v.vod_name+' - '+e.title)+'" data-epindex="'+ei+'">'+escHtml(e.title)+(!e.playable?' ⚠':'')+(isCurr?' ▶':'')+(prog?' ('+Math.floor(prog/60)+"'"+(prog%60)+')':'')+'</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  if(!items.length) h='<div class="pw-empty-state">🔍 无匹配结果</div>';
  $('pwContent').innerHTML=h;
  var pg='';
  if(isSearch || isSpecial || (currentPrefix && !currentPrefix.startsWith('__') && currentCategory!=='')){
    var pgs=Math.ceil(total/PAGE_SIZE)||1;
    if(pgs===1) pg='<button disabled>1</button>';
    else{
      pg+='<button class="pw-pg-go" data-page="1"'+(currentPage<=1?' disabled':'')+'>«</button><button class="pw-pg-go" data-page="'+(currentPage-1)+'"'+(currentPage<=1?' disabled':'')+'>‹</button>';
      var sp=Math.max(1,currentPage-2), ep=Math.min(pgs,currentPage+2);
      for(var pi=sp;pi<=ep;pi++) pg+='<button class="pw-pg-go'+(pi===currentPage?' pw-active':'')+'" data-page="'+pi+'">'+pi+'</button>';
      pg+='<button class="pw-pg-go" data-page="'+(currentPage+1)+'"'+(currentPage>=pgs?' disabled':'')+'>›</button><button class="pw-pg-go" data-page="'+pgs+'"'+(currentPage>=pgs?' disabled':'')+'>»</button>';
    }
    if(isSearch){
      if(!isSearching) setStatus('关键词：'+(currentSearchKeyword||'-')+' - 结果：'+currentSearchResults.length+(currentSearchCategory?' · 分类：'+currentSearchCategory:'')+' · 第 '+currentPage+' 页');
      $('pwClearSearchResultBtn').style.display=currentSearchResults.length?'inline-block':'none';
    }
    else if(isSpecial) setStatus((currentPrefix==='__history__'?'最近观看':currentPrefix==='__favorites__'?'我的收藏':'我的影签')+' — '+total+' 条记录 · 第 '+currentPage+' 页');
    else setStatus((currentData?.name||'')+' · '+(currentCategory==='未分类'?'未分类':currentCategory)+'分类 — '+total+' 部影片 · 第 '+currentPage+' 页');
  } else if(currentPrefix && sourceMeta[currentPrefix] && !currentPrefix.startsWith('__')){
    var pc=sourceMeta[currentPrefix].page_count||1;
    if(pc===1) pg='<button disabled>1</button>';
    else{
      pg+='<button class="pw-pg-page" data-page="1"'+(currentFilePage<=1?' disabled':'')+'>«</button><button class="pw-pg-page" data-page="'+(currentFilePage-1)+'"'+(currentFilePage<=1?' disabled':'')+'>‹</button>';
      sp=Math.max(1,currentFilePage-2), ep=Math.min(pc,currentFilePage+2);
      for(pi=sp;pi<=ep;pi++) pg+='<button class="pw-pg-page'+(pi===currentFilePage?' pw-active':'')+'" data-page="'+pi+'">'+pi+'</button>';
      pg+='<button class="pw-pg-page" data-page="'+(currentFilePage+1)+'"'+(currentFilePage>=pc?' disabled':'')+'>›</button><button class="pw-pg-page" data-page="'+pc+'"'+(currentFilePage>=pc?' disabled':'')+'>»</button>';
    }
    setStatus('📡 '+(currentData?.name||'')+' — 第'+currentFilePage+'页');
  }
  $('pwPagination').innerHTML=pg;
}
function go(p){ var total=currentFiltered.length, max=Math.ceil(total/PAGE_SIZE)||1; if(p<1) p=1; if(p>max) p=max; currentPage=p; render(); }
function goPage(p){
  if(currentCategory!==''){ go(p); return; }
  var meta=sourceMeta[currentPrefix];
  var pc=meta?.page_count||1;
  if(p<1) p=1; if(p>pc) p=pc;
  if(p!==currentFilePage) loadPageFile(currentPrefix,p);
  else{ currentPage=p; render(); }
}
function toggleEpisodes(el,eid){
  var panel = document.getElementById(eid);
  if(!panel) return;
  var open = panel.classList.contains('pw-open');
  document.querySelectorAll('.pw-ep-panel.pw-open').forEach(function(ep){ if(ep.id!==eid) ep.classList.remove('pw-open'); });
  panel.classList.toggle('pw-open');
  if(!open){
    var vodName=el.dataset.vodname, sKey=el.dataset.sourcekey;
    currentOpenVideo=currentFiltered.find(function(v){ return v.vod_name===vodName&&v.sourceKey===sKey; })||null;
    if(currentOpenVideo && currentOpenVideo.episodes?.length===1 && (currentOpenVideo.isHistory||currentOpenVideo.isBookmark)){
      var full=findVideoInCache(sKey,vodName);
      if(full?.episodes?.length>1){
        currentOpenVideo.episodes=full.episodes;
        currentOpenVideo.playable_count=full.playable_count||full.episodes.filter(function(e){ return e.playable; }).length;
        currentOpenVideo.ep_count=full.ep_count||full.episodes.length;
        var epContainer=panel;
        epContainer.innerHTML='<div class="pw-ep-header"><span>剧集 ('+currentOpenVideo.episodes.length+')</span><button class="pw-ep-close" data-eid="'+eid+'">✖</button></div>';
        currentOpenVideo.episodes.forEach(function(e,ei){
          var isCurr=(currentOpenVideo.isHistory && ei===currentOpenVideo.historyEpIndex)||(currentOpenVideo.isBookmark && ei===currentOpenVideo.bookmarkEpIndex);
          var prog=isCurr&&(currentOpenVideo.historyProgress||currentOpenVideo.bookmarkProgress);
          epContainer.innerHTML+='<div class="pw-ep-item'+(isCurr?' pw-current':'')+'" data-url="'+escAttr(e.url)+'" data-name="'+escAttr(currentOpenVideo.vod_name+' - '+e.title)+'" data-epindex="'+ei+'">'+escHtml(e.title)+(!e.playable?' ⚠':'')+(isCurr?' ▶':'')+(prog?' ('+Math.floor(prog/60)+"'"+(prog%60)+')':'')+'</div>';
        });
        var closeBtn=epContainer.querySelector('.pw-ep-close');
        if(closeBtn) closeBtn.addEventListener('click',function(ev){ ev.stopPropagation(); panel.classList.remove('pw-open'); });
      }
    }
  } else currentOpenVideo=null;
}
function playEp(el){
  var url=el.dataset.url;
  if(!url) return;
  var items=el.parentElement.querySelectorAll('.pw-ep-item');
  var idx=Array.from(items).indexOf(el);
  var epIdx=parseInt(el.dataset.epindex)||idx;
  currentEpNext=idx<items.length-1?items[idx+1]:null;
  $('pwNextEpBtn').style.display=currentEpNext?'inline':'none';
  if(currentPlayingVideo){
    var vv=$('pwPlayer');
    if(vv.currentTime>5) updateHistory(currentPlayingVideo,currentPlayingEpIndex,Math.floor(vv.currentTime));
  }
  currentPlayingVideo=currentOpenVideo;
  currentPlayingEpIndex=epIdx;
  $('pwBookmarkBtn').style.display='inline-block';
  doPlay(url,el.dataset.name);
}
function doPlay(url,name){
  if(currentHls) currentHls.destroy();
  var v=$('pwPlayer');
  v.pause(); v.removeAttribute('src'); v.load();
  pw$('.pw-player-box').classList.add('pw-playing');
  var saved=currentPlayingVideo?(currentPlayingVideo.historyProgress||currentPlayingVideo.bookmarkProgress||0):0;
  if(url.includes('.m3u8') && window.Hls?.isSupported()){
    var hls=new Hls();
    if(saved>5){
      hls.on(Hls.Events.MANIFEST_PARSED,function(){
        v.currentTime=saved;
      });
    }
    hls.loadSource(url);
    hls.attachMedia(v);
    currentHls=hls;
  } else {
    if(saved>5){
      v.addEventListener('loadedmetadata',function once(){
        v.removeEventListener('loadedmetadata',once);
        v.currentTime=saved;
      });
    }
    v.src=url;
  }
  v.play().catch(function(){});
  setStatus('▶ '+name);
}
function playNext(){ if(currentEpNext) playEp(currentEpNext); }
function addBookmarkHandler(){
  if(!currentPlayingVideo || (currentPlayingEpIndex===undefined)){ setStatus('⚠ 请先选择剧集'); return; }
  var v=$('pwPlayer');
  updateHistory(currentPlayingVideo,currentPlayingEpIndex,Math.floor(v.currentTime));
  var note=prompt('影签备注：','');
  if(note===null) return;
  addBookmark(currentPlayingVideo,currentPlayingEpIndex,Math.floor(v.currentTime),note);
  setStatus('✓ 影签已添加');
}
function showFloatPlayer(){
  if(playerInFloat) return;
  var main=$('pwPlayer'), floatV=$('pwFloatVideo'), floatDiv=$('pwFloatPlayer');
  if(currentHls){ currentHls.detachMedia(); currentHls.attachMedia(floatV); }
  floatV.src=main.src||main.currentSrc;
  floatV.currentTime=main.currentTime;
  floatV.volume=main.volume;
  if(currentPlayingVideo) $('pwFloatPlayerTitle').textContent=currentPlayingVideo.vod_name||'正在播放';
  playerInFloat=true;
  pw$('.pw-player-box').classList.remove('pw-playing');
  floatDiv.style.display='block';
  if(!main.paused) floatV.play().catch(function(){});
}
function returnFromFloat(){
  if(!playerInFloat) return;
  $('pwFloatPlayer').style.display='none';
  playerInFloat=false;
  var main=$('pwPlayer'), floatV=$('pwFloatVideo');
  if(currentHls){ currentHls.detachMedia(); currentHls.attachMedia(main); }
  main.src=floatV.src; main.currentTime=floatV.currentTime; main.volume=floatV.volume;
  main.play().catch(function(){});
  pw$('.pw-player-box').classList.add('pw-playing');
  if(floatReturn){ $('pwSourceSelect').value=floatReturn; floatReturn=null; }
}
function closeFloatPlayer(){
  if(!playerInFloat) return;
  var v=$('pwFloatVideo'); v.pause(); v.src='';
  if(currentHls){ currentHls.destroy(); currentHls=null; }
  playerInFloat=false; floatReturn=null;
  $('pwFloatPlayer').style.display='none';
  pw$('.pw-player-box').classList.remove('pw-playing');
  currentPlayingVideo=null;
  $('pwBookmarkBtn').style.display='none';
  setStatus('⏹ 已关闭');
}
(function(){
  var wrap=$('player-wrap');
  function syncTheme(t){
    if(!t||(t!=='dark'&&t!=='light')){
      try{ t=window.parent.document.documentElement.getAttribute('data-theme'); }catch(e){}
    }
    if(!t||(t!=='dark'&&t!=='light')) t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    wrap.setAttribute('data-theme',t);
  }
  syncTheme(wrap.getAttribute('data-theme'));
  try{
    var parentEl=window.parent.document.documentElement;
    new MutationObserver(function(){
      syncTheme(parentEl.getAttribute('data-theme'));
    }).observe(parentEl,{attributes:true,attributeFilter:['data-theme']});
  }catch(e){}
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){
    syncTheme(e.matches?'dark':'light');
  });
  function checkContainerWidth(){
    var width = wrap.offsetWidth;
    if(width < 500) wrap.classList.add('pw-narrow');
    else wrap.classList.remove('pw-narrow');
  }
  checkContainerWidth();
  window.addEventListener('resize', checkContainerWidth);
})();
function setEmpty(t,s){ $('pwContent').innerHTML='<div class="pw-empty-state">📺 '+t+(s?'<div class="sub">'+s+'</div>':'')+'</div>'; }
function loadIndex(){
  loadData('index.js',function(data){
    if(!data){ setEmpty('无数据','请运行爬虫'); return; }
    sourceIndex=data;
    if(!sourceIndex.length){ setEmpty('无数据源','请检查 data/目录'); return; }
    var sel=$('pwSourceSelect'), ta=0,pa=0;
    sel.innerHTML='';
    sel.appendChild(new Option('🕒 最近观看','__history__'));
    sel.appendChild(new Option('❤️ 我的收藏','__favorites__'));
    sel.appendChild(new Option('📌 我的影签','__bookmarks__'));
    sel.appendChild(new Option('📋 搜索结果','__search_result__'));
    sel.appendChild(new Option('— 数据源 —','',true,true));
    var nameCnt={};
    sourceIndex.forEach(function(s){ nameCnt[s.name]=(nameCnt[s.name]||0)+1; });
    var nameSeen={};
    sourceIndex.forEach(function(s){
      ta+=s.total||0; pa+=s.playable||0;
      var dn=s.name;
      if(nameCnt[s.name]>1){ nameSeen[s.name]=(nameSeen[s.name]||0)+1; dn=s.name+'（站'+['一','二','三','四','五','六','七','八','九'][nameSeen[s.name]-1]+'）'; }
      sel.appendChild(new Option('📀 '+dn,s.prefix));
      sourceMeta[s.prefix]={ page_count:s.page_count||1, name:dn, total:s.total, playable_videos:s.playable_videos||0, categories:s.categories||{}, fileBase:s.file.replace(/\.js$/,'').replace(/-\d+$/,''), prefix:s.prefix };
    });
    $('pwTvboxFooter').innerHTML='<span>数据源 '+sourceIndex.length+'</span><span>总地址 '+ta+'</span><span>可播放 '+pa+'</span>';
    startPreload();
    sel.value='__history__';
    renderSpecialView('__history__');
  });
}
document.addEventListener('click',function(e){
  var t=e.target;
  var epDel=t.closest('.pw-ep-delete');
  if(epDel){ e.stopPropagation(); var sKey=epDel.dataset.sourcekey, vName=epDel.dataset.vodname, type=epDel.dataset.type; if(type==='history'){ var h=getStorage(STORAGE.HISTORY); delete h[sKey+'_'+vName]; setStorage(STORAGE.HISTORY,h); setStatus('✓ 已删除'); renderSpecialView('__history__'); }else if(type==='bookmark'){ saveBookmarks(getBookmarks().filter(function(b){ return !(b.videoName===vName&&b.sourceKey===sKey); })); setStatus('✓ 影签已删除'); renderSpecialView('__bookmarks__'); } return; }
  var srDel=t.closest('.pw-search-result-delete');
  if(srDel){ e.stopPropagation(); removeSearchItem(srDel.dataset.sourcekey, srDel.dataset.vodname); setStatus('✓ 已从搜索结果中删除'); return; }
  var fav=t.closest('.pw-fav-btn');
  if(fav){
    e.stopPropagation();
    var sKey=fav.dataset.sourcekey, vName=fav.dataset.vodname, vPic=fav.dataset.vodpic, eCnt=parseInt(fav.dataset.epcount)||0, pCnt=parseInt(fav.dataset.playablecount)||0;
    if(isFavorited(sKey,vName)){
      removeFavorite(sKey,vName); fav.classList.remove('pw-faved'); fav.innerHTML='♡收藏'; fav.title='收藏';
      if(currentPrefix==='__favorites__') renderSpecialView('__favorites__');
    }else{
      var full=currentFiltered.find(function(v){ return v.vod_name===vName&&v.sourceKey===sKey; });
      if(!full && currentData?.videos) full=currentData.videos.find(function(v){ return v.vod_name===vName; });
      if(!full||!full.episodes?.length) Object.values(loadedSources).some(function(d){
        var f=d?.videos?.find(function(v){ return v.vod_name===vName; });
        if(f?.episodes?.length){ full=f; return true; }
      });
      addFavorite({
        sourceKey:sKey, vod_name:vName, vod_pic:full?.vod_pic||vPic,
        sourceName:full?.sourceName||'', ep_count:full?.ep_count||eCnt,
        playable_count:full?.playable_count||pCnt, episodes:full?.episodes||[],
        vod_class:full?.vod_class||''
      });
      fav.classList.add('pw-faved'); fav.innerHTML='♥收藏'; fav.title='取消收藏';
    }
    return;
  }
  var epItem=t.closest('.pw-ep-item');
  if(epItem){ playEp(epItem); return; }
  var epClose=t.closest('.pw-ep-close');
  if(epClose){ e.stopPropagation(); var pid=epClose.dataset.eid; var panel=document.getElementById(pid); if(panel) panel.classList.remove('pw-open'); return; }
  var btn=t.closest('button');
  if(btn){
    if(btn.id==='pwSearchBtn') doSearch();
    else if(btn.id==='pwStopSearchBtn') stopSearch();
    else if(btn.id==='pwBookmarkBtn') addBookmarkHandler();
    else if(btn.id==='pwNextEpBtn') playNext();
    else if(btn.classList.contains('pw-pg-go')) go(parseInt(btn.dataset.page));
    else if(btn.classList.contains('pw-pg-page')) goPage(parseInt(btn.dataset.page));
    else if(btn.id==='pwClearSearchResultBtn') clearAllSearchResults();
    return;
  }
  var card=t.closest('.pw-video-card');
  if(card) toggleEpisodes(card,card.dataset.eid);
});
document.addEventListener('change',function(e){
  var tar=e.target;
  if(tar.id==='pwSourceSelect') switchSource();
  else if(tar.classList.contains('pw-cat-filter')) filterCategory(tar);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && document.activeElement===$('pwSearchInput')) doSearch();
  if((e.key==='n'||e.key==='N') && currentEpNext){ e.preventDefault(); playNext(); }
});
$('pwPlayer').addEventListener('ended',function(){
  if(currentPlayingVideo){ var v=$('pwPlayer'); updateHistory(currentPlayingVideo,currentPlayingEpIndex,Math.floor(v.currentTime)); }
  playNext();
  if(!currentEpNext) pw$('.pw-player-box').classList.remove('pw-playing');
});
$('pwPlayer').addEventListener('pause',function(){
  if(currentPlayingVideo){ var v=$('pwPlayer'); if(v.currentTime>5) updateHistory(currentPlayingVideo,currentPlayingEpIndex,Math.floor(v.currentTime)); }
});
function saveOnExit(){
  if(currentPlayingVideo){ var v=$('pwPlayer'); if(v.currentTime>5) updateHistory(currentPlayingVideo,currentPlayingEpIndex,Math.floor(v.currentTime)); }
}
window.addEventListener('beforeunload',saveOnExit);
window.addEventListener('pagehide',saveOnExit);
$('pwFloatBackBtn').addEventListener('click',returnFromFloat);
$('pwFloatCloseBtn').addEventListener('click',closeFloatPlayer);
loadIndex();
if (typeof onDataLoaded !== 'undefined' && onDataLoaded) { onDataLoaded([]); }
})();
</script>
