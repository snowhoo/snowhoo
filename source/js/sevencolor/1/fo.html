<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛音</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
#app { max-width: 1400px; margin: 0 auto; padding: 10px 12px 48px; }
h1 { font-size: 20px; padding: 10px 0 6px; text-align: center; }

/* 搜索栏 */
.search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.search-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
.search-bar input:focus { border-color: #e67e22; }

/* 分类标签 */
.cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; color: #666; }
.cat-tab.active { background: #e67e22; color: #fff; border-color: #e67e22; }

/* 统计信息 */
.stats { font-size: 12px; color: #999; margin-bottom: 12px; }

/* 网格 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; } }

.card { background: #fff; border-radius: 8px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.card:active { transform: scale(0.97); }
.card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #eee; }
.card-body { padding: 6px 8px 8px; }
.card-title { font-size: 13px; line-height: 1.4; color: #333; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-subcat { font-size: 11px; color: #999; margin-top: 2px; }

.loading { text-align: center; padding: 60px 0; color: #999; font-size: 14px; }
.empty { text-align: center; padding: 60px 0; color: #999; }

/* 播放器 */
.player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; padding: 8px 12px; display: none; align-items: center; gap: 12px; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); }
.player-bar.show { display: flex; }
.player-info { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-info .player-title { font-weight: 500; }
.player-info .player-subcat { font-size: 11px; color: #999; margin-left: 6px; }
.player-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.player-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #e67e22; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.player-btn:hover { background: #d35400; }
.player-btn.pause-btn { background: #e74c3c; }
.player-btn.pause-btn:hover { background: #c0392b; }
.player-progress { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.player-progress input[type="range"] { width: 80px; height: 4px; -webkit-appearance: none; appearance: none; background: #ddd; border-radius: 2px; outline: none; }
.player-progress input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #e67e22; cursor: pointer; }
.player-time { font-size: 11px; color: #999; min-width: 80px; text-align: center; }
</style>
</head>
<body>

<div id="app">
  <h1>佛音</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索音频...">
  </div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="player-bar" id="playerBar">
  <div class="player-info">
    <span class="player-title" id="playerTitle">-</span>
    <span class="player-subcat" id="playerSubcat"></span>
  </div>
  <div class="player-progress">
    <span class="player-time" id="playerTime">00:00 / 00:00</span>
    <input type="range" id="playerSeek" value="0" min="0" max="100" step="0.1">
  </div>
  <div class="player-controls">
    <button class="player-btn" id="playerBtnPlay" title="播放/暂停">▶</button>
    <button class="player-btn" id="playerBtnClose" title="关闭" style="background:#999;font-size:14px;">✕</button>
  </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<!-- 加载8个分类数据文件 -->
<script src="fo_data/fo_01_feige.js"></script>
<script src="fo_data/fo_02_nianfo.js"></script>
<script src="fo_data/fo_03_zhouyu.js"></script>
<script src="fo_data/fo_04_niansong.js"></script>
<script src="fo_data/fo_05_jizan.js"></script>
<script src="fo_data/fo_06_fanyue.js"></script>
<script src="fo_data/fo_07_youshengshu.js"></script>
<script src="fo_data/fo_08_jiangzuo.js"></script>

<script>
(function() {
    // 分类配置 (与JS文件名和变量名对应)
    var categories = [
        { name: '佛教歌曲', icon: '🎵', varName: 'fo_01_feige' },
        { name: '念佛佛号', icon: '🙏', varName: 'fo_02_nianfo' },
        { name: '咒语系列', icon: '📿', varName: 'fo_03_zhouyu' },
        { name: '佛经念诵', icon: '📖', varName: 'fo_04_niansong' },
        { name: '偈赞经忏', icon: '🎼', varName: 'fo_05_jizan' },
        { name: '清心梵乐', icon: '🎶', varName: 'fo_06_fanyue' },
        { name: '有声书', icon: '🔊', varName: 'fo_07_youshengshu' },
        { name: '音频讲座', icon: '🎙️', varName: 'fo_08_jiangzuo' },
    ];

    // 从全局变量获取数据
    categories.forEach(function(cat) {
        cat.items = window[cat.varName] || [];
    });

    var currentCat = categories[0].name;
    var searchText = '';

    var audio = document.getElementById('audioPlayer');
    var catTabs = document.getElementById('catTabs');
    var stats = document.getElementById('stats');
    var grid = document.getElementById('grid');
    var searchInput = document.getElementById('searchInput');
    var playerBar = document.getElementById('playerBar');
    var playerTitle = document.getElementById('playerTitle');
    var playerSubcat = document.getElementById('playerSubcat');
    var playerTime = document.getElementById('playerTime');
    var playerSeek = document.getElementById('playerSeek');
    var playerBtnPlay = document.getElementById('playerBtnPlay');
    var playerBtnClose = document.getElementById('playerBtnClose');

    // 渲染分类标签
    function renderTabs() {
        catTabs.innerHTML = '';
        categories.forEach(function(cat) {
            var tab = document.createElement('div');
            tab.className = 'cat-tab' + (cat.name === currentCat ? ' active' : '');
            tab.textContent = cat.icon + ' ' + cat.name + ' (' + cat.items.length + ')';
            tab.addEventListener('click', function() {
                if (currentCat !== cat.name) {
                    currentCat = cat.name;
                    renderTabs();
                    renderGrid();
                }
            });
            catTabs.appendChild(tab);
        });
    }

    // 渲染网格
    function renderGrid() {
        var cat = categories.filter(function(c) { return c.name === currentCat; })[0];
        if (!cat) return;

        var items = cat.items;
        if (searchText.trim()) {
            var kw = searchText.trim().toLowerCase();
            items = items.filter(function(item) {
                return item.title.toLowerCase().indexOf(kw) !== -1 ||
                       (item.subcat || '').toLowerCase().indexOf(kw) !== -1;
            });
            stats.textContent = '搜索 "' + searchText.trim() + '" 共 ' + items.length + ' 条';
        } else {
            stats.textContent = '共 ' + items.length + ' 条音频';
        }

        if (items.length === 0) {
            grid.innerHTML = '<div class="empty">没有找到匹配的音频</div>';
            return;
        }

        grid.innerHTML = '';
        items.forEach(function(item) {
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML =
                '<img src="' + item.cover + '" loading="lazy" alt="' + esc(item.title) + '" onerror="this.style.display=\'none\'">' +
                '<div class="card-body">' +
                '<div class="card-title">' + esc(item.title) + '</div>' +
                (item.subcat ? '<div class="card-subcat">' + esc(item.subcat) + '</div>' : '') +
                '</div>';
            card.addEventListener('click', function() {
                playAudio(item);
            });
            grid.appendChild(card);
        });
    }

    // 播放音频
    function playAudio(item) {
        playerBar.classList.add('show');
        playerTitle.textContent = item.title;
        playerSubcat.textContent = item.subcat || '';
        playerBtnPlay.textContent = '▶';
        
        if (audio.src !== item.audio) {
            audio.src = item.audio;
            audio.load();
            audio.play().then(function() {
                playerBtnPlay.textContent = '⏸';
            }).catch(function() {});
        } else {
            audio.play().then(function() {
                playerBtnPlay.textContent = '⏸';
            }).catch(function() {});
        }
    }

    // 播放/暂停按钮
    playerBtnPlay.addEventListener('click', function() {
        if (audio.paused) {
            audio.play();
            playerBtnPlay.textContent = '⏸';
        } else {
            audio.pause();
            playerBtnPlay.textContent = '▶';
        }
    });

    // 关闭播放器
    playerBtnClose.addEventListener('click', function() {
        audio.pause();
        audio.src = '';
        playerBar.classList.remove('show');
        playerBtnPlay.textContent = '▶';
    });

    // 进度条更新
    audio.addEventListener('timeupdate', function() {
        if (audio.duration) {
            var pct = (audio.currentTime / audio.duration) * 100;
            playerSeek.value = pct;
            playerTime.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
        }
    });

    // 拖动进度条
    playerSeek.addEventListener('input', function() {
        if (audio.duration) {
            audio.currentTime = (playerSeek.value / 100) * audio.duration;
        }
    });

    // 播放结束
    audio.addEventListener('ended', function() {
        playerBtnPlay.textContent = '▶';
    });

    function formatTime(s) {
        s = Math.floor(s);
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function esc(s) {
        return String(s).replace(/[&<>"]/g, function(m) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
        });
    }

    // 搜索防抖
    var searchTimer = null;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            searchText = searchInput.value;
            renderGrid();
        }, 300);
    });

    renderTabs();
    renderGrid();
})();
</script>
</body>
</html>
