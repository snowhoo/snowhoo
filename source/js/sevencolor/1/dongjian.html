---
layout: false
---
<style>
#dongjian-app {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#dongjian-app .header {
  margin: 0 auto; padding: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline;
}
#dongjian-app .header h1 { font-size: 13px; font-weight: 700; color: inherit; }
#dongjian-app .header .header-stats { font-size: 13px; color: var(--text-secondary, #999); }
#dongjian-app .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 768px) { #dongjian-app .gallery { grid-template-columns: repeat(4, 1fr); } }
#dongjian-app .article-card { cursor: pointer; position: relative; }
#dongjian-app .article-card .cover-wrap {
  width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: var(--cover-bg, #e8ecf1); position: relative;
  border-radius: 8px;
}
#dongjian-app .article-card .cover-wrap .img-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 14px;
}
#dongjian-app .article-card .cover-wrap img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform 0.4s; position: relative; z-index: 1;
}
#dongjian-app .article-card:hover .cover-wrap img { transform: scale(1.05); }
#dongjian-app .article-card .audio-badge {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  background: rgba(233, 69, 96, 0.85); color: #fff; font-size: 11px;
  padding: 3px 8px; border-radius: 10px; display: none; align-items: center; gap: 4px;
  backdrop-filter: blur(4px);
}
#dongjian-app .article-card .audio-badge.show { display: flex; }
#dongjian-app .article-card .info { padding: 8px 0 0; }
#dongjian-app .article-card .info h2 {
  font-size: 13px; font-weight: 600; line-height: 1.4; color: inherit;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
#dongjian-app .article-card .info .card-date { font-size: 12px; color: var(--text-secondary, #aaa); margin-top: 2px; }

/* Lightbox（yedu 风格） */
#dongjian-app .lightbox {
  display: none; position: fixed; z-index: 9999; inset: 0; background: rgba(0,0,0,0.85);
  padding: 0; overflow-y: auto;
}
#dongjian-app .lightbox.show { display: flex; flex-direction: column; }
#dongjian-app .lightbox .lb-close {
  position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.6);
  font-size: 28px; cursor: pointer; z-index: 10; line-height: 1; transition: color 0.2s;
}
#dongjian-app .lightbox .lb-close:hover { color: #fff; }
#dongjian-app .lightbox .lb-main { display: flex; flex-direction: column; min-height: 100vh; }
@media (min-width: 768px) { #dongjian-app .lightbox .lb-main { flex-direction: row; } }

#dongjian-app .lightbox .lb-cover {
  flex: 0 0 auto; position: relative; overflow: hidden; background: var(--cover-bg, #2d4a6e);
}
@media (min-width: 768px) { #dongjian-app .lightbox .lb-cover { flex: 0 0 50%; min-height: 100vh; } }
#dongjian-app .lightbox .lb-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
#dongjian-app .lightbox .lb-cover .lb-cover-badge {
  position: absolute; top: 12px; left: 12px;
  background: rgba(0,0,0,0.4); color: rgba(255,255,255,0.85);
  font-size: 12px; padding: 4px 12px; border-radius: 16px;
  backdrop-filter: blur(4px);
}

#dongjian-app .lightbox .lb-content {
  flex: 1; padding: 24px; display: flex; flex-direction: column;
  background: var(--card-bg, rgba(255,255,255,0.98));
}
[data-theme="dark"] #dongjian-app .lightbox .lb-content { background: rgba(30,30,50,0.98); }
#dongjian-app .lightbox .lb-content h2 {
  font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 8px;
  color: var(--text-primary, #1a1a2e);
}
#dongjian-app .lightbox .lb-content .lb-date {
  font-size: 13px; color: var(--text-secondary, #999); margin-bottom: 8px;
}

/* 音频播放器 */
#dongjian-app .lightbox .lb-audio-wrap {
  margin: 12px 0 16px; padding: 16px; background: var(--cover-bg, #f5f5f5);
  border-radius: 10px; text-align: center;
}
#dongjian-app .lightbox .lb-audio-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: #e94560; color: #fff; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px; transition: all 0.2s;
}
#dongjian-app .lightbox .lb-audio-btn:hover { transform: scale(1.1); }
#dongjian-app .lightbox .lb-audio-label { font-size: 12px; color: var(--text-secondary, #888); margin-top: 8px; }
#dongjian-app .lightbox .lb-progress-bar {
  height: 3px; background: rgba(233,69,96,0.2); border-radius: 2px; margin-top: 10px; position: relative;
}
#dongjian-app .lightbox .lb-progress-bar .lb-progress-fill {
  height: 100%; background: #e94560; width: 0; border-radius: 2px; transition: width 0.1s linear;
}
#dongjian-app .lightbox .lb-progress-time {
  display: flex; justify-content: space-between; font-size: 11px;
  color: var(--text-secondary, #999); margin-top: 4px;
}
#dongjian-app .lightbox .lb-content .lb-desc {
  font-size: 15px; line-height: 1.8; color: var(--text-primary, #333);
  white-space: pre-wrap; flex: 1;
}
#dongjian-app .lightbox .lb-actions {
  display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;
}
#dongjian-app .lightbox .lb-actions a {
  display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px;
  border-radius: 6px; text-decoration: none; font-size: 13px; transition: all 0.2s;
  border: 1px solid var(--border-color, #e0e0e0); color: var(--text-primary, #333);
}
#dongjian-app .lightbox .lb-actions a:hover { border-color: #e94560; color: #e94560; }

/* 分页 */
#dongjian-app .pagination {
  display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; padding: 16px 0;
}
#dongjian-app .pagination .page-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid var(--border, #e0e0e0); border-radius: 6px;
  background: transparent; color: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; user-select: none;
}
#dongjian-app .pagination .page-btn:hover:not(.active):not(.disabled) { border-color: #e94560; color: #e94560; }
#dongjian-app .pagination .page-btn.active { background: #e94560; border-color: #e94560; color: #fff; font-weight: 600; }
#dongjian-app .pagination .page-btn.disabled { opacity: 0.35; cursor: not-allowed; }
#dongjian-app .pagination .page-ellipsis { padding: 0 4px; color: var(--text-secondary, #999); font-size: 14px; }
#dongjian-app .footer { text-align: center; padding: 16px 0; color: var(--text-secondary, #bbb); font-size: 12px; }

/* 状态 */
#dongjian-app .state-msg { padding: 40px 0; text-align: center; }
#dongjian-app .state-msg .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
#dongjian-app .state-msg p { font-size: 16px; color: var(--text-secondary, #999); line-height: 1.6; }
</style>

<div id="dongjian-app">

<div class="lightbox" id="lightbox">
  <span class="lb-close" id="lbCloseBtn">✕</span>
  <div class="lb-main">
    <div class="lb-cover" id="lbCover">
      <div class="lb-cover-badge">洞见 · 每晚8点</div>
      <img id="lightboxImg" src="" alt="">
    </div>
    <div class="lb-content">
      <h2 id="lbTitle"></h2>
      <div class="lb-date" id="lbDate"></div>

      <div class="lb-audio-wrap" id="lbAudioWrap" style="display:none;">
        <button class="lb-audio-btn" id="lbAudioBtn">▶</button>
        <div class="lb-audio-label">🎧 播放音频</div>
        <div class="lb-progress-bar">
          <div class="lb-progress-fill" id="lbProgressFill"></div>
        </div>
        <div class="lb-progress-time">
          <span id="lbTimeCurrent">00:00</span>
          <span id="lbTimeTotal">--:--</span>
        </div>
      </div>

      <div class="lb-desc" id="lbDesc"></div>

      <div class="lb-actions" id="lbActions">
        <a id="lbLinkJtk" target="_blank" rel="noopener">📄 查看原文</a>
      </div>
    </div>
  </div>
</div>

<div class="header">
  <h1>洞见 · 精选文章</h1>
  <span class="header-stats" id="headerStats"></span>
</div>

<div class="state-msg" id="loadingState">
  <div class="icon">📖</div>
  <p>正在加载文章数据...</p>
</div>

<div class="state-msg" id="emptyState" style="display:none;">
  <div class="icon">📭</div>
  <p><strong>暂无文章</strong></p>
</div>

<div class="gallery" id="gallery" style="display:none;"></div>
<div class="pagination" id="pagination" style="display:none;"></div>
<div class="footer">公众号：洞见 · 不是每一种观点，都可以叫洞见</div>

</div>

<script>
(function() {
var BASE = (typeof window.__DONGJIAN_BASE_PATH !== 'undefined' ? window.__DONGJIAN_BASE_PATH :
           (location.protocol === 'file:' ? './' : '/js/sevencolor/1/'));
var PER_PAGE = 4;
var articles = [];
var total = 0;
var totalPages = 0;
var currentPage = 1;
var _player = null;

var dom = {
  gallery: document.getElementById('gallery'),
  pagination: document.getElementById('pagination'),
  loading: document.getElementById('loadingState'),
  empty: document.getElementById('emptyState'),
  headerStats: document.getElementById('headerStats'),
  lightbox: document.getElementById('lightbox'),
  lightboxImg: document.getElementById('lightboxImg'),
  lbTitle: document.getElementById('lbTitle'),
  lbDate: document.getElementById('lbDate'),
  lbDesc: document.getElementById('lbDesc'),
  lbLinkJtk: document.getElementById('lbLinkJtk'),
  lbAudioWrap: document.getElementById('lbAudioWrap'),
  lbAudioBtn: document.getElementById('lbAudioBtn'),
  lbProgressFill: document.getElementById('lbProgressFill'),
  lbTimeCurrent: document.getElementById('lbTimeCurrent'),
  lbTimeTotal: document.getElementById('lbTimeTotal'),
};

function closeLightbox() {
  dom.lightbox.classList.remove('show');
  document.body.style.overflow = '';
  if (_player) { _player.pause(); _player = null; }
  dom.lbAudioBtn.textContent = '\u25B6';
  dom.lbProgressFill.style.width = '0%';
  dom.lbTimeCurrent.textContent = '00:00';
  dom.lbTimeTotal.textContent = '--:--';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
dom.lightbox.addEventListener('click', function(e) {
  if (e.target === dom.lightbox || e.target.id === 'lbCloseBtn') closeLightbox();
});

function showState(active) {
  var ids = ['loading', 'empty', 'gallery', 'pagination'];
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var el = (id === 'gallery' || id === 'pagination') ? document.getElementById(id) : document.getElementById(id + 'State');
    if (el) el.style.display = (id === active) ? '' : 'none';
  }
  if (active === 'gallery') dom.pagination.style.display = '';
}

function esc(text) { var d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

function fmtDate(s) {
  if (!s) return '';
  if (/^\d{10}$/.test(s)) {
    var d = new Date(parseInt(s) * 1000);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  return s;
}

function resolvePath(path) {
  if (!path) return '';
  if (path.indexOf('://') > 0 || path.startsWith('//') || path.startsWith('/') || path.startsWith('http')) return path;
  return BASE + path.replace(/^\.\//, '');
}

function renderPage(page) {
  var start = (page - 1) * PER_PAGE;
  var end = Math.min(start + PER_PAGE, total);
  var pageArts = articles.slice(start, end);
  var html = '';
  for (var i = 0; i < pageArts.length; i++) {
    var art = pageArts[i];
    var title = esc(art.title || '');
    var img = resolvePath(art.image_url || '');
    var date = fmtDate(art.create_time);
    var idx = articles.indexOf(art);
    var hasAudio = art.audio_url ? 'show' : '';
    html +=
      '<div class="article-card" data-idx="' + idx + '">' +
        '<div class="cover-wrap">' +
          '<div class="img-placeholder">加载中...</div>' +
          '<div class="audio-badge ' + hasAudio + '">\uD83C\uDFA7 音频</div>' +
          '<img src="' + esc(img) + '" alt="' + title + '" loading="lazy"' +
               ' onload="this.parentNode.querySelector(\'.img-placeholder\').style.display=\'none\'"' +
               ' onerror="this.style.display=\'none\'; this.parentNode.querySelector(\'.img-placeholder\').textContent=\'\uD83D\uDCF7\'">' +
        '</div>' +
        '<div class="info"><h2>' + title + '</h2><div class="card-date">' + date + '</div></div>' +
      '</div>';
  }
  dom.gallery.innerHTML = html;
  showState('gallery');
  dom.headerStats.textContent = '\u5171 ' + total + ' \u7BC7 \u00B7 \u7B2C ' + page + ' / ' + totalPages + ' \u9875';
  renderPagination(page);
}

dom.gallery.addEventListener('click', function(e) {
  var card = e.target.closest('.article-card');
  if (!card) return;
  var idx = parseInt(card.dataset.idx, 10);
  var art = articles[idx];
  if (!art) return;

  dom.lightboxImg.src = resolvePath(art.image_url || '');
  dom.lbTitle.textContent = art.title || '';
  dom.lbDate.textContent = fmtDate(art.create_time);
  dom.lbDesc.textContent = (art.description || '').replace(/\\n/g, '\n').substring(0, 500) + ((art.description && art.description.length > 500) ? '...' : '');
  dom.lbLinkJtk.href = art.url || '';

  if (art.audio_url) {
    dom.lbAudioWrap.style.display = '';
    dom.lbAudioBtn.textContent = '\u25B6';
    dom.lbAudioBtn.dataset.src = art.audio_url;
    dom.lbProgressFill.style.width = '0%';
    dom.lbTimeCurrent.textContent = '00:00';
    dom.lbTimeTotal.textContent = '--:--';
    if (_player) { _player.pause(); _player = null; }
  } else {
    dom.lbAudioWrap.style.display = 'none';
    if (_player) { _player.pause(); _player = null; }
  }

  dom.lightbox.classList.add('show');
  document.body.style.overflow = 'hidden';
});

dom.lbAudioBtn.addEventListener('click', function() {
  var src = this.dataset.src;
  if (!src) return;
  if (_player && !_player.paused) { _player.pause(); this.textContent = '\u25B6'; return; }
  if (_player && _player._src === src) { _player.play(); this.textContent = '\u23F8'; return; }
  if (_player) { _player.pause(); _player = null; }

  var audio = new Audio(src);
  audio._src = src;
  _player = audio;
  this.textContent = '\u23F8';

  audio.addEventListener('timeupdate', function() {
    if (audio.duration) {
      dom.lbProgressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      dom.lbTimeCurrent.textContent = fmtTime(audio.currentTime);
    }
  });
  audio.addEventListener('loadedmetadata', function() {
    dom.lbTimeTotal.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', function() {
    dom.lbAudioBtn.textContent = '\u25B6';
    dom.lbProgressFill.style.width = '0%';
    dom.lbTimeCurrent.textContent = '00:00';
  });
  audio.addEventListener('error', function() {
    dom.lbAudioBtn.textContent = '\u25B6';
    alert('\u97F3\u9891\u52A0\u8F7D\u5931\u8D25');
  });
  audio.play().catch(function() { dom.lbAudioBtn.textContent = '\u25B6'; });
});

function fmtTime(s) {
  if (!s || !isFinite(s)) return '--:--';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function renderPagination(activePage) {
  var t = totalPages;
  if (t <= 1) { dom.pagination.innerHTML = ''; dom.pagination.style.display = 'none'; return; }
  dom.pagination.style.display = '';
  var html = '<span class="page-btn' + (activePage === 1 ? ' disabled' : '') + '" data-page="' + (activePage - 1) + '">\u2039</span>';
  var range = buildRange(activePage, t);
  for (var i = 0; i < range.length; i++) {
    var item = range[i];
    if (item === '...') { html += '<span class="page-ellipsis">\u2026</span>'; }
    else { html += '<span class="page-btn' + (item === activePage ? ' active' : '') + '" data-page="' + item + '">' + item + '</span>'; }
  }
  html += '<span class="page-btn' + (activePage === t ? ' disabled' : '') + '" data-page="' + (activePage + 1) + '">\u203A</span>';
  dom.pagination.innerHTML = html;
  var btns = dom.pagination.querySelectorAll('.page-btn:not(.disabled)');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      var p = parseInt(this.dataset.page, 10);
      if (p >= 1 && p <= t) { currentPage = p; renderPage(p); window.scrollTo({top:0,behavior:'smooth'}); }
    });
  }
}

function buildRange(cur, t) {
  var max = window.innerWidth < 768 ? 5 : 7;
  if (t <= max) { var r = []; for (var i = 1; i <= t; i++) r.push(i); return r; }
  if (max === 5) {
    if (cur <= 3) return [1,2,3,'...',t];
    if (cur >= t - 2) return [1,'...',t-2,t-1,t];
    return [1,'...',cur,'...',t];
  } else {
    if (cur <= 4) return [1,2,3,4,5,'...',t];
    if (cur >= t - 3) return [1,'...',t-4,t-3,t-2,t-1,t];
    return [1,'...',cur-1,cur,cur+1,'...',t];
  }
}

function loadData() {
  fetch(BASE + 'dongjian.js?_=' + Date.now())
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(text) {
      try {
        var match = text.match(/var DONGJIAN_DATA\s*=\s*(\[.*?\])\s*;/);
        if (!match) throw new Error('\u683C\u5F0F\u9519\u8BEF');
        eval('window.__DONGJIAN_DATA = ' + match[1] + ';');
      } catch(e) { throw new Error('\u89E3\u6790\u5931\u8D25: ' + e.message); }
      var data = window.__DONGJIAN_DATA;
      if (!data || !Array.isArray(data) || data.length === 0) { showState('empty'); return; }
      articles = data;
      total = data.length;
      totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
      currentPage = 1;
      renderPage(1);
    })
    .catch(function(e) {
      var c = document.getElementById('loadingState');
      if (c) c.innerHTML = '<div class="icon">\u26A0\uFE0F</div><p>\u52A0\u8F7D\u5931\u8D25\uFF1A' + e.message + '</p>';
    });
}

loadData();
})();
</script>
