---
layout: false
---
<style>
#qrdownload-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 20px 15px; box-sizing: border-box; }
#qrdownload-wrap .qr-wrapper { display: inline-block; padding: 14px; margin-bottom: 16px; }
#qrdownload-wrap .qr-wrapper img { display: block; width: 180px; height: 180px; }
#qrdownload-wrap .qr-tip { font-size: 13px; margin-top: 10px; }
#qrdownload-wrap .download-btn { display: inline-block; padding: 10px 28px; background: #4CAF50; color: #fff; text-decoration: none; border-radius: 6px; font-size: 15px; transition: background 0.2s; }
#qrdownload-wrap .download-btn:hover { background: #43A047; }
</style>

<div id="qrdownload-wrap">
    <div class="qr-wrapper">
        <img id="qrcode-img" alt="扫描下载APP" />
        <div class="qr-tip">手机扫描二维码下载</div>
    </div>
    <p>
        <a id="download-link" class="download-btn">获取本站APP</a>
    </p>
</div>

<script>
(function() {
    var apkPath = '/snowhoo.net.apk';
    var fullUrl = window.location.origin + apkPath;
    document.getElementById('qrcode-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(fullUrl);
    document.getElementById('download-link').href = apkPath;
})();
</script>
