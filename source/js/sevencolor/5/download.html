---
layout: false
---
<div id="af-root">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 10px">
        <div class="dl-cards">
            <div class="dl-card">
                <img id="qrcode-img" alt="扫描下载小红故事" class="dl-qr">
                <div class="dl-label">扫描二维码下载</div>
                <a id="download-link" class="dl-btn dl-btn-red">小红故事</a>
            </div>
            <div class="dl-card">
                <img id="qrcode-img-lite" alt="扫描下载小红故事 Lite" class="dl-qr">
                <div class="dl-label">扫描二维码下载</div>
                <a id="download-link-lite" class="dl-btn dl-btn-green">小红故事 Lite</a>
            </div>
        </div>
        <div class="dl-notice">声明：本站APP未经备案和发布，仅供内部交流。</div>
    </div>
</div>

<style>
#af-root{--green:#00b894;--sub:#888;--red:#c0392b;--border:#ddd}
#af-root[data-theme="dark"]{--green:#00cec9;--sub:#90a4ae;--red:#e74c3c;--border:#444}
#af-root .dl-cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:14px 0px 14px 0px;margin-bottom:0px}
#af-root .dl-card{border:1px solid var(--border);border-radius:12px;padding:14px 14px;display:flex;flex-direction:column;align-items:center}
#af-root .dl-qr{display:block;width:100px;height:100px;margin:0 auto}
#af-root .dl-label{font-size:13px;margin-top:10px;color:var(--sub)}
#af-root .dl-btn{display:inline-block;margin-top:12px;padding:5px 10px;color:#fff;text-decoration:none;border-radius:6px;font-size:15px;cursor:pointer}
#af-root .dl-btn-red{background:var(--red)}
#af-root .dl-btn-green{background:var(--green)}
#af-root .dl-notice{font-size:12px;color:var(--sub);margin-top:14px;letter-spacing:.5px;line-height:1.6}
</style>

<script>
(function() {
    var root = document.getElementById('af-root');

    function syncTheme(t) {
        if (!t || (t !== 'dark' && t !== 'light')) {
            try { t = window.parent.document.documentElement.getAttribute('data-theme'); } catch(e) {}
        }
        if (!t || (t !== 'dark' && t !== 'light')) t = window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark';
        root.setAttribute('data-theme', t);
    }
    syncTheme();
    try {
        var parentEl = window.parent.document.documentElement;
        new MutationObserver(function() { syncTheme(parentEl.getAttribute('data-theme')); }).observe(parentEl, { attributes: true, attributeFilter: ['data-theme'] });
    } catch(e) {}
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e) { syncTheme(e.matches ? 'dark' : 'light'); });

    var apkUrl = 'https://snowhoo.net/snowhoo.net.apk';
    document.getElementById('qrcode-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(apkUrl);
    document.getElementById('download-link').href = apkUrl;

    var liteUrl = 'https://snowhoo.net/snowhoo.net.lite.apk';
    document.getElementById('qrcode-img-lite').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(liteUrl);
    document.getElementById('download-link-lite').href = liteUrl;
})();
</script>
