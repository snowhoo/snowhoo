<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Builder 远程下单</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --blue: #0984e3; --green: #00b894; --red: #d63031; --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
        .header { text-align: center; padding: 20px 0 8px; }
        .header h1 { font-size: 22px; color: var(--blue); }
        .header p { color: var(--sub); font-size: 12px; margin-top: 4px; }
        .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display:flex; align-items:center; gap:6px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--sub); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 11px; border: 1.5px solid #e0e0e0; border-radius: 9px; font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blue); }
        .form-group .hint { font-size: 11px; color: #b2bec3; margin-top: 2px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .file-upload { border: 1.5px dashed #ddd; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafafa; position: relative; }
        .file-upload:hover { border-color: var(--blue); background: #f0f7ff; }
        .file-upload.has-file { border-style: solid; border-color: var(--green); }
        .file-upload input { display: none; }
        .preview-img { max-width: 70px; max-height: 70px; border-radius: 8px; margin: 0 auto 6px; display: none; object-fit: cover; }
        .has-file .preview-img { display: block; }
        .file-placeholder { font-size: 12px; color: #b2bec3; }
        .has-file .file-placeholder { color: var(--green); font-weight: 500; }
        .has-file .file-placeholder .dim { color: #b2bec3; font-weight: 400; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 11px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #0984e3, #6c5ce7); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(9,132,227,0.3); }
        .btn-green { background: var(--green); color: #fff; display: none; }
        .btn-green:hover { background: #00a381; }

        .json-box { background: #f8f9fa; border-radius: 10px; padding: 12px; margin-top: 10px; max-height: 180px; overflow: auto; font-family: 'Consolas', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; display: none; }
        .json-box.show { display: block; }
        .note { font-size: 11px; color: #e17055; background: #fff5f5; border-radius: 8px; padding: 10px; margin-top: 10px; line-height: 1.6; }
        .size-warn { color: #e17055; font-size: 11px; margin-top: 4px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 APK 远程下单</h1>
            <p>填写配置 → 点「生成并发送」→ 邮件客户端自动打开 → 发送到 9187541@qq.com</p>
        </div>

        <!-- 基本信息 -->
        <div class="card">
            <div class="card-title">📋 基本信息</div>
            <div class="form-group">
                <label>应用名称 *</label>
                <input type="text" id="appName" placeholder="例如：小红故事" value="小红故事" maxlength="30">
            </div>
            <div class="form-group">
                <label>包名 *</label>
                <input type="text" id="packageName" placeholder="com.example.app" value="net.snowhoo.app">
                <span class="hint">唯一标识，不能含中文</span>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>版本号</label>
                    <input type="text" id="versionName" value="1.0.0">
                </div>
                <div class="form-group">
                    <label>版本代码</label>
                    <input type="number" id="versionCode" value="1">
                </div>
            </div>
        </div>

        <!-- 数据源 -->
        <div class="card">
            <div class="card-title">🔗 数据源</div>
            <div class="form-group">
                <label>模式</label>
                <select id="sourceMode">
                    <option value="url">🌐 在线网址</option>
                    <option value="local">📁 本地文件</option>
                </select>
            </div>
            <div class="form-group" id="urlGroup">
                <label>网站 URL *</label>
                <input type="url" id="url" placeholder="https://your-site.com" value="https://snowhoo.net">
            </div>
            <div class="form-group" id="localGroup" style="display:none">
                <label>ZIP 下载地址</label>
                <input type="url" id="zipUrl" placeholder="https://your-server.com/site.zip">
                <span class="hint">或邮件附带 ZIP 附件</span>
            </div>
            <div class="form-group">
                <label>签名模式</label>
                <select id="signMode">
                    <option value="debug">Debug（测试）</option>
                    <option value="release">Release（发布版）</option>
                </select>
            </div>
            <div class="form-group" id="releaseGroup" style="display:none">
                <label>密钥别名</label>
                <input type="text" id="keystoreAlias" placeholder="例如：xiaohong">
                <span class="hint">需已在本机构建器中创建</span>
            </div>
        </div>

        <!-- 图标与截图（上传方式，base64编码进JSON） -->
        <div class="card">
            <div class="card-title">🎨 图标与截图</div>
            <div class="form-row">
                <div class="file-upload" id="iconBox" onclick="document.getElementById('iconFile').click()">
                    <input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp" onchange="handleFile(this,'iconBox','iconSize')">
                    <img class="preview-img" id="iconPreview" src="">
                    <div class="file-placeholder">📷 应用图标<br><span class="dim">512×512 建议</span></div>
                </div>
            </div>
            <span class="hint" id="iconSize"></span>
            <div class="form-row" style="margin-top:10px">
                <div class="file-upload" id="ss1Box" onclick="document.getElementById('ss1File').click()">
                    <input type="file" id="ss1File" accept="image/png,image/jpeg,image/webp" onchange="handleFile(this,'ss1Box','')">
                    <img class="preview-img" id="ss1Preview" src="">
                    <div class="file-placeholder">📱 首页<br><span class="dim">1280×720</span></div>
                </div>
                <div class="file-upload" id="ss2Box" onclick="document.getElementById('ss2File').click()">
                    <input type="file" id="ss2File" accept="image/png,image/jpeg,image/webp" onchange="handleFile(this,'ss2Box','')">
                    <img class="preview-img" id="ss2Preview" src="">
                    <div class="file-placeholder">📱 内容页<br><span class="dim">1280×720</span></div>
                </div>
                <div class="file-upload" id="ss3Box" onclick="document.getElementById('ss3File').click()">
                    <input type="file" id="ss3File" accept="image/png,image/jpeg,image/webp" onchange="handleFile(this,'ss3Box','')">
                    <img class="preview-img" id="ss3Preview" src="">
                    <div class="file-placeholder">📱 其他<br><span class="dim">1280×720</span></div>
                </div>
            </div>
        </div>

        <!-- 应用介绍 -->
        <div class="card">
            <div class="card-title">📝 应用介绍</div>
            <div class="form-group">
                <label>一句话简介（各市场展示用）</label>
                <input type="text" id="shortDesc" placeholder="例如：小红故事—记录美好生活的文字社区" maxlength="80">
                <span class="hint">最多 80 字，显示在应用列表</span>
            </div>
            <div class="form-group">
                <label>完整介绍（应用详情页）</label>
                <textarea id="fullDesc" rows="4" placeholder="例如：&#10;小红故事是一款专注于文字创作的社区应用...&#10;&#10;主要功能：&#10;• 浏览精选文章&#10;• 收藏喜欢的作者&#10;• 个性化推荐&#10;&#10;联系我们：admin@snowhoo.net"></textarea>
                <span class="hint">支持换行，各市场上架时直接粘贴</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <button class="btn btn-primary" onclick="generateAndSend()">
            📝 生成 JSON 并打开邮件
        </button>
        <div class="json-box" id="jsonPreview"></div>
        <div class="size-warn" id="sizeWarn"></div>

        <button class="btn btn-green" id="btnSend" onclick="openMail()">
            📧 重新打开邮件
        </button>

        <div class="note">
            ⚠ 邮件主题：<b>@webview 应用名称</b><br>
            邮件正文：自动生成的 JSON 配置<br>
            发件人需为可信邮箱（目前你自己发的自动构建，他人需审核）
        </div>
    </div>

<script>
    // Toggle URL/local
    document.getElementById('sourceMode').addEventListener('change', function() {
        document.getElementById('urlGroup').style.display = this.value === 'url' ? 'block' : 'none';
        document.getElementById('localGroup').style.display = this.value === 'local' ? 'block' : 'none';
    });
    document.getElementById('signMode').addEventListener('change', function() {
        document.getElementById('releaseGroup').style.display = this.value === 'release' ? 'block' : 'none';
    });

    // File handling
    const fileData = { icon: null, ss1: null, ss2: null, ss3: null };

    function handleFile(input, boxId, sizeId) {
        const file = input.files[0];
        if (!file) return;
        const key = input.id.replace('File', '');
        const box = document.getElementById(boxId);
        const reader = new FileReader();
        reader.onload = function(e) {
            // Store base64
            fileData[key] = e.target.result;
            box.classList.add('has-file');
            // Show preview
            const previewId = key + 'Preview';
            const preview = document.getElementById(previewId);
            if (preview) preview.src = e.target.result;
            // Update placeholder
            const placeholder = box.querySelector('.file-placeholder');
            if (placeholder) {
                const sizeKB = (file.size / 1024).toFixed(1);
                placeholder.innerHTML = `${file.name}<br><span class="dim">${sizeKB} KB</span>`;
            }
            // Show size warning for icon
            if (sizeId) {
                const sizeEl = document.getElementById(sizeId);
                if (sizeEl) sizeEl.textContent = `图标: ${(file.size/1024).toFixed(1)} KB`;
            }
        };
        reader.readAsDataURL(file);
    }

    let jsonConfig = '';

    function generateAndSend() {
        const config = {
            appName: document.getElementById('appName').value.trim(),
            packageName: document.getElementById('packageName').value.trim(),
            sourceMode: document.getElementById('sourceMode').value,
            url: document.getElementById('url').value.trim(),
            zipUrl: document.getElementById('zipUrl').value.trim(),
            versionName: document.getElementById('versionName').value.trim() || '1.0.0',
            versionCode: parseInt(document.getElementById('versionCode').value) || 1,
            signMode: document.getElementById('signMode').value,
            keystoreAlias: document.getElementById('keystoreAlias').value.trim(),
            shortDesc: document.getElementById('shortDesc').value.trim(),
            fullDesc: document.getElementById('fullDesc').value.trim(),
            requestedAt: new Date().toISOString(),
            source: 'webview-builder-remote',
        };

        if (!config.appName || !config.packageName) return alert('请填写应用名称和包名');
        if (config.sourceMode === 'url' && !config.url) return alert('请输入网站URL');

        // Add base64 images if uploaded
        if (fileData.icon) config.iconBase64 = fileData.icon;
        config.screenshotBase64List = [];
        if (fileData.ss1) config.screenshotBase64List.push(fileData.ss1);
        if (fileData.ss2) config.screenshotBase64List.push(fileData.ss2);
        if (fileData.ss3) config.screenshotBase64List.push(fileData.ss3);

        jsonConfig = JSON.stringify(config, null, 2);

        // Show preview
        document.getElementById('jsonPreview').textContent = jsonConfig;
        document.getElementById('jsonPreview').classList.add('show');
        document.getElementById('btnSend').style.display = 'flex';

        // Warn if JSON is too large
        const sizeKB = (jsonConfig.length / 1024).toFixed(1);
        const warn = document.getElementById('sizeWarn');
        if (jsonConfig.length > 500000) {
            warn.style.display = 'block';
            warn.textContent = `⚠ JSON ${sizeKB} KB，较大！邮件可能被截断，建议减少截图数量`;
        } else {
            warn.style.display = 'none';
        }

        openMail();
    }

    function openMail() {
        if (!jsonConfig) return generateAndSend();
        const subject = '@webview ' + document.getElementById('appName').value.trim();
        const mailto = `mailto:9187541@qq.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(jsonConfig)}`;
        window.open(mailto, '_blank');
    }
</script>
</body>
</html>
