---
layout: false
---
<style>
/* ===== CSS 变量 - 明暗模式 ===== */
:root {
  --bg-start: #0b0e2a; --bg-mid1: #1a1f4e; --bg-mid2: #2a1f5e; --bg-end: #0f1635;
  --text-primary: #e8e6f0; --text-secondary: rgba(255,255,255,0.4);
  --card-bg: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.06);
  --grid-item-bg: rgba(255,255,255,0.04);
  --zodiac-shadow: rgba(0,0,0,0.3);
  --footer-color: rgba(255,255,255,0.2);
}
[data-theme="dark"] {
  --bg-start: #0b0e2a; --bg-mid1: #1a1f4e; --bg-mid2: #2a1f5e; --bg-end: #0f1635;
  --text-primary: #e8e6f0; --text-secondary: rgba(255,255,255,0.4);
  --card-bg: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.06);
  --grid-item-bg: rgba(255,255,255,0.04);
  --zodiac-shadow: rgba(0,0,0,0.3);
  --footer-color: rgba(255,255,255,0.2);
}
[data-theme="light"], :root:not([data-theme="dark"]) {
  --bg-start: #f0eef8; --bg-mid1: #e8e4f4; --bg-mid2: #ddd8ee; --bg-end: #f5f0fa;
  --text-primary: #2d2a44; --text-secondary: rgba(0,0,0,0.35);
  --card-bg: rgba(255,255,255,0.7); --card-border: rgba(0,0,0,0.06);
  --grid-item-bg: rgba(255,255,255,0.6);
  --zodiac-shadow: rgba(0,0,0,0.08);
  --footer-color: rgba(0,0,0,0.2);
}

/* ===== 全局重置 & 背景 ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{min-height:100vh}
body{
  min-height:100vh;
  background: linear-gradient(145deg, var(--bg-start), var(--bg-mid1) 35%, var(--bg-mid2) 65%, var(--bg-end) 100%);
  position:relative;overflow-x:hidden;transition:background 0.4s;
}
/* 星星粒子（仅深色模式显示） */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0;transition:opacity 0.6s;
}
[data-theme="dark"] body::before,
:root:not([data-theme="light"]) body::before{
  opacity:1;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 85% 70%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 55% 80%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 40% 45%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.5), transparent);
}
/* 光晕 */
body::after{
  content:'';position:fixed;top:-30%;left:-10%;width:80%;height:80%;
  background: radial-gradient(circle at 30% 30%, rgba(108,92,231,0.15), transparent 70%);
  pointer-events:none;z-index:0;
}

#cst-app{
  position:relative;z-index:1;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  color:var(--text-primary);
  min-height:100vh;padding:20px 16px 40px;
  max-width:520px;margin:0 auto;
}

/* ===== 头部 ===== */
#cst-app .header{text-align:center;padding:16px 0 8px}
#cst-app .header h1{
  font-size:24px;font-weight:700;
  background:linear-gradient(135deg,#c4b5fd,#a78bfa,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:2px;
}
#cst-app .header p{font-size:13px;color:var(--text-secondary);margin-top:4px}

/* ===== 星座网格 ===== */
#cst-app .cst-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin:20px auto;
}
@media (max-width:400px){#cst-app .cst-grid{grid-template-columns:repeat(3,1fr)}}
#cst-app .cst-grid .cst-item{
  text-align:center;padding:14px 4px 12px;
  border-radius:16px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:1.5px solid var(--card-border);
  background:var(--grid-item-bg);
  backdrop-filter:blur(8px);position:relative;overflow:hidden;
}
#cst-app .cst-grid .cst-item::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(167,139,250,0.08), transparent);
  opacity:0;transition:opacity 0.3s;
}
#cst-app .cst-grid .cst-item:hover{transform:translateY(-3px);border-color:rgba(167,139,250,0.25)}
#cst-app .cst-grid .cst-item:hover::before{opacity:1}
#cst-app .cst-grid .cst-item.active{
  border-color:#a78bfa;
  background:rgba(167,139,250,0.12);
  box-shadow:0 0 20px rgba(167,139,250,0.15);
}
/* 卡通图标容器 */
#cst-app .cst-grid .cst-item .cst-icon-wrap{
  width:52px;height:52px;margin:0 auto 6px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px var(--zodiac-shadow);
  transition:transform 0.3s, box-shadow 0.3s;
  position:relative;
}
#cst-app .cst-grid .cst-item:hover .cst-icon-wrap{transform:scale(1.1) rotate(-5deg);box-shadow:0 6px 20px var(--zodiac-shadow)}
#cst-app .cst-grid .cst-item .cst-icon-wrap svg{width:28px;height:28px}
#cst-app .cst-grid .cst-item .cst-icon-wrap svg path{fill:#fff}
#cst-app .cst-grid .cst-item .cst-name{font-size:13px;font-weight:600;color:var(--text-primary)}
#cst-app .cst-grid .cst-item .cst-en{font-size:10px;color:var(--text-secondary);margin-top:1px}

/* ===== 类型切换 ===== */
#cst-app .type-bar{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  margin:0 auto 20px;
}
#cst-app .type-bar .type-btn{
  padding:6px 18px;border-radius:20px;border:1.5px solid var(--card-border);
  background:var(--card-bg);color:var(--text-secondary);
  font-size:13px;cursor:pointer;transition:all 0.25s;
  backdrop-filter:blur(4px);
}
#cst-app .type-bar .type-btn:hover{border-color:rgba(167,139,250,0.4)}
#cst-app .type-bar .type-btn.active{
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  border-color:transparent;color:#fff;
  box-shadow:0 4px 15px rgba(124,58,237,0.3);
}

/* ===== 结果区 ===== */
#cst-app .result{margin-top:4px}
#cst-app .result .loading{
  text-align:center;padding:50px 0;
  color:var(--text-secondary);font-size:14px;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}
#cst-app .result .error{
  text-align:center;padding:20px;border-radius:14px;
  background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);
  color:#ff6b7a;font-size:14px;
}
#cst-app .result .success{animation:fadeUp 0.4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== 顶部评分卡 ===== */
#cst-app .result .overview{
  background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(167,139,250,0.12));
  border:1px solid rgba(167,139,250,0.2);
  border-radius:18px;padding:28px 20px 22px;text-align:center;
  backdrop-filter:blur(12px);margin-bottom:14px;
  position:relative;overflow:hidden;
}
#cst-app .result .overview::before{
  content:'';position:absolute;top:-50%;right:-30%;width:100%;height:100%;
  background:radial-gradient(circle,rgba(167,139,250,0.08),transparent 70%);
  pointer-events:none;
}
#cst-app .result .overview h2{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:2px}
#cst-app .result .overview .date{font-size:13px;color:var(--text-secondary);margin-bottom:10px}
.score-ring{width:100px;height:100px;margin:10px auto 8px;position:relative}
.score-ring svg{transform:rotate(-90deg);width:100px;height:100px}
.score-ring .ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:6}
.score-ring .ring-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease}
.score-ring .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:700}
.score-ring .score-label{position:absolute;top:calc(50% + 18px);left:50%;transform:translate(-50%,-50%);font-size:10px;color:var(--text-secondary);letter-spacing:1px}
.score-stars{font-size:14px;letter-spacing:3px;margin-top:4px}

/* ===== 各项运势卡片 ===== */
#cst-app .result .items{display:grid;gap:10px;margin-bottom:14px}
#cst-app .result .items .item{
  background:var(--card-bg);border-radius:14px;padding:16px 18px;
  border:1px solid var(--card-border);
  backdrop-filter:blur(8px);transition:all 0.25s;
}
#cst-app .result .items .item:hover{
  background:rgba(167,139,250,0.07);border-color:rgba(167,139,250,0.15);
  transform:translateY(-1px);
}
#cst-app .result .items .item .item-header{display:flex;justify-content:space-between;align-items:center}
#cst-app .result .items .item .item-name{font-weight:600;font-size:14px;color:var(--text-primary)}
#cst-app .result .items .item .item-star{
  background:linear-gradient(135deg,#f59e0b,#f97316);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-size:14px;letter-spacing:2px;
}

/* ===== 幸运信息 ===== */
#cst-app .result .lucky{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#cst-app .result .lucky .lucky-item{
  background:var(--card-bg);border-radius:12px;padding:14px 8px;text-align:center;
  border:1px solid var(--card-border);
  backdrop-filter:blur(8px);transition:all 0.25s;
}
#cst-app .result .lucky .lucky-item:hover{
  background:rgba(167,139,250,0.06);border-color:rgba(167,139,250,0.12);
}
#cst-app .result .lucky .lucky-item .label{font-size:11px;color:var(--text-secondary);margin-bottom:6px;letter-spacing:1px}
#cst-app .result .lucky .lucky-item .value{font-size:16px;font-weight:600;color:var(--text-primary)}
#cst-app .result .lucky .lucky-item.gold .value{color:#fbbf24}
#cst-app .result .lucky .lucky-item.green .value{color:#10b981}
#cst-app .result .lucky .lucky-item.purple .value{color:#a78bfa}
#cst-app .result .lucky .lucky-item.rose .value{color:#fb7185}

/* ===== 页脚 ===== */
#cst-app .footer{text-align:center;padding:28px 0 8px;font-size:12px;color:var(--footer-color)}
#cst-app .footer a{color:rgba(167,139,250,0.4);text-decoration:none;transition:color 0.2s}
#cst-app .footer a:hover{color:rgba(167,139,250,0.7)}
</style>

<div id="cst-app">

<div class="header">
  <h1>✦ 每日星象</h1>
  <p>点击星象查看今日运势</p>
</div>

<div class="cst-grid" id="cstGrid"></div>
<div class="type-bar" id="cstTypeBar"></div>
<div class="result" id="cstResult">
  <div class="loading">👆 选择一个星象查看运势</div>
</div>

<div class="footer">
  数据来源：<a href="https://www.52api.cn" target="_blank" rel="noopener">52api.cn</a>
</div>

</div>

  { key: 'tomorrow', label: '明日' },
  { key: 'week', label: '本周' },
  { key: 'month', label: '本月' },
  { key: 'year', label: '今年' },
];

const API_URL = 'https://www.52api.cn/api/constellation';

var app = document.getElementById('cst-app');
var grid = document.getElementById('cstGrid');
var typeBar = document.getElementById('cstTypeBar');
var result = document.getElementById('cstResult');

var currentCons = '';
var currentType = 'today';

var CST_API_KEY = 'G84cVgxx8BqrzOEPUZlpRSK41r';

// ===== 生成卡通 SVG 图标 =====
function makeZodiacSVG(name) {
  var info = ZODIAC_ICONS[name];
  if (!info) return '<span style="font-size:28px">♈</span>';
  var g = info.gradient;
  var id = 'grd-' + name.charCodeAt(0);
  return '' +
    '<svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="' + id + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="' + g[0] + '"/>' +
        '<stop offset="100%" stop-color="' + g[1] + '"/>' +
      '</linearGradient></defs>' +
      '<path d="' + info.path + '" fill="url(#' + id + ')"/>' +
    '</svg>';
}

// 背景色配渐变（与图标色系一致）
var ZODIAC_BG = {
  白羊座: '#FF6B6B', 金牛座: '#4ECDC4', 双子座: '#A78BFA',
  巨蟹座: '#F472B6', 狮子座: '#FBBF24', 处女座: '#34D399',
  天秤座: '#60A5FA', 天蝎座: '#FB7185', 射手座: '#F97316',
  摩羯座: '#6B7280', 水瓶座: '#22D3EE', 双鱼座: '#818CF8'
};

// 渲染星象网格
CONSTELLATIONS.forEach(function(c) {
  var el = document.createElement('div');
  el.className = 'cst-item';
  var bgColor = ZODIAC_BG[c.name] || '#a78bfa';
  el.innerHTML =
    '<div class="cst-icon-wrap" style="background:linear-gradient(135deg,' + bgColor + '88,' + bgColor + '44)">' +
      makeZodiacSVG(c.name) +
    '</div>' +
    '<div class="cst-name">' + c.name + '</div>' +
    '<div class="cst-en">' + c.en + '</div>';
  el.dataset.name = c.name;
  el.addEventListener('click', function() {
    app.querySelectorAll('.cst-item').forEach(function(e) { e.classList.remove('active'); });
    this.classList.add('active');
    currentCons = this.dataset.name;
    fetchData();
  });
  grid.appendChild(el);
});

// 渲染类型切换
TYPES.forEach(function(t) {
  var el = document.createElement('button');
  el.className = 'type-btn' + (t.key === 'today' ? ' active' : '');
  el.textContent = t.label;
  el.dataset.type = t.key;
  el.addEventListener('click', function() {
    typeBar.querySelectorAll('.type-btn').forEach(function(e) { e.classList.remove('active'); });
    this.classList.add('active');
    currentType = this.dataset.type;
    if (currentCons) fetchData();
  });
  typeBar.appendChild(el);
});

function fetchData() {
  if (!currentCons) return;
  result.innerHTML = '<div class="loading">🔮 正在查询 ' + currentCons + ' ' + getTypeLabel(currentType) + '运势...</div>';

  var params = new URLSearchParams();
  params.set('key', CST_API_KEY);
  params.set('consName', currentCons);
  params.set('type', currentType);

  fetch(API_URL + '?' + params.toString())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.code && data.code !== 200) {
        result.innerHTML = '<div class="error">❌ ' + (data.msg || '查询失败') + '</div>';
        return;
      }
      renderResult(data);
    })
    .catch(function(err) {
      result.innerHTML = '<div class="error">❌ 网络错误：' + err.message + '</div>';
    });
}

function getTypeLabel(type) {
  var t = TYPES.find(function(x) { return x.key === type; });
  return t ? t.label : type;
}

function parseInfo(infoArray) {
  var result = {};
  if (!infoArray || !Array.isArray(infoArray)) return result;
  infoArray.forEach(function(str) {
    var parts = str.split('：');
    if (parts.length >= 2) {
      var key = parts[0].trim();
      var val = parts.slice(1).join('：').trim();
      result[key] = val;
    }
  });
  return result;
}

function getConsEnName(zhName) {
  var c = CONSTELLATIONS.find(function(x) { return x.name === zhName; });
  return c ? c.en.toLowerCase() : '';
}

var TYPE_MAP = { 'today': 'today', 'tomorrow': 'tomorrow', 'week': 'weeks', 'month': 'month', 'year': 'years' };

function ringColor(score) {
  if (score >= 80) return '#6ee7b7';
  if (score >= 60) return '#60a5fa';
  if (score >= 40) return '#fbbf24';
  return '#fb7185';
}

function renderResult(data) {
  var enName = getConsEnName(currentCons);
  var consData = data.data && data.data[capitalize(enName)];
  if (!consData) {
    result.innerHTML = '<div class="error">❌ 未找到 ' + currentCons + ' 的数据</div>';
    return;
  }

  var apiType = TYPE_MAP[currentType] || currentType;
  var detail = consData.detail && consData.detail[apiType];
  if (!detail) {
    result.innerHTML = '<div class="error">❌ 暂无此类型数据</div>';
    return;
  }

  var info = parseInfo(detail.info);

  var dateText = info['今日时间'] || info['明日时间'] || info['本周时间'] || info['本月时间'] || info['今年时间'] || '';

  var overall = parseInt(info['综合运势'] || info['综合指数'] || '0', 10);
  var loveScore = parseInt(info['爱情运势'] || info['爱情指数'] || '0', 10);
  var wealthScore = parseInt(info['财富运势'] || info['财富指数'] || '0', 10);
  var careerScore = parseInt(info['工作运势'] || info['工作指数'] || '0', 10);

  var luckyNum = info['幸运数字'] || '';
  var luckyColor = info['幸运颜色'] || '';
  var luckyStar = info['贵人星座'] || '';
  var luckyTime = info['幸运时间'] || '';

  function starScore(num) {
    var n = parseInt(num, 10);
    if (isNaN(n)) return '';
    var stars = Math.round(n / 20);
    return '★'.repeat(Math.max(1, Math.min(5, stars))) + '☆'.repeat(Math.max(0, 5 - Math.max(1, Math.min(5, stars))));
  }

  var circumference = 2 * Math.PI * 44;
  var offset = circumference - (overall / 100) * circumference;
  var color = ringColor(overall);
  var ringSvg =
    '<div class="score-ring">' +
      '<svg viewBox="0 0 100 100">' +
        '<circle class="ring-bg" cx="50" cy="50" r="44"/>' +
        '<circle class="ring-fg" cx="50" cy="50" r="44" stroke="' + color + '" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"/>' +
      '</svg>' +
      '<div class="score-text" style="color:' + color + '">' + overall + '</div>' +
      '<div class="score-label">综合评分</div>' +
    '</div>';

  var overviewHtml = '<div class="overview">' +
    '<h2>' + escHtml(currentCons) + ' · ' + getTypeLabel(currentType) + '</h2>' +
    (dateText ? '<div class="date">' + escHtml(dateText) + '</div>' : '') +
    ringSvg +
    '<div class="score-stars">' + starScore(overall) + '</div>' +
  '</div>';

  var itemList = [];
  if (loveScore) itemList.push({ name: '❤ 爱情', val: loveScore });
  if (careerScore) itemList.push({ name: '💼 事业', val: careerScore });
  if (wealthScore) itemList.push({ name: '💰 财富', val: wealthScore });

  var itemsHtml = itemList.map(function(item) {
    return '<div class="item">' +
      '<div class="item-header"><span class="item-name">' + item.name + '</span>' +
        '<span class="item-star">' + starScore(item.val) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  var luckyItems = [];
  if (luckyNum) luckyItems.push({ label: '幸运数字', val: luckyNum, cls: 'gold' });
  if (luckyColor) luckyItems.push({ label: '幸运颜色', val: luckyColor, cls: 'green' });
  if (luckyStar) luckyItems.push({ label: '贵人星象', val: luckyStar, cls: 'purple' });
  if (luckyTime) luckyItems.push({ label: '幸运时间', val: luckyTime, cls: 'rose' });

  var luckyHtml = '';
  if (luckyItems.length > 0) {
    luckyHtml = '<div class="lucky">' + luckyItems.map(function(l) {
      return '<div class="lucky-item ' + l.cls + '"><div class="label">' + l.label + '</div><div class="value">' + escHtml(l.val) + '</div></div>';
    }).join('') + '</div>';
  }

  result.innerHTML = '<div class="success">' + overviewHtml +
    (itemsHtml ? '<div class="items">' + itemsHtml + '</div>' : '') +
    luckyHtml +
  '</div>';
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function escHtml(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
})();
</script>
