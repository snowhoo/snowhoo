  // 通用写入：将完整游戏状态（含解锁标记）保存到 Waline（有记录 PUT 更新，无记录 POST 创建）
  _writeState: function(user, commentObj, successMsg) {
    var self = this;
    // 写库动作执行：此时才进入"真气融合中"，不再由调用方前置设置
    this.setSyncState('saving');
    var payload = JSON.stringify({
      comment: JSON.stringify(commentObj),
      url: '/app-game/actions',
      nick: user.display_name || '游客',
      mail: user.email || ''
    });
    var token = user.token || '';
    if (!token) { try { var s = JSON.parse(localStorage.getItem('WALINE_USER')||'{}'); if(s.token) token=s.token; } catch(e){} }
    var headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var request;
    if (this._gameObjectId) {
      // 已有记录 → PUT 更新
      request = fetch('https://waline.snowhoo.net/api/comment/' + this._gameObjectId, {
        method: 'PUT',
        headers: headers,
        body: payload
      });
    } else {
      // 无记录 → POST 创建新记录（带 auth，确保有所属用户）
      request = fetch('https://waline.snowhoo.net/api/comment', {
        method: 'POST',
        headers: headers,
        body: payload
      }).then(function(r){
        if (r.ok) {
          return r.json().then(function(j){
            if (j.data && j.data.objectId) {
              self._gameObjectId = parseInt(j.data.objectId,10);
            }
            return r;
          });
        }
        return r;
      });
    }
    // 15 秒超时兜底：Waline 写库响应慢/挂起时不再无限等待（否则 syncState 永久卡 saving）
    var timer = new Promise(function(resolve, reject) {
      setTimeout(function(){ reject(new Error('写库超时')); }, 15000);
    });
    return Promise.race([request, timer])
    .then(function(r){
      if (r.ok) {
        console.log('[GAME]', successMsg);
        return self.loadFromServer(user).then(function(){ return true; });
      } else {
        self.syncError = true;
        return r.text().then(function(t){ console.warn('[GAME] Waline 同步失败', r.status, t); return false; });
      }
    }).catch(function(e){
      self.syncError = true;
      console.warn('[GAME] Waline 同步网络失败:', e);
      return false;
    }).then(function(ok){
      if (!ok) {
        // 统一显示"心魔困扰"（含 IPQPS 频率限制场景，便于统一识别定位）
        self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
        self.syncError = false;
        self._beforePoints = undefined;
        self.setSyncState('idle');
        self.updateBadge();
        self.updateTaskDots();
      }
      return !!ok;
    });
  },

  // 归一化剩余次数：确保所有任务都有值（缺失时用当前境界 LEVEL_CONFIG[level].times 补全，
  // GAME_CONFIG.max 已废弃），首次修炼/解锁时防止写入空对象
  _normalizeRemaining: function(base) {
    var src = base || this.todayCounts || {};
    var out = {};
    if (!window.GAME_CONFIG) {
      for (var k in src) out[k] = src[k];
      return out;
    }
    var cfg = this.getLevelCfg();
    var times = (cfg && cfg.times) ? cfg.times : {};
    for (var i = 0; i < GAME_CONFIG.length; i++) {
      var ck = GAME_CONFIG[i].key;
      if (typeof src[ck] === 'number') {
        out[ck] = src[ck];
      } else if (typeof times[ck] === 'number') {
        out[ck] = times[ck];
      } else {
        out[ck] = 0;
      }
    }
    return out;
  },

  // 从数据库读取当前用户的真实记录（只读，不更新 UI），返回 Promise<{foundId, data}>
  // 写入前必须先调此方法拿真实数据，再基于真实数据处理后写入，防止覆盖其他端的最新数据
  _fetchCurrentRecord: function(user) {
    var self = this;
    var userNick = user.display_name || '';
    var p = fetch('https://waline.snowhoo.net/api/comment?path=/app-game/actions')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(resp) {
        var records = (resp.data && resp.data.data) || [];
        var foundId = 0, foundData = null;
        for (var i = 0; i < records.length; i++) {
          try {
            var r = records[i];
            if ((r.nick || '') !== userNick) continue;
            var raw = r.orig || r.comment || '';
            var data = self.parseGameRecord(raw);
            if (data && typeof data.points === 'number' && data.todayRemaining) {
              var id = parseInt(r.objectId, 10) || 0;
              if (id > foundId) { foundId = id; foundData = data; }
            }
          } catch(e) {}
        }
        // 云端无该用户记录（新用户，或老用户后台数据被删除）→ 重置 objectId，
        // 后续写库走 POST 创建新记录，实现自动重建（否则会 PUT 到已删除的记录而 404）
        if (foundId) self._gameObjectId = foundId;
        else self._gameObjectId = 0;
        return { foundId: foundId, data: foundData };
      });
    // 8 秒超时兜底：防止网络挂起导致状态机永久卡在 loading/saving
    var timer = new Promise(function(resolve, reject) {
      setTimeout(function(){ reject(new Error('读取超时')); }, 8000);
    });
    return Promise.race([p, timer]);
  },

  syncToWaline: function(key,points,user) {
    try {
      if (!user || !user.display_name) return Promise.resolve(false);
      var self = this;
      return this.performCultivate(key, user, {points: points});
    } catch(e){ console.warn('[GAME] Waline 同步异常:', e); return Promise.resolve(false); }
  },

  // 核心修炼：点击任务后 ①读库真实数据 → ②判断（剩余次数/经验，一律以数据库为准）→ ③写库（PUT/POST）→ ④读回确认
  // 返回 Promise<boolean>：写库成功 true，失败 false（失败时已显示心魔困扰）
  performCultivate: function(key, user, opts) {
    var self = this;
    opts = opts || {};
    // 真气快照不读内存：读库后以数据库真实值设置（回读后按实际增益显示 +真气）
    this._beforePoints = undefined;
    // ① 读库阶段：真气恢复中（saving 由 _writeState 在真正写库时设置）
    this.setSyncState('loading');
    return this._fetchCurrentRecord(user).then(function(res) {
      var basePoints = res.data ? res.data.points : 0;
      var baseRemaining = (res.data && res.data.todayRemaining) ? res.data.todayRemaining : {};
      var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : 0;
      // 解锁状态一律以数据库为准（无记录按 0），绝不读内存
      var baseAuto = res.data ? (res.data.autoUnlocked ? 1 : 0) : 0;
      var baseOneKey = res.data ? (res.data.oneKeyUnlocked ? 1 : 0) : 0;
      var baseAlmanac = res.data ? (res.data.almanacUnlocked ? 1 : 0) : 0;
      var baseLogo = res.data ? (res.data.logoUnlocked ? 1 : 0) : 0;
      var baseYin = res.data ? (res.data.yinUnlocked ? 1 : 0) : 0;
      // 找到真实记录 → 用其 objectId，确保 PUT 更新同一条（不产生新记录）
      if (res.foundId) self._gameObjectId = res.foundId;
      // ② 剩余次数以数据库为准（手动任务检查；自动/一键模式由外层流程管理，跳过）
      if (!opts.skipCheck) {
        var dbRemaining = (typeof baseRemaining[key] === 'number') ? baseRemaining[key] : 0;
        if (dbRemaining <= 0) {
          self.setSyncState('idle');
          self.showXp('+0 真气', '今日此项修炼已毕');
          self.updateBadge();
          self.updateTaskDots();
          return false;
        }
      }
      // 单次经验值以数据库 level 查表（opts.points 可覆盖：一键批量用自身计算）
      var lvCfg = (typeof LEVEL_CONFIG !== 'undefined' && LEVEL_CONFIG[baseLevel]) ? LEVEL_CONFIG[baseLevel] : null;
      var points = (opts.points !== undefined) ? opts.points
        : (lvCfg && lvCfg.points && typeof lvCfg.points[key] === 'number' ? lvCfg.points[key] : 0);
      if (points <= 0) {
        self.setSyncState('idle');
        self.showXp('+0 真气', '当前境界此项无经验奖励');
        self.updateBadge();
        self.updateTaskDots();
        return false;
      }
      // 真气快照以数据库真实值为准
      self._beforePoints = basePoints;
      // ③ 基于真实数据计算
      var newPoints = basePoints + points;
      var newRemaining = self._normalizeRemaining(baseRemaining);
      if (typeof newRemaining[key] === 'number') newRemaining[key]--;
      var now = new Date();
      var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      // 写入（成功后再回读确认，更新 UI）；解锁状态以数据库为准
      function lvC(k){ return (res.data && res.data[k + 'Unlocked']) ? 1 : 0; }
      return self._writeState(user, {
        points: newPoints,
        todayRemaining: newRemaining,
        nick: user.display_name,
        level: baseLevel,
        date: today,
        autoUnlocked: baseAuto,
        oneKeyUnlocked: baseOneKey,
        almanacUnlocked: baseAlmanac,
        logoUnlocked: baseLogo,
        runnerUnlocked: lvC('runner'),
        storyUnlocked: lvC('story'),
        yeduUnlocked: lvC('yedu'),
        zjszUnlocked: lvC('zjsz'),
        newsUnlocked: lvC('news'),
        tvUnlocked: lvC('tv'),
        backgroundUnlocked: lvC('background'),
        yinUnlocked: lvC('yin')
      }, '真气值已同步到 Waline: ' + key + ' +' + points);
    }).catch(function(e) {
      // 写入前读取真实数据失败 → 无法保证写入正确性，阻止写入
      console.warn('[GAME] 写入前读取真实数据失败:', e);
      self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      self.setSyncState('idle');
      self.updateBadge();
      self.updateTaskDots();
      return false;
    });
  },

  // 面板数据加载完成通知（自动修炼模式下由面板函数调用，替代 doAction）
  _autoPanelLoaded: function(key, ok) {
    // key 匹配当前期望的任务才响应（避免上一步迟到的回调误触发下一步）
    if (this._autoPanelCb && this._autoPanelKey === key) {
      var cb = this._autoPanelCb;
      this._autoPanelCb = null;
      this._autoPanelKey = null;
      cb(ok);
    }
  },

  // 解锁功能：消耗真气一次性解锁"自动"/"一键"/"日期卡片"
  unlockFeature: function(feature) {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    // 名称/解锁文案按配置原始 key 查（key 与 FEATURE_CONFIG.unlockCost 完全一致，无映射）
    var dItem = this._findDiscoverItem(feature);
    var cfg = (typeof FEATURE_CONFIG !== 'undefined' && FEATURE_CONFIG && FEATURE_CONFIG.unlockCost) ? FEATURE_CONFIG.unlockCost : {}; // 成本一律读配置文件，不硬编码
    var cost = cfg[feature];
    if (!cost) return;
    var name = (dItem && dItem.name) ? dItem.name : feature;
    var unlockMsg = (dItem && dItem.unlockMsg) ? dItem.unlockMsg : ('破除封印！-' + cost + ' 真气');
    // 5 个栏目（参照自动修炼锁定，解锁后正常跳转）
    var catKeys = ['story','yedu','zjsz','news','tv'];
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    var self = this;
    // 1. 立即弹询问窗口（不先读库），确认后窗口不关闭，读写信息直接在窗口内显示
    self._showUnlockFlow(cost, {
      onConfirm: function(setStatus) {        // 确认后再校验登录状态（未登录 → 窗口提示，无法注入真气破除封印）
        var user = self.getWalineUser();
        if (!user) {
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
          setStatus('隐匿身份', '隐匿身份，无法注入真气破除封印!');
          return;
        }
        // 2. 确认后读数据库真实数据（真气值/解锁状态以数据库为准，防止多端数据过期）
        setStatus('⚡ 破除封印', '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseAuto = res.data ? (res.data.autoUnlocked ? 1 : 0) : 0;
          var baseOneKey = res.data ? (res.data.oneKeyUnlocked ? 1 : 0) : 0;
          var baseAlmanac = res.data ? (res.data.almanacUnlocked ? 1 : 0) : 0;
          var baseLogo = res.data ? (res.data.logoUnlocked ? 1 : 0) : 0;
          var baseRunner = res.data ? (res.data.runnerUnlocked ? 1 : 0) : 0;
          var baseYin = res.data ? (res.data.yinUnlocked ? 1 : 0) : 0;
          var baseCats = {};
          for (var ci = 0; ci < catKeys.length; ci++) {
            baseCats[catKeys[ci]] = res.data ? (res.data[catKeys[ci] + 'Unlocked'] ? 1 : 0) : 0;
          }
          var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : 0;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 以下所有"不能解锁"的场景：直接回 idle 并恢复按钮文本，不写库
          // 结果直接在窗口内显示（原页面提示保留照旧）
          // 已解锁（以数据库为准）→ 同步内存标记并提示
          if (feature === 'auto' && baseAuto) {
            self.autoUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"自动" 已解锁');
            self._updateQuickBtns(true);
            setStatus('无需破除封印', '"自动" 功能已解锁');
            return;
          }
          if (feature === 'oneKey' && baseOneKey) {
            self.oneKeyUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"一键" 已解锁');
            self._updateQuickBtns(true);
            setStatus('无需破除封印', '"一键" 功能已解锁');
            return;
          }
          if (feature === 'almanac' && baseAlmanac) {
            self.almanacUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"日期卡片" 已解锁');
            self._updateAlmanacLock();
            setStatus('无需破除封印', '"日期卡片" 功能已解锁');
            return;
          }
          if (feature === 'logo' && baseLogo) {
            self.logoUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"LOGO" 已解锁');
            self._updateLogoLock();
            self._updateYinLock();
            setStatus('无需破除封印', '"LOGO" 功能已解锁');
            return;
          }
          if (feature === 'yin' && baseYin) {
            self.yinUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"阴阳镜" 已解锁');
            self._updateYinLock();
            setStatus('无需破除封印', '"阴阳镜" 已解锁');
            return;
          }
          if (feature === 'runner' && baseRunner) {
            self.runnerUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"奔跑" 已解锁');
            self._updateRunnerLock();
            setStatus('无需破除封印', '"奔跑" 功能已解锁');
            return;
          }
          // 5 个栏目：已解锁（以数据库为准）→ 同步内存标记并提示
          for (var ci2 = 0; ci2 < catKeys.length; ci2++) {
            var ck = catKeys[ci2];
            if (feature === ck && baseCats[ck]) {
              self[ck + 'Unlocked'] = 1;
              self.setSyncState('idle');
              self.updateTaskMenuBtn();
              self.showXp('', '"' + name + '" 已解锁');
              self._updateCategoryLocks();
              setStatus('无需破除封印', '"' + name + '" 功能已解锁');
              return;
            }
          }
          // "一键"需先解锁"自动"
          if (feature === 'oneKey' && !baseAuto) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '需先解锁"自动"功能!');
            setStatus('无法破除封印', '需先解锁"自动"功能!');
            return;
          }
          // 真气不足（以数据库真实值为准）→ 不允许解锁
          if (basePoints < cost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破除封印需要 ' + cost + ' 真气！');
            setStatus('无法破除封印', '真气不足，破除封印需要 ' + cost + ' 真气！');
            return;
          }
          // 3. 写库（saving 由 _writeState 内部在写库动作执行时设置）
          //    注意：不在此处修改 self.xxxUnlocked，也不立即解锁——
          //    解锁状态以写库成功后读库返回的数据为准（processRecords 从数据库读回并更新 UI）
          setStatus('⚡ 破除封印', '正在融合真气..');
          var newPoints = basePoints - cost;
          var newAuto = (feature === 'auto') ? 1 : baseAuto;
          var newOneKey = (feature === 'oneKey') ? 1 : baseOneKey;
          var newAlmanac = (feature === 'almanac') ? 1 : baseAlmanac;
          var newLogo = (feature === 'logo') ? 1 : baseLogo;
          var newRunner = (feature === 'runner') ? 1 : baseRunner;
          var newYin = (feature === 'yin') ? 1 : baseYin;
          var newCats = {};
          for (var ci3 = 0; ci3 < catKeys.length; ci3++) {
            newCats[catKeys[ci3]] = (feature === catKeys[ci3]) ? 1 : baseCats[catKeys[ci3]];
          }
          // 记录解锁成功后的提示（由 processRecords 在写库读回确认后显示，与修炼 +真气 一致）
          self._pendingUnlockMsg = unlockMsg + ' · -' + cost + ' 真气';
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          // 4. 写入（成功后再回读确认，由 processRecords 根据数据库数据更新解锁状态）
          self._writeState(user, {
            points: newPoints,
            todayRemaining: self._normalizeRemaining(res.data ? res.data.todayRemaining : null),
            nick: user.display_name,
            level: baseLevel,
            date: today,
            autoUnlocked: newAuto,
            oneKeyUnlocked: newOneKey,
            almanacUnlocked: newAlmanac,
            logoUnlocked: newLogo,
            runnerUnlocked: newRunner,
            storyUnlocked: newCats.story,
            yeduUnlocked: newCats.yedu,
            zjszUnlocked: newCats.zjsz,
            newsUnlocked: newCats.news,
            tvUnlocked: newCats.tv,
            backgroundUnlocked: (res.data && res.data.backgroundUnlocked) ? 1 : 0,
            yinUnlocked: newYin
          }, '已解锁"' + name + '"功能').then(function(ok) {
            // 结果直接在窗口内显示（页面成功提示照旧由 processRecords 驱动）
            setStatus(ok ? '✓ 封印已破' : '心魔困扰', ok ? ('解锁成功！-' + cost + ' 真气，封印已破！') : '正遭受心魔困扰，点击恢复心神!');
            // 注意：发现窗口的刷新放在 _showUnlockFlow 关闭后统一执行（见下方 .then）
          });
        }).catch(function(e) {
          // 确认后读取真实数据失败/超时 → 无法保证解锁正确性，窗口提示并回 idle
          console.warn('[GAME] 解锁前读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    }).then(function(){
      // 窗口已关闭（用户点"知道了"）→ 用已回读的数据库值刷新发现窗口
      self.refreshDiscover();
    });
  },

  // 从配置文件（game-config.js 的 FEATURE_CONFIG.discover）读取发现列表分组；未定义时返回空
  _discoverGroups: function() {
    var cfg = (typeof FEATURE_CONFIG !== 'undefined' && FEATURE_CONFIG && FEATURE_CONFIG.discover) ? FEATURE_CONFIG.discover : [];
    return cfg;
  },
  // 回收返还比例（FEATURE_CONFIG.relockRate），配置缺失时默认 0.8（80%）
  _relockRate: function() {
    if (typeof FEATURE_CONFIG !== 'undefined' && FEATURE_CONFIG && typeof FEATURE_CONFIG.relockRate === 'number') {
      return FEATURE_CONFIG.relockRate;
    }
    return 0.8;
  },
  // 回收返还比例的文字表述（FEATURE_CONFIG.relockRateText，如"八成"），缺失时回退百分比
  _relockRateText: function() {
    if (typeof FEATURE_CONFIG !== 'undefined' && FEATURE_CONFIG && FEATURE_CONFIG.relockRateText) {
      return FEATURE_CONFIG.relockRateText;
    }
    return Math.round(this._relockRate() * 100) + '%';
  },
  // 按 key 在发现配置（FEATURE_CONFIG.discover）中查找秘藏项（key 与 unlockCost 一致，无额外映射）
  _findDiscoverItem: function(key) {
    var groups = this._discoverGroups();
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (items[j].key === key) return items[j];
      }
    }
    return null;
  },

  // 该秘藏是否已解锁（key 与 FEATURE_CONFIG.unlockCost 完全一致）
  _isUnlocked: function(key) {
    var map = { auto:'autoUnlocked', oneKey:'oneKeyUnlocked', almanac:'almanacUnlocked', logo:'logoUnlocked', runner:'runnerUnlocked', story:'storyUnlocked', yedu:'yeduUnlocked', zjsz:'zjszUnlocked', news:'newsUnlocked', tv:'tvUnlocked', background:'backgroundUnlocked', yin:'yinUnlocked' };
    return !!this[map[key]];
  },

  // 渲染发现列表内容（不改变窗口开关状态；供打开与刷新共用）
  renderDiscover: function() {
    var body = document.getElementById('discoverBody');
    if (!body) return;
    var groups = this._discoverGroups();
    var rateTxt = this._relockRateText();
    var html = '';
    groups.forEach(function(g){
      html += '<div class="discover-cat">' + g.cat + '</div>';
      html += '<div class="discover-grid">';
      (g.items || []).forEach(function(it){
        var un = GAME._isUnlocked(it.key);
        // 图标：优先 png（用户可替换），缺失回退内置 svg 占位
        var icon = 'discover_' + it.key + '.png';
        var iconFallback = 'discover_' + it.key + '.svg';
        var imgHtml = '<img src="' + icon + '" alt="" onerror="this.onerror=null;this.src=\'' + iconFallback + '\'">';
        // 未解锁 → ？？ + 遮罩
        if (!un) {
          html += '<div class="disc-item locked-item" data-key="' + it.key + '">'
            + '<div class="disc-icon">' + imgHtml + '<span class="disc-lock">？</span></div>'
            + '<span class="disc-dname locked">？？</span>'
            + '<span class="disc-act">未发现</span>'
            + '</div>';
          return;
        }
        // 已解锁 → 名称可点击弹提示；不可回收（noRelock）项不显示回撤破印
        if (it.noRelock) {
          html += '<div class="disc-item unlocked" data-key="' + it.key + '">'
            + '<div class="disc-icon">' + imgHtml + '</div>'
            + '<span class="disc-dname">' + it.name + '</span>'
            + '<span class="disc-act">不可回收</span>'
            + '</div>';
          return;
        }
        html += '<div class="disc-item unlocked" data-key="' + it.key + '">'
          + '<div class="disc-icon">' + imgHtml + '</div>'
          + '<span class="disc-dname">' + it.name + '</span>'
          + '<span class="disc-act relock-act">回撤破印 · ' + rateTxt + '</span>'
          + '</div>';
      });
      html += '</div>';
    });
    if (!html) html = '<div class="discover-cat">暂未配置发现秘藏</div>';
    body.innerHTML = html;
    var foot = document.getElementById('discoverFoot');
    if (foot) foot.textContent = '点击未发现的秘藏可查看获得方式；已发现的点击名称可查看说明，点击"回撤破印"可回收真气重新上锁';
    body.querySelectorAll('.disc-item').forEach(function(el){
      // 整项点击：弹提示（未解锁 → lockedTip；已解锁 → unlockedTip），不激活破印
      el.addEventListener('click', function(){
        var key = el.dataset.key;
        var it = GAME._findDiscoverItem(key);
        var tip = it ? (GAME._isUnlocked(key) ? it.unlockedTip : it.lockedTip) : '';
        GAME._showTip(GAME._isUnlocked(key) ? it.name : '未发现', tip || '暂无更多说明');
      });
      // 回撤破印按钮：单独触发回收（阻止整项提示）
      var relock = el.querySelector('.relock-act');
      if (relock) {
        relock.addEventListener('click', function(e){
          e.stopPropagation();
          GAME.relockFeature(el.dataset.key);
        });
      }
    });
  },

  // 打开发现列表（打坐人形入口）
  openDiscover: function() {
    var mask = document.getElementById('discoverMask');
    if (!mask) return;
    this.renderDiscover();
    mask.classList.add('show');
    document.body.style.overflow = 'hidden';
  },

  // 刷新发现列表：若窗口当前已打开，仅重绘内容（不关闭窗口）
  refreshDiscover: function() {
    var mask = document.getElementById('discoverMask');
    if (mask && mask.classList.contains('show')) this.renderDiscover();
  },

  closeDiscover: function() {
    var mask = document.getElementById('discoverMask');
    if (mask) mask.classList.remove('show');
    document.body.style.overflow = '';
  },

  // 回收真气（返还比例见 FEATURE_CONFIG.relockRate），使已解锁秘藏重新上锁
  // 流程与解锁一致：询问 → 确认后窗口不关闭，读库/写库/回读进度直接在窗口内显示，成功后才关窗
  relockFeature: function(feature) {
    // 名称/回收操作名按配置原始 key 查（key 与 unlockCost 一致，无映射）
    var dItem = this._findDiscoverItem(feature);
    // 不可回收项（noRelock，如法器乾坤镜）→ 直接提示，不回收
    if (dItem && dItem.noRelock) {
      this._showTip((dItem.name || feature), '此物不可回收（' + (dItem.unlockedTip || '永久持有') + '）');
      return;
    }
    var cfg = (typeof FEATURE_CONFIG !== 'undefined' && FEATURE_CONFIG && FEATURE_CONFIG.unlockCost) ? FEATURE_CONFIG.unlockCost : {}; // 成本一律读配置文件，不硬编码
    var cost = cfg[feature];
    if (!cost) return;
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法操作..' : '真气融合中，无法操作..');
      return;
    }
    var name = (dItem && dItem.name) ? dItem.name : feature;
    var relockMsg = (dItem && dItem.relockMsg) ? dItem.relockMsg : '收回真气重修';
    var refund = Math.floor(cost * this._relockRate());
    var rateTxt = this._relockRateText();
    var self = this;
    var user = this.getWalineUser();
    if (!user) { this.showXp('', '隐匿身份，无法操作'); return; }
    // 流程弹窗：确认后窗口不关闭，进度/结果直接显示在窗口内
    self._showUnlockFlow(cost, {
      title: '🔓 回撤破印',
      text: '回撤破印，可得原破印真气' + rateTxt + '（+' + refund + ' 真气），【' + name + '】将重新上锁，继续？',
      okText: '回撤破印',
      onConfirm: function(setStatus) {
        // 1. 读库阶段（真气恢复中）
        setStatus('🔓 回撤破印', '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res){
          var basePoints = res.data ? res.data.points : 0;
          var todayRemaining = res.data ? res.data.todayRemaining : {};
          var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : 0;
          var newPoints = basePoints + refund;
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          // 解锁状态一律以数据库当前记录为准（无记录按 0），绝不读内存
          function lv(k){ return (res.data && res.data[k + 'Unlocked']) ? 1 : 0; }
          var state = {
            points: newPoints,
            todayRemaining: self._normalizeRemaining(todayRemaining),
            nick: user.display_name,
            level: baseLevel,
            date: today,
            autoUnlocked: (feature === 'auto') ? 0 : lv('auto'),
            oneKeyUnlocked: (feature === 'oneKey') ? 0 : lv('oneKey'),
            almanacUnlocked: (feature === 'almanac') ? 0 : lv('almanac'),
            logoUnlocked: (feature === 'logo') ? 0 : lv('logo'),
            runnerUnlocked: (feature === 'runner') ? 0 : lv('runner'), // 回收固魂大法即回收奔跑的人
            storyUnlocked: (feature === 'story') ? 0 : lv('story'),
            yeduUnlocked: (feature === 'yedu') ? 0 : lv('yedu'),
            zjszUnlocked: (feature === 'zjsz') ? 0 : lv('zjsz'),
            newsUnlocked: (feature === 'news') ? 0 : lv('news'),
            tvUnlocked: (feature === 'tv') ? 0 : lv('tv'),
            backgroundUnlocked: lv('background'),
            yinUnlocked: (feature === 'yin') ? 0 : lv('yin')
          };
          // 2. 写库阶段（真气融合中）；_writeState 内部成功后自动回读数据库
          setStatus('🔓 回撤破印', '正在融合真气..');
          self._pendingRelockMsg = '【' + name + '】重新上锁 · ' + relockMsg + ' · +' + refund + ' 真气';
          self._writeState(user, state, '已回收重修: ' + feature).then(function(ok){
            if (!ok) {
              self._pendingRelockMsg = undefined;
              setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
              return;
            }
            // 3. 写库成功且已回读数据库 → 窗口显示完成，等待用户点"知道了"关窗
            setStatus('✓ 回撤完成', '【' + name + '】重新上锁 · ' + relockMsg + ' · +' + refund + ' 真气');
          });
        }).catch(function(e) {
          console.warn('[GAME] 回收重修读取失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    }).then(function(){
      // 窗口已关闭（用户点"知道了"）→ 用已回读的数据库值刷新发现窗口
      self.refreshDiscover();
    });
  },

  // 境界突破流程弹窗：询问 → 确认后窗口不关闭，读库/写库进度与结果直接在窗口内显示（暗绿色主题）
  // opts.onConfirm(setStatus)：用户点"破境"后调用；setStatus(title, text) 更新窗口内容
  _showUpgradeFlow: function(cost, nextName, opts) {
    return new Promise(function(resolve) {
      var mask = document.getElementById('upgradeConfirm');
      var title = document.getElementById('upgradeConfirmTitle');
      var text = document.getElementById('upgradeConfirmText');
      var okBtn = document.getElementById('upgradeConfirmOk');
      var cancelBtn = document.getElementById('upgradeConfirmCancel');
      // 弹层元素缺失时兜底用原生 confirm
      if (!mask || !title || !text || !okBtn || !cancelBtn) {
        if (opts && opts.onConfirm) {
          if (window.confirm('消耗 ' + cost + ' 真气，破境至【' + nextName + '】？')) opts.onConfirm(function(){});
        }
        resolve(true);
        return;
      }
      // 询问态
      title.textContent = '⚡ 境界突破';
      text.textContent = '消耗 ' + cost + ' 真气，破境至【' + nextName + '】？';
      okBtn.textContent = '破境';
      cancelBtn.style.display = '';
      mask.classList.add('show');
      var settled = false;
      function finish(v) {
        if (settled) return;
        settled = true;
        mask.classList.remove('show');
        cancelBtn.style.display = '';
        okBtn.textContent = '破境';
        okBtn.removeEventListener('click', onOk);
        okBtn.removeEventListener('click', onClose);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(v);
      }
      function onOk() {
        // 确认 → 窗口不关闭，转为流程态：隐藏"再想想"，按钮变"知道了"
        okBtn.removeEventListener('click', onOk);
        cancelBtn.style.display = 'none';
        okBtn.textContent = '知道了';
        okBtn.addEventListener('click', onClose);
        if (opts && opts.onConfirm) {
          opts.onConfirm(function(t, x) {
            if (settled) return;
            if (t !== undefined) title.textContent = t;
            if (x !== undefined) text.textContent = x;
          });
        }
      }
      function onClose() { finish(true); }
      function onCancel() { finish(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  },

  // 手动升级境界：扣真气 → level+1 → 写库 → 读回确认 → 显示【境界突破】
  upgradeLevel: function() {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    var user = this.getWalineUser();
    if (!user) {
      this.showXp('', '请勿隐匿身份，否则您无法修炼');
      return;
    }
    if (!this.loaded) {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法升级..' : '真气融合中，无法升级..');
      return;
    }
    // 检查 LEVEL_CONFIG 是否存在
    if (typeof LEVEL_CONFIG === 'undefined') {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    var self = this;
    // 用内存境界推算下一档（本地配置用于询问文案；确认后读库再以数据库为准复核）
    var nextLv0 = self.level + 1;
    if (!LEVEL_CONFIG[nextLv0]) {
      this.showXp('', '已达最高境界【化神大圆满】');
      return;
    }
    var preCost = LEVEL_CONFIG[nextLv0].cost;
    var preName = LEVEL_CONFIG[nextLv0].name;
    // 1. 立即弹询问窗口（暗绿色，不先读库），确认后窗口不关闭，读写信息直接在窗口内显示
    self._showUpgradeFlow(preCost, preName, {
      onConfirm: function(setStatus) {
        // 2. 确认后读数据库真实数据（真气/level 以数据库为准）
        setStatus('⚡ 境界突破', '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseLevel = res.data && typeof res.data.level === 'number' ? res.data.level : 0;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 检查等级上限（以数据库为准，已是最高境界）
          var nextLv = baseLevel + 1;
          if (!LEVEL_CONFIG[nextLv]) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '已达最高境界【化神大圆满】');
            setStatus('已达最高境界', '已臻【化神大圆满】，无法继续突破');
            return;
          }
          var realCost = LEVEL_CONFIG[nextLv].cost;
          var nextName = LEVEL_CONFIG[nextLv].name;
          // 真气不足 → 窗口提示（原页面提示保留照旧）
          if (basePoints < realCost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破境【' + nextName + '】需 ' + realCost + ' 真气');
            setStatus('无法突破', '真气不足，破境【' + nextName + '】需 ' + realCost + ' 真气');
            return;
          }
          // 3. 写库（saving 由 _writeState 内部在写库动作执行时设置）
          setStatus('⚡ 境界突破', '正在融合真气..');
          var newPoints = basePoints - realCost;
          var newLevel = nextLv;
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          // 升级后剩余次数按新境界 times 全量恢复（体力已恢复）
          var newRemaining = self.buildRemainingForLevel(newLevel);
          // 解锁状态一律以数据库当前记录为准（res.data），无记录时按 0 处理，绝不读内存
          function lvU(k){ return (res.data && res.data[k + 'Unlocked']) ? 1 : 0; }
          self._writeState(user, {
            points: newPoints,
            todayRemaining: newRemaining,
            nick: user.display_name,
            level: newLevel,
            date: today,
            autoUnlocked: lvU('auto'),
            oneKeyUnlocked: lvU('oneKey'),
            almanacUnlocked: lvU('almanac'),
            logoUnlocked: lvU('logo'),
            runnerUnlocked: lvU('runner'),
            storyUnlocked: lvU('story'),
            yeduUnlocked: lvU('yedu'),
            zjszUnlocked: lvU('zjsz'),
            newsUnlocked: lvU('news'),
            tvUnlocked: lvU('tv'),
            backgroundUnlocked: lvU('background'),
            yinUnlocked: lvU('yin')
          }, '境界提升至【' + nextName + '】').then(function(ok) {
            // 不前置显示升级提示，由 processRecords 读回确认后展示（与修炼+真气同一时序）
            self._pendingUpgradeMsg = { name: nextName, cost: realCost };
            // 结果直接在窗口内显示（暗绿色窗口）
            setStatus(ok ? '✓ 突破成功' : '心魔困扰', ok ? ('境界提升至【' + nextName + '】！-' + realCost + ' 真气，体力恢复！') : '正遭受心魔困扰，点击恢复心神!');
          });
        }).catch(function(e) {
          // 确认后读取真实数据失败/超时 → 无法保证升级正确性，窗口提示并回 idle
          console.warn('[GAME] 升级前读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          self.updateTaskMenuBtn();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    });
  },

  // 双击背景图破除隐藏结界：扣随机真气 → 成功后保存当前背景图到相册
  // 流程与其它解锁完全一致：先弹询问窗 → 确认后窗口不关闭 → 读库校验（登录/真气不足）→ 扣真气写库 → 读回确认 → 保存图片
  // 参数与文案由 game-config.js 的 BG_UNLOCK_CONFIG 配置（不记录解锁状态、不限次数）
  unlockBackground: function() {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    var cfg = (typeof BG_UNLOCK_CONFIG !== 'undefined') ? BG_UNLOCK_CONFIG : {};
    var min = (typeof cfg.min === 'number') ? cfg.min : 5;
    var max = (typeof cfg.max === 'number') ? cfg.max : 10;
    if (max < min) max = min;
    var cost = min + Math.floor(Math.random() * (max - min + 1)); // min~max 随机
    var qTitle = cfg.title || '🗝 隐藏结界';
    var qText = (cfg.text || '发现隐藏结界，注入 {cost} 真气破除结界？').replace('{cost}', cost);
    var qOk = cfg.okText || '破除';
    var doneTitle = cfg.doneTitle || '✓ 结界已破';
    var doneText = (cfg.doneText || '结界破除！-{cost} 真气，图片已保存到相册').replace('{cost}', cost);
    var self = this;
    // 1. 立即弹询问窗口（自定义文案：隐藏结界），确认后窗口不关闭
    self._showUnlockFlow(cost, {
      title: qTitle,
      text: qText,
      okText: qOk,
      onConfirm: function(setStatus) {
        // 确认后再校验登录状态（未登录 → 窗口提示，无法注入真气）
        var user = self.getWalineUser();
        if (!user) {
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
          setStatus('隐匿身份', '隐匿身份，无法注入真气破除结界!');
          return;
        }
        // 2. 读数据库真实数据（真气值以数据库为准）
        setStatus(qTitle, '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : 0;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 真气不足（以数据库真实值为准）→ 窗口提示，不写库
          if (basePoints < cost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破除结界需要 ' + cost + ' 真气！');
            setStatus('无法破除结界', '真气不足，破除结界需要 ' + cost + ' 真气！');
            return;
          }
          // 3. 写库：扣随机真气，解锁状态字段保留数据库原值；本次成功破除结界并保存图片 → 乾坤镜（background）解锁
          setStatus(qTitle, '正在融合真气..');
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          var newPoints = basePoints - cost;
          var newRemaining = self._normalizeRemaining(res.data ? res.data.todayRemaining : null);
          // 解锁状态一律以数据库当前记录为准（无记录按 0），绝不读内存
          function lvB(k){ return (res.data && res.data[k + 'Unlocked']) ? 1 : 0; }
          self._writeState(user, {
            points: newPoints,
            todayRemaining: newRemaining,
            nick: user.display_name,
            level: baseLevel,
            date: today,
            autoUnlocked: lvB('auto'),
            oneKeyUnlocked: lvB('oneKey'),
            almanacUnlocked: lvB('almanac'),
            logoUnlocked: lvB('logo'),
            runnerUnlocked: lvB('runner'),
            storyUnlocked: lvB('story'),
            yeduUnlocked: lvB('yedu'),
            zjszUnlocked: lvB('zjsz'),
            newsUnlocked: lvB('news'),
            tvUnlocked: lvB('tv'),
            backgroundUnlocked: 1  // 本次成功破除结界 → 获得乾坤镜（首次即解锁，永久持有）
          }, '破除结界 -' + cost + ' 真气').then(function(ok) {
            if (!ok) {
              setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
              return;
            }
            // 成功 → 窗口提示 + 保存图片到相册
            setStatus(doneTitle, doneText);
            self.saveBgImage();
          });
        }).catch(function(e) {
          console.warn('[GAME] 破除结界读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    });
  },

  // 是否运行在 App 内嵌 WebView 中（UA 自动识别 + 配置关键字）
  // WebView 无下载处理器：a[download] 下载会导致 App 退出/无反应，需走长按保存
  _isInAppWebView: function() {
    var ua = (navigator.userAgent || '').toLowerCase();
    // 通用 WebView 标识（Android: "; wv"；iOS WKWebView: "Mobile/...Safari" 无标识，靠关键字补）
    if (/\bwv\b|webview|wkwebview/.test(ua)) return true;
    // 配置关键字（game-config.js 的 WEBVIEW_UA_KEYWORDS，App 壳自定义 UA 标识）
    var kws = (typeof WEBVIEW_UA_KEYWORDS !== 'undefined' && WEBVIEW_UA_KEYWORDS.length) ? WEBVIEW_UA_KEYWORDS : [];
    for (var i = 0; i < kws.length; i++) {
      if (kws[i] && ua.indexOf(String(kws[i]).toLowerCase()) >= 0) return true;
    }
    return false;
  },

  // 全屏预览当前图片 + 长按保存到相册（WebView 环境专用，替代 a[download] 下载，避免退出 App）
  _showBgPreview: function(blob) {
    var name = 'bg-' + Date.now() + '.jpg';
    var reader = new FileReader();
    reader.onload = function() {
      var mask = document.createElement('div');
      mask.className = 'bg-save-mask';
      mask.innerHTML =
        '<div class="bg-save-tip">长按图片保存到相册</div>' +
        '<img class="bg-save-img" src="' + reader.result + '" alt="背景图" draggable="false">' +
        '<button class="bg-save-close">关闭</button>';
      document.body.appendChild(mask);
      var close = mask.querySelector('.bg-save-close');
      close.addEventListener('click', function(){ mask.remove(); });
      mask.addEventListener('click', function(e){ if (e.target === mask) mask.remove(); });
    };
    reader.readAsDataURL(blob);
  },

  // 保存当前背景图：用 canvas 捕获页面正在显示的图片（保证与页面看到的一致，不重新请求）
  // 浏览器：优先 Web Share API（移动端可直接存相册），否则 a[download] + blob 直接下载（不跳转浏览器）
  // App WebView：禁用 a[download]（会退出 App）→ 优先系统分享，否则全屏预览 + 长按保存到相册
  saveBgImage: function() {
    // 优先保存探索圆形中的 picsum 图；未开启探索时回退保存背景图（bg.jpg/随机图）
    var img = document.querySelector('.explore-circle img') || document.getElementById('bgImage');
    if (!img || !img.src) return;
    var self = this;
    var name = 'bg-' + Date.now() + '.jpg';
    var inWebView = this._isInAppWebView();
    function downloadBlob(blob, n) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = n;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    }
    function shareOrDownload(blob, n) {
      // App WebView：优先原生桥保存到系统相册（最可靠，替代长按/下载，不会退出 App）
      if (inWebView && window.AndroidBridge && typeof window.AndroidBridge.save === 'function') {
        var rd = new FileReader();
        rd.onload = function() {
          try { window.AndroidBridge.save(rd.result, n); }
          catch (e) { self._showBgPreview(blob); }
        };
        rd.readAsDataURL(blob);
        return;
      }
      // 移动端优先系统分享（可存相册）
      if (navigator.canShare && navigator.share) {
        var file = new File([blob], n, { type: blob.type || 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          // WebView 里分享面板取消/失败 → 回退预览长按保存；浏览器取消则静默
          navigator.share({ files: [file], title: '背景图' })
            .catch(function(){ if (inWebView) self._showBgPreview(blob); });
          return;
        }
      }
      if (inWebView) {
        // WebView：不用 a[download]（会导致退出 App），改全屏预览长按保存
        self._showBgPreview(blob);
      } else {
        // 直接下载（blob 本地数据，不跳转、不会被刷新成其他图）
        downloadBlob(blob, n);
      }
    }
    // canvas 捕获当前已显示的图片 → toBlob（crossOrigin=anonymous 已保证画布不被污染）
    try {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      if (!c.width || !c.height) { fallbackSave(); return; }
      var ctx = c.getContext('2d');
      if (!ctx) { fallbackSave(); return; }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob) {
        if (blob) { shareOrDownload(blob, name); }
        else { fallbackSave(); }
      }, 'image/jpeg', 0.92);
    } catch (e) {
      fallbackSave();
    }
    function fallbackSave() {
      if (inWebView) {
        // WebView 极端兜底：直接展示原始图 URL 的全屏预览，长按保存
        var mask = document.createElement('div');
        mask.className = 'bg-save-mask';
        mask.innerHTML =
          '<div class="bg-save-tip">长按图片保存到相册</div>' +
          '<img class="bg-save-img" src="' + img.src + '" alt="背景图" draggable="false">' +
          '<button class="bg-save-close">关闭</button>';
        document.body.appendChild(mask);
        mask.querySelector('.bg-save-close').addEventListener('click', function(){ mask.remove(); });
        mask.addEventListener('click', function(e){ if (e.target === mask) mask.remove(); });
        return;
      }
      // 浏览器兜底：下载当前图片 URL（极端情况才会走，picsum 可能因 random 参数重新生成图）

      '<span class="plan-stat-line">' +
        '<span class="plan-stat-text">' + (allMode ? '全部 ' : '今日 ') + total + ' 项，完成 ' + done + ' 项</span>' +
        '<span class="plan-stat-sep">|</span>' +
        '<span class="plan-sync-tip" id="planSyncTip"></span>' +
      '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>';
    updateSyncTip(); // 登录信息与完成项同行（元素随 innerHTML 重建，需重新填充）
    // 日期栏：始终显示当前日期 "2026-8-1 周六"（全部/单日模式都显示，切日期不迷失）
    var d = parseDate(curDate);
    $('planDateMain').textContent = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate() + ' 周' + weekCN(d);
    // 渲染后刷新滚动方向提示箭头（等布局完成）
    requestAnimationFrame(updateArrows);
  }

  // 列表滚动方向提示：上箭头=顶部被滚出（可往上），下箭头=底部还有未显示（可往下）
  function updateArrows(){
    var card = document.getElementById('planListCard');
    if (!card) return;
    var up = document.getElementById('planArrowUp');
    var down = document.getElementById('planArrowDown');
    if (!up || !down) return;
    up.classList.toggle('show', card.scrollTop > 2);
    down.classList.toggle('show', card.scrollTop + card.clientHeight < card.scrollHeight - 2);
  }

  // ---------- 交互 ----------
  // 按 id 在全部日期中查找条目（全部日程模式下跨日期勾选/删除）
  function findItemById(id){
    for (var d in data) {
      var arr = data[d];
      if (Array.isArray(arr)) {
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].id == id) return { arr: arr, i: i };
        }
      }
    }
    return null;
  }
  function addItem(){
    var textEl = $('planText');
    var timeEl = $('planTime');
    var text = (textEl.value || '').trim();
    if (!text) { toast('请输入计划内容'); textEl.focus(); return; }
    listFor(curDate).push({
      id: Date.now() + Math.floor(Math.random() * 1000),
      time: timeEl.value || '',
      text: text.slice(0, 60),
      done: false
    });
    textEl.value = '';
    render();
    pushCloudSoon();   // 修改后立即推送云端
    if (isAllMode()) toast('已添加到 ' + fmtDate(curDate));
  }
  function toggleDone(id){
    var f = findItemById(id);
    if (!f) return;
    f.arr[f.i].done = !f.arr[f.i].done;
    render();
    pushCloudSoon();
  }
  function delItem(id){
    var f = findItemById(id);
    if (!f) return;
    f.arr.splice(f.i, 1);
    render();
    pushCloudSoon();
    toast('已删除');
  }
  function toast(msg){
    var t = document.querySelector('.plan-toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'plan-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  // ---------- 计划行内编辑（双击激活，原地改） ----------
  var editingEl = null;      // 当前编辑中的 input
  var planClickTimer = null; // 单击延迟（区分单击/双击）
  function commitPlanEdit(input){
    if (input._done) return;
    input._done = true;
    if (input._cancelled) { editingEl = null; render(); return; }
    editingEl = null;
    var li = input.closest('.plan-item');
    var id = li ? li.dataset.id : null;
    var kind = input.dataset.kind; // text | date | time
    var f = id == null ? null : findItemById(id);
    var changed = false;
    if (f) {
      if (kind === 'text') {
        var t = (input.value || '').trim();
        if (t) { f.arr[f.i].text = t.slice(0, 60); changed = true; }
        else { toast('计划内容不能为空'); }
      } else if (kind === 'time') {
        if ((input.value || '') !== (f.arr[f.i].time || '')) { f.arr[f.i].time = input.value || ''; changed = true; }
      } else if (kind === 'date') {
        var nd = input.value;
        var oldKey = null;
        for (var k in data) if (data[k] === f.arr) { oldKey = k; break; }
        if (nd && nd !== oldKey) {
          var item = f.arr[f.i];
          f.arr.splice(f.i, 1);
          if (!Array.isArray(data[nd])) data[nd] = [];
          data[nd].push(item);
          if (oldKey && (!data[oldKey] || !data[oldKey].length)) delete data[oldKey];
          changed = true;
          toast('已移至 ' + fmtDate(nd));
        }
      }
    }
    if (changed) { pushCloudSoon(); if (kind !== 'date') toast('已修改'); }
    render();
  }
  function startPlanEdit(el, kind, curVal){
    if (editingEl) commitPlanEdit(editingEl); // 先提交上一个未完成的编辑
    var input = document.createElement('input');
    input.type = kind === 'date' ? 'date' : kind === 'time' ? 'time' : 'text';
    if (kind === 'text') input.maxLength = 60;
    input.value = curVal || '';
    input.className = 'plan-edit-inline';
    input.dataset.kind = kind;
    input.style.fontSize = kind === 'date' || kind === 'time' ? '.62rem' : '';
    el.replaceWith(input);
    editingEl = input;
    input.focus();
    if (kind === 'text') { try { input.setSelectionRange(input.value.length, input.value.length); } catch(e){} }
    input.addEventListener('blur', function(){ if (!input._done) commitPlanEdit(input); });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); if (!input._done) commitPlanEdit(input); }
      else if (e.key === 'Escape') { input._cancelled = true; if (!input._done) commitPlanEdit(input); }
    });
  }

  // ---------- 初始化 ----------
  function init(){
    // 严格云端优先：清理旧版本遗留的本地计划缓存，数据只从云端读取
    try {
      localStorage.removeItem('snowhoo_plan_data');
      localStorage.removeItem('snowhoo_plan_savedAt');
      localStorage.removeItem('snowhoo_plan_oid');
    } catch(e){}
    data = {};
    oid = 0;
    curDate = todayStr();
    $('planAllSwitch').checked = isAllMode();
    updateSyncTip();
    render();

    var picker = $('planDatePicker');
    // 点击日期直接选日期：picker 透明覆盖在日期文字上，原生弹出；全部模式下选日期自动切到单日
    picker.addEventListener('change', function(){
      if (!picker.value) return;
      if (isAllMode()) { setAllMode(false); $('planAllSwitch').checked = false; }
      curDate = picker.value;
      render();
    });
    // 点击时间直接选时间（PC 端无原生指示器时兜底弹出；移动端点击输入框自动弹出）
    $('planTime').addEventListener('click', function(){
      try { if (this.showPicker) this.showPicker(); } catch(e){}
    });
    // 底部开关：开=全部日程，关=仅显示日期框所选日期
    $('planAllSwitch').addEventListener('change', function(){
      setAllMode(this.checked);
      render();
    });
    $('planAddBtn').addEventListener('click', addItem);
    $('planText').addEventListener('keydown', function(e){
      if (e.key === 'Enter') addItem();
    });
    var listCard = document.getElementById('planListCard');
    if (listCard) listCard.addEventListener('scroll', updateArrows);
    window.addEventListener('resize', updateArrows);
    $('planList').addEventListener('click', function(e){
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var li = btn.closest('.plan-item');
      var id = li ? li.dataset.id : null;
      if (id == null) return;
      if (btn.dataset.act === 'toggle') toggleDone(id);
      else if (btn.dataset.act === 'del') delItem(id);
    });
    // 单击条目 → 提示"双击可进行修改"；双击 → 行内编辑（勾选/删除按钮区、编辑中的 input 不触发）
    $('planList').addEventListener('click', function(e){
      if (e.target.closest('[data-act]') || e.target.tagName === 'INPUT') return;
      var li = e.target.closest('.plan-item');
      if (!li) return;
      if (planClickTimer) { clearTimeout(planClickTimer); planClickTimer = null; return; } // 双击的第二次点击，交给 dblclick
      planClickTimer = setTimeout(function(){ planClickTimer = null; toast('双击可进行修改'); }, 280);
    });
    $('planList').addEventListener('dblclick', function(e){
      if (e.target.closest('[data-act]') || e.target.tagName === 'INPUT') return;
      var li = e.target.closest('.plan-item');
      if (!li) return;
      if (planClickTimer) { clearTimeout(planClickTimer); planClickTimer = null; }
      var id = li.dataset.id;
      var dd = e.target.closest('.plan-dt-date');
      if (dd) { startPlanEdit(dd, 'date', li.dataset.date || ''); return; }
      var tt = e.target.closest('.plan-dt-time') || e.target.closest('.plan-time');
      if (tt) { startPlanEdit(tt, 'time', li.dataset.time || ''); return; }
      var txt = e.target.closest('.plan-text');
      if (txt) { startPlanEdit(txt, 'text', txt.textContent); }
    });
    // 已登录 → 从云端拉取计划（数据以云端数据库为准）
    if (getWalineUser()) syncNow();
  }

  return { init: init, render: render, updateSyncTip: updateSyncTip, syncNow: syncNow, getWalineUser: getWalineUser };
})();
PlanSvc.init();

var walineInstance = null;

// 初始化 Waline（页面加载时就初始化，非延迟加载）
// 这样登录重定向回来时 Waline 能立刻检测到用户
(function initWalineEarly() {
  import('./lib/waline.js').then(function(mod) {
    try {
      walineInstance = mod.init({
        el: '#walineContainer',
        serverURL: 'https://waline.snowhoo.net',
        lang: 'zh-CN',
        avatar: 'mp',
        pageview: false,
        locale: {
          placeholder: '说点什么吧...',
          comment: '留言'
        },
        onLogin: function(user) {
          // 登录态由 Waline 自身管理；游戏数据一律不落本地存储（数据全部以数据库为准）
          try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e) {}
          // 更新头像，然后让 checkLogin 自动检测用户变化并加载数据
          if (window.GAME) {
            GAME.updateAvatar(user);
            commentOverlay.classList.remove('active');
            // 不直接调 loadFromServer，走 checkLogin 统一路径
            // 避免与 init/定时器 双重调用导致 race condition
            GAME.checkLogin();
          }
        },
        onLogout: function() {
          try { localStorage.removeItem('WALINE_USER'); } catch(e) {}
          // 彻底清理 Waline 组件残留（否则栏目页菜单会误判已登录解锁）
          try { localStorage.removeItem('@waline/user'); } catch(e) {}
          try { localStorage.removeItem('waline_user'); } catch(e) {}
          try { sessionStorage.removeItem('WALINE_USER'); } catch(e) {}
          try { sessionStorage.removeItem('@waline/user'); } catch(e) {}
          if (window.GAME) {
            // 不设 lastUser，让 checkLogin 自然检测到 user→null 的变化进入登出分支
            GAME.checkLogin();
          }
        }
      });
      console.log('[GAME] Waline init OK');
    } catch(e) {
      console.error('[GAME] Waline init error:', e);
    }
  }).catch(function(e) {
    console.error('[GAME] Waline import error:', e);
  });
})();

<script>
// 启动进度：等待背景图 + 数据加载完整后进度条走满并淡出
// 触发条件：GAME.loaded=true（成功）或 曾进入 loading 后回 idle（加载失败），且背景图已加载完
// 不再监听 window.load（load 只代表资源就绪，早于 checkLogin/waline 数据加载完成）
(function(){
  var sp = document.getElementById('bootSplash');
  if (!sp) return;
  var finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    setTimeout(function(){
      sp.classList.add('hide');
      setTimeout(function(){ if (sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
    }, 260);
  }
  var sawLoading = false; // 是否曾进入数据加载中（区分"未开始"与"已失败"）
  // 包装 setSyncState 精确捕获 loading 状态（轮询 150ms 采样可能错过瞬时 loading）
  try {
    if (typeof GAME !== 'undefined' && GAME && typeof GAME.setSyncState === 'function') {
      var _origSS = GAME.setSyncState;
      GAME.setSyncState = function(s){ if (s === 'loading') sawLoading = true; return _origSS.apply(this, arguments); };
    }
  } catch(e){}
  var bootT = Date.now(); // 页面加载起始
  function ready(){
    // 背景图（设置了 src）加载完成（成功或失败都算）
    var bg = document.getElementById('bgImage');
    if (bg && bg.getAttribute('src') && !bg.complete) return false;
    // GAME 数据：加载成功 → 完成；正在加载 → 继续等
    if (typeof GAME === 'undefined' || !GAME) return false;
    if (GAME.loaded) return true;
    if (GAME.syncState === 'loading') return false;
    // idle 且未加载：曾进入 loading（加载已失败）或页面已过 2s（checkLogin 500ms 已跑完）→ 放行
    if (sawLoading || Date.now() - bootT > 2000) return true;
    return false;
  }
  var t = setInterval(function(){ if (ready()) { clearInterval(t); finish(); } }, 150);
  // 兜底：GAME 脚本异常等极端情况最多等 10s（长于 waline 8s 超时，正常路径不会被兜底抢先）
  setTimeout(function(){ clearInterval(t); finish(); }, 10000);
})();
</script>
