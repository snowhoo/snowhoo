<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|一九七九年 春天</title>
<link rel="icon" href="./logo.png?v=20260802" type="image/png">
<link rel="apple-touch-icon" href="./logo.png?v=20260802">
<link rel="stylesheet" href="./lib/waline.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}

/* ===== 图片区域：自适应填充剩余空间 ===== */
.image-area{position:relative;flex:1;min-height:0;overflow:hidden;background:#1a1a1a}
.image-area img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s ease}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.image-area .gradient-top{position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.welcome{position:fixed;bottom:150px;left:15px;color:#333;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:none;cursor:pointer;animation:welcomePulse 2.5s ease-in-out infinite;z-index:7;transition:all .35s ease}
.welcome.active{color:#ff8c00;animation:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes welcomePulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}
/* 阴模式：探索/日历文字白色（阳模式黑色为默认；元素已在 body 层，用兄弟选择器） */
.image-area.yin ~ .welcome{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.image-area.yin ~ .welcome.active{color:#ff8c00}
.image-area.yin ~ .almanac{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
/* 发现按钮：底边 = 发现.png 底边 - 30（图片 375×1531，显示宽 50 → 高≈204；按钮底边距视口顶=204-30=174 → bottom=100vh-174）；完全不可见（无文字/边框/背景），点击事件保留，随 png 同步摆动 */
.discover-btn{position:fixed;bottom:calc(100vh - 174px);left:44px;z-index:9;width:38px;height:38px;border-radius:50%;font-size:0;color:transparent;background:transparent;border:none;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none;transform-origin:top center;animation:faxianSwing 5s ease-in-out infinite}
.discover-btn:active{transform:scale(.94);opacity:.7}
.image-area.yin ~ .discover-btn{background:transparent;color:transparent;border:none}

/* 左上角圈字 */
.top-left-badges{position:absolute;top:46px;left:16px;z-index:5;display:flex;gap:14px}
.top-left-badges .badge{color:#fff;font-size:.68rem;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer;transition:all .3s;letter-spacing:1px;border:none;background:none;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.top-left-badges .badge-icon{font-size:1rem;line-height:1;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:3px 5px;margin-bottom:1px}
.top-left-badges .badge.selected{color:#ffd700;font-weight:400;text-shadow:0 0 10px rgba(255,215,0,.4)}
.top-left-badges .badge.selected .badge-icon{border-color:rgba(255,215,0,.5)}
/* 日程徽章：默认隐藏，奔跑人解锁后才显示（唯一入口） */
#planBtn{display:inline-flex}

/* 右上角logo */
.top-right-logo{position:absolute;top:46px;right:16px;z-index:5;width:110px}
.top-right-logo.hidden{opacity:0;pointer-events:none;transform:scale(.8)}
.top-right-logo img{width:100%;height:auto;display:block;border-radius:8px;opacity:.7}
/* LOGO 收起边条：与日期卡片一致（同高、宽5、透明度50、内含<），贴右边缘 */
.logo-mini{position:absolute;right:0;top:46px;z-index:5;display:none;align-items:center;justify-content:center;width:5px;background:#fff;opacity:.5;border-radius:6px 0 0 6px;cursor:pointer;transition:all .35s ease;box-shadow:-2px 0 8px rgba(0,0,0,.15)}
.logo-mini.show{display:flex}
.logo-mini svg{width:8px;height:auto;stroke:#333;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
/* LOGO 锁定状态：不加背景/滤镜，仅右上角锁图标，未解锁时点击走解锁流程 */
.top-right-logo.locked{cursor:not-allowed;filter:saturate(.35) brightness(.85)}
.top-right-logo .lock-overlay{position:absolute;top:-10px;right:-10px;z-index:2;display:none;align-items:center;justify-content:center;width:24px;height:24px;pointer-events:auto;background:transparent;border-radius:0;padding:0;margin:0}
.top-right-logo .lock-overlay svg{width:14px;height:14px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 黄历面板 - 竖版 */
.almanac{position:fixed;bottom:80px;right:16px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:16px;padding:0;color:#333;min-width:90px;text-shadow:none;cursor:pointer;transition:all .35s ease}
.almanac.hidden{opacity:0;pointer-events:none;transform:scale(.8)}
/* 日历折叠边条：收起后贴右侧边缘，同高、宽5、透明度90，内含 < 箭头 */
.almanac-mini{position:fixed;right:0;bottom:80px;z-index:7;display:none;align-items:center;justify-content:center;width:5px;background:#fff;opacity:.5;border-radius:6px 0 0 6px;cursor:pointer;transition:all .35s ease;box-shadow:-2px 0 8px rgba(0,0,0,.15)}
.almanac-mini.show{display:flex}
.almanac-mini:active{transform:scale(.88)}
.almanac-mini svg{width:8px;height:auto;stroke:#333;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.almanac .al-day{font-size:2.5rem;font-weight:600;line-height:1;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.almanac .al-body{display:flex;flex-direction:column;align-items:center;gap:5px}
.almanac .al-month{font-size:.72rem;font-weight:500;letter-spacing:.3px;opacity:.9;line-height:1.2}
.almanac .al-weekday{font-size:.65rem;font-weight:400;opacity:.75;line-height:1.2}
.almanac .al-lunar{font-size:.6rem;opacity:.7;line-height:1.3;margin-top:1px}
.almanac .al-zodiac{margin-top:4px;padding:2px 10px;border-radius:6px;font-size:.55rem;background:rgba(255,255,255,.12);letter-spacing:1px}
/* 日期卡片锁定状态：不加背景/滤镜，仅右上角锁图标，未解锁时点击走解锁流程 */
.almanac.locked{cursor:not-allowed;opacity:.6}
.almanac .lock-overlay{position:absolute;top:-10px;right:-10px;z-index:2;display:none;align-items:center;justify-content:center;width:24px;height:24px;pointer-events:auto;background:transparent;border-radius:0;padding:0;margin:0}
/* 破除封印确认弹层（自定义 confirm，兼容移动端） */
.confirm-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20020;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.confirm-mask.show{display:flex}
.confirm-box{background:linear-gradient(160deg,#2b1e13,#1a120c);border:1px solid rgba(233,69,96,.35);border-radius:14px;padding:22px 26px;text-align:center;max-width:290px;color:#f5e9d0;box-shadow:0 8px 32px rgba(0,0,0,.55)}
.confirm-title{font-size:.95rem;letter-spacing:2px;color:#e94560;margin-bottom:10px;font-weight:600}
.confirm-text{font-size:.8rem;line-height:1.7;color:#e8d9b8;margin-bottom:18px}
.confirm-btns{display:flex;gap:12px;justify-content:center}
.confirm-btn{padding:9px 24px;border-radius:8px;font-size:.78rem;border:none;cursor:pointer;letter-spacing:1px}
.confirm-btn.cancel{background:rgba(255,255,255,.12);color:#e8d9b8}
.confirm-btn.ok{background:linear-gradient(135deg,#e94560,#c72846);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(233,69,96,.35)}
/* 境界突破确认弹层（暗绿色主题变体） */
.confirm-mask.green .confirm-box{background:linear-gradient(160deg,#0e2a1b,#0a1a10);border:1px solid rgba(74,222,128,.4)}
.confirm-mask.green .confirm-title{color:#4ade80}
.confirm-mask.green .confirm-text{color:#cfe8d6}
.confirm-mask.green .confirm-btn.cancel{background:rgba(255,255,255,.1);color:#cfe8d6}
.confirm-mask.green .confirm-btn.ok{background:linear-gradient(135deg,#16a34a,#0f7a35);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(22,163,74,.35)}
.almanac .lock-overlay svg{width:14px;height:14px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 发现列表弹层（点击打坐人形打开）：深蓝渐变卡片 + 蓝色描边 ===== */
.discover-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20010;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.discover-mask.show{display:flex}
.discover-box{background:linear-gradient(160deg,#1f3a5f,#14223c);border:1px solid rgba(59,130,246,.55);border-radius:16px;width:min(92vw,360px);max-height:78vh;display:flex;flex-direction:column;color:#f0f6ff;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden}
.discover-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid rgba(59,130,246,.3);flex-shrink:0}
.discover-title{font-size:.92rem;font-weight:600;letter-spacing:2px;color:#bcd7ff}
.discover-close{background:none;border:none;color:#93b4e8;font-size:1.15rem;cursor:pointer;padding:2px 6px;line-height:1}
.discover-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 16px}
.discover-cat{font-size:.72rem;color:#9db8ff;letter-spacing:3px;margin:12px 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.discover-cat::before,.discover-cat::after{content:'';flex:1;height:1px;background:rgba(59,130,246,.3)}
/* 发现页图标网格 */
.discover-grid{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.disc-item{width:calc(25% - 4.5px);display:flex;flex-direction:column;align-items:center;padding:6px 2px 5px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;transition:all .15s;text-align:center;box-sizing:border-box}
.disc-item:active{transform:scale(.96)}
.disc-item .disc-icon{position:relative;width:64px;height:64px;border-radius:50%;overflow:hidden;margin-bottom:6px;border:1.5px solid rgba(59,130,246,.5);box-shadow:0 1px 5px rgba(0,0,0,.25);flex-shrink:0;background:#fff}
.disc-item .disc-icon img{width:100%;height:100%;object-fit:cover;display:block}
.disc-item .disc-icon .disc-lock{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,24,.62);color:#9db8ff;font-size:.6rem;letter-spacing:1px;font-weight:600}
.disc-item .disc-dname{font-size:.58rem;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3}
.disc-item .disc-dname.locked{color:#8fa6c8;letter-spacing:2px}
.disc-item .disc-act{font-size:.5rem;color:#93b4e8;margin-top:1px;white-space:nowrap;line-height:1.2}
.disc-item.unlocked .disc-icon{border-color:rgba(52,211,153,.55)}
.disc-item.unlocked .disc-act{color:#4ade80}
.disc-item .relock-act{color:#93b4e8}
.disc-item .relock-act:active{opacity:.6}
.discover-foot{padding:10px 16px 14px;border-top:1px solid rgba(59,130,246,.3);font-size:.62rem;color:#8fa6c8;text-align:center;line-height:1.6;flex-shrink:0}
.xz-man{cursor:default;pointer-events:auto}

/* ===== 底部面板：固定高度 ===== */
.bottom-panel{position:relative;height:220px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:#fff url('xzbg.png') center/cover no-repeat;z-index:2}

/* 数据库同步状态指示器 */
.sync-indicator{position:absolute;top:42px;left:50%;transform:translateX(-50%);font-size:.55rem;color:#ff8c00;font-weight:300;letter-spacing:.5px;display:none;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.5);z-index:3;animation:syncPulse 1.2s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 年度进度条（紧贴屏幕底边；文字在其上方，点击打开计划日程） */
.year-bar{position:absolute;bottom:0;left:0;right:0;height:5px;background:#f0f0f0;overflow:visible;opacity:.5}
.year-bar-fill{height:100%;background:linear-gradient(90deg,#e94560,#ff8c00);transition:width .6s ease;border-radius:0 2px 2px 0;position:relative}
.year-bar-text{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#bbb;white-space:nowrap;letter-spacing:.5px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:color .2s}
.year-bar-text:active{opacity:.6}

/* 分类圆形按钮 */
/* 左上角"发现"装饰图：left 40px / top 0 / 宽 50px / 高按比例缩放（不挡点击）；以顶部中间为圆心钟摆式轻微摆动 */
.faxian-float{position:fixed;top:0;left:40px;width:50px;height:auto;z-index:8;pointer-events:none;transform-origin:top center;animation:faxianSwing 5s ease-in-out infinite}
@keyframes faxianSwing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* 栏目按钮：钉在背景图容器上散落分布（image-area 内，阳=上半屏 / 阴=全屏自动跟随） */
.category-list{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:3}
.category-list.hide{display:none}
.category-item{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .25s;user-select:none;-webkit-user-select:none;border:none;background:none;padding:0;min-width:0;pointer-events:auto;opacity:.9}
.category-item:active{transform:scale(.88)}
.category-item .circle{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .25s,box-shadow .25s;background:rgba(255,255,255,.5) url('./ann.png') center/cover no-repeat}
.category-item.active .circle{box-shadow:0 6px 20px rgba(0,0,0,.25)}
.category-item .label{font-size:.6rem;color:#fff;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;opacity:.55}
/* 五个按钮散落位置（避开左上徽章/右上LOGO/左下探索/右下日历） */
#storyBtn{left:12%;top:16%}
#yeduBtn{left:68%;top:18%}
#zjszBtn{left:44%;top:44%}
#newsBtn{left:14%;top:58%}
#tvBtn{left:70%;top:60%}
/* 栏目锁定：参照自动修炼（灰白滤镜 + 右上角红色小锁） */
.category-item .lock-icon{position:absolute;top:0;right:2px;width:12px;height:12px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:none}
.category-item.locked{cursor:not-allowed;filter:saturate(.35) brightness(.85)}
/* 解锁状态：按栏目色 box-shadow 呼吸发光（原发光方式；红/紫/蓝/橙/绿） */
.category-item:not(.locked) .circle{animation:catGlowRed 2.2s ease-in-out infinite}
#yeduBtn:not(.locked) .circle{animation:catGlowPurple 2.2s ease-in-out infinite}
#zjszBtn:not(.locked) .circle{animation:catGlowBlue 2.2s ease-in-out infinite}
#newsBtn:not(.locked) .circle{animation:catGlowOrange 2.2s ease-in-out infinite}
#tvBtn:not(.locked) .circle{animation:catGlowGreen 2.2s ease-in-out infinite}
@keyframes catGlowRed{0%,100%{box-shadow:0 0 8px rgba(233,69,96,.4),0 0 18px rgba(233,69,96,.2)}50%{box-shadow:0 0 16px rgba(233,69,96,.75),0 0 34px rgba(233,69,96,.4)}}
@keyframes catGlowPurple{0%,100%{box-shadow:0 0 8px rgba(118,75,162,.4),0 0 18px rgba(118,75,162,.2)}50%{box-shadow:0 0 16px rgba(118,75,162,.75),0 0 34px rgba(118,75,162,.4)}}
@keyframes catGlowBlue{0%,100%{box-shadow:0 0 8px rgba(59,130,246,.4),0 0 18px rgba(59,130,246,.2)}50%{box-shadow:0 0 16px rgba(59,130,246,.75),0 0 34px rgba(59,130,246,.4)}}
@keyframes catGlowOrange{0%,100%{box-shadow:0 0 8px rgba(255,140,0,.4),0 0 18px rgba(255,140,0,.2)}50%{box-shadow:0 0 16px rgba(255,140,0,.75),0 0 34px rgba(255,140,0,.4)}}
@keyframes catGlowGreen{0%,100%{box-shadow:0 0 8px rgba(34,197,94,.4),0 0 18px rgba(34,197,94,.2)}50%{box-shadow:0 0 16px rgba(34,197,94,.75),0 0 34px rgba(34,197,94,.4)}}
.xz-group{position:absolute;bottom:5px;left:25px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.xz-man{height:45px;width:auto;animation:xzFloat 3s ease-in-out infinite}
.xz-level{font-size:.62rem;color:#000;font-weight:300;letter-spacing:1px;white-space:nowrap}
@keyframes xzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* 评论登录头像 */
/* 评论登录用户区域 */
.comment-user{position:fixed;bottom:10px;right:16px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px}
.comment-user .comment-avatar{width:36px;height:36px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(0,0,0,.15);box-shadow:0 2px 8px rgba(0,0,0,.1);transition:border-color .3s;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.comment-user .comment-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.comment-user .comment-avatar svg{width:20px;height:20px;fill:none;stroke:#888;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.comment-user .comment-name{font-size:.58rem;color:#666;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1}
 
 /* 诗/今/星象 内容展示区 - 磨砂透明（背景只由探索按钮刷新，容器半透明+毛玻璃） */
.content-area{position:absolute;top:calc(50% + 20px);left:15px;right:15px;z-index:5;width:auto;max-width:600px;max-height:calc(100% - 180px);overflow-y:auto;text-align:center;transform:translateY(-50%);transition:opacity .5s ease;opacity:0;visibility:hidden;border-radius:14px;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.content-area.show{opacity:1;visibility:visible}
.image-area.yin .content-area{background:rgba(20,28,48,.32)}
.content-area::-webkit-scrollbar{width:0}
.content-area .content-line{font-size:.88rem;line-height:1.5;color:#fff;font-weight:400;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.content-area .content-title{font-size:1.05rem;font-weight:400;color:#fff;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-bottom:2px}
.content-area .content-author{font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .content-source{font-size:.65rem;color:rgba(255,255,255,.7);margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
.content-area .loading-hint{font-size:.82rem;color:#fff;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.content-area .history-item{font-size:.78rem;line-height:1.6;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-family:"KaiTi","STKaiti","楷体",serif;display:flex}
.content-area .history-item .hyear{flex-shrink:0;width:auto;margin-right:0.6em;color:rgba(255,255,255,.6);font-size:.7rem;font-family:sans-serif}
.content-area .history-item .htext{text-align:left}
/* 探索圆形图片（中央内容区显示，与诗词/今日同位置；直径 260px；外围绿色发光呼吸，低饱和） */
.explore-circle{position:relative;width:260px;height:260px;border-radius:50%;overflow:hidden;margin:10px auto;border:3px solid rgba(255,255,255,.65);box-shadow:0 0 16px rgba(34,197,94,.25),0 0 40px rgba(34,197,94,.15),0 8px 32px rgba(0,0,0,.5);background:#101c30;animation:exploreGlow 2.8s ease-in-out infinite}
@keyframes exploreGlow{
  0%,100%{box-shadow:0 0 12px rgba(34,197,94,.2),0 0 30px rgba(34,197,94,.1),0 8px 32px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 22px rgba(34,197,94,.4),0 0 60px rgba(34,197,94,.25),0 8px 32px rgba(0,0,0,.5)}
}
.explore-circle img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s ease}
.explore-circle .ec-status{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.6);background:rgba(10,15,30,.5);z-index:2}

/* 星象转盘样式（三层同心：内圈 三垣/二十八宿；中圈 三垣三宫+四象；外圈 31 天区） */
.zodiac-wheel{position:relative;width:360px;height:360px;margin:8px auto 0;cursor:pointer;touch-action:none}
.z-ring-lines{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:0}
.z-ring{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:1}
.z-ring .z-item{position:absolute;text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%);cursor:pointer;user-select:none;-webkit-user-select:none;transition:all .35s;line-height:1.3}
.z-ring .z-item .zt{display:block;font-weight:300;transition:all .35s;line-height:1.3}
.z-ring.r1 .z-item{width:80px;font-size:.74rem}
.z-ring.r2 .z-item{width:72px;font-size:.66rem}
.z-ring.r3 .z-item{width:54px;font-size:.74rem}
.z-ring.r3{pointer-events:none}
.z-ring.r3 .z-item{pointer-events:auto}
.z-ring.r1{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:3}
.z-ring.r1 .z-item{pointer-events:auto}
/* 内圈三宫固定层（不随转盘旋转）：角度线 + 12 点圆点 */
.z-ring-lines-inner{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:2}
.z-ring-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-158px);width:10px;height:10px;border-radius:50%;background:#ff8c00;box-shadow:0 0 8px rgba(255,140,0,.9);z-index:4;pointer-events:none}
.z-ring .z-item.sel .zt{color:#ff8c00;font-weight:600}
.zodiac-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:auto;line-height:1.6;display:flex;flex-direction:column;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.zodiac-center .zc-name{font-size:1.02rem;font-weight:700;color:#ff8c00;display:block;letter-spacing:1px}
.zodiac-center .zc-line{font-size:.58rem;color:rgba(255,255,255,.92);display:block;white-space:nowrap;margin-top:3px}
/* 星象全文弹窗（参照发现弹窗风格：深紫渐变卡片） */
.xz-detail-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30001;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.xz-detail-mask.show{opacity:1;visibility:visible}
.xz-detail-panel{background:linear-gradient(160deg,#2c2340,#1a1526);border:1px solid rgba(139,92,246,.5);border-radius:16px;width:min(92vw,360px);max-height:78vh;display:flex;flex-direction:column;color:#f6f2ff;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden;transform:translateY(12px);transition:transform .3s ease}
.xz-detail-mask.show .xz-detail-panel{transform:translateY(0)}
.xz-detail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid rgba(139,92,246,.3);flex-shrink:0}
.xz-detail-title{font-size:.92rem;font-weight:600;letter-spacing:2px;color:#ff8c00}
.xz-detail-close{background:none;border:none;color:#b9aee0;font-size:1.15rem;cursor:pointer;padding:2px 6px;line-height:1}
.xz-detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;font-size:.9rem;line-height:1.8;color:#f6f2ff;text-align:left}
.xz-detail-foot{padding:10px 16px 14px;border-top:1px solid rgba(139,92,246,.3);font-size:.62rem;color:#a49cc4;text-align:center;line-height:1.6;flex-shrink:0}

/* 星象星空背景覆盖层 */
.stars-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('bg-stars.jpg') center/cover no-repeat;opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:1}
.stars-overlay.show{opacity:1}
.poetry-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('poetry-bg.jpg') center/cover no-repeat;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:1}
.poetry-overlay.show{opacity:1}
.poetry-overlay::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}
.history-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('history-bg.jpg') center/cover no-repeat;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:1}
.history-overlay.show{opacity:1}
.history-overlay::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}

/* 评论弹窗 */
.comment-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;display:flex;align-items:flex-end}
.comment-overlay.active{opacity:1;visibility:visible}
.comment-panel{background:#fff;width:100%;max-height:85vh;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s ease-out}
.comment-overlay.active .comment-panel{transform:translateY(0)}
.comment-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid #eee;flex-shrink:0}
.comment-panel-header .cp-title{font-size:.9rem;font-weight:600;color:#333}
.comment-panel-header .cp-close{font-size:1.2rem;color:#999;cursor:pointer;padding:4px;line-height:1;border:none;background:none}
.comment-panel-body{flex:1;overflow-y:auto;padding:8px 16px;min-height:200px;max-height:calc(85vh - 50px);-webkit-overflow-scrolling:touch}

/* 积分系统 */
.points-badge{font-size:.58rem;color:#1a1a1a;white-space:nowrap;letter-spacing:.5px;font-weight:300;line-height:1}

/* 任务红点 */
.task-dot{position:absolute;top:-8px;right:-8px;background:#e94560;color:#fff;font-size:.42rem;min-width:13px;height:13px;border-radius:7px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:300;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}

/* 阴阳（明暗模式）全屏遮罩：阴=背景图拓展全屏 + 30% 黑色遮罩；不拦截点击 */
.yin-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:4000;pointer-events:none;display:none}
.yin-mask.show{display:block}
/* 阴阳按钮锁定态（阴阳镜未解锁）：右上角锁图标 + 灰化 */
.top-left-badges .badge .lock-overlay{position:absolute;top:-4px;right:-22px;z-index:2;display:none;align-items:center;justify-content:center;width:24px;height:24px;pointer-events:auto;background:transparent;border-radius:0;padding:0;margin:0}
.top-left-badges .badge .lock-overlay svg{width:14px;height:14px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-left-badges .badge.locked{color:rgba(255,255,255,.55)}
/* 阴模式：上半部分背景图拓展成全屏（背景不分段，覆盖到底部区域）；底部功能控件固定在底部保留在背景之上 */
.image-area.yin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5}
.image-area.yin ~ .bottom-panel{position:fixed;bottom:0;left:0;right:0;height:220px;background:transparent;z-index:6}
/* 注：探索/日历/收起边条已改 fixed 视口定位（bottom:156px），阴阳模式统一，无需阴模式特调 */
/* 阴模式：诗词/今日/星象内容面板与日程面板保持原视口位置（背景全屏后 50% 基准变化，用视口高度修正） */
.image-area.yin .content-area{top:calc((100vh - 220px)/2 + 20px)}
.image-area.yin .plan-panel{top:calc((100vh - 220px)/2 + 10px)}
/* 阴模式：下半部分文字提亮，提高在暗背景上的可读性 */
.image-area.yin ~ .bottom-panel .label{color:#f2f2f2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.image-area.yin ~ .bottom-panel .category-item.active .label{color:#ffffff}
.image-area.yin ~ .bottom-panel .year-bar-text{color:#f0f0f0}
.image-area.yin ~ .bottom-panel .year-bar-text .runner{stroke:#f0f0f0}
.image-area.yin ~ .bottom-panel .xz-level{color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.image-area.yin ~ .bottom-panel .points-badge{color:#f5f5f5;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.image-area.yin ~ .bottom-panel .xz-man{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.35))}
.image-area.yin ~ .bottom-panel .comment-name{color:#f0f0f0;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.image-area.yin ~ .bottom-panel .comment-avatar{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.image-area.yin ~ .bottom-panel .comment-avatar svg{stroke:#ffffff}

/* 今日修炼任务菜单 */
.task-menu{position:absolute;bottom:45px;z-index:10001;display:flex;flex-direction:column;align-items:center;gap:4px}
/* 自动修炼提示：显示在修炼按钮上方，单独元素不占用按钮（z-index 高于修炼遮罩） */
.auto-hint{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:.58rem;color:#22c55e;background:#fff;border:1px solid rgba(34,197,94,.35);border-radius:10px;padding:3px 10px;white-space:nowrap;display:none;z-index:9997;box-shadow:0 2px 8px rgba(0,0,0,.08);letter-spacing:.3px}
/* 修炼模式全屏透明遮罩：覆盖所有页面功能（含评论弹窗 9999），杜绝任何点击 */
#modeMask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:none;background:transparent}
.task-menu-btn{font-size:.58rem;color:#ff8c00;cursor:pointer;padding:3px 8px;border:1px solid rgba(255,140,0,.3);border-radius:10px;background:rgba(255,255,255,.88);white-space:nowrap;transition:all .3s;font-weight:400;letter-spacing:.3px;line-height:1.4;user-select:none;-webkit-user-select:none;transform:translateY(-10px)}
/* 初始隐藏（!important 防止任何 JS/CSS 提前显示）*/
.task-menu-btn.init-hidden{display:none!important}
.task-menu-btn.error{color:#e94560!important;border-color:rgba(233,69,96,.35)!important}
.task-menu-btn.completed{color:#22c55e;border-color:rgba(34,197,94,.35)}
/* 快捷修炼按钮（第二行：自动 + 一键） */
.task-quick-row{display:flex;gap:5px}
.task-quick-btn{display:none;height:22px;border-radius:11px;padding:0 7px;align-items:center;justify-content:center;font-size:.58rem;font-weight:400;cursor:pointer;transition:all .3s;vertical-align:middle;user-select:none;-webkit-user-select:none;line-height:1;flex-shrink:0;white-space:nowrap;position:relative}
.task-quick-btn.auto{background:#22c55e;color:#fff;border:1px solid #fff}
.task-quick-btn.onekey{background:#3b82f6;color:#fff;border:1px solid #fff}
/* 突破按钮：移到打坐人形丹田处，只显示无背景绿色箭头（文字隐藏，箭头由 ::after 绘制） */
.task-quick-btn.upgrade{position:absolute;left:50%;margin-left:-11px;top:52%;width:22px;height:22px;background:none;border:none;box-shadow:none;padding:0;font-size:0;color:#22c55e;animation:xzUpgradeJump 1s ease-in-out infinite;z-index:2;pointer-events:auto}
.task-quick-btn.upgrade::after{content:'↑';font-size:1.15rem;color:#22c55e;line-height:1;font-weight:700}
/* 最高境界：金色箭头，不再跳动 */
.task-quick-btn.upgrade.max-level{background:none;animation:none}
.task-quick-btn.upgrade.max-level::after{color:#f59e0b}
/* 境界提升按钮跳动动画 */
@keyframes xzUpgradeJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 锁遮罩：未解锁时半透明灰白遮罩 + 锁图标，禁用点击 */
.task-quick-btn .lock-icon{width:10px;height:10px;flex-shrink:0;margin-left:3px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:none}
.task-quick-btn.locked{cursor:not-allowed;filter:saturate(.35) brightness(.85);pointer-events:auto}
.task-menu-dropdown{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:170px;padding:6px 0;display:none;z-index:10002}
.task-menu-dropdown.show{display:block}
/* 菜单底部：自动/一键勾选行（□ 选中形式；未解锁不选中，解锁后默认选中，点击即执行） */
.task-menu-quick{display:flex;gap:8px;justify-content:center;padding:8px 12px 4px;border-top:1px solid #f0f0f0;margin-top:4px}
.tq-item{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;color:#999;cursor:pointer;user-select:none;-webkit-user-select:none;padding:3px 10px;border-radius:9px;background:#f5f5f5;transition:all .2s;line-height:1.3}
.tq-item.on{color:#22c55e;background:rgba(34,197,94,.12)}
.tq-item.busy{opacity:.6;pointer-events:none}
.tq-item:active{transform:scale(.94)}
.task-item{display:flex;align-items:center;padding:7px 12px;font-size:.7rem;color:#333;line-height:1.4;gap:4px;white-space:nowrap}
.task-item .task-dot{display:inline-block;width:5px;height:5px;min-width:0;border-radius:10px;flex-shrink:0;position:static;vertical-align:middle}
.task-item .task-check{color:#22c55e;flex-shrink:0;width:14px;text-align:center;font-size:.65rem;font-weight:700}
.task-item .task-name{flex-shrink:0;margin-right:2px}
.task-item .task-sub{font-size:.6rem;opacity:.55;flex-shrink:0}
.task-item .task-count{margin-left:auto;color:#aaa;font-size:.62rem;flex-shrink:0}
.task-item.completed{color:#22c55e}
.task-item.completed .task-sub{color:#22c55e;opacity:.7}
/* WebView 内保存背景图：全屏预览 + 长按存相册（替代 a[download]，避免 WebView 无下载处理器退出 App） */
.bg-save-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.bg-save-tip{color:#fff;font-size:.85rem;letter-spacing:1px;background:rgba(255,255,255,.16);padding:6px 16px;border-radius:20px;margin-bottom:14px;backdrop-filter:blur(4px)}
.bg-save-img{max-width:94%;max-height:78vh;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);-webkit-user-select:none;user-select:none;-webkit-touch-callout:default}
.bg-save-close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#fff;font-size:.8rem;cursor:pointer;z-index:1}

/* ===== 日程计划：与诗词/今日/星象同位置（中央内容区），互斥切换 ===== */
.plan-panel{position:absolute;top:calc(50% + 10px);left:15px;right:15px;z-index:5;max-width:620px;margin:0 auto;transform:translateY(-50%);max-height:calc(100% - 180px);background:rgba(255,255,255,.8);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.plan-panel.show{opacity:1;visibility:visible}
.plan-panel-body{flex:1;min-height:0;overflow:hidden;padding:10px;display:flex;flex-direction:column}
.plan-topbar{display:flex;align-items:center;gap:5px;padding:0px;flex-shrink:0}
.plan-cal-icon{flex-shrink:0;font-size:1rem;line-height:1;color:#e8793a}
.plan-date-center{position:relative;flex:1;text-align:center;cursor:pointer;padding:0 2px;min-width:92;overflow:hidden}
.plan-date-main{font-size:.7rem;color:#3a2f22;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
/* 透明日期选择器覆盖日期区：点击日期直接弹原生日期选择器 */
.plan-date-picker{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:none;background:transparent;cursor:pointer;z-index:2;color:#3a2f22}
/* 隐藏 time 输入框右侧原生下箭头（点击输入框直接弹时间选择器） */
.plan-add-time::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none;opacity:0}
.plan-add-time::-webkit-inner-spin-button{display:none;-webkit-appearance:none}
.plan-sync-tip{font-size:.62rem;color:#b0a48c;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.plan-add-time{border:none;border-radius:8px;padding:0px;font-size:.7rem;color:#3a2f22;background:#ffffff00;flex-shrink:0;outline:none;max-width:60px}
.plan-add-text{flex:1;min-width:0;border:none;outline:none;font-size:.7rem;color:#3a2f22;background:#ffffff8f;padding:2px 8px;border-radius:14px}
.plan-add-text::placeholder{color:#c2b8a2}
.plan-add-btn{flex-shrink:0;border:none;border-radius:15px;padding:2px 5px;font-size:.7rem;color:#fff;background:#e8793a;cursor:pointer;letter-spacing:1px}
.plan-add-btn:active{opacity:.85}
.plan-list-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;margin-top:10px}
.plan-list-card{flex:1;min-height:0;background:rgba(255,255,255,.5);border-radius:8px;box-shadow:0 1px 6px rgba(60,50,30,.06);overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 列表滚动方向提示箭头：上箭头=上方有未显示，下箭头=下方有未显示（纯提示，不拦截滚动手势） */
.plan-arrow{position:absolute;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;font-size:.55rem;line-height:1;color:#8a7c63;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 9px;box-shadow:0 1px 5px rgba(60,50,30,.15);opacity:0;transition:opacity .25s}
.plan-arrow.show{opacity:1}
.plan-arrow-up{top:-7px}
.plan-arrow-down{bottom:-7px}
.plan-item{display:flex;align-items:center;gap:10px;padding:3px 10px;border-bottom:1px solid #f3efe4}
.plan-item:last-child{border-bottom:none}
.plan-item:active{background:#faf8f2}
.plan-done-btn{width:20px;height:20px;border-radius:50%;border:2px solid #d8cfba;background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0}
.plan-item.done .plan-done-btn{background:#e8793a;border-color:#e8793a}
.plan-done-btn svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.plan-item.done .plan-done-btn svg{opacity:1}
.plan-time{flex-shrink:0;font-size:.62rem;color:#a3957d;background:#f6f4ee;border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
/* 全部日程视图：日期+时间竖排双行容器（节省水平空间） */
.plan-datetime{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:#efe9dc;border-radius:8px;padding:3px 7px;min-width:46px}
.plan-dt-date{font-size:.58rem;color:#8a7a5f;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan-dt-time{font-size:.64rem;color:#a3957d;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan-text{flex:1;min-width:0;font-size:.88rem;color:#3a2f22;word-break:break-all;line-height:1.45}
.plan-item.done .plan-text{color:#c0b6a0;text-decoration:line-through}
.plan-del-btn{flex-shrink:0;width:26px;height:26px;border:none;background:none;color:#d3c9b4;font-size:1.05rem;cursor:pointer;line-height:1;border-radius:50%}
.plan-del-btn:active{color:#e94560;background:#fdf1f1}
.plan-empty{padding:10px 0;text-align:center;color:#c2b8a2;font-size:.8rem;line-height:1.8}
.plan-empty span{font-size:1.5rem;display:block;margin-bottom:8px}
.plan-stat-bar{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 2px;font-size:.62rem;color:#a3957d;flex-shrink:0;min-height:0}
.plan-stat-line{display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%}
.plan-stat-bar .bar{width:120px;height:5px;border-radius:3px;background:#e8e0cf;overflow:hidden;flex-shrink:0}
.plan-stat-bar .bar i{display:block;height:100%;width:0;background:#e8793a;border-radius:3px;transition:width .3s}
.plan-stat-sep{color:#d3c9b4;flex-shrink:0}
/* 首行"全部日程"开关（滑块，title 提示含义） */
.plan-switch{position:relative;display:inline-block;width:34px;height:18px;flex-shrink:0;cursor:pointer}
.plan-switch input{position:absolute;opacity:0;width:0;height:0}
.plan-switch .slider{position:absolute;inset:0;background:#d8cfba;border-radius:9px;transition:background .2s;pointer-events:none}
.plan-switch .slider::before{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.plan-switch input:checked + .slider{background:#e8793a}
.plan-switch input:checked + .slider::before{transform:translateX(16px)}
.plan-switch:active .slider{opacity:.85}
.plan-toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:12000;background:rgba(40,32,20,.88);color:#fff;font-size:.72rem;padding:7px 16px;border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.plan-toast.show{opacity:1}
/* ===== 计划行内编辑（双击条目区域激活） ===== */
.plan-edit-inline{font:inherit;color:#3a2f22;background:#fff;border:1px solid #e8793a;border-radius:6px;padding:1px 5px;min-width:24px;max-width:100%;outline:none;box-sizing:border-box;flex-shrink:0}
.plan-edit-inline::placeholder{color:#c0b6a0}
/* ===== 启动进度遮罩（打开/刷新时显示，仅旋转加载图标） ===== */
.boot-splash{position:fixed;inset:0;z-index:30000;background:radial-gradient(circle at 50% 40%,rgba(60,45,25,.05),rgba(20,15,8,.05));display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;opacity:1}
.boot-splash.hide{opacity:0;pointer-events:none}
.boot-spinner{width:38px;height:38px;border:3px solid rgba(128,128,128,.22);border-top-color:#e8793a;border-radius:50%;animation:bootSpin .8s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
</style>

<!-- 继续播放跳转：点系统媒体卡片/通知进入 App 时，若仍有播放会话（resume_play），
     自动跳回正在播放的栏目页并定位（如新闻对应条目/文章页码）；用户手动打开首页
     时若点击了页面则取消跳转 -->
<script>
(function(){
  try {
    var v = localStorage.getItem('resume_play');
    if (!v) return;
    var r = JSON.parse(v);
    if (!r || !r.page || r.page === 'APP.html') return;
    // 30 分钟内且有播放会话才跳转（防残留误跳）
    if (Date.now() - (r.ts || 0) > 30 * 60 * 1000) return;
    var cancelled = false;
    function onceCancel(){ cancelled = true; }
    document.addEventListener('touchstart', onceCancel, { once: true, passive: true });
    document.addEventListener('click', onceCancel, { once: true });
    setTimeout(function(){
      if (cancelled) return;
      try { location.replace(r.page + '?resume=1'); } catch(e){}
    }, 500);
  } catch(e){}
})();
</script>

<script>
// 年度进度
(function() {
  var now = new Date();
  var yr = now.getFullYear();
  var start = new Date(yr, 0, 1);
  var diff = now - start;
  var day = Math.floor(diff / 86400000) + 1;
  var total = (yr % 400 === 0 || (yr % 4 === 0 && yr % 100 !== 0)) ? 366 : 365;
  var pct = Math.min(day / total, 1);
  document.getElementById('yearFill').style.width = (pct * 100) + '%';
  document.getElementById('yearText').textContent = '把梦想写进日程 [ ' + yr + '已过' + Math.round(pct * 100) + '% ]';
})();

// 背景图：默认 bg.jpg（用户放入 APP 文件夹即生效；缺失时回退随机图，避免空白）
var bgImgEl = document.getElementById('bgImage');
function setDefaultBg() {
  bgImgEl.crossOrigin = '';
  bgImgEl.onload = null;
  bgImgEl.src = './bg.jpg';
  bgImgEl.onerror = function() {
    // bg.jpg 缺失 → 回退随机图（crossOrigin=anonymous 保证可被 canvas 捕获保存）
    bgImgEl.crossOrigin = 'anonymous';
    bgImgEl.onerror = null;
    bgImgEl.src = 'https://picsum.photos/1280/960?random=' + Date.now();
  };
}
setDefaultBg();

// 栏目按钮精确贴背景图：按钮锚点固定在【图片原始内容】的百分比位置，
// 按 cover 裁切偏移换算回容器坐标（随换图/缩放/阴阳切换自动重算）
(function(){
  var area = document.querySelector('.image-area');
  var img  = document.getElementById('bgImage');
  var list = document.getElementById('categoryList');
  if (!area || !img || !list) return;
  // 锚点：相对图片原始尺寸的百分比（x=左起, y=上起），即按钮左上角钉住图片上的点；
  // dx/dy：额外像素偏移（相对容器/屏幕，正值=右移/下移）；yinDx/yinDy：阴模式额外偏移
  var ANCH = {
    storyBtn: {x:12, y:16, dx:85, dy:65, yinDx:20, yinDy:10},
    yeduBtn:  {x:68, y:18, dx:20, dy:170, yinDy:40},
    zjszBtn:  {x:44, y:44, dx:-50, dy:55, yinDx:-15, yinDy:10},
    newsBtn:  {x:14, y:58, dx:130, dy:135, yinDx:30, yinDy:-30},
    tvBtn:    {x:70, y:60, dx:35, dy:25}
  };
  function place() {
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) return;
    var cw = area.clientWidth, ch = area.clientHeight;
    if (!cw || !ch) return;
    // cover 等比缩放：scale 取较大者，多余部分两侧裁切（居中）
    var scale = Math.max(cw / iw, ch / ih);
    var dispW = iw * scale, dispH = ih * scale;
    var offX = (cw - dispW) / 2, offY = (ch - dispH) / 2;
    var isYin = area.classList.contains('yin');
    for (var id in ANCH) {
      var el = document.getElementById(id);
      if (!el) continue;
      var a = ANCH[id];
      // 锚点为按钮中心：宽度随文字自适应，但中心位置恒定不跳
      var cx = offX + (a.x / 100) * iw * scale + (a.dx || 0) + (isYin ? (a.yinDx || 0) : 0);
      var cy = offY + (a.y / 100) * ih * scale + (a.dy || 0) + (isYin ? (a.yinDy || 0) : 0);
      el.style.left = (cx - (el.offsetWidth || 0) / 2) + 'px';
      el.style.top  = (cy - (el.offsetHeight || 0) / 2) + 'px';
    }
  }
  img.addEventListener('load', place);          // 换图（bg.jpg / 探索随机图）完成后
  window.addEventListener('resize', place);     // 窗口尺寸变化
  if (window.ResizeObserver) new ResizeObserver(place).observe(area); // 阴阳切换等容器尺寸变化
  if (window.MutationObserver) new MutationObserver(place).observe(area, {attributes:true, attributeFilter:['class']}); // 阴模式偏移切换
  if (img.complete) place();
  setTimeout(place, 300);                        // 兜底（图片缓存未触发 load）
  window.__placeCats = place;                    // 供文字切换（???/原名）后重新居中定位
})();

// 打开诗词/今日/星象/日程/探索时隐藏五个栏目按钮（MutationObserver 监听面板状态 class 自动切换）
(function(){
  var list = document.getElementById('categoryList');
  if (!list) return;
  function update() {
    var cb = document.getElementById('constellationBtn');
    var open = !!(document.querySelector('.plan-panel.show')
      || document.querySelector('.welcome.active')
      || document.querySelector('.poetry-overlay.show')
      || document.querySelector('.history-overlay.show')
      || (cb && cb.classList.contains('selected')));
    list.classList.toggle('hide', open);
  }
  var ids = ['planPanel', 'poetryOverlay', 'historyOverlay', 'constellationBtn'];
  var obs = window.MutationObserver ? new MutationObserver(update) : null;
  if (obs) {
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if (el) obs.observe(el, {attributes:true, attributeFilter:['class']});
    });
    var wl = document.querySelector('.welcome');
    if (wl) obs.observe(wl, {attributes:true, attributeFilter:['class']});
    update();
  } else {
    // 兜底：MutationObserver 不可用时轮询
    setInterval(update, 500);
  }
})();

// 探索：点击刷新背景图（picsum 随机图），不打开面板、不选中（背景只由探索控制）
document.querySelector('.welcome').addEventListener('click', function() {
  if ((GAME._autoMode || GAME._oneKeyMode) && !GAME._autoPanelOpen) return; // 修炼中屏蔽（自动模式主动打开除外）
  var w = this;
  cancelAllRequests();
  // 关闭当前打开的诗词/今日/星象面板（背景不随之切换）
  closeAllOverlays();
  var area = document.getElementById('contentArea');
  if (area) {
    area.classList.remove('show');
    area._activeBtn = null;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  w.classList.remove('active');   // 取消选中效果
  // 刷新背景图：picsum 随机图（crossOrigin=anonymous 保证可被捕获保存；load 后栏目按钮自动重新定位）
  var bgImgEl = document.getElementById('bgImage');
  if (bgImgEl) {
    bgImgEl.crossOrigin = 'anonymous';
    bgImgEl.onerror = null;
    bgImgEl.src = 'https://picsum.photos/1280/960?random=' + Date.now();

  if (GAME._autoMode) GAME._autoPanelLoaded('explore', true);
});

  // 天干 地支 生肖
  var tg = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var dz = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var sx = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  var lm = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  var ld = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','廿十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

  function sol2lunar(y,m,d) {
    var idx = y - 1900;
    if (idx < 0 || idx >= lInfo.length) return null;
    // 计算到1900年1月31日(农历正月初一)的天数差
    var base = new Date(1900,0,31);
    var offset = Math.floor((new Date(y,m-1,d) - base) / 86400000);
    // 先减掉1900年到y-1年每个整年的天数
    var i, j, yearDays, monthDays, leapMonth, leapDays;
    for (i = 0; i < idx; i++) {
      leapMonth = lInfo[i] & 0xf;
      yearDays = 0;
      for (j = 0; j < 12; j++) {
        yearDays += lInfo[i] >> (4 + j) & 1 ? 30 : 29;
      }
      if (leapMonth > 0) {
        yearDays += lInfo[i] >> 16 & 1 ? 30 : 29;
      }
      offset -= yearDays;
    }
    // 现在offset是目标年在农历中的第几天(从正月初一开始)
    // 遍历目标年y的每个月(含闰月)
    leapMonth = lInfo[idx] & 0xf;
    leapDays = lInfo[idx] >> 16 & 1 ? 30 : 29;
    var total = 12 + (leapMonth > 0 ? 1 : 0);
    yearDays = 0;
    for (i = 0; i < total; i++) {
      if (leapMonth > 0 && i === leapMonth) {
        monthDays = leapDays;
      } else if (leapMonth > 0 && i > leapMonth) {
        monthDays = lInfo[idx] >> (4 + i - 1) & 1 ? 30 : 29;
      } else {
        monthDays = lInfo[idx] >> (4 + i) & 1 ? 30 : 29;
      }
      if (offset < yearDays + monthDays) break;
      yearDays += monthDays;
    }
    if (i >= total) return null;
    var day = offset - yearDays + 1;
    var mon, isLeap = false;
    if (leapMonth > 0 && i === leapMonth) {
      mon = leapMonth; isLeap = true;
    } else if (leapMonth > 0 && i > leapMonth) {
      mon = i;
    } else {
      mon = i + 1;
    }
    return { m: mon, d: day, isLeap: isLeap };
  }

  var lr = sol2lunar(y,m,d);
  if (lr) {
    var ganZhiYear = tg[(y - 4) % 10] + dz[(y - 4) % 12];
    var lunarStr = (lr.isLeap ? '闰' : '') + lm[lr.m - 1] + '月' + ld[lr.d - 1];
    document.getElementById('alLunar').textContent = '农历' + ganZhiYear + '年 ' + lunarStr;
    document.getElementById('alZodiac').textContent = '生肖 ' + sx[(y - 4) % 12];
  }
})();

// 取消所有正在加载的请求，防止异步回调覆盖当前面板内容
function cancelAllRequests() {
  var area = document.getElementById('contentArea');
  if (!area) return;
  var now = Date.now() + '_cancelled';
  area._toggleReqId = now;           // 取消诗词/今日
  area._constellationReqId = now;    // 取消星象
  area._exploreReqId = now;          // 取消探索
}

// 点击"诗"展示每日诗词，"今"展示历史上的今天
function toggleContent(btnId, url, renderFn, onLoaded) {
  cancelAllRequests();
  var btn = document.getElementById(btnId);
  var area = document.getElementById('contentArea');
  var bg = document.getElementById('bgImage');
  if (area._activeBtn === btnId && area.classList.contains('show')) {
    area.classList.remove('show');
    btn.classList.remove('selected');
    area._activeBtn = null;
    closeAllOverlays();
    return;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');
  // 关闭所有背景覆盖层（诗词/星象）
  closeAllOverlays();
  // 终止后台正在加载的星象请求
  if (area._activeBtn === 'constellationBtn') {
    area._constellationReqId = Date.now() + '_cancelled';
  }
  // 恢复默认位置（诗/今内容居中）
  area.style.left = '';
  area.style.width = '';
  area.style.transform = 'translateY(-50%)';
  area.style.textAlign = 'center';
  area.style.overflowY = '';   // 恢复滚动（星象面板会锁定）
  // 生成唯一标记，防止异步回调覆盖
  var _reqId = Date.now() + '_' + Math.random();
  area._toggleReqId = _reqId;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = renderFn(data);
    area.classList.add('show');
    area._activeBtn = btnId;
    // 内容加载完成→记录修炼
    if (onLoaded) onLoaded();
  }).catch(function(){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = '<div class="content-line">暂无内容</div>';
    area.classList.add('show');
    area._activeBtn = btnId;
    // 内容加载失败不记录修炼
  });
}

    function hideDetail(){
      var mask = document.getElementById('xzDetailMask');

    function showDetail(){
      var d = (selKind === 'palace') ? sansi3[selIdx] : stars28[selIdx];
      if (!d) return;
      var dname = (selKind === 'palace') ? (PALACE_RENAME[d.name] || d.name) : d.name;

    function playXZ(name){
      var f = XZ_AUDIO[name] || ('发现_' + name + '.mp3');
      try {
        if (_xzAudio) { _xzAudio.pause(); _xzAudio = null; }

      } catch(e){}

      });

      });
    });
    function snapToNearest() {
      // 吸附到扇区中心（文字位于扇区中间，选中后正对 12 点方向）
      var rawIdx = -currentAngle / step;
      var nearest = ((Math.round(rawIdx - 0.5) % N) + N) % N;
      currentAngle = -(nearest * step + step / 2);
      wheel.style.transition = 'transform .35s ease-out';
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transition = 'transform .35s ease-out';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';

    function getClientXY(e) {
      if (e.type.indexOf('touch') === 0) {
        return {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }
      return {x: e.clientX, y: e.clientY};
    }
    function onStart(e) {
      isDragging = true;
      var c = getClientXY(e);
      startX = c.x;
      startY = c.y;
      startAngle = currentAngle;
      wheel.style.transition = 'none';
      centerEl.style.transition = 'none';
    }
    function onMove(e) {
      if (!isDragging) return;
      var c = getClientXY(e);
      var dx = c.x - startX;
      currentAngle = startAngle + dx * 0.5;
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
    }
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    }
    // 鼠标事件
    wheel.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    // 触摸事件
    wheel.addEventListener('touchstart', onStart, {passive: true});
    document.addEventListener('touchmove', onMove, {passive: true});
    document.addEventListener('touchend', onEnd);
    // 点击选择（外圈二十八宿，旋转到扇区中心）
    zodiacItems.forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.index);
        currentAngle = -(idx * step + step / 2);
        wheel.style.transition = 'transform .35s ease-out';
        wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
        centerEl.style.transition = 'transform .35s ease-out';
        centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
        selectStar(idx);
        playXZ(stars28[idx].name);   // 有对应音频的星宿（东方苍龙七宿）点击播放
      });
    });
  }).catch(function(){

    area._activeBtn = 'constellationBtn';

    });
});

      el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      nameEl.textContent = user.display_name || '';
    } else {
      el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      nameEl.textContent = '隐匿者';
    }
  },

  getWalineUser: function() {
    try {
      // 只信任 Waline 自身的 key，登出时 Waline 会清掉
      var keys = ['WALINE_USER','@waline/user','waline_user'];
      var user = null;
      var foundKey = '';
      for (var i = 0; i < keys.length; i++) {
        try {
          var val = localStorage.getItem(keys[i]);
          if (val) {
            user = JSON.parse(val);
            if (user && (user.display_name || user.nick || user.name)) { foundKey = keys[i]; break; }
          }
        } catch(e) { user = null; }
      }
      if (!user) {
        try {
          var sv = sessionStorage.getItem('WALINE_USER') || sessionStorage.getItem('@waline/user');
          if (sv) { user = JSON.parse(sv); if (!user || !(user.display_name || user.nick || user.name)) user = null; }
        } catch(e) { user = null; }
      }
      if (!user) return null;
      // 标准化
      user.display_name = user.display_name || user.nick || user.name || '';
      user.display_name = user.display_name.trim();
      if (!user.display_name) {
        // 空名称的残留数据 → 清理掉
        if (foundKey) try { localStorage.removeItem(foundKey); } catch(e) {}
        return null;
      }
      user.avatar = user.avatar || user.objectURL || user.avator || '';
      user.email = user.email || user.mail || '';
      return user;
    } catch(e) { return null; }
  },

  loadFromServer: function(optUser) {
    var self = this;
    var user = optUser || this.getWalineUser();
    // 标准化用户字段（无论从 optUser 还是 getWalineUser 来，确保 display_name 存在）
    if (user) {
      user.display_name = user.display_name || user.nick || user.name || '';
      user.avatar = user.avatar || user.objectURL || user.avator || '';
      user.email = user.email || user.mail || '';
    }
    if (!user) {
      this.loaded = true;
      this.setSyncState('idle');
      this.totalPoints = 0;
      this.todayCounts = {};
      this.updateBadge();
      this.updateTaskDots();
      this.updateTaskMenu();
      return Promise.resolve();
    }
    this.setSyncState('loading');
    // 获取 token 用于调试/认证
    var token = user.token || '';
    var p = fetch('https://waline.snowhoo.net/api/comment?path=/app-game/actions' + (token ? '&token='+encodeURIComponent(token) : ''))
    .then(function(r) {
      if (!r.ok) {
        // 读取响应体以便排查错误详情
        return r.text().then(function(body) {
          console.warn('[GAME] 加载 Waline HTTP 异常:', r.status, body.slice(0,300));
          throw new Error('HTTP ' + r.status);
        });
      }
      return r.json();
    })
    .then(function(data) {
      // Waline API 返回 {data: {page, totalPages, count, data: [...]}}
      var records = (data.data && data.data.data) || [];
      self.processRecords(records, user);
      // 数据库中无记录 → 重建初始记录（真气0 + 按等级0次数），写库成功后再回读，
      // 红点等数据全部以数据库为准
      if (self._pendingInitRecord) {
        self._pendingInitRecord = false;
        return self._writeInitRecord(user);
      }
      // 跨天 → 将新一天的次数写入数据库后再回读（数据以数据库为准）
      if (self._pendingDailyReset) {
        self._pendingDailyReset = false;
        return self._writeDailyReset(user);
      }
      console.log('[GAME] 从 Waline 加载真气值成功:', self.totalPoints);
    });
    // 12 秒超时兜底：防止 Waline 响应慢/挂起导致 syncState 永久卡在 loading
    var timer = new Promise(function(resolve, reject) {
      setTimeout(function(){ reject(new Error('读取超时')); }, 12000);
    });
    return Promise.race([p, timer])
    .catch(function(e) {
      console.warn('[GAME] 加载 Waline 失败:', e);
      self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
    })
    .then(function() {
      self.setSyncState('idle');
      self.updateBadge();
      self.updateTaskDots();
      // 错误状态不覆盖按钮文本；按钮正在显示临时提示（+真气）时不覆盖，等 showXp 计时器恢复
      var btn = document.getElementById('taskMenuBtn');
      if (btn && !btn.classList.contains('error') && !btn._msgTimer) {
        self.updateTaskMenu();
      }
    });
  },

  // 数据库中无记录时重建初始记录：真气 0 + 按等级 0 赋予今日次数 + 全部未解锁
  // 写库成功后 _writeState 内部会 loadFromServer 回读，红点/真气等自动更新为数据库数据
  _writeInitRecord: function(user) {
    var self = this;
    var now = new Date();
    var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    var remaining = self.buildRemainingForLevel(0);
    return self._writeState(user, {
      points: 0,
      todayRemaining: remaining,
      nick: user.display_name,
      level: 0,
      date: today,
      autoUnlocked: 0,
      oneKeyUnlocked: 0,
      almanacUnlocked: 0,
      logoUnlocked: 0,
      runnerUnlocked: 0,
      storyUnlocked: 0,
      yeduUnlocked: 0,
      zjszUnlocked: 0,
      newsUnlocked: 0,
      tvUnlocked: 0,
      backgroundUnlocked: 0,
      yinUnlocked: 0
    }, '已初始化修炼记录').then(function(ok) {
      if (!ok) {
        // 重建失败（网络等）→ 保持空状态，不伪造次数
        self.setSyncState('idle');
        self.updateBadge();
        self.updateTaskDots();
      }
      return ok;
    });
  },

  // 跨天重置今日次数：基于数据库当前记录，仅更新 date + todayRemaining（按当前境界满次数），
  // 真气/境界/解锁状态保留数据库原值；写库成功后 _writeState 内部回读，任务列表/红点以数据库为准
  _writeDailyReset: function(user) {
    var self = this;
    var now = new Date();
    var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    return self._fetchCurrentRecord(user).then(function(res) {
      var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : 0;
      var remaining = self.buildRemainingForLevel(baseLevel);
      // 真气/解锁状态一律以数据库当前记录为准（无记录按 0），绝不读内存
      function lv(k){ return (res.data && res.data[k + 'Unlocked']) ? 1 : 0; }
      return self._writeState(user, {
        points: res.data ? res.data.points : 0,
        todayRemaining: remaining,
        nick: user.display_name,
        level: baseLevel,
        date: today,
        autoUnlocked: lv('auto'),
        oneKeyUnlocked: lv('oneKey'),
        almanacUnlocked: lv('almanac'),
        logoUnlocked: lv('logo'),
        runnerUnlocked: lv('runner'),
        storyUnlocked: lv('story'),
        yeduUnlocked: lv('yedu'),
        zjszUnlocked: lv('zjsz'),
        newsUnlocked: lv('news'),
        tvUnlocked: lv('tv'),
        backgroundUnlocked: lv('background'),
        yinUnlocked: lv('yin')
      }, '今日修炼次数已刷新').then(function(ok) {
        if (!ok) {
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          self.updateTaskMenu();
        }
        return ok;
      });
    }).catch(function(e) {
      console.warn('[GAME] 跨天重置写库失败:', e);
      self.setSyncState('idle');
      return false;
    });
  },

  // 从 LEVEL_CONFIG[level] 初始化所有任务的剩余次数（跨天/首次使用/升级后）
  initTodayRemaining: function() {
    this.todayCounts = this.buildRemainingForLevel(this.level);
  },

  // 按指定境界 level 生成全量剩余次数（不修改 this.todayCounts，供升级等场景使用）
  buildRemainingForLevel: function(lv) {
    var out = {};
    if (!window.GAME_CONFIG) return out;
    if (typeof LEVEL_CONFIG === 'undefined' || !LEVEL_CONFIG[lv] || !LEVEL_CONFIG[lv].times) {
      // 配置缺失时按 0 兜底
      for (var k = 0; k < GAME_CONFIG.length; k++) out[GAME_CONFIG[k].key] = 0;
      return out;
    }
    for (var i = 0; i < GAME_CONFIG.length; i++) {
      var key = GAME_CONFIG[i].key;
      var t = LEVEL_CONFIG[lv].times[key];
      out[key] = typeof t === 'number' ? t : 0;
    }
    return out;
  },

  // 健壮解析 Waline 记录内容：兼容纯 JSON / 被 markdown 渲染成 <p> 包裹 / 弯引号 / HTML 实体 等情况
  // 手工在 Waline 管理后台编辑评论时，内容会被重新渲染为 <p>{“points”:...}</p>（直引号变弯引号），
  // 直接 JSON.parse 会失败导致读不到数据，这里先清洗再解析。
  parseGameRecord: function(raw) {
    if (!raw) return null;
    var s = String(raw);
    // 1. 去掉 HTML 标签
    s = s.replace(/<[^>]*>/g, '');
    // 2. Unicode 弯引号 → 直引号
    s = s.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
    // 3. HTML 实体解码
    s = s.replace(/&quot;/g, '"').replace(/&#34;/g, '"')
         .replace(/&amp;/g, '&').replace(/&#38;/g, '&')
         .replace(/&lt;/g, '<').replace(/&#60;/g, '<')
         .replace(/&gt;/g, '>').replace(/&#62;/g, '>');
    // 4. 截取第一个 { 到最后一个 }（剔除渲染残留的前后缀）
    var start = s.indexOf('{');
    var end = s.lastIndexOf('}');
    if (start >= 0 && end > start) s = s.slice(start, end + 1);
    try {
      return JSON.parse(s);
    } catch(e) { return null; }
  },

  processRecords: function(records, user) {
    var now = new Date();
    var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    var userNick = user.display_name || '';
    var foundId = 0;
    var foundData = null;
    for (var i = 0; i < records.length; i++) {
      try {
        var r = records[i];
        if ((r.nick || '') !== userNick) continue;
        var raw = r.orig || r.comment || '';
        var data = this.parseGameRecord(raw);
        // 识别新格式：todayRemaining（剩余次数）
        if (data && typeof data.points === 'number' && data.todayRemaining) {
          var id = parseInt(r.objectId, 10) || 0;
          if (id > foundId) { foundId = id; foundData = data; }
        }
      } catch(e) {}
    }
    if (foundData) {
      if (this._loadTimeout) { clearTimeout(this._loadTimeout); this._loadTimeout = null; }
      this.totalPoints = foundData.points;
      this._gameObjectId = foundId;
      this._noDbData = false;
      this.level = typeof foundData.level === 'number' ? foundData.level : 0;
      this.autoUnlocked = foundData.autoUnlocked ? 1 : 0;
      this.oneKeyUnlocked = foundData.oneKeyUnlocked ? 1 : 0;
      this.almanacUnlocked = foundData.almanacUnlocked ? 1 : 0;
      this.logoUnlocked = foundData.logoUnlocked ? 1 : 0;
      this.runnerUnlocked = foundData.runnerUnlocked ? 1 : 0;
      this.storyUnlocked = foundData.storyUnlocked ? 1 : 0;
      this.yeduUnlocked = foundData.yeduUnlocked ? 1 : 0;
      this.zjszUnlocked = foundData.zjszUnlocked ? 1 : 0;
      this.newsUnlocked = foundData.newsUnlocked ? 1 : 0;
      this.tvUnlocked = foundData.tvUnlocked ? 1 : 0;
      this.backgroundUnlocked = foundData.backgroundUnlocked ? 1 : 0;
      this.yinUnlocked = foundData.yinUnlocked ? 1 : 0;
      if (foundData.date === today) {
        // 当天 → 直接用数据库里的剩余次数
        this.todayCounts = foundData.todayRemaining || {};
        this._pendingDailyReset = false;
      } else {
        // 跨天 → 按当前境界重置今日次数，并标记写库（数据以数据库为准，写库回读后显示）
        this.initTodayRemaining();
        this._pendingDailyReset = true;
      }
    } else {
      // 数据库中无该用户记录：新用户或老用户后台数据被删除（用户已登录）
      // 不在此处生成内存假次数——红点等所有数据必须以数据库为准。
      // 置 _pendingInitRecord 标记，由 loadFromServer 触发"重建初始记录"（写库 → 回读），
      // 红点显示从数据库读回的初始次数。
      this.totalPoints = 0;
      this._gameObjectId = 0;
      this.level = 0;              // 从头开始：境界重置为凡人
      this._noDbData = false;      // 已有初始数据，不再视为"无数据"
      this.todayCounts = {};       // 等重建记录写库回读后再填充（来自数据库）
      this._pendingInitRecord = true;
      this.autoUnlocked = 0;
      this.oneKeyUnlocked = 0;
      this.almanacUnlocked = 0;
      this.logoUnlocked = 0;
      this.runnerUnlocked = 0;
      this.storyUnlocked = 0;
      this.yeduUnlocked = 0;
      this.zjszUnlocked = 0;
      this.newsUnlocked = 0;
      this.tvUnlocked = 0;
      this.backgroundUnlocked = 0;
      this.yinUnlocked = 0;
    }
    this.loaded = true;
    this.clearTaskMenuError();
    // 数据读取成功后更新快捷按钮锁状态 + 日期卡片锁状态 + LOGO锁状态 + 栏目锁状态 + 奔跑者锁状态
    this._updateQuickBtns(true);
    this._updateAlmanacLock();
    this._updateLogoLock();
    this._updateYinLock();
    this._updateCategoryLocks();
    this._updateRunnerLock();
    var gain = this._beforePoints !== undefined ? this.totalPoints - this._beforePoints : 0;
    // 一键修炼期间不逐次显示 +真气（完成提示统一在 autoHint）；自动修炼与手动一致显示实际增益
    if (gain > 0 && !this._oneKeyMode) {
      this.showXp('+' + gain + ' 真气', '');
    }
    this._beforePoints = undefined;
    // 解锁成功读回确认后显示"封印已破"提示（与修炼 +真气 同一展示位）
    if (this._pendingUnlockMsg) {
      this.showXp(this._pendingUnlockMsg, '');
      this._pendingUnlockMsg = undefined;
    }
    // 回收重修读回确认后显示提示（重新上锁 + 返还真气）
    if (this._pendingRelockMsg) {
      this.showXp(this._pendingRelockMsg, '');
      this._pendingRelockMsg = undefined;
    }
    // 升级成功读回确认后显示【境界突破】提示
    if (this._pendingUpgradeMsg) {
      this.showXp('-' + this._pendingUpgradeMsg.cost + ' 真气', '【' + this._pendingUpgradeMsg.name + '】突破，体力恢复！');
      this._pendingUpgradeMsg = undefined;
    }
    this.updateLevelDisplay();
  },

  doAction: function(key) {
    var act = this.actions[key];
    if (!act) return Promise.resolve(false);
    // 自动/一键修炼期间屏蔽手动修炼
    if (this._autoMode || this._oneKeyMode) return Promise.resolve(false);
    var user = this.getWalineUser();
    // 重置快照（避免上次失败的残留）
    this._beforePoints = undefined;
    // 数据未就绪（加载失败导致的心魔困扰）永久阻塞，按钮显示错误提示
    if (user && !this.loaded) {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return Promise.resolve(false);
    }
    // 加载中或保存中，浮动提示操作被阻塞
    if (this.syncState !== 'idle') {
      var msg = this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..';
      this.showXp('', msg);
      return Promise.resolve(false);
    }
    if (!user) {
      this.showXp('+0 真气','请登录赚取修炼真气');
      return Promise.resolve(false);
    }
    // ① 点击任务 → 直接进入读库链路（performCultivate 内：读库 → 判断剩余/经验(数据库为准) → 写库 → 回读）
    // 剩余次数、经验值、真气快照全部以数据库为准，不再读任何内存缓存
    return this.syncToWaline(key, undefined, user);
  },

  updateBadge: function() {
    var user = this.getWalineUser();
    var el = document.getElementById('pointsBadge');
    if (!el) return;
    if (this.loaded && user && !this._noDbData) {
      // 下一境界所需真气（LEVEL_CONFIG 越界 = 已达最高境界）
      var nextCost = (typeof LEVEL_CONFIG !== 'undefined' && LEVEL_CONFIG[this.level + 1])
        ? LEVEL_CONFIG[this.level + 1].cost : null;
      if (nextCost !== null) {
        // 显示：总真气/下一境界所需
        el.textContent = '✦ ' + this.totalPoints + '/' + nextCost;
        // 达到或超过 → 绿色；未达到 → 红色
        el.style.color = this.totalPoints >= nextCost ? '#22c55e' : '#e94560';
      } else {
        // 已达最高境界：只显示总真气
        el.textContent = '✦ ' + this.totalPoints;
        el.style.color = '#22c55e';
      }
    } else {
      el.textContent = '✦ ..';
      el.style.color = '';
    }
  },

  updateTaskDots: function() {
    if (!window.GAME_CONFIG) return;
    var user = this.getWalineUser();
    for (var i = 0; i < GAME_CONFIG.length; i++) {
      var key = GAME_CONFIG[i].key;
      var el = document.getElementById(key + 'Dot');
      if (!el) continue;
      // 仅未登录（或数据尚未加载完成）→ 显示".."；已登录 → 显示剩余次数
      if (!user || !this.loaded) {
        el.textContent = '..';
        el.style.display = 'flex';
        continue;
      }
      var remaining = this.todayCounts[key] || 0;
      if (remaining > 0) {
        el.textContent = remaining;
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }
  },

  updateTaskMenu: function() {
    var btn = document.getElementById('taskMenuBtn');
    var dropdown = document.getElementById('taskMenuDropdown');
    if (!btn || !dropdown) return;
    if (!window.GAME_CONFIG) return;
    // 错误/未登录状态下不覆盖按钮文本（由 showTaskMenuError/updateTaskMenuBtn 控制）
    if (btn.classList.contains('error')) return;
    var allDone = true;
    var html = '';
    for (var i = 0; i < GAME_CONFIG.length; i++) {
      var key = GAME_CONFIG[i].key;
      var act = this.actions[key];
      if (!act) continue;
      // max 由 LEVEL_CONFIG[level] 决定（level 来自数据库）
      var max = this.getActionMax(key);
      // 剩余次数直接读数据库（todayCounts 仅由 processRecords 从数据库解析）
      var remaining = this.todayCounts[key] || 0;
      var done = remaining <= 0;
      if (!done) allDone = false;
      var pts = this.getActionPoints(key);
      html += '<div class="task-item' + (done ? ' completed' : '') + '">'
        + (done ? '<span class="task-check">✓</span>'
                : '<span class="task-dot" style="background:'+GAME_CONFIG[i].color+'"></span>')
        + '<span class="task-name">' + act.taskName + '</span>'
        + '<span class="task-sub">' + act.name + ' +' + pts + '真气</span>'
        + '<span class="task-count">' + (max - remaining) + '/' + max + '</span>'
        + '</div>';
    }
    dropdown.innerHTML = html
      // 底部：自动/一键勾选行（未解锁 ☐、解锁后 ☑；解锁点击即执行对应修炼；修炼中显示进行中）
      + '<div class="task-menu-quick">'
      + '<span class="tq-item' + (this.autoUnlocked ? ' on' : '') + (this._autoMode ? ' busy' : '') + '" id="tqAuto">' + (this.autoUnlocked ? '☑' : '☐') + ' 自动' + (this._autoMode ? '（修炼中）' : '') + '</span>'
      + '<span class="tq-item' + (this.oneKeyUnlocked ? ' on' : '') + (this._oneKeyMode ? ' busy' : '') + '" id="tqOneKey">' + (this.oneKeyUnlocked ? '☑' : '☐') + ' 一键' + (this._oneKeyMode ? '（修炼中）' : '') + '</span>'
      + '</div>';
    btn.textContent = allDone ? '今日修炼已毕' : '今日修炼任务';
    btn.classList.toggle('completed', allDone);
  },

  // 提示信息：显示在任务菜单按钮位置（原浮动提示已取消）
  // 临时显示 main/sub，2.2 秒后自动恢复按钮原文本
  showXp: function(main, sub) {
    var btn = document.getElementById('taskMenuBtn');
    if (!btn) return;
    if (btn._msgTimer) clearTimeout(btn._msgTimer);
    // 保存当前按钮文本，用于提示结束后恢复
    if (btn._preMsg === undefined) btn._preMsg = btn.textContent;
    btn.textContent = main ? (sub ? main + ' ' + sub : main) : sub;
    btn.classList.remove('init-hidden');
    var self = this;
    btn._msgTimer = setTimeout(function() {
      if (btn._preMsg !== undefined) {
        // error 状态（心魔/请勿隐匿身份）恢复原错误文本
        if (btn.classList.contains('error')) {
          btn.textContent = btn._preMsg;
        } else if (GAME.syncState !== 'idle') {
          // 仍在加载/保存中 → 恢复状态文本（真气恢复中/真气融合中）
          btn.textContent = GAME.syncState === 'loading' ? '⚡ 真气恢复中..' : '⟳ 真气融合中..';

    //   达到下一境界所需 → 绿色跳动"境界提升↑"
    //   未达到 → 隐藏
    //   已达最高境界 → 金色静态"已达最高境界"
    if (upgradeBtn) {

        upgradeBtn.classList.add('max-level');

  // 显示确认弹层（自定义，兼容移动端禁 confirm 环境），返回 Promise<boolean>
  // opts.title / opts.text / opts.okText：自定义文案（默认"⚡ 破除封印 / 破除封印会损耗 X 真气，继续？ / 破除"）
  _showUnlockConfirm: function(cost, opts) {
    return new Promise(function(resolve) {
      var mask = document.getElementById('unlockConfirm');
      var titleEl = document.getElementById('unlockConfirmTitle');
      var textEl = document.getElementById('unlockConfirmText');
      var okBtn = document.getElementById('unlockConfirmOk');
      var cancelBtn = document.getElementById('unlockConfirmCancel');
      var qTitle = (opts && opts.title) || '⚡ 破除封印';
      var qText = (opts && opts.text) || ('破除封印会损耗 ' + cost + ' 真气，继续？');
      var qOk = (opts && opts.okText) || '破除';
      // 弹层元素缺失时兜底用原生 confirm
      if (!mask || !textEl || !okBtn || !cancelBtn) {
        resolve(window.confirm(qText));
        return;
      }
      if (titleEl) titleEl.textContent = qTitle;
      textEl.textContent = qText;
      okBtn.textContent = qOk;
      mask.classList.add('show');
      var done = false;
      function finish(ok) {
        if (done) return;
        done = true;
        mask.classList.remove('show');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(ok);
      }
      function onOk() { finish(true); }
      function onCancel() { finish(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  },

  // 解锁流程弹窗：询问 → 确认后窗口不关闭，读库/写库进度与结果直接在窗口内显示
  // opts.onConfirm(setStatus)：用户点"破除"后调用；setStatus(title, text) 更新窗口内容
  // opts.title / opts.text / opts.okText：自定义询问态文案（默认"⚡ 破除封印 / 破除封印会损耗 X 真气，继续？ / 破除"）
  _showUnlockFlow: function(cost, opts) {
    return new Promise(function(resolve) {
      var mask = document.getElementById('unlockConfirm');
      var title = document.getElementById('unlockConfirmTitle');
      var text = document.getElementById('unlockConfirmText');
      var okBtn = document.getElementById('unlockConfirmOk');
      var cancelBtn = document.getElementById('unlockConfirmCancel');
      var qTitle = (opts && opts.title) || '⚡ 破除封印';
      var qText = (opts && opts.text) || ('破除封印会损耗 ' + cost + ' 真气，继续？');
      var qOk = (opts && opts.okText) || '破除';
      // 弹层元素缺失时兜底用原生 confirm
      if (!mask || !title || !text || !okBtn || !cancelBtn) {
        if (opts && opts.onConfirm) {
          if (window.confirm(qText)) opts.onConfirm(function(){});
        }
        resolve(true);
        return;
      }
      // 询问态
      title.textContent = qTitle;
      text.textContent = qText;
      okBtn.textContent = qOk;
      cancelBtn.style.display = '';
      mask.classList.add('show');
      var settled = false;
      function finish(v) {
        if (settled) return;
        settled = true;
        mask.classList.remove('show');
        cancelBtn.style.display = '';
        okBtn.textContent = '破除';
        okBtn.removeEventListener('click', onOk);
        okBtn.removeEventListener('click', onClose);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(v);
      }
      function onOk() {
        // 确认 → 窗口不关闭，转为流程态：隐藏"再想想"，按钮变"知道了"
        okBtn.removeEventListener('click', onOk);
        cancelBtn.style.display = 'none';
        okBtn.textContent = '知道了';
        okBtn.addEventListener('click', onClose);
        if (opts && opts.onConfirm) {
          opts.onConfirm(function(t, x) {
            if (settled) return;
            if (t !== undefined) title.textContent = t;
            if (x !== undefined) text.textContent = x;
          });
        }
      }
      function onClose() { finish(true); }
      function onCancel() { finish(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  },
