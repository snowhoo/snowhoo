<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|一九七九年 春天</title>
<link rel="icon" href="./logo.png?v=20260802" type="image/png">
<link rel="apple-touch-icon" href="./logo.png?v=20260802">
<link rel="stylesheet" href="./lib/waline.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}

/* ===== 图片区域：自适应填充剩余空间 ===== */
.image-area{position:relative;flex:1;min-height:0;overflow:hidden;background:#1a1a1a}
.image-area img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s ease}
/* 磨砂半透明：仅面板（诗词/今日/星象/日程）打开时生效（只作用于背景图，不影响 logo 等） */
.image-area.frost #bgImage{filter:blur(6px) saturate(1.05);opacity:.9}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.image-area .gradient-top{position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.welcome{position:fixed;bottom:125px;left:15px;color:#333;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:none;cursor:pointer;animation:welcomePulse 2.5s ease-in-out infinite;z-index:7;transition:all .35s ease}
.welcome.active{color:#ff8c00;animation:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes welcomePulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}
/* 阴模式：探索/日历文字白色（阳模式黑色为默认；元素已在 body 层，用兄弟选择器） */
.image-area.yin ~ .welcome{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.image-area.yin ~ .welcome.active{color:#ff8c00}
.image-area.yin ~ .almanac{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}

/* 左上角圈字 */
.top-left-badges{position:absolute;top:46px;left:16px;z-index:5;display:flex;gap:14px}
.top-left-badges .badge{color:#fff;font-size:.68rem;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer;transition:all .3s;letter-spacing:1px;border:none;background:none;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.top-left-badges .badge-icon{font-size:1rem;line-height:1;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:3px 5px;margin-bottom:1px}
.top-left-badges .badge.selected{color:#ffd700;font-weight:400;text-shadow:0 0 10px rgba(255,215,0,.4)}
.top-left-badges .badge.selected .badge-icon{border-color:rgba(255,215,0,.5)}
/* 日程徽章：默认隐藏，奔跑人解锁后才显示（唯一入口） */
#planBtn{display:inline-flex}

/* 右上角logo */
.top-right-logo{position:absolute;top:46px;right:16px;z-index:5;width:110px}
.top-right-logo.hidden{opacity:0;pointer-events:none;transform:scale(.8)}
.top-right-logo img{width:100%;height:auto;display:block;border-radius:8px;opacity:.7}
/* LOGO 收起边条：与日期卡片一致（同高、宽5、透明度50、内含<），贴右边缘 */
.logo-mini{position:absolute;right:0;top:46px;z-index:5;display:none;align-items:center;justify-content:center;width:5px;background:#fff;opacity:.5;border-radius:6px 0 0 6px;cursor:pointer;transition:all .35s ease;box-shadow:-2px 0 8px rgba(0,0,0,.15)}
.logo-mini.show{display:flex}
.logo-mini svg{width:8px;height:auto;stroke:#333;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

/* 黄历面板 - 竖版 */
.almanac{position:fixed;bottom:55px;right:16px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:16px;padding:0;color:#333;min-width:90px;text-shadow:none;cursor:pointer;transition:all .35s ease}
.almanac.hidden{opacity:0;pointer-events:none;transform:scale(.8)}
/* 日历折叠边条：收起后贴右侧边缘，同高、宽5、透明度90，内含 < 箭头 */
.almanac-mini{position:fixed;right:0;bottom:80px;z-index:7;display:none;align-items:center;justify-content:center;width:5px;background:#fff;opacity:.5;border-radius:6px 0 0 6px;cursor:pointer;transition:all .35s ease;box-shadow:-2px 0 8px rgba(0,0,0,.15)}
.almanac-mini.show{display:flex}
.almanac-mini:active{transform:scale(.88)}
.almanac-mini svg{width:8px;height:auto;stroke:#333;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.almanac .al-day{font-size:2.5rem;font-weight:600;line-height:1;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.almanac .al-body{display:flex;flex-direction:column;align-items:center;gap:5px}
.almanac .al-month{font-size:.72rem;font-weight:500;letter-spacing:.3px;opacity:.9;line-height:1.2}
.almanac .al-weekday{font-size:.65rem;font-weight:400;opacity:.75;line-height:1.2}
.almanac .al-lunar{font-size:.6rem;opacity:.7;line-height:1.3;margin-top:1px}
.almanac .al-zodiac{margin-top:4px;padding:2px 10px;border-radius:6px;font-size:.55rem;background:rgba(255,255,255,.12);letter-spacing:1px}

/* ===== 底部面板：固定高度 ===== */
.bottom-panel{position:relative;height:220px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:#fff url('xzbg.png') center/cover no-repeat;z-index:2}

/* 数据库同步状态指示器 */
.sync-indicator{position:absolute;top:42px;left:50%;transform:translateX(-50%);font-size:.55rem;color:#ff8c00;font-weight:300;letter-spacing:.5px;display:none;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.5);z-index:3;animation:syncPulse 1.2s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 年度进度条（紧贴屏幕底边；文字在其上方，点击打开计划日程） */
.year-bar{position:absolute;bottom:0;left:0;right:0;height:5px;background:#f0f0f0;overflow:visible;opacity:.5}
.year-bar-fill{height:100%;background:linear-gradient(90deg,#e94560,#ff8c00);transition:width .6s ease;border-radius:0 2px 2px 0;position:relative}
.year-bar-text{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#bbb;white-space:nowrap;letter-spacing:.5px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:color .2s}
.year-bar-text:active{opacity:.6}

/* 分类圆形按钮 */
/* 栏目按钮：顶部定位（下移 160：100vh-798+160），一排 4 个，换行与上行同列对齐，行间距 30px */
.category-list{position:absolute;left:0;right:0;top:calc(100vh - 638px);display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;padding:10px 6px;pointer-events:none;z-index:5;row-gap:30px}
.category-list.hide{display:none}
.category-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .25s;user-select:none;-webkit-user-select:none;border:none;background:none;padding:0;min-width:0;pointer-events:auto;opacity:.95;flex:0 0 25%}
.category-item:active{transform:scale(.88)}
.category-item .circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .25s,box-shadow .25s;background:var(--cat-color);color:#fff;font-size:1.1rem;font-weight:600;border:1.5px solid rgba(255,255,255,.45);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.category-item.active .circle{box-shadow:0 6px 20px rgba(0,0,0,.28)}
.category-item .label{font-size:.62rem;color:#fff;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.7);white-space:nowrap;opacity:.88}
/* 栏目锁定：参照自动修炼（灰白滤镜 + 右上角红色小锁） */
.category-item .lock-icon{position:absolute;top:0;right:2px;width:12px;height:12px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:none}
.category-item.locked{cursor:not-allowed;filter:saturate(.35) brightness(.85)}
/* 栏目图标：不再发光 */

/* 评论登录头像 */
/* 评论登录用户区域 */
.comment-user{position:fixed;bottom:57px;left:15px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px}
.comment-user .comment-avatar{width:36px;height:36px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(0,0,0,.15);box-shadow:0 2px 8px rgba(0,0,0,.1);transition:border-color .3s;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.comment-user .comment-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.comment-user .comment-avatar svg{width:20px;height:20px;fill:none;stroke:#888;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.comment-user .comment-name{font-size:.58rem;color:#666;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1}
 
 /* 诗/今/星象 内容展示区 - 磨砂透明（背景只由探索按钮刷新，容器半透明+毛玻璃） */
.content-area{position:absolute;top:calc(50% + 20px);left:15px;right:15px;z-index:5;width:auto;max-width:600px;max-height:calc(100% - 180px);overflow-y:auto;text-align:center;transform:translateY(-50%);transition:opacity .5s ease;opacity:0;visibility:hidden}
.content-area.show{opacity:1;visibility:visible}
.content-area::-webkit-scrollbar{width:0}
.content-area .content-line{font-size:.88rem;line-height:1.5;color:#fff;font-weight:400;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.content-area .content-title{font-size:1.05rem;font-weight:400;color:#fff;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-bottom:2px}
.content-area .content-author{font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .content-source{font-size:.65rem;color:rgba(255,255,255,.7);margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
.content-area .loading-hint{font-size:.82rem;color:#fff;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.content-area .history-item{font-size:.78rem;line-height:1.6;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-family:"KaiTi","STKaiti","楷体",serif;display:flex}
.content-area .history-item .hyear{flex-shrink:0;width:auto;margin-right:0.6em;color:rgba(255,255,255,.6);font-size:.7rem;font-family:sans-serif}
.content-area .history-item .htext{text-align:left}

/* 星象转盘样式（三层同心：内圈 三垣/二十八宿；中圈 三垣三宫+四象；外圈 31 天区） */
.zodiac-wheel{position:relative;width:360px;height:360px;margin:8px auto 0;cursor:pointer;touch-action:none}
.z-ring-lines{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:0}
.z-ring{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:1}
.z-ring .z-item{position:absolute;text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%);cursor:pointer;user-select:none;-webkit-user-select:none;transition:all .35s;line-height:1.3}
.z-ring .z-item .zt{display:block;font-weight:300;transition:all .35s;line-height:1.3}
.z-ring.r1 .z-item{width:80px;font-size:.74rem}
.z-ring.r2 .z-item{width:72px;font-size:.66rem}
.z-ring.r3 .z-item{width:54px;font-size:.74rem}
.z-ring.r3{pointer-events:none}
.z-ring.r3 .z-item{pointer-events:auto}
.z-ring.r1{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:3}
.z-ring.r1 .z-item{pointer-events:auto}
/* 内圈三宫固定层（不随转盘旋转）：角度线 + 12 点圆点 */
.z-ring-lines-inner{position:absolute;top:0;left:0;width:360px;height:360px;pointer-events:none;z-index:2}
.z-ring-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-158px);width:10px;height:10px;border-radius:50%;background:#ff8c00;box-shadow:0 0 8px rgba(255,140,0,.9);z-index:4;pointer-events:none}
.z-ring .z-item.sel .zt{color:#ff8c00;font-weight:600}
.zodiac-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:auto;line-height:1.6;display:flex;flex-direction:column;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.zodiac-center .zc-name{font-size:1.02rem;font-weight:700;color:#ff8c00;display:block;letter-spacing:1px}
.zodiac-center .zc-line{font-size:.58rem;color:rgba(255,255,255,.92);display:block;white-space:nowrap;margin-top:3px}
/* 星象全文弹窗（参照发现弹窗风格：深紫渐变卡片） */
.xz-detail-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30001;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.xz-detail-mask.show{opacity:1;visibility:visible}
.xz-detail-panel{background:linear-gradient(160deg,#2c2340,#1a1526);border:1px solid rgba(139,92,246,.5);border-radius:16px;width:min(92vw,360px);max-height:78vh;display:flex;flex-direction:column;color:#f6f2ff;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden;transform:translateY(12px);transition:transform .3s ease}
.xz-detail-mask.show .xz-detail-panel{transform:translateY(0)}
.xz-detail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid rgba(139,92,246,.3);flex-shrink:0}
.xz-detail-title{font-size:.92rem;font-weight:600;letter-spacing:2px;color:#ff8c00}
.xz-detail-close{background:none;border:none;color:#b9aee0;font-size:1.15rem;cursor:pointer;padding:2px 6px;line-height:1}
.xz-detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;font-size:.9rem;line-height:1.8;color:#f6f2ff;text-align:left}
.xz-detail-foot{padding:10px 16px 14px;border-top:1px solid rgba(139,92,246,.3);font-size:.62rem;color:#a49cc4;text-align:center;line-height:1.6;flex-shrink:0}

/* 星象星空背景覆盖层 */
.stars-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('bg-stars.jpg') center/cover no-repeat;opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:1}
.stars-overlay.show{opacity:1}
.poetry-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('poetry-bg.jpg') center/cover no-repeat;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:1}
.poetry-overlay.show{opacity:1}
.poetry-overlay::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}
.history-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('history-bg.jpg') center/cover no-repeat;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:1}
.history-overlay.show{opacity:1}
.history-overlay::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}

/* 评论弹窗 */
.comment-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;display:flex;align-items:flex-end}
.comment-overlay.active{opacity:1;visibility:visible}
.comment-panel{background:#fff;width:100%;max-height:85vh;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s ease-out}
.comment-overlay.active .comment-panel{transform:translateY(0)}
.comment-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid #eee;flex-shrink:0}
.comment-panel-header .cp-title{font-size:.9rem;font-weight:600;color:#333}
.comment-panel-header .cp-close{font-size:1.2rem;color:#999;cursor:pointer;padding:4px;line-height:1;border:none;background:none}
.comment-panel-body{flex:1;overflow-y:auto;padding:8px 16px;min-height:200px;max-height:calc(85vh - 50px);-webkit-overflow-scrolling:touch}

/* 任务红点 */
.task-dot{position:absolute;top:-8px;right:-8px;background:#e94560;color:#fff;font-size:.42rem;min-width:13px;height:13px;border-radius:7px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:300;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}

/* 阴阳（明暗模式）全屏遮罩：阴=背景图拓展全屏 + 30% 黑色遮罩；不拦截点击 */
.yin-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:4000;pointer-events:none;display:block}
.yin-mask.show{display:block}
/* 阴阳按钮锁定态（阴阳镜未解锁）：右上角锁图标 + 灰化 */
.top-left-badges .badge .lock-overlay{position:absolute;top:-4px;right:-22px;z-index:2;display:none;align-items:center;justify-content:center;width:24px;height:24px;pointer-events:auto;background:transparent;border-radius:0;padding:0;margin:0}
.top-left-badges .badge .lock-overlay svg{width:14px;height:14px;stroke:#e94560;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-left-badges .badge.locked{color:rgba(255,255,255,.55)}
/* 阴模式：上半部分背景图拓展成全屏（背景不分段，覆盖到底部区域）；底部功能控件固定在底部保留在背景之上 */
.image-area.yin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5}
.image-area.yin ~ .bottom-panel{position:fixed;bottom:0;left:0;right:0;height:220px;background:transparent;z-index:6}
/* 注：探索/日历/收起边条已改 fixed 视口定位（bottom:156px），阴阳模式统一，无需阴模式特调 */
/* 阴模式：诗词/今日/星象内容面板与日程面板保持原视口位置（背景全屏后 50% 基准变化，用视口高度修正） */
.image-area.yin .content-area{top:calc((100vh - 220px)/2 + 20px)}
.image-area.yin .plan-panel{top:calc((100vh - 220px)/2 + 10px)}
/* 阴模式：下半部分文字提亮，提高在暗背景上的可读性 */
.image-area.yin ~ .bottom-panel .label{color:#f2f2f2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.image-area.yin ~ .bottom-panel .category-item.active .label{color:#ffffff}
.image-area.yin ~ .bottom-panel .year-bar-text{color:#f0f0f0}
.image-area.yin ~ .bottom-panel .year-bar-text .runner{stroke:#f0f0f0}
.image-area.yin ~ .comment-user .comment-name{color:#f0f0f0;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.image-area.yin ~ .comment-user .comment-avatar{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.image-area.yin ~ .comment-user .comment-avatar svg{stroke:#ffffff}

/* WebView 内保存背景图：全屏预览 + 长按存相册（替代 a[download]，避免 WebView 无下载处理器退出 App） */
.bg-save-mask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.bg-save-tip{color:#fff;font-size:.85rem;letter-spacing:1px;background:rgba(255,255,255,.16);padding:6px 16px;border-radius:20px;margin-bottom:14px;backdrop-filter:blur(4px)}

<!-- 继续播放跳转：点系统媒体卡片/通知进入 App 时，若仍有播放会话（resume_play），
     自动跳回正在播放的栏目页并定位（如新闻对应条目/文章页码）；用户手动打开首页
     时若点击了页面则取消跳转 -->
<script>
(function(){
  try {
    var v = localStorage.getItem('resume_play');
    if (!v) return;
    var r = JSON.parse(v);
    if (!r || !r.page || r.page === 'APP.html') return;
    // 30 分钟内且有播放会话才跳转（防残留误跳）
    if (Date.now() - (r.ts || 0) > 30 * 60 * 1000) return;
    var cancelled = false;
    function onceCancel(){ cancelled = true; }
    document.addEventListener('touchstart', onceCancel, { once: true, passive: true });
    document.addEventListener('click', onceCancel, { once: true });
    setTimeout(function(){
      if (cancelled) return;
      try { location.replace(r.page + '?resume=1'); } catch(e){}
    }, 500);
  } catch(e){}
})();
</script>

<script>
// 年度进度
(function() {
  var now = new Date();
  var yr = now.getFullYear();
  var start = new Date(yr, 0, 1);
  var diff = now - start;
  var day = Math.floor(diff / 86400000) + 1;
  var total = (yr % 400 === 0 || (yr % 4 === 0 && yr % 100 !== 0)) ? 366 : 365;
  var pct = Math.min(day / total, 1);
  document.getElementById('yearFill').style.width = (pct * 100) + '%';
  document.getElementById('yearText').textContent = '把梦想写进日程 [ ' + yr + '已过' + Math.round(pct * 100) + '% ]';
})();

// 背景图：初始直接使用 picsum 随机图（crossOrigin=anonymous 保证可被 canvas 捕获保存）
var bgImgEl = document.getElementById('bgImage');
function setDefaultBg() {
  bgImgEl.crossOrigin = 'anonymous';
  bgImgEl.onerror = null;
  bgImgEl.src = 'https://picsum.photos/1280/960?random=' + Date.now();
}
setDefaultBg();

// 面板状态观察：诗词/今日/星象/日程打开时隐藏五个栏目按钮 + 背景切换磨砂半透明（平时背景清晰）
(function(){
  var list = document.getElementById('categoryList');
  if (!list) return;
  function update() {
    var pb = document.getElementById('poetryBtn');
    var hb = document.getElementById('historyBtn');
    var cb = document.getElementById('constellationBtn');
    var open = !!(document.querySelector('.plan-panel.show')
      || document.querySelector('.welcome.active')
      || (pb && pb.classList.contains('selected'))
      || (hb && hb.classList.contains('selected'))
      || (cb && cb.classList.contains('selected')));
    list.classList.toggle('hide', open);
    // 磨砂半透明背景：仅面板打开时生效
    var ia = document.querySelector('.image-area');
    if (ia) ia.classList.toggle('frost', open);
  }
  var ids = ['planPanel', 'poetryBtn', 'historyBtn', 'constellationBtn'];
  var obs = window.MutationObserver ? new MutationObserver(update) : null;
  if (obs) {
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if (el) obs.observe(el, {attributes:true, attributeFilter:['class']});
    });
    var wl = document.querySelector('.welcome');
    if (wl) obs.observe(wl, {attributes:true, attributeFilter:['class']});
    update();
  } else {
    // 兜底：MutationObserver 不可用时轮询
    setInterval(update, 500);
  }
})();

// 探索：点击刷新背景图（picsum 随机图），不打开面板、不选中（背景只由探索控制）
document.querySelector('.welcome').addEventListener('click', function() {
  if ((GAME._autoMode || GAME._oneKeyMode) && !GAME._autoPanelOpen) return; // 修炼中屏蔽（自动模式主动打开除外）
  var w = this;
  cancelAllRequests();
  // 关闭当前打开的诗词/今日/星象面板（背景不随之切换）
  closeAllOverlays();
  var area = document.getElementById('contentArea');
  if (area) {
    area.classList.remove('show');
    area._activeBtn = null;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  w.classList.remove('active');   // 取消选中效果
  // 刷新背景图：picsum 随机图（crossOrigin=anonymous 保证可被捕获保存；load 后栏目按钮自动重新定位）
  var wt = document.getElementById('welcomeText');
  if (wt) wt.textContent = '探索中';   // 加载中显示"探索中"
  var bgImgEl = document.getElementById('bgImage');
  if (bgImgEl) {
    bgImgEl.crossOrigin = 'anonymous';
    bgImgEl.onerror = null;
    bgImgEl.onload = function(){ if (wt) wt.textContent = '探索'; };
    bgImgEl.src = 'https://picsum.photos/1280/960?random=' + Date.now();
  } else if (wt) {
    wt.textContent = '探索';
  }
  if (GAME._autoMode) GAME._autoPanelLoaded('explore', true);
});

// ===== 黄历 =====
(function() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('alDay').textContent = d;
  document.getElementById('alMonth').textContent = y + '年' + m + '月';
  document.getElementById('alWeekday').textContent = weekdays[now.getDay()];

  // 农历数据表 1900-2100 (每月大小月+闰月)

// 取消所有正在加载的请求，防止异步回调覆盖当前面板内容
function cancelAllRequests() {
  var area = document.getElementById('contentArea');
  if (!area) return;
  var now = Date.now() + '_cancelled';
  area._toggleReqId = now;           // 取消诗词/今日
  area._constellationReqId = now;    // 取消星象
  area._exploreReqId = now;          // 取消探索

// 点击"诗"展示每日诗词，"今"展示历史上的今天
function toggleContent(btnId, url, renderFn, onLoaded) {
  cancelAllRequests();
  var btn = document.getElementById(btnId);
  var area = document.getElementById('contentArea');
  var bg = document.getElementById('bgImage');
  if (area._activeBtn === btnId && area.classList.contains('show')) {
    area.classList.remove('show');
    btn.classList.remove('selected');
    area._activeBtn = null;
    closeAllOverlays();
    return;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');
  // 关闭所有背景覆盖层（诗词/星象）
  closeAllOverlays();
  // 终止后台正在加载的星象请求
  if (area._activeBtn === 'constellationBtn') {
    area._constellationReqId = Date.now() + '_cancelled';
  }
  // 恢复默认位置（诗/今内容居中）
  area.style.left = '';
  area.style.width = '';
  area.style.transform = 'translateY(-50%)';
  area.style.textAlign = 'center';
  area.style.overflowY = '';   // 恢复滚动（星象面板会锁定）
  // 生成唯一标记，防止异步回调覆盖
  var _reqId = Date.now() + '_' + Math.random();
  area._toggleReqId = _reqId;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = renderFn(data);
    area.classList.add('show');
    area._activeBtn = btnId;
    // 内容加载完成→记录修炼
    if (onLoaded) onLoaded();
  }).catch(function(){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = '<div class="content-line">暂无内容</div>';
    area.classList.add('show');
    area._activeBtn = btnId;
    // 内容加载失败不记录修炼
  });
}

      svg += '<line x1="' + pa.x.toFixed(1) + '" y1="' + pa.y.toFixed(1) + '" x2="' + pb.x.toFixed(1) + '" y2="' + pb.y.toFixed(1) + '" stroke="rgba(255,255,255,.2)" stroke-width="1"/>';
    }
    svg += '</svg>';
    html += svg;
    // 中心信息面板：名称 + 分类（如"紫微恒 / 三垣 · 天帝居所"、"角宿 / 二十八宿 · 东方苍龙"）
    html += '<div class="zodiac-center">'
          + '<span class="zc-name">' + (PALACE_RENAME[sansi3[0].name] || sansi3[0].name) + '</span>'
          + '<span class="zc-line">三垣 · ' + (PALACE_SUB[sansi3[0].name] || '') + '</span>'
          + '</div>';
    // 中圈 4 象（r=95，位于 80~110 环带中间，文字置于扇区中心）
    html += '<div class="z-ring r2">';
    for (var j = 0; j < MID.length; j++) {
      var a2 = j * midStep + midStep / 2 - 90;
      var r2 = a2 * Math.PI / 180;
      html += '<div class="z-item" data-name="' + MID[j] + '" style="left:' + (cx + 95 * Math.cos(r2)).toFixed(0) + 'px;top:' + (cy + 95 * Math.sin(r2)).toFixed(0) + 'px">'
        + '<span class="zt" style="transform:rotate(' + (j * midStep + midStep / 2) + 'deg)">' + MID[j] + '</span></div>';
    }
    html += '</div>';
    // 外圈 28 宿（r=126，位于 110~140 环带中间，文字置于扇区中心；显示单字"角、亢…"，数据 name 不变供播放/弹窗使用）
    html += '<div class="z-ring r3">';
    for (var k = 0; k < stars28.length; k++) {
      var d = stars28[k];
      var a3 = k * step + step / 2 - 90;
      var r3 = a3 * Math.PI / 180;
      html += '<div class="z-item" data-index="' + k + '" style="left:' + (cx + 126 * Math.cos(r3)).toFixed(0) + 'px;top:' + (cy + 126 * Math.sin(r3)).toFixed(0) + 'px">'

    }
    html += '</div>';
    html += '</div>';
    // 内圈 3 宫：不随转盘旋转（固定层，紫微恒扇区中心在 12 点）
    // 内圈角度线（固定，不随转）：从中心面板边缘(r=52)画到 80 圆，避开面板遮挡、清晰可见
    var svgIn = '<svg class="z-ring-lines-inner" viewBox="0 0 360 360">';
    for (var n1 = 0; n1 < INNER.length; n1++) {   // 内圈 3 条（120°），扇区边界
      var q1a = lineXY1(n1 * innerStep - 60, 52), q1b = lineXY1(n1 * innerStep - 60, 78); 
      svgIn += '<line x1="' + q1a.x.toFixed(1) + '" y1="' + q1a.y.toFixed(1) + '" x2="' + q1b.x.toFixed(1) + '" y2="' + q1b.y.toFixed(1) + '" stroke="rgba(255,255,255,.22)" stroke-width="1"/>';
    }
    svgIn += '</svg>';
    html += svgIn;
    // 内圈 3 宫文字（固定，朝向圆心）
    html += '<div class="z-ring r1">';
    for (var ii = 0; ii < INNER.length; ii++) {
      var a1 = ii * innerStep + innerStep / 2 - 90 - 60;   // 固定布局：紫微恒中心在 12 点
      var r1 = a1 * Math.PI / 180;
      html += '<div class="z-item" data-palace="' + ii + '" style="left:' + (cx + 66 * Math.cos(r1)).toFixed(0) + 'px;top:' + (cy + 8 + 66 * Math.sin(r1)).toFixed(0) + 'px">' //cy + 8px，以修正位置
        + '<span class="zt" style="transform:rotate(' + (a1 + 90) + 'deg)">' + (PALACE_RENAME[INNER[ii].name] || INNER[ii].name) + '</span></div>';
    }
    html += '</div>';

    html += '<div class="z-ring-dot"></div>';
    area.innerHTML = html;
    area._activeBtn = 'constellationBtn';
    // 星象内容加载完成→记录修炼（自动模式下通知自动流程，不直接修炼）
    if (GAME._autoMode) { GAME._autoPanelLoaded('constellation', true); }
    else { GAME.doAction('constellation'); }
    // ===== 转盘交互 =====
    var wheel = area.querySelector('.zodiac-wheel');
    var centerEl = area.querySelector('.zodiac-center');
    var zodiacItems = area.querySelectorAll('.z-ring.r3 .z-item');   // 外圈 28 宿（可点击）
    var midItems = area.querySelectorAll('.z-ring.r2 .z-item');      // 中圈 4 象（联动高亮）
    var innerItems = area.querySelectorAll('.z-ring.r1 .z-item');    // 内圈 3 宫（可点击）
    var centerName = area.querySelector('.zc-name');
    var centerLine = area.querySelector('.zc-line');
    var currentAngle = -135, startX, startY, startAngle = 0;   // 默认 -135°：北方玄武扇区中心（45°）转到 12 点正北方；内圈三宫固定不转
    var isDragging = false;
    var selKind = 'palace';   // 'palace'=内圈三宫 | 'star'=外圈二十八宿
    var selIdx = 0;
    // 中心两行：名称 + 分类（三宫：三垣·职能；二十八宿：二十八宿·四象）
    function updateCenter(d, dname) {
      centerName.textContent = dname;
      centerLine.textContent = (d.group === '三垣')
        ? ('三垣 · ' + (PALACE_SUB[d.name] || ''))
        : ('二十八宿 · ' + d.group);
    }
    // 选中二十八宿（外圈）：中心信息 + 中圈对应四象高亮
    function selectStar(idx) {
      var d = stars28[idx];
      selKind = 'star'; selIdx = idx;
      zodiacItems.forEach(function(el){el.classList.remove('sel')});
      zodiacItems[idx].classList.add('sel');
      midItems.forEach(function(el){
        el.classList.toggle('sel', el.getAttribute('data-name') === d.group);
      });
      innerItems.forEach(function(el){el.classList.remove('sel')});
      updateCenter(d, d.name);
    }
    // 选中三垣宫（内圈）：中心信息 + 内圈高亮，外圈/中圈取消
    function selectPalace(idx) {
      var d = sansi3[idx];
      selKind = 'palace'; selIdx = idx;
      innerItems.forEach(function(el){el.classList.remove('sel')});
      innerItems[idx].classList.add('sel');
      midItems.forEach(function(el){el.classList.remove('sel')});
      zodiacItems.forEach(function(el){el.classList.remove('sel')});
      updateCenter(d, PALACE_RENAME[d.name] || d.name);
    }
    // 默认选中紫微宫（内圈）并旋转到扇区中心朝 12 点
    selectPalace(0);
    wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
    centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
    // 点击中心 → 弹窗显示全文歌诀（含分类标题）
    function hideDetail(){
      var mask = document.getElementById('xzDetailMask');
      if (mask) mask.classList.remove('show');
    }
    function showDetail(){
      var d = (selKind === 'palace') ? sansi3[selIdx] : stars28[selIdx];
      if (!d) return;
      var dname = (selKind === 'palace') ? (PALACE_RENAME[d.name] || d.name) : d.name;
      var mask = document.getElementById('xzDetailMask');
      if (!mask) {
        mask = document.createElement('div');
        mask.id = 'xzDetailMask';
        mask.className = 'xz-detail-mask';
        mask.innerHTML = '<div class="xz-detail-panel">'
          + '<div class="xz-detail-head"><span class="xz-detail-title"></span><button class="xz-detail-close">✕</button></div>'
          + '<div class="xz-detail-body"></div>'
          + '<div class="xz-detail-foot">✦ 三垣二十八宿 · 星象歌诀 ✦</div>'
          + '</div>';
        document.body.appendChild(mask);
        mask.addEventListener('click', function(ev){ if (ev.target === mask) hideDetail(); });
        mask.querySelector('.xz-detail-close').addEventListener('click', function(ev){ ev.stopPropagation(); hideDetail(); });
      }
      mask.querySelector('.xz-detail-title').textContent = d.group + ' · ' + dname;
      mask.querySelector('.xz-detail-body').textContent = d.poem;
      mask.classList.add('show');
    }
    // 点击中心信息区：先阻止 mousedown/touchstart 冒泡，避免触发转盘拖动→吸附旋转→选中被改写
    ['mousedown', 'touchstart'].forEach(function(ev){
      centerEl.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive: true });
    });
    centerEl.addEventListener('click', function(e){
      e.stopPropagation();
      showDetail();
    });
    // 内圈三宫点击：只切换内容，不旋转转盘（阻止拖动事件冒泡）
    var _xzAudio = null;   // 星象音频（点击三恒/二十八宿播放"发现_xx.mp3"）
    var XZ_AUDIO = {
      '紫微恒': '发现_紫微恒.mp3', '太微恒': '发现_太微恒.mp3', '天市恒': '发现_天市恒.mp3'
    };
    // 播放星象音频：三恒用显式映射；二十八宿按命名规则"发现_<宿名>.mp3"自动拼接。
    // 不校验文件是否存在——文件缺失时播放失败被静默忽略，后续往 app 目录放对应音频即可直接生效
    function playXZ(name){
      var f = XZ_AUDIO[name] || ('发现_' + name + '.mp3');
      try {
        if (_xzAudio) { _xzAudio.pause(); _xzAudio = null; }
        _xzAudio = new Audio(encodeURI('./' + f));
        _xzAudio.play().catch(function(){});
      } catch(e){}
    }
    innerItems.forEach(function(el){
      ['mousedown', 'touchstart'].forEach(function(ev){
        el.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive: true });
      });
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var pidx = parseInt(el.getAttribute('data-palace'), 10);
        selectPalace(pidx);
        playXZ(PALACE_RENAME[INNER[pidx].name] || INNER[pidx].name);
      });
    });
    function snapToNearest() {
      // 吸附到扇区中心（文字位于扇区中间，选中后正对 12 点方向）
      var rawIdx = -currentAngle / step;
      var nearest = ((Math.round(rawIdx - 0.5) % N) + N) % N;
      currentAngle = -(nearest * step + step / 2);
      wheel.style.transition = 'transform .35s ease-out';
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transition = 'transform .35s ease-out';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
      selectStar(nearest);
    }
    function getClientXY(e) {
      if (e.type.indexOf('touch') === 0) {
        return {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }
      return {x: e.clientX, y: e.clientY};
    }
    function onStart(e) {
      isDragging = true;
      var c = getClientXY(e);
      startX = c.x;
      startY = c.y;
      startAngle = currentAngle;
      wheel.style.transition = 'none';
      centerEl.style.transition = 'none';
    }
    function onMove(e) {
      if (!isDragging) return;
      var c = getClientXY(e);
      var dx = c.x - startX;
      currentAngle = startAngle + dx * 0.5;
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
    }
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    }
    // 鼠标事件
    wheel.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    // 触摸事件
    wheel.addEventListener('touchstart', onStart, {passive: true});
    document.addEventListener('touchmove', onMove, {passive: true});
    document.addEventListener('touchend', onEnd);
    // 点击选择（外圈二十八宿，旋转到扇区中心）
    zodiacItems.forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.index);
        currentAngle = -(idx * step + step / 2);
        wheel.style.transition = 'transform .35s ease-out';
        wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
        centerEl.style.transition = 'transform .35s ease-out';
        centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
        selectStar(idx);
        playXZ(stars28[idx].name);   // 有对应音频的星宿（东方苍龙七宿）点击播放
      });
    });
  }).catch(function(){
    // 如果已切换到其他面板，放弃
    if (area._constellationReqId !== _reqId) return;
    area.innerHTML = '<div class="content-line" style="font-size:.72rem;opacity:.6">网络请求失败，请稍后重试</div>';
    area._activeBtn = 'constellationBtn';
  });
    });
});

// ===== 日程计划面板（PlanSvc：严格云端优先，数据全部以 Waline 数据库为准） =====
var PlanSvc = (function(){
  var LS_ALLMODE = 'snowhoo_plan_allMode'; // 全部日程开关（默认开，UI 偏好，非计划数据）
  var CLOUD_BASE = 'https://waline.snowhoo.net';
  var CLOUD_PATH_BASE = '/app-plan/';

  var data = {};
  var oid = 0;              // 云端记录 objectId（从云端拉取获得，仅运行时引用，不落本地）
  var curDate = '';
  var syncTimer = null, toastTimer = null;

  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function weekCN(d){ return '日一二三四五六'[d.getDay()]; }
  function parseDate(s){ var p = String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
  // 展示用去前导零：2026-08-01 → 2026-8-1
  function fmtDate(s){ var p = String(s).split('-'); return (+p[0]) + '-' + (+p[1]) + '-' + (+p[2]); }
  // 展示用去前导零：09:00 → 9:00
  function fmtTime(t){ return String(t || '').replace(/^0(\d):/, '$1:'); }
  function isAllMode(){ try{ var v = localStorage.getItem(LS_ALLMODE); if (v == null) return true; return v === '1'; }catch(e){ return true; } }
  function setAllMode(on){ try{ localStorage.setItem(LS_ALLMODE, on ? '1' : '0'); }catch(e){} }
  function $(id){ return document.getElementById(id); }

  // ---------- Waline 用户（与 GAME.getWalineUser 同套逻辑） ----------
  function getWalineUser(){
    try{
      var keys = ['WALINE_USER','@waline/user','waline_user'];
      var user = null;
      for (var i = 0; i < keys.length; i++) {
        try{
          var val = localStorage.getItem(keys[i]);
          if (val) {
            user = JSON.parse(val);
            if (user && (user.display_name || user.nick || user.name)) break;
          }
        }catch(e){ user = null; }
      }
      if (!user) {
        try{
          var sv = sessionStorage.getItem('WALINE_USER') || sessionStorage.getItem('@waline/user');
          if (sv) { user = JSON.parse(sv); if (!user || !(user.display_name || user.nick || user.name)) user = null; }
        }catch(e){ user = null; }
      }
      if (!user) return null;
      user.display_name = user.display_name || user.nick || user.name || '';
      user.display_name = user.display_name.trim();
      if (!user.display_name) return null;
      user.email = user.email || user.mail || '';
      return user;
    }catch(e){ return null; }
  }
  // 云端按用户区分 path（email 优先，保证唯一）
  function cloudPath(u){
    var key = (u.email || u.display_name || 'guest').trim();
    return CLOUD_PATH_BASE + encodeURIComponent(key);
  }
  // 健壮解析（兼容 Waline 管理后台 markdown 渲染污染，同 GAME.parseGameRecord）
  function parsePlan(raw){
    if (!raw) return null;
    var s = String(raw).replace(/<[^>]*>/g, '')
      .replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'")
      .replace(/&quot;/g, '"').replace(/&#34;/g, '"')
      .replace(/&amp;/g, '&').replace(/&#38;/g, '&')
      .replace(/&lt;/g, '<').replace(/&#60;/g, '<')
      .replace(/&gt;/g, '>').replace(/&#62;/g, '>');
    var start = s.indexOf('{');
    var end = s.lastIndexOf('}');
    if (start >= 0 && end > start) s = s.slice(start, end + 1);
    try { return JSON.parse(s); } catch(e){ return null; }
  }

  // ---------- 云端同步（严格云端优先：数据只从云端读、只写云端） ----------
  function setTip(txt){ var el = $('planSyncTip'); if (el) el.textContent = txt || ''; }
  function updateSyncTip(){
    var u = getWalineUser();
    if (u) setTip('已登录：' + u.display_name + ' · 计划自动同步云端');
    else setTip('未登录 · 计划无法同步云端');
  }
  // 拉取云端最新记录（含 objectId），失败返回 null
  function fetchCloud(u){
    var p = fetch(CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(cloudPath(u)))
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(resp){
        var records = (resp.data && resp.data.data) || [];
        var found = null;
        for (var i = 0; i < records.length; i++) {
          try{
            var rec = records[i];
            var obj = parsePlan(rec.orig || rec.comment || '');
            if (obj && obj.v === 1 && obj.data && typeof obj.data === 'object') {
              var recOid = parseInt(rec.objectId, 10) || 0;
              if (!found || recOid > found.oid) found = { oid: recOid, updatedAt: +obj.updatedAt || 0, data: obj.data };
            }
          }catch(e){}
        }
        return found;
      });
    var timer = new Promise(function(resolve, reject){ setTimeout(function(){ reject(new Error('超时')); }, 8000); });
    return Promise.race([p, timer]).catch(function(e){ console.warn('[计划] 拉取云端失败:', e); return null; });
  }
  // 从云端加载（进入页面/登录/打开面板时调用）：云端有记录则以云端为准
  function syncNow(){
    var u = getWalineUser();
    if (!u) { oid = 0; setTip('未登录 · 计划无法同步云端'); return; }
    fetchCloud(u).then(function(res){
      if (res && res.data) {
        data = res.data;
        oid = res.oid;
        render();
        setTip('已加载云端计划');
      } else {
        oid = 0; // 云端无记录（新用户或数据被删）→ 下次修改走 POST 重建
      }
      setTimeout(function(){ updateSyncTip(); }, 2000);
    });
  }
  // 把当前 data 推送到云端（修改后立即调用）：有 oid PUT 更新，无 oid POST 创建
  function pushCloud(){
    var u = getWalineUser();
    if (!u) { setTip('未登录 · 修改无法同步云端'); setTimeout(function(){ updateSyncTip(); }, 2000); return; }
    var token = u.token || '';
    if (!token) { try{ var s = JSON.parse(localStorage.getItem('WALINE_USER')||'{}'); if (s.token) token = s.token; }catch(e){} }
    setTip('正在同步…');
    var payload = JSON.stringify({
      comment: JSON.stringify({ v: 1, updatedAt: Date.now(), data: data }),
      url: cloudPath(u),
      nick: u.display_name || '游客',
      mail: u.email || ''
    });
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var req;
    if (oid) {
      req = fetch(CLOUD_BASE + '/api/comment/' + oid, { method: 'PUT', headers: headers, body: payload });
    } else {
      req = fetch(CLOUD_BASE + '/api/comment', { method: 'POST', headers: headers, body: payload })
        .then(function(r){
          return r.json().then(function(j){
            if (r.ok && j.data && j.data.objectId) oid = parseInt(j.data.objectId, 10);
            return r;
          });
        });
    }
    return req.then(function(r){
      if (r.ok) setTip('已同步到云端');
      else setTip('云端同步失败');
      setTimeout(function(){ updateSyncTip(); }, 2000);
    }).catch(function(e){
      console.warn('[计划] 云端同步网络失败:', e);
      setTip('云端同步失败');
      setTimeout(function(){ updateSyncTip(); }, 2000);
    });
  }
  function pushCloudSoon(){
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(pushCloud, 800);
  }

  // ---------- 渲染 ----------
  function listFor(date){ return data[date] || (data[date] = []); }
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function byTime(a, b){
    var ta = a.time || '99:99', tb = b.time || '99:99';
    if (ta === tb) return (a.id||0) - (b.id||0);
    return ta < tb ? -1 : 1;
  }
  function render(){
    var allMode = isAllMode();
    var items = [], total = 0, done = 0;
    if (allMode) {
      // 全部日程：所有日期按日期+时间升序，条目带日期
      Object.keys(data).filter(function(k){ return Array.isArray(data[k]) && data[k].length; }).sort().forEach(function(k){
        data[k].slice().sort(byTime).forEach(function(it){ items.push({ date: k, it: it }); });
      });
      total = items.length;
      items.forEach(function(r){ if (r.it.done) done++; });
    } else {
      // 单日：只显示日期框所选日期的日程（保持原样）
      items = listFor(curDate).slice().sort(byTime).map(function(it){ return { date: curDate, it: it }; });
      total = items.length;
      items.forEach(function(r){ if (r.it.done) done++; });
    }
    var list = $('planList');
    var empty = $('planEmptyTip');
    list.innerHTML = '';
    items.forEach(function(rec){
      var it = rec.it;
      var li = document.createElement('div');
      li.className = 'plan-item' + (it.done ? ' done' : '');
      li.dataset.id = it.id;
      li.dataset.date = rec.date;
      li.dataset.time = it.time || '';
      var html =
        '<button class="plan-done-btn" data-act="toggle"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>';
      if (allMode) {
        // 全部日程：日期+时间竖排双行容器，节省水平空间
        html += '<span class="plan-datetime">' +
          '<span class="plan-dt-date">' + fmtDate(rec.date) + '</span>' +
          '<span class="plan-dt-time">' + (it.time ? fmtTime(it.time) : '全天') + '</span>' +
        '</span>';
      } else {
        html += '<span class="plan-time">' + (it.time ? fmtTime(it.time) : '全天') + '</span>';
      }
      html +=
        '<span class="plan-text">' + escapeHtml(it.text) + '</span>' +
        '<button class="plan-del-btn" data-act="del">×</button>';
      li.innerHTML = html;
      list.appendChild(li);
    });
    empty.style.display = items.length ? 'none' : 'block';
    empty.innerHTML = '<span>📝</span>' + (allMode ? '还没有任何计划，添加一条吧' : '今天还没有计划，添加一条吧');
    var stat = $('planStatBar');
    var pct = total ? Math.round(done / total * 100) : 0;
    stat.innerHTML =
      '<span class="plan-stat-line">' +
        '<span class="plan-stat-text">' + (allMode ? '全部 ' : '今日 ') + total + ' 项，完成 ' + done + ' 项</span>' +
        '<span class="plan-stat-sep">|</span>' +
        '<span class="plan-sync-tip" id="planSyncTip"></span>' +
      '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>';
    updateSyncTip(); // 登录信息与完成项同行（元素随 innerHTML 重建，需重新填充）
    // 日期栏：始终显示当前日期 "2026-8-1 周六"（全部/单日模式都显示，切日期不迷失）
    var d = parseDate(curDate);
    $('planDateMain').textContent = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate() + ' 周' + weekCN(d);
    // 渲染后刷新滚动方向提示箭头（等布局完成）
    requestAnimationFrame(updateArrows);
  }

  // 列表滚动方向提示：上箭头=顶部被滚出（可往上），下箭头=底部还有未显示（可往下）
  function updateArrows(){
    var card = document.getElementById('planListCard');
    if (!card) return;
    var up = document.getElementById('planArrowUp');
    var down = document.getElementById('planArrowDown');
    if (!up || !down) return;
    up.classList.toggle('show', card.scrollTop > 2);
    down.classList.toggle('show', card.scrollTop + card.clientHeight < card.scrollHeight - 2);
  }

  // ---------- 交互 ----------
  // 按 id 在全部日期中查找条目（全部日程模式下跨日期勾选/删除）
  function findItemById(id){
    for (var d in data) {
      var arr = data[d];
      if (Array.isArray(arr)) {
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].id == id) return { arr: arr, i: i };
        }
      }
    }
    return null;
  }
  function addItem(){
    var textEl = $('planText');
    var timeEl = $('planTime');
    var text = (textEl.value || '').trim();
    if (!text) { toast('请输入计划内容'); textEl.focus(); return; }
    listFor(curDate).push({
      id: Date.now() + Math.floor(Math.random() * 1000),
      time: timeEl.value || '',
      text: text.slice(0, 60),
      done: false
    });
    textEl.value = '';
    render();
    pushCloudSoon();   // 修改后立即推送云端
    if (isAllMode()) toast('已添加到 ' + fmtDate(curDate));
  }
  function toggleDone(id){
    var f = findItemById(id);
    if (!f) return;
    f.arr[f.i].done = !f.arr[f.i].done;
    render();
    pushCloudSoon();
  }
  function delItem(id){
    var f = findItemById(id);
    if (!f) return;
    f.arr.splice(f.i, 1);
    render();
    pushCloudSoon();
    toast('已删除');
  }
  function toast(msg){
    var t = document.querySelector('.plan-toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'plan-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  // ---------- 计划行内编辑（双击激活，原地改） ----------
  var editingEl = null;      // 当前编辑中的 input
  var planClickTimer = null; // 单击延迟（区分单击/双击）
  function commitPlanEdit(input){
    if (input._done) return;
    input._done = true;
    if (input._cancelled) { editingEl = null; render(); return; }
    editingEl = null;
    var li = input.closest('.plan-item');
    var id = li ? li.dataset.id : null;
    var kind = input.dataset.kind; // text | date | time
    var f = id == null ? null : findItemById(id);
    var changed = false;
    if (f) {
      if (kind === 'text') {
        var t = (input.value || '').trim();
        if (t) { f.arr[f.i].text = t.slice(0, 60); changed = true; }
        else { toast('计划内容不能为空'); }
      } else if (kind === 'time') {
        if ((input.value || '') !== (f.arr[f.i].time || '')) { f.arr[f.i].time = input.value || ''; changed = true; }
      } else if (kind === 'date') {
        var nd = input.value;
        var oldKey = null;
        for (var k in data) if (data[k] === f.arr) { oldKey = k; break; }
        if (nd && nd !== oldKey) {
          var item = f.arr[f.i];
          f.arr.splice(f.i, 1);
          if (!Array.isArray(data[nd])) data[nd] = [];
          data[nd].push(item);
          if (oldKey && (!data[oldKey] || !data[oldKey].length)) delete data[oldKey];
          changed = true;
          toast('已移至 ' + fmtDate(nd));
        }
      }
    }
    if (changed) { pushCloudSoon(); if (kind !== 'date') toast('已修改'); }
    render();
  }
  function startPlanEdit(el, kind, curVal){
    if (editingEl) commitPlanEdit(editingEl); // 先提交上一个未完成的编辑
    var input = document.createElement('input');
    input.type = kind === 'date' ? 'date' : kind === 'time' ? 'time' : 'text';
    if (kind === 'text') input.maxLength = 60;
    input.value = curVal || '';
    input.className = 'plan-edit-inline';
    input.dataset.kind = kind;
    input.style.fontSize = kind === 'date' || kind === 'time' ? '.62rem' : '';
    el.replaceWith(input);
    editingEl = input;
    input.focus();
    if (kind === 'text') { try { input.setSelectionRange(input.value.length, input.value.length); } catch(e){} }
    input.addEventListener('blur', function(){ if (!input._done) commitPlanEdit(input); });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); if (!input._done) commitPlanEdit(input); }
      else if (e.key === 'Escape') { input._cancelled = true; if (!input._done) commitPlanEdit(input); }
    });
  }

  // ---------- 初始化 ----------
  function init(){
    // 严格云端优先：清理旧版本遗留的本地计划缓存，数据只从云端读取
    try {
      localStorage.removeItem('snowhoo_plan_data');
      localStorage.removeItem('snowhoo_plan_savedAt');
      localStorage.removeItem('snowhoo_plan_oid');
    } catch(e){}
    data = {};
    oid = 0;
    curDate = todayStr();
    $('planAllSwitch').checked = isAllMode();
    updateSyncTip();
    render();

    var picker = $('planDatePicker');
    // 点击日期直接选日期：picker 透明覆盖在日期文字上，原生弹出；全部模式下选日期自动切到单日
    picker.addEventListener('change', function(){
      if (!picker.value) return;
      if (isAllMode()) { setAllMode(false); $('planAllSwitch').checked = false; }
      curDate = picker.value;
      render();
    });
    // 点击时间直接选时间（PC 端无原生指示器时兜底弹出；移动端点击输入框自动弹出）
    $('planTime').addEventListener('click', function(){
      try { if (this.showPicker) this.showPicker(); } catch(e){}
    });
    // 底部开关：开=全部日程，关=仅显示日期框所选日期
    $('planAllSwitch').addEventListener('change', function(){
      setAllMode(this.checked);
      render();
    });
    $('planAddBtn').addEventListener('click', addItem);
    $('planText').addEventListener('keydown', function(e){
      if (e.key === 'Enter') addItem();
    });
    var listCard = document.getElementById('planListCard');
    if (listCard) listCard.addEventListener('scroll', updateArrows);
    window.addEventListener('resize', updateArrows);
    $('planList').addEventListener('click', function(e){
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var li = btn.closest('.plan-item');
      var id = li ? li.dataset.id : null;
      if (id == null) return;
      if (btn.dataset.act === 'toggle') toggleDone(id);
      else if (btn.dataset.act === 'del') delItem(id);
    });
    // 单击条目 → 提示"双击可进行修改"；双击 → 行内编辑（勾选/删除按钮区、编辑中的 input 不触发）
    $('planList').addEventListener('click', function(e){
      if (e.target.closest('[data-act]') || e.target.tagName === 'INPUT') return;
      var li = e.target.closest('.plan-item');
      if (!li) return;
      if (planClickTimer) { clearTimeout(planClickTimer); planClickTimer = null; return; } // 双击的第二次点击，交给 dblclick
      planClickTimer = setTimeout(function(){ planClickTimer = null; toast('双击可进行修改'); }, 280);
    });
    $('planList').addEventListener('dblclick', function(e){
      if (e.target.closest('[data-act]') || e.target.tagName === 'INPUT') return;
      var li = e.target.closest('.plan-item');
      if (!li) return;
      if (planClickTimer) { clearTimeout(planClickTimer); planClickTimer = null; }
      var id = li.dataset.id;
      var dd = e.target.closest('.plan-dt-date');
      if (dd) { startPlanEdit(dd, 'date', li.dataset.date || ''); return; }
      var tt = e.target.closest('.plan-dt-time') || e.target.closest('.plan-time');
      if (tt) { startPlanEdit(tt, 'time', li.dataset.time || ''); return; }
      var txt = e.target.closest('.plan-text');
      if (txt) { startPlanEdit(txt, 'text', txt.textContent); }
    });
    // 已登录 → 从云端拉取计划（数据以云端数据库为准）
    if (getWalineUser()) syncNow();
  }

  return { init: init, render: render, updateSyncTip: updateSyncTip, syncNow: syncNow, getWalineUser: getWalineUser };
})();
PlanSvc.init();

// 初始化 Waline（页面加载时就初始化，非延迟加载）
// 这样登录重定向回来时 Waline 能立刻检测到用户
(function initWalineEarly() {
  import('./lib/waline.js').then(function(mod) {
    try {
      walineInstance = mod.init({
        el: '#walineContainer',
        serverURL: 'https://waline.snowhoo.net',
        lang: 'zh-CN',
        avatar: 'mp',
        pageview: false,
        locale: {
          placeholder: '说点什么吧...',
          comment: '留言'
        },
        onLogin: function(user) {
          // 登录态由 Waline 自身管理；游戏数据一律不落本地存储（数据全部以数据库为准）
          try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e) {}
          // 更新头像，然后让 checkLogin 自动检测用户变化并加载数据
          if (window.GAME) {
            GAME.updateAvatar(user);
            commentOverlay.classList.remove('active');
            // 不直接调 loadFromServer，走 checkLogin 统一路径
            // 避免与 init/定时器 双重调用导致 race condition
            GAME.checkLogin();
          }
        },
        onLogout: function() {
          try { localStorage.removeItem('WALINE_USER'); } catch(e) {}
          // 彻底清理 Waline 组件残留（否则栏目页菜单会误判已登录解锁）
          try { localStorage.removeItem('@waline/user'); } catch(e) {}
          try { localStorage.removeItem('waline_user'); } catch(e) {}
          try { sessionStorage.removeItem('WALINE_USER'); } catch(e) {}
          try { sessionStorage.removeItem('@waline/user'); } catch(e) {}
          if (window.GAME) {
            // 不设 lastUser，让 checkLogin 自然检测到 user→null 的变化进入登出分支
            GAME.checkLogin();
          }
        }
      });
      console.log('[GAME] Waline init OK');
    } catch(e) {
      console.error('[GAME] Waline init error:', e);
    }
  }).catch(function(e) {
    console.error('[GAME] Waline import error:', e);
  });
})();

<script>
// 启动进度：等待背景图 + 数据加载完整后进度条走满并淡出
// 触发条件：GAME.loaded=true（成功）或 曾进入 loading 后回 idle（加载失败），且背景图已加载完
// 不再监听 window.load（load 只代表资源就绪，早于 checkLogin/waline 数据加载完成）
(function(){
  var sp = document.getElementById('bootSplash');
  if (!sp) return;
  var finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    setTimeout(function(){
      sp.classList.add('hide');
      setTimeout(function(){ if (sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
    }, 260);
  }
  var sawLoading = false; // 是否曾进入数据加载中（区分"未开始"与"已失败"）
  // 包装 setSyncState 精确捕获 loading 状态（轮询 150ms 采样可能错过瞬时 loading）
  try {
    if (typeof GAME !== 'undefined' && GAME && typeof GAME.setSyncState === 'function') {
      var _origSS = GAME.setSyncState;
      GAME.setSyncState = function(s){ if (s === 'loading') sawLoading = true; return _origSS.apply(this, arguments); };
    }
  } catch(e){}
  var bootT = Date.now(); // 页面加载起始
  function ready(){
    // 背景图（设置了 src）加载完成（成功或失败都算）
    var bg = document.getElementById('bgImage');
    if (bg && bg.getAttribute('src') && !bg.complete) return false;
    // GAME 数据：加载成功 → 完成；正在加载 → 继续等
    if (typeof GAME === 'undefined' || !GAME) return false;
    if (GAME.loaded) return true;
    if (GAME.syncState === 'loading') return false;
    // idle 且未加载：曾进入 loading（加载已失败）或页面已过 2s（checkLogin 500ms 已跑完）→ 放行
    if (sawLoading || Date.now() - bootT > 2000) return true;
    return false;
  }
  var t = setInterval(function(){ if (ready()) { clearInterval(t); finish(); } }, 150);
  // 兜底：GAME 脚本异常等极端情况最多等 10s（长于 waline 8s 超时，正常路径不会被兜底抢先）
  setTimeout(function(){ clearInterval(t); finish(); }, 10000);
})();
</script>
</body>
</html>
