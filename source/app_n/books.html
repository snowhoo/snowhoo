---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>书架 · 小说阅读</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: transparent; }
  #app {
    max-width: 1400px; min-height: 100vh; margin: 0 auto; padding: 0 16px 96px;
    transition: background 0.2s, color 0.2s;
    --bg-body: #0a0a0f; --bg-surface: #14141e; --bg-card: #1c1c26; --bg-card-hover: #252532;
    --bg-elevated: #1e1e2a; --border: #2c2c3a; --text-primary: #f0f0f3; --text-secondary: #a0a0b0;
    --text-muted: #6e6e80; --accent: #ec4899; --accent-hover: #f472b6;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.3); --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --radius-card: 10px; --radius-md: 16px; --radius-sm: 12px;
    background: var(--bg-body); color: var(--text-primary);
  }
  #app[data-theme="dark"] {
    --bg-body: #000000; --bg-surface: #0a0a0f; --bg-card: #111115; --bg-card-hover: #1a1a20;
    --bg-elevated: #15151c; --border: #2a2a33; --text-primary: #ffffff; --text-secondary: #c0c0cf;
    --text-muted: #8a8a99; --accent: #ec4899; --accent-hover: #f472b6;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.5); --shadow-md: 0 8px 24px rgba(0,0,0,0.6);
  }
  #app[data-theme="light"] {
    --bg-body: #f8fafc; --bg-surface: #ffffff; --bg-card: #f0f2f5; --bg-card-hover: #e8eaed;
    --bg-elevated: #f1f5f9; --border: #e2e8f0; --text-primary: #0f172a; --text-secondary: #475569;
    --text-muted: #64748b; --accent: #ec4899; --accent-hover: #f472b6;
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.05); --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

  .view { transition: opacity 0.2s; }
  .view.hidden { display: none; }

  /* 吸顶头部：品牌 + 胶囊工具栏 + 分类徽章 */
  #stickyHeader { position: sticky; top: 0; z-index: 100; background: var(--bg-body); padding-top: 40px; padding-bottom: 4px; }
  .toolbar { display: flex; gap: 10px; align-items: center; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar input, .toolbar button {
    border-radius: 40px; padding: 8px 16px; font-weight: 500; font-size: 13px;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
    outline: none; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
  }
  .toolbar input { max-width: 240px; flex: 1; }
  .toolbar button { cursor: pointer; font-weight: 600; }
  .toolbar button:active { background: var(--bg-card-hover); }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .cat-filters { display: flex; gap: 8px; align-items: center; width: 100%; overflow-x: auto; padding: 8px 0 6px; scrollbar-width: none; }
  .cat-filters::-webkit-scrollbar { display: none; }
  .cat-badge {
    background: var(--bg-elevated); padding: 4px 12px; border-radius: 40px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); transition: all 0.1s; white-space: nowrap; flex-shrink: 0; color: var(--text-primary);
  }
  .cat-badge.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .meta { padding: 2px 2px 8px; font-size: .72rem; color: var(--text-muted); }

  /* 书架网格 */
  #shelf { display: none; }
  #shelf.active { display: block; }
  .book-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px;
    align-content: start; padding: 4px 0;
  }
  .book-card {
    background: var(--bg-card); border-radius: var(--radius-card); overflow: hidden; cursor: pointer;
    transition: all 0.25s ease; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
  }
  .book-card:active { transform: translateY(1px); box-shadow: var(--shadow-md); }
  .book-cover-wrap { width: 100%; aspect-ratio: 3/4; background: var(--bg-elevated); overflow: hidden; position: relative; }
  .book-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book-cover-text { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--text-muted); }
  .book-cover-badge {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    font-size: .6rem; color: #fff; background: rgba(0,0,0,.5);
    border-radius: 6px; padding: 2px 6px; line-height: 1.2;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    pointer-events: none; max-width: calc(100% - 12px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .book-info { padding: 6px 8px 8px; }
  .book-title {
    font-weight: 600; font-size: 13px; line-height: 1.4; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .book-author { flex: 1; min-width: 0; font-size: .72rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-author-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  /* 日期/进度覆盖在封面底部（渐变底保证可读，pointer-events:none 不挡点击） */
  .book-cover-foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 12px 6px 5px; font-size: .6rem; color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0));
    pointer-events: none;
  }
  .book-cover-foot .cov-date { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-cover-foot .cov-prog { flex-shrink: 0; margin-left: auto; }
  .fav-home-btn { background: transparent; border: none; font-size: 15px; cursor: pointer; color: var(--text-secondary); flex-shrink: 0; padding: 0 2px; line-height: 1.2; }
  .fav-home-btn:active { transform: scale(.88); }
  /* 书籍信息栏的收藏 / 续读 */
  .resume-btn { border: none; background: var(--accent); color: #fff; border-radius: 40px; padding: 9px 22px; font-size: .85rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .resume-btn:active { transform: scale(.96); }

  /* 阅读器 */
  #reader { display: none; }
  #reader.active { display: flex; flex-direction: row; min-height: calc(100vh - 120px); }
  #chapterPanel { width: 38%; max-width: 360px; min-width: 200px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-surface); }
  #bookHead { flex-shrink: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #bookHead .bt { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
  #bookHead .ba { font-size: .76rem; color: var(--text-secondary); margin-top: 3px; }
  #bookHead .bi { font-size: .74rem; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
  #bookHead .bc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  #bookHead .bc { font-size: .7rem; color: var(--text-muted); }
  .fav-heart { border: none; background: none; cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 2px 4px; color: var(--text-secondary); -webkit-tap-highlight-color: transparent; }
  .fav-heart:active { transform: scale(.9); }
  #chapFilter { flex-shrink: 0; padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
  #chapFilter input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: .8rem; outline: none; background: var(--bg-card); color: var(--text-primary); }
  #chapSortBtn { flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); border-radius: 8px; padding: 6px 10px; font-size: .72rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #chapSortBtn:active { background: var(--bg-card-hover); }
  #chapterList { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .chap { display: block; padding: 9px 10px; border-radius: 8px; font-size: .82rem; color: var(--text-secondary); cursor: pointer; border-bottom: 1px solid var(--border); }
  .chap:active, .chap:hover { background: var(--bg-card-hover); }
  .chap.cur { background: var(--accent); color: #fff; font-weight: 600; }

  #contentPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-surface); position: relative; }
  .read-bg-layer { position: absolute; inset: 0; z-index: 0; background: var(--read-bg, var(--bg-surface)); filter: brightness(var(--read-bg-bright, 1)); pointer-events: none; }
  #contentHead, #content { position: relative; z-index: 1; }
  #contentHead { flex-shrink: 0; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: .95rem; font-weight: 600; background: var(--bg-elevated); color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
  /* 章节翻页（上/下章） */
  /* 章节切换按钮已取消，改由阅读区左右竖排边缘控件（.read-edge）切换 */
  #ttsBarMount { width: 100%; display: flex; min-width: 0; }
  /* 会员登录区（头像点击弹留言窗） */
  .user-area { display: flex; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: rgba(128,128,128,.2); border: 1px solid var(--border); flex-shrink: 0; }
  /* 登录留言弹窗 */
  .comment-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; display: flex; align-items: flex-end; }
  .comment-overlay.active { opacity: 1; visibility: visible; }
  .comment-panel { background: var(--bg-elevated); width: 100%; max-height: 85vh; border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .35s ease-out; }
  .comment-overlay.active .comment-panel { transform: translateY(0); }
  .comment-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .comment-panel-header .cp-title { font-size: .9rem; font-weight: 600; color: var(--text-primary); }
  .comment-panel-header .cp-close { font-size: 1.2rem; color: var(--text-muted); cursor: pointer; padding: 4px; line-height: 1; border: none; background: none; }
  .comment-panel-body { flex: 1; overflow-y: auto; padding: 8px 16px; min-height: 200px; max-height: calc(85vh - 50px); -webkit-overflow-scrolling: touch; }
  /* 目录开关：桌面隐藏，移动端抽屉用 */
  .toc-toggle { display: none; align-items: center; gap: 4px; flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); border-radius: 8px; padding: 4px 10px; font-size: .8rem; font-weight: 600; cursor: pointer; }
  .toc-toggle:active { background: var(--bg-card-hover); }
  #content { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 20px; line-height: 1.9; font-size: var(--read-fs, 1.02rem);
    font-family: "KaiTi", "STKaiti", "楷体", "Songti SC", serif; color: var(--read-fg, var(--text-primary)); background: transparent; max-width: 780px; margin: 0 auto; width: 100%;
    filter: brightness(var(--read-text-bright, 1)); }
  /* 正文 / 目录滚动条：极细、无配色 */
  #content, #chapterList { scrollbar-width: thin; scrollbar-color: rgba(120,120,120,.35) transparent; }
  #content::-webkit-scrollbar, #chapterList::-webkit-scrollbar { width: 3px; height: 3px; }
  #content::-webkit-scrollbar-track, #chapterList::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb, #chapterList::-webkit-scrollbar-thumb { background: rgba(120,120,120,.35); border-radius: 3px; }
  #content p { margin: 0 0 1.1em; text-indent: 2em; }
  #content .empty { color: var(--text-muted); font-size: .9rem; text-indent: 0; text-align: center; margin-top: 30vh; font-family: sans-serif; }
  #content .empty a { color: var(--accent); }

  .loading { padding: 30px; text-align: center; color: var(--text-muted); font-size: .85rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 1s linear infinite; font-size: 1.2rem; }
  .wish-prompt { text-align: center; padding: 48px 20px; color: var(--text-primary); }
  .wish-emoji { font-size: 2.6rem; }
  .wish-prompt p { margin-top: 12px; font-size: 1rem; }
  .wish-sub { color: var(--text-muted); font-size: .82rem !important; margin-top: 6px !important; }
  .wish-btns { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
  .wish-btn { border: none; border-radius: 40px; padding: 10px 30px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: transform .1s; }
  .wish-btn.yes { background: var(--accent); color: #fff; }
  .wish-btn.no { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }
  .wish-btn:active { transform: scale(.96); }

  /* 底部导航 */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 700; background: var(--bg-surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; padding: 0; font-size: .8rem; user-select: none; -webkit-user-select: none; }
  .bottom-nav .bn-row { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; height: 44px; width: 100%; flex-shrink: 0; min-width: 0; gap: 8px; }
  .bottom-nav .bn-row:not(:first-child) { border-top: 1px solid var(--border); }
  .bottom-nav .bn-tts-row { height: 42px; padding: 0 4px 0 0; justify-content: stretch; }
  .page-nav-group { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
  .page-btn { display: flex; align-items: center; gap: 4px; padding: 4px 14px; border-radius: 40px; cursor: pointer; color: var(--text-secondary); background: var(--bg-card); border: 1px solid var(--border); font-weight: 600; flex-shrink: 0; }
  .page-btn:active { background: var(--bg-card-hover); }
  .page-text { font-size: .72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-btn { width: 32px; height: 32px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .theme-btn:active { transform: scale(.92); }
  .theme-btn svg { width: 18px; height: 18px; }

  /* 浮窗菜单（与 app 家族一致） */
  .float-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
  .float-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
  .float-btn:active { transform: scale(.92); }
  .float-menu { position: absolute; bottom: 40px; left: 0; z-index: 200; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md); overflow: hidden; opacity: 0; transform: translateY(8px) scale(.95); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  .float-menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; padding: 10px 16px; color: var(--text-primary); text-decoration: none; font-size: .82rem; font-weight: 500; white-space: nowrap; transition: background .2s; }
  .float-menu a:hover { background: var(--bg-card-hover); }
  .float-menu .menu-home { border-top: 1px solid rgba(128,128,128,.35); }
  .menu-indicator { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 6px; vertical-align: middle; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: .6rem; font-weight: 600; line-height: 18px; text-align: center; }

  /* 心愿单面板 */
  .wish-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; display: flex; align-items: flex-end; }
  .wish-overlay.show { opacity: 1; visibility: visible; }
  .wish-panel { background: var(--bg-surface); width: 100%; max-height: 80vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .35s ease-out; }
  .wish-overlay.show .wish-panel { transform: translateY(0); }
  .wish-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .wish-cp-title { font-size: .95rem; font-weight: 600; color: var(--text-primary); }
  .wish-count { font-size: .76rem; color: var(--text-secondary); }
  .wish-count b { color: var(--accent); }
  .wish-close { font-size: 1.2rem; color: var(--text-muted); border: none; background: none; cursor: pointer; padding: 4px; line-height: 1; }
  .wish-panel-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
  .wish-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px; }
  .wish-row:active { background: var(--bg-card-hover); }
  .wish-row-main { min-width: 0; }
  .wish-row-title { font-size: .88rem; color: var(--text-primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wish-row-chap { font-size: .72rem; color: var(--text-muted); margin-top: 3px; }
  .wish-row-sub { font-size: .66rem; color: var(--accent); }
  .wish-status { font-size: .7rem; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
  .wish-status.done { background: rgba(34,197,94,.15); color: #22c55e; }
  .wish-status.pending { background: rgba(236,72,153,.15); color: var(--accent); }
  .wish-status.failed { background: rgba(239,68,68,.15); color: #ef4444; }
  .wish-empty { padding: 44px 20px; text-align: center; color: var(--text-muted); font-size: .85rem; }

  /* 启动加载动画 */
  .loading-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg-body); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .5s; }
  .loading-overlay.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .loading-text { margin-top: 16px; font-size: .9rem; color: var(--text-muted); }

  /* ===== 移动端（手机 webview 优先）：阅读器全屏 + 目录抽屉 ===== */
  @media (max-width: 768px) {
    #app { padding: 0 12px 96px; }
    #botInfo { display: none; }
    .book-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .toolbar { flex-wrap: nowrap; }
    .toolbar input { max-width: none; flex: 1; }
    .toolbar .btn-text { display: none; }

    /* 阅读器改为全屏固定层，脱离原文档流，正文为主视图 */
    #reader.active {
      position: fixed; inset: 0; z-index: 600;
      flex-direction: column; min-height: 0; height: 100%;
      background: var(--bg-body);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #contentPanel { min-width: 0; }
    #content { padding: 16px 18px 104px; font-size: var(--read-fs, 1.05rem); }
    #contentHead { padding: 40px 14px 10px; gap: 8px; }
    #bookHead { padding-top: 40px; }
    #chapterList { padding-bottom: 96px; }
    #contentTitle { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-toggle { display: inline-flex !important; }

    /* 章节目录：默认隐藏为左侧抽屉，点击 ☰ 目录滑入 */
    #chapterPanel {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 30;
      width: 82%; max-width: 340px;
      transform: translateX(-101%); opacity: 0;
      transition: transform .28s ease, opacity .28s ease;
      border-right: 1px solid var(--border); box-shadow: var(--shadow-md);
      background: var(--bg-surface);
    }
    #reader.active #chapterPanel.open { transform: translateX(0); opacity: 1; }

    /* 抽屉遮罩（移动端） */
    .reader-mask { display: none; position: absolute; inset: 0; z-index: 25; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .28s ease; }
    #reader.active .reader-mask.show { display: block; opacity: 1; }
  }

  /* ===== 朗读栏只在阅读页显示；书架等页面底栏单行、不占位 ===== */
  #bottomNav .bn-tts-row { display: none; }
  body.reader-on #bottomNav .bn-tts-row { display: flex; }
  #app { padding-bottom: 56px; }
  body.reader-on #app { padding-bottom: 100px; }

  /* ===== 阅读环境：正文区右下浮动按钮 + 设置面板 ===== */

<script>
// 数据源：Cloudflare R2 公开访问地址（桶开启 Public access 后获得，形如 https://pub-xxxxxxxx.r2.dev/）
// 若使用自定义域名，改成你的域名即可。保留 REPLACE 占位时自动回退到本地 ./books_data/（便于本地预览）。
const R2_BASE = 'https://pub-d583e3093dc1438882b43509c1571302.r2.dev/';
const DATA = (R2_BASE.indexOf('REPLACE') === -1) ? R2_BASE : './books_data/';
const LEXU_BASE = 'https://www.lewx.cc';
// 按需抓取调度：前端把"未缓存章节"作为一条匿名评论提交到 Waline 专用 path（当作心愿任务队列），
// 本地轮询服务（books_poller.py）认领后抓取并上传 R2，前端轮询 R2 分片就绪即加载。
const WALINE_SERVER = 'https://waline.snowhoo.net';
const TASK_PATH = '/books/task-queue';
// 心愿单展示文件（由 poller 写入、随 R2 公开同步，前端匿名读取）
// 心愿单本体与"已达成累计"全部直接读写 Waline（匿名 GET，path 必须用完整 URL 才命中）——无需任何 R2/本地文件
// 封面在 book.json / 索引里只存相对路径（/uploads/allimg/...），按需补全站点前缀
function coverUrl(b) {
  if (!b || !b.cover) return '';
  return (b.cover.indexOf('http') === 0) ? b.cover : (LEXU_BASE + b.cover);
}
let INDEX = null;           // 兼容保留（历史字段，当前未直接使用）
let META = null;           // 索引元信息：{total, generated_at, categories:[{name,file,count}]}
let catCache = {};         // 分类文件 -> book 数组 缓存（避免重复拉取）
let currentCatFile = '';   // 当前选中的分类文件（'' = 全部分类）
let currentBook = null;
let bookById = {};        // id -> 分类索引条目（不再有单书 book.json，详情页元数据直接来自索引）
let currentShards = [];   // 稀疏数组，索引 = 全局章号(0-based)，每元素 = "章节标题\n正文"
let HIST = {};            // 阅读记录：{ [id]: {id,title,author,category,chapter_count,idx,ts} }
let FAV = [];             // 收藏：[{id,title,author,category,chapter_count,ts}]
let specialView = '';     // 书架特殊视图：'' | '__history__' | '__fav__'
let chapterTitles = [];   // 来自 toc.json 的有序章节标题（导航用）
let loadedShards = new Set();   // 已载入 currentShards 的分片号
let curIdx = null;
let chapOrder = 'asc';     // 章节排序：'asc' 正序 / 'desc' 反序
let shelfAll = [];        // 当前过滤后的全部书籍
let shelfShown = 0;       // 书架已渲染数量（用于懒加载 / 无限滚动）
let shelfObserver = null; // IntersectionObserver 实例
const PAGE_SIZE = 36;     // 每批渲染数量（避免一次性渲染上万张卡片卡死）

// 会话内"已许愿"标记（仅内存防同会话重复弹窗；不写 localStorage——是否已在队列以 R2 recent.json 为准）
let wishedSet = new Set();
let wishCache = null;     // 最近十条心愿（来自 R2）
let wishStats = null;     // {fulfilled:Number}
let wishLoaded = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = (t) => t ? t.replace('T', ' ').replace('Z', '').slice(0, 16) : '';

async function getJSON(u) {
  const r = await fetch(u, { cache: 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function init() {
  try {
    META = await getJSON(DATA + 'index_meta.json');
  } catch (e) {
    $('#shelfList').innerHTML = '<div class="loading">书架数据尚未准备，请稍后再来。</div>';
    hideLoading();
    return;
  }
  $('#shelfMeta').textContent = '共 ' + META.total + ' 本小说' + (META.generated_at ? '（更新于 ' + META.generated_at + '）' : '');
  buildCatBadges();
  loadUserData();      // 阅读记录 / 收藏：先读本地缓存
  syncUserData();      // 已登录则与 Waline 库同步（异步，不阻塞首屏）
  await renderShelf();
  $('#searchInput').addEventListener('input', debounce(renderShelf, 300));
  $('#refreshBtn').addEventListener('click', refresh);
  $('#historyBtn').addEventListener('click', () => setSpecialView(specialView === '__history__' ? '' : '__history__'));
  $('#favoritesBtn').addEventListener('click', () => setSpecialView(specialView === '__fav__' ? '' : '__fav__'));
  // 书籍页：收藏 / 续读（事件委托）
  document.addEventListener('click', (e) => {
    if (e.target.closest('#bookFavBtn')) { toggleFav(currentBook); syncBookFavBtn(currentBook); return; }
    if (e.target.closest('#resumeBtn')) { const h = HIST[currentBook && currentBook.id]; if (h && h.idx >= 0) openChapter(h.idx); }
  });
  // 封面加载失败时替换为占位图
  document.addEventListener('error', function (e) {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.dataset.fallback) {
      const ph = document.createElement('div');
      ph.className = 'book-cover book-cover-text';
      ph.textContent = '📖';
      t.replaceWith(ph);
    }
  }, true);
  $('#backShelfBtn').addEventListener('click', () => { if (location.hash) location.hash = ''; else showView('shelf'); });
  $('#chapSearch').addEventListener('input', renderChapters);
  $('#chapSortBtn').addEventListener('click', () => {
    chapOrder = (chapOrder === 'asc') ? 'desc' : 'asc';
    $('#chapSortBtn').textContent = (chapOrder === 'asc') ? '正序' : '反序';
    renderChapters();
  });
  initReadEnv();
  $('#wishBtn').addEventListener('click', openWishList);
  $('#wishClose').addEventListener('click', () => $('#wishOverlay').classList.remove('show'));
  $('#wishOverlay').addEventListener('click', (e) => { if (e.target === $('#wishOverlay')) $('#wishOverlay').classList.remove('show'); });
  // 移动端章节抽屉：☰ 目录开关 + 遮罩关闭
  document.addEventListener('click', (e) => { if (e.target.closest('#tocToggle')) toggleToc(); });
  $('#readerMask').addEventListener('click', closeToc);
  // 章节翻页：阅读区左右竖排边缘控件（取消原上/下章按钮）
  const ep = $('#edgePrev'); if (ep) ep.addEventListener('click', () => { const n = (currentBook && currentBook.chapter_count) || 0; const i = (typeof curIdx === 'number' && curIdx >= 0) ? curIdx : -1; if (i > 0) openChapter(i - 1); });
  const en = $('#edgeNext'); if (en) en.addEventListener('click', () => { const n = (currentBook && currentBook.chapter_count) || 0; const i = (typeof curIdx === 'number' && curIdx >= 0) ? curIdx : -1; if (i + 1 < n) openChapter(i + 1); });
  window.addEventListener('hashchange', route);
  route();
  hideLoading();
}

// 由索引元信息生成分类徽章（与 tv_p 的 cat-badge 风格一致）
function buildCatBadges() {
  const bar = $('#catBar');
  let html = '<span class="cat-badge' + (currentCatFile === '' ? ' active' : '') + '" data-cat="">全部 (' + (META.total || 0) + ')</span>';
  (META.categories || []).forEach(c => {
    html += '<span class="cat-badge' + (currentCatFile === c.file ? ' active' : '') + '" data-cat="' + esc(c.file) + '">' + esc(c.name) + ' (' + c.count + ')</span>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.cat-badge').forEach(el => {
    el.addEventListener('click', () => {

function hideLoading() {
  const el = document.getElementById('loading');
  if (!el) return;
  el.classList.add('hide');
  setTimeout(() => el.remove(), 500);
}

function showView(v) {
  closeToc();
  document.body.classList.toggle('reader-on', v === 'reader');   // 控制底栏朗读行显示
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));

async function refresh() {
  catCache = {};
  try { META = await getJSON(DATA + 'index_meta.json'); } catch (e) { /* 保留旧 META */ }
  $('#shelfMeta').textContent = '共 ' + (META.total || 0) + ' 本小说' + (META.generated_at ? '（更新于 ' + META.generated_at + '）' : '');
  buildCatBadges();
  await renderShelf();
}

async function ensureCategory(file) {
  // 懒加载某个分类索引文件，并缓存
  if (catCache[file]) return catCache[file];
  const arr = await getJSON(DATA + file);
  catCache[file] = arr;
  arr.forEach(e => { if (e && e.id) bookById[e.id] = e; });  // 同步填充 id->条目 映射
  return arr;
}

async function getActiveBooks() {
  // 选中具体分类 -> 只加载该分类文件；全部分类 -> 并行加载所有分类并合并
  if (!currentCatFile) {
    const files = (META.categories || []).map(c => c.file);
    const arrs = await Promise.all(files.map(ensureCategory));
    return arrs.flat();
  }
  return await ensureCategory(currentCatFile);
}

async function renderShelf() {
  if (specialView) return renderSpecialView();
  const box = $('#shelfList');
  if (shelfObserver) { shelfObserver.disconnect(); shelfObserver = null; }
  box.innerHTML = '<div class="loading">加载中…</div>';
  let list;
  try {
    list = await getActiveBooks();
  } catch (e) {
    box.innerHTML = '<div class="loading">加载失败：' + esc(e.message) + '</div>';
    return;
  }
  const kw = $('#searchInput').value.trim().toLowerCase();
  if (kw) {
    list = list.filter(b => {
      const hay = (b.title + ' ' + b.author + ' ' + (b.tags || []).join(' ')).toLowerCase();
      return hay.includes(kw);
    });
  }
  shelfAll = list;
  shelfShown = 0;
  box.innerHTML = '';
  const total = META.total || 0;
  if (!list.length) {
    box.innerHTML = '<div class="loading">没有匹配的小说</div>';
    $('#shelfMeta').textContent = '共 ' + total + ' 本小说';
    $('#botInfo').textContent = '0 本';
    return;
  }
  // 计数提示：搜索时显示匹配数，否则显示总数
  $('#shelfMeta').textContent = kw
    ? ('匹配 ' + list.length + ' 本（共 ' + total + ' 本）')
    : ('共 ' + total + ' 本小说' + (META.generated_at ? '（更新于 ' + META.generated_at + '）' : ''));
  $('#botInfo').textContent = list.length + ' 本';
  appendShelf();
  // 触底自动加载更多（懒加载）
  const sentinel = document.createElement('div');
  sentinel.id = 'shelfSentinel';
  sentinel.className = 'loading';
  sentinel.textContent = '加载更多…';
  box.appendChild(sentinel);
  shelfObserver = new IntersectionObserver((entries) => {
    if (entries[0] && entries[0].isIntersecting) appendShelf();
  }, { root: box, rootMargin: '400px' });
  shelfObserver.observe(sentinel);
}

// 特殊视图：最近阅读 / 我的收藏（参考 tv_p 的 renderSpecialView）

// 向书架追加一批卡片（无限滚动核心）
function appendShelf() {
  const box = $('#shelfList');
  const sentinel = document.getElementById('shelfSentinel');
  const next = shelfAll.slice(shelfShown, shelfShown + PAGE_SIZE);
  if (!next.length) {
    if (sentinel) sentinel.textContent = '— 已显示全部 ' + shelfAll.length + ' 本 —';
    if (shelfObserver) { shelfObserver.disconnect(); shelfObserver = null; }
    return;
  }
  const frag = document.createDocumentFragment();
  next.forEach(b => {
    const card = document.createElement('div');
    card.className = 'book-card';
    const cover = coverUrl(b)
      ? '<img class="book-cover" src="' + esc(coverUrl(b)) + '" loading="lazy" data-fallback="1" alt="">'
      : '<div class="book-cover book-cover-text">📖</div>';
    const prog = (HIST[b.id] && HIST[b.id].idx >= 0) ? (HIST[b.id].idx + 1) : 0;
    const coverBadge = (b.category ? '<span class="book-cover-badge">' + esc(b.category) + (b.status ? ' · ' + esc(b.status) : '') + '</span>' : '');
    const coverFoot = (b.crawled_at || prog)
      ? '<div class="book-cover-foot">' +
        (b.crawled_at ? '<span class="cov-date">' + esc(fmtTime(b.crawled_at)) + '</span>' : '<span></span>') +
        (prog ? '<span class="cov-prog">读到第 ' + prog + ' 章</span>' : '') +
        '</div>'
      : '';
    card.innerHTML = '<div class="book-cover-wrap">' + cover + coverBadge + coverFoot + '</div>' +
      '<div class="book-info">' +
      '<div class="book-title" title="' + esc(b.title) + '">' + esc(b.title) + '</div>' +
      '<div class="book-author-row">' +
      '<div class="book-author">' + esc(b.author || '') + '</div>' +
      '<button class="fav-home-btn" data-favid="' + esc(b.id) + '">' + (isFav(b.id) ? '❤️' : '🤍') + '</button>' +
      '</div></div>';
    card.addEventListener('click', () => { location.hash = '#book/' + b.id; });
    const favBtn = card.querySelector('.fav-home-btn');
    if (favBtn) favBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(b);
      favBtn.textContent = isFav(b.id) ? '❤️' : '🤍';
      if (specialView === '__fav__') renderSpecialView();
      if (currentBook && String(currentBook.id) === String(b.id)) syncBookFavBtn(b);
    });
    frag.appendChild(card);
  });
  if (sentinel) box.insertBefore(frag, sentinel); else box.appendChild(frag);
  shelfShown += next.length;
  if (shelfShown >= shelfAll.length && sentinel) {
    sentinel.textContent = '— 已显示全部 ' + shelfAll.length + ' 本 —';
    if (shelfObserver) { shelfObserver.disconnect(); shelfObserver = null; }
  }
}

// 确保某分片已在 currentShards 中；命中缓存直接返回，否则尝试从 R2 加载，缺失则返回 false（交由上层处理心愿流程）
async function ensureShard(id, S) {
  if (loadedShards.has(S)) return true;
  try {
    const arr = await getJSON(DATA + id + '/c' + String(S).padStart(2, '0') + '.json');
    placeShard(S, arr);
    loadedShards.add(S);
    return true;
  } catch (e) {
    return false;   // R2 没有该分片
  }
}

// ===== 阅读记录 / 收藏：未登录写 localStorage，已登录同步 Waline 库 =====
const LS_HIST = 'books_history';
const LS_FAV = 'books_fav';
const UD_PATH = '/app-books/userdata';

function loadUserData() {
  try { HIST = JSON.parse(localStorage.getItem(LS_HIST)) || {}; } catch (e) { HIST = {}; }
  try { FAV = JSON.parse(localStorage.getItem(LS_FAV)) || []; } catch (e) { FAV = []; }
}
function saveUserData() {
  try { localStorage.setItem(LS_HIST, JSON.stringify(HIST)); } catch (e) {}
  try { localStorage.setItem(LS_FAV, JSON.stringify(FAV)); } catch (e) {}
}
function walineUser() {
  try {
    const v = localStorage.getItem('WALINE_USER');
    const u = v ? JSON.parse(v) : null;
    return (u && (u.display_name || u.nick || u.name)) ? u : null;
  } catch (e) { return null; }
}
function parseUserData(raw) {   // 兼容 Waline markdown 渲染污染（同 reader.html parseGameRecord）
  if (!raw) return null;
  let s = String(raw).replace(/<[^>]*>/g, '')
    .replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/&quot;/g, '"').replace(/&#34;/g, '"')
    .replace(/&amp;/g, '&').replace(/&#38;/g, '&')
    .replace(/&lt;/g, '<').replace(/&#60;/g, '<')
    .replace(/&gt;/g, '>').replace(/&#62;/g, '>');
  const st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch (e) { return null; }
}
async function cloudPull() {    // 取当前用户在 UD_PATH 下最新一条记录
  const u = walineUser(); if (!u) return null;
  try {
    const token = u.token || '';
    const r = await fetch(WALINE_SERVER + '/api/comment?path=' + encodeURIComponent(UD_PATH) + (token ? '&token=' + encodeURIComponent(token) : ''));
    if (!r.ok) return null;
    const j = await r.json();
    const list = (j.data && j.data.data) || j.data || [];
    let best = null, bestOid = 0;
    for (const c of list) {
      if ((c.nick || '') !== (u.display_name || u.nick)) continue;
      const obj = parseUserData(c.orig || c.comment || '');
      const oid = parseInt(c.objectId, 10) || 0;
      if (obj && oid > bestOid) { best = obj; bestOid = oid; }
    }
    return best;
  } catch (e) { return null; }
}
async function cloudPush() {
  const u = walineUser(); if (!u) return;
  try {
    const origin = (location.origin && location.origin.indexOf('http') === 0) ? location.origin : 'https://snowhoo.net';
    await fetch(WALINE_SERVER + '/api/comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: origin + '/app_n/books.html',
        path: UD_PATH,
        comment: JSON.stringify({ history: HIST, fav: FAV, readEnv: readEnv, ts: Date.now() }),
        nick: u.display_name || u.nick, mail: u.mail || '', link: ''
      })
    });
  } catch (e) {}
}
function localUserTs() {
  let m = 0;
  for (const k in HIST) m = Math.max(m, HIST[k].ts || 0);
  FAV.forEach(f => m = Math.max(m, f.ts || 0));
  return m;
}

// ===== 阅读环境设置（文字大小 / 文字颜色 / 文字亮度 / 背景颜色 / 背景亮度 + 标题/朗读/底栏 三开关） =====
// 颜色用色相(Hue)拉杆：0-360 取彩虹色；亮度用百分比 50%-160%
const RE_KEY = 'books_read_env';
const RE_DEFAULT = { fs: 17, fgHue: 215, bgHue: 215, fgBright: 100, bgBright: 100, hideTitle: false, hideTts: false, hideBottom: false };
let readEnv = Object.assign({}, RE_DEFAULT);
function hueFg(h) { return 'hsl(' + h + ', 70%, 42%)'; }     // 文字：较深可读
function hueBg(h) { return 'hsl(' + h + ', 30%, 92%)'; }     // 背景：浅色柔和

function applyReadEnv() {
  const cp = $('#contentPanel'); if (!cp) return;
  cp.style.setProperty('--read-fs', readEnv.fs + 'px');
  cp.style.setProperty('--read-fg', hueFg(readEnv.fgHue));
  cp.style.setProperty('--read-bg', hueBg(readEnv.bgHue));
  cp.style.setProperty('--read-text-bright', readEnv.fgBright / 100);
  cp.style.setProperty('--read-bg-bright', readEnv.bgBright / 100);
  const f = $('#reFont'); if (f) { f.value = readEnv.fs; const v = $('#reFontVal'); if (v) v.textContent = readEnv.fs + 'px'; }
  const fg = $('#reFg'); if (fg) { fg.value = readEnv.fgHue; const v = $('#reFgVal'); if (v) v.textContent = readEnv.fgHue + '°'; }
  const tb = $('#reTextBright'); if (tb) { tb.value = readEnv.fgBright; const v = $('#reTextBrightVal'); if (v) v.textContent = readEnv.fgBright + '%'; }
  const bg = $('#reBg'); if (bg) { bg.value = readEnv.bgHue; const v = $('#reBgVal'); if (v) v.textContent = readEnv.bgHue + '°'; }
  const bb = $('#reBgBright'); if (bb) { bb.value = readEnv.bgBright; const v = $('#reBgBrightVal'); if (v) v.textContent = readEnv.bgBright + '%'; }
  // 三开关：写 body class + 同步勾选框
  document.body.classList.toggle('hide-title', !!readEnv.hideTitle);
  document.body.classList.toggle('hide-tts', !!readEnv.hideTts);
  document.body.classList.toggle('hide-bottom', !!readEnv.hideBottom);
  const tgT = $('#tgTitle'); if (tgT) tgT.checked = !!readEnv.hideTitle;
  const tgS = $('#tgTts'); if (tgS) tgS.checked = !!readEnv.hideTts;
  const tgB = $('#tgBottom'); if (tgB) tgB.checked = !!readEnv.hideBottom;
}
function saveReadEnv() {
  try { localStorage.setItem(RE_KEY, JSON.stringify(readEnv)); } catch (e) {}
  if (walineUser()) persistUserData();   // 登录则随历史/收藏一起上云（/app-books/userdata 同记录）
}
function initReadEnv() {
  try { const s = JSON.parse(localStorage.getItem(RE_KEY)); if (s) Object.assign(readEnv, RE_DEFAULT, s); } catch (e) {}
  applyReadEnv();
  const f = $('#reFont'); if (f) f.addEventListener('input', () => { readEnv.fs = parseInt(f.value) || 17; applyReadEnv(); saveReadEnv(); });
  const fg = $('#reFg'); if (fg) fg.addEventListener('input', () => { readEnv.fgHue = parseInt(fg.value); applyReadEnv(); saveReadEnv(); });
  const tb = $('#reTextBright'); if (tb) tb.addEventListener('input', () => { readEnv.fgBright = parseInt(tb.value); applyReadEnv(); saveReadEnv(); });
  const bg = $('#reBg'); if (bg) bg.addEventListener('input', () => { readEnv.bgHue = parseInt(bg.value); applyReadEnv(); saveReadEnv(); });
  const bb = $('#reBgBright'); if (bb) bb.addEventListener('input', () => { readEnv.bgBright = parseInt(bb.value); applyReadEnv(); saveReadEnv(); });
  const tgT = $('#tgTitle'); if (tgT) tgT.addEventListener('change', () => { readEnv.hideTitle = tgT.checked; applyReadEnv(); saveReadEnv(); });
  const tgS = $('#tgTts'); if (tgS) tgS.addEventListener('change', () => { readEnv.hideTts = tgS.checked; applyReadEnv(); saveReadEnv(); });
  const tgB = $('#tgBottom'); if (tgB) tgB.addEventListener('change', () => { readEnv.hideBottom = tgB.checked; applyReadEnv(); saveReadEnv(); });
  const rst = $('#reReset'); if (rst) rst.addEventListener('click', () => { readEnv = Object.assign({}, RE_DEFAULT); applyReadEnv(); saveReadEnv(); });
  const btn = $('#readEnvBtn'); if (btn) btn.addEventListener('click', (e) => { e.stopPropagation(); $('#readEnvPanel').classList.toggle('show'); });
  document.addEventListener('click', (e) => {
    const p = $('#readEnvPanel'); if (!p || !p.classList.contains('show')) return;
    if (!p.contains(e.target) && e.target.id !== 'readEnvBtn') p.classList.remove('show');
  });
}
let _udPushT = null;
function persistUserData() {
  saveUserData();
  clearTimeout(_udPushT);
  _udPushT = setTimeout(cloudPush, 1500);   // 节流上云，避免频繁写评论
}
async function syncUserData() {   // 云端更新则以云端为准，本地更新则回推
  const obj = await cloudPull();
  if (!obj) return;
  let changed = false;
  if ((obj.ts || 0) > localUserTs()) {
    HIST = obj.history || {}; FAV = obj.fav || [];
    if (obj.readEnv) Object.assign(readEnv, RE_DEFAULT, obj.readEnv);
    saveUserData();
    try { localStorage.setItem(RE_KEY, JSON.stringify(readEnv)); } catch (e) {}
    applyReadEnv();
    changed = true;
  }
  else await cloudPush();
  if (currentBook) syncBookFavBtn(currentBook);
  if (!changed) return;
  // 云端数据有更新：阅读页只刷新收藏键，书架则整页重渲染
  const readerOn = $('#reader') && $('#reader').classList.contains('active');
  if (!readerOn) { if (specialView) renderSpecialView(); else renderShelf(); }
}
function touchHistory(b, idx) {
  if (!b || !b.id) return;
  const e = HIST[b.id] || { id: b.id, idx: -1, ts: 0 };
  e.title = b.title; e.author = b.author; e.category = b.category; e.chapter_count = b.chapter_count;
  if (typeof idx === 'number' && idx >= 0) e.idx = idx;
  e.ts = Date.now();
  HIST[b.id] = e;
  persistUserData();
}
function isFav(id) { return FAV.some(f => String(f.id) === String(id)); }
function toggleFav(b) {
  if (!b || !b.id) return false;
  const i = FAV.findIndex(f => String(f.id) === String(b.id));
  if (i >= 0) FAV.splice(i, 1);
  else FAV.unshift({ id: b.id, title: b.title, author: b.author, category: b.category, chapter_count: b.chapter_count, ts: Date.now() });
  persistUserData();
  return i < 0;
}
function syncBookFavBtn(b) {   // 书籍信息栏收藏键状态（仅心形，无文字/背景）
  const el = $('#bookFavBtn'); if (!el || !b) return;
  el.textContent = isFav(b.id) ? '❤️' : '🤍';
}

// ===== 心愿单数据：许愿进 Waline，打开心愿单也直接读 Waline（简单直连，无中间缓存） =====
// Waline 匿名读评论时 path 参数必须传"完整 URL"（origin + path），纯路径匹配不到
async function loadWishes(force) {
  if (wishLoaded && !force) return;
  const origin = (location.origin && location.origin.indexOf('http') === 0) ? location.origin : 'https://snowhoo.net';
  const fullPath = origin + TASK_PATH;
  const raw = [];
  try {
    let page = 1, totalPages = 1;
    do {
      const j = await getJSON(WALINE_SERVER + '/api/comment?path=' + encodeURIComponent(fullPath) + '&page=' + page + '&pageSize=100');
      const d = (j && j.data) || {};
      (d.data || []).forEach(c => raw.push(c));
      totalPages = d.totalPages || 1;
      page++;
    } while (page <= totalPages);
  } catch (e) { /* Waline 不可达：视为空列表 */ }
  const items = raw.map(c => {
    const req = parseWishComment(c.comment || c.orig || '');
    if (!req || req.b == null || req.s == null) return null;
    return {
      objectId: String(c.objectId || ''),
      bid: String(req.b),
      shard: parseInt(req.s, 10),
      chapter: (req.i != null ? parseInt(req.i, 10) + 1 : null),
      title: req.t || '',
      ts: c.time || c.createdAt || '',
      status: (req.ok === 1 || req.ok === '1' || req.ok === true) ? 'done' : 'pending'   // ok 由 poller 达成后写回评论
    };
  }).filter(Boolean);
  items.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
  // 累计已达成数 = Waline 同列表里一条无 b 的 {"cnt": N} 计数评论（poller 每次达成后 +N 写回）
  let fulfilled = 0;
  raw.forEach(c => {
    const rc = parseWishComment(c.comment || c.orig || '');
    if (rc && rc.cnt != null && rc.b == null) fulfilled = parseInt(rc.cnt, 10) || 0;
  });
  wishCache = items;
  wishStats = { fulfilled: fulfilled };
  wishLoaded = true;
}
// 解析心愿评论内容（兼容 Waline HTML 转义包裹）：{b,s,i,t}
function parseWishComment(s) {
  if (!s) return null;
  let t = String(s).replace(/<[^>]*>/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/&quot;/g, '"').replace(/&#34;/g, '"').replace(/&amp;/g, '&').replace(/&#38;/g, '&');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (e) { return null; }
}
function isWishedRemote(bid, shard) {
  if (!wishCache) return false;
  return wishCache.some(e => String(e.bid) === String(bid) && e.shard === shard);   // 已在 Waline 队列=许过愿
}
function isWished(bid, shard) {
  return wishedSet.has(bid + ':' + shard) || isWishedRemote(bid, shard);
}

// ===== 章节点击：R2 直读 / 心愿流程 =====
async function openChapter(i) {
  const id = currentBook.id;
  const S = Math.ceil((i + 1) / 50);     // 章号(1-based) -> 分片号
  const ok = await ensureShard(id, S);
  curIdx = i;
  if (!window._ttsAuto && window.TTS && TTS.isSpeaking && TTS.isSpeaking()) TTS.stop();  // 手动翻章停读防错位
  updateChapNav();
  renderChapters();
  closeToc();                            // 移动端选章后收起目录抽屉
  if (ok) { renderContent(i); touchHistory(currentBook, i); return; }
  // R2 没有该分片 -> 心愿流程
  await handleShardMiss(id, S, i);
}

// 移动端章节抽屉开关
function closeToc() {
  const cp = $('#chapterPanel'); if (cp) cp.classList.remove('open');
  const m = $('#readerMask'); if (m) m.classList.remove('show');
}
function toggleToc() {
  const cp = $('#chapterPanel'); if (!cp) return;
  const open = cp.classList.toggle('open');
  const m = $('#readerMask'); if (m) m.classList.toggle('show', open);
}

// 左右边缘翻章控件禁用态（首/末章边界）
function updateChapNav() {
  const ep = $('#edgePrev'), en = $('#edgeNext');
  const n = (currentBook && currentBook.chapter_count) || 0;
  const i = (typeof curIdx === 'number' && curIdx >= 0) ? curIdx : -1;
  if (ep) ep.classList.toggle('disabled', i <= 0);
  if (en) en.classList.toggle('disabled', i < 0 || i >= n - 1);
}

async function handleShardMiss(id, S, i) {
  await loadWishes(true);          // 强刷许愿池（Waline 实时）后判断，避免误弹许愿窗
  if (isWished(id, S)) {
    // 许愿池已有覆盖该分片的待实现愿望：直接提示，不再弹许愿、不写库
    wishInPool(id, S, i);
    await pollShard(id, S, i);     // 静默轮询 R2：达成即自动进正文
    return;
  }
  // 未许愿：弹出确认
  showWishPrompt(id, S, i);
}

// 许愿池已覆盖：同书同分片(50章一批)已有待实现愿望，无需再许、不重复写库
function wishInPool(id, S, i) {
  const low = (S - 1) * 50 + 1, high = S * 50;
  $('#content').innerHTML =
    '<div class="wish-prompt">' +
    '<div class="wish-emoji">💝</div>' +
    '<p>您的愿望，已在池中无需再许！</p>' +
    '<p class="wish-sub">第 ' + low + '-' + high + ' 章正在为你准备，静待如愿…</p>' +
    '</div>';
}

function showWishPrompt(id, S, i) {
  const cEl = $('#content');
  const low = (S - 1) * 50 + 1, high = S * 50;
  cEl.innerHTML =
    '<div class="wish-prompt">' +
    '<div class="wish-emoji">💝</div>' +
    '<p>章节未收录，许下心愿？</p>' +
    '<p class="wish-sub">第 ' + low + '-' + high + ' 章会一起开放阅读哦～</p>' +
    '<p class="wish-sub">10 分钟内就能如愿！</p>' +
    '<div class="wish-btns">' +
    '<button class="wish-btn yes" id="wishYes">许愿</button>' +
    '<button class="wish-btn no" id="wishNo">不用了</button>' +
    '</div></div>';
  $('#wishYes').addEventListener('click', () => makeWish(id, S, i));
  $('#wishNo').addEventListener('click', () => {
    cEl.innerHTML = '<p class="empty">本章正文暂未缓存。<br>可返回目录选其它章节，或稍后再来。</p>';
  });
}

function showWishPending() {
  $('#content').innerHTML = '<div class="loading">已接到资源请求，请稍后……<br><span class="spin">◌</span><br><span style="font-size:.82rem;display:block;margin-top:8px">心愿已许，静待如愿！</span></div>';
}

async function makeWish(id, S, i) {
  const title = currentBook ? currentBook.title : '';
  await loadWishes(true);              // 接受许愿前强刷队列判重
  if (isWished(id, S)) {
    // 池中已有覆盖心愿：提示"无需再许"，不写库
    wishInPool(id, S, i);
    await pollShard(id, S, i);
    return;
  }
  wishedSet.add(id + ':' + S);
  showWishPending();
  const sent = await submitWish(id, S, i, title);
  if (!sent) return;   // submitWish 内部已提示错误
  await pollShard(id, S, i);
}

async function submitWish(id, S, i, title) {
  // Waline 要求评论必须带 url 字段，且 url 须在其配置站点（WALINE_SITE_URL）之下，否则直接拒绝（errno 1001）
  const queueUrl = (location.origin && location.origin.indexOf('http') === 0)
    ? (location.origin + TASK_PATH)
    : ('https://snowhoo.net' + TASK_PATH);
  const cEl = $('#content');
  try {
    const resp = await fetch(WALINE_SERVER + '/api/comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: queueUrl,
        path: TASK_PATH,
        comment: JSON.stringify({ b: id, s: S, i: i, t: title }),
        nick: 'books-bot', mail: 'bot@snowhoo.net', link: ''
      })
    });
    if (!resp.ok) {
      const txt = await resp.text().catch(() => '');
      throw new Error('HTTP ' + resp.status + ' ' + txt.slice(0, 140));
    }
  } catch (e) {
    cEl.innerHTML = '<p class="empty">提交心愿失败：' + esc(e.message) +
      '<br>网络好像不太通畅，稍后再试试吧。</p>';
    return false;
  }
  return true;
}

// 轮询 R2 直到分片就绪（poller 抓完即上传）。仅当仍停留在当前章节时才渲染，避免串台
async function pollShard(id, S, i) {
  const key = DATA + id + '/c' + String(S).padStart(2, '0') + '.json';
  for (let k = 0; k < 60; k++) {
    await sleep(3000);
    try {
      const arr = await getJSON(key);
      if (curIdx === i) { placeShard(S, arr); loadedShards.add(S); renderContent(i); }
      return true;
    } catch (e) { /* 未就绪，继续等待 */ }
  }
  if (curIdx === i) {
    $('#content').innerHTML = '<p class="empty">准备时间有点长，稍后再来看看，或先读其它章节吧。</p>';
  }
  return false;
}

function debounce(fn, ms) {
  let t;
  return function () {
    clearTimeout(t);
    const a = arguments, c = this;
    t = setTimeout(() => fn.apply(c, a), ms);
  };
}

function placeShard(S, arr) {
  const base = (S - 1) * 50;
  for (let k = 0; k < arr.length; k++) currentShards[base + k] = arr[k];
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function renderContent(i) {
  const raw = currentShards[i] || '';
  const nl = raw.indexOf('\n');
  const title = nl >= 0 ? raw.slice(0, nl) : raw;
  const body = nl >= 0 ? raw.slice(nl + 1) : '';
  const dispTitle = title || ('第' + (i + 1) + '章');
  $('#contentTitle').textContent = dispTitle;
  const ent = $('#edgeNextTitle'); if (ent) ent.textContent = dispTitle;
  const cEl = $('#content');
  if (body && body.trim()) {
    const paras = body.split('\n').map(p => p.trim()).filter(Boolean);
    cEl.innerHTML = paras.map(p => '<p>' + esc(p) + '</p>').join('') || '<p class="empty">（本章内容为空）</p>';
    cEl.scrollTop = 0;
  } else {
    cEl.innerHTML = '<p class="empty">本章内容还在准备中，可返回目录先读其它章节，或点「许愿」让它优先补上。</p>';
    cEl.scrollTop = 0;
  }
}

function renderChapters() {
  const box = $('#chapterList');
  if (!currentBook) { box.innerHTML = '<div class="loading">无章节</div>'; return; }
  const n = currentBook.chapter_count || 0;
  const kw = $('#chapSearch').value.trim().toLowerCase();
  const list = [];
  for (let i = 0; i < n; i++) {
    const title = chapterTitles[i] || (currentShards[i] ? currentShards[i].split('\n')[0] : ('第' + (i + 1) + '章'));
    if (kw && !title.toLowerCase().includes(kw)) continue;
    list.push({ i, title });
  }
  if (!list.length) { box.innerHTML = '<div class="loading">无匹配章节</div>'; return; }
  if (chapOrder === 'desc') list.reverse();
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach(c => {
    const a = document.createElement('a');
    a.className = 'chap' + (c.i === curIdx ? ' cur' : '');
    a.textContent = c.title;
    a.addEventListener('click', () => openChapter(c.i));
    frag.appendChild(a);
  });
  box.appendChild(frag);
}

async function route() {
  const h = location.hash;
  const m = h.match(/^#book\/(.+)$/);
  if (m) {
    const id = m[1];
    if (bookById[id]) { openBook(bookById[id]); return; }
    await resolveBook(id);   // 直接通过链接/刷新进入：当前分类未加载，先载入全部分类定位本书
  } else {
    showView('shelf');
  }
}

async function resolveBook(id) {
  const files = (META.categories || []).map(c => c.file);
  await Promise.all(files.map(ensureCategory));
  if (bookById[id]) openBook(bookById[id]);
  else { showView('shelf'); alert('未找到该书：' + id); }
}

// ===== 心愿单面板（弹出即时响应，Waline 数据后台懒加载，不阻塞菜单） =====
function openWishList() {
  renderWishPanel();                       // 先用现有数据渲染（旧缓存/空态），面板立即弹出
  $('#wishOverlay').classList.add('show');
  loadWishes(true).then(() => {            // 后台刷新 Waline 心愿，完成后重渲染
    if ($('#wishOverlay').classList.contains('show')) renderWishPanel();
  }).catch(() => {});
}
function renderWishPanel() {
  const fulfilled = (wishStats && wishStats.fulfilled) || 0;
  $('#wishFulfilled').textContent = fulfilled;
  const list = $('#wishList');
  const all = wishCache || [];
  // 展示口径：未达成(pending)全部保留；已达成(done)只保留最近 10 条（wishCache 已按时间倒序）
  const pend = all.filter(e => e.status !== 'done');
  const dones = all.filter(e => e.status === 'done').slice(0, 10);
  const show = pend.concat(dones);
  if (!wishCache) {
    list.innerHTML = '<div class="loading">心愿单加载中…</div>';
  } else if (!show.length) {
    list.innerHTML = '<div class="wish-empty">还没有心愿，去书架挑一本未收录的章节"许愿"吧～</div>';
  } else {
    let html = '';
    show.forEach(e => {
      const st = e.status === 'done' ? '已达成' : '待';
      const stCls = e.status === 'done' ? 'done' : 'pending';
      const chap = (e.chapter != null) ? e.chapter : ((e.shard - 1) * 50 + 1);
      const low = (e.shard - 1) * 50 + 1, high = e.shard * 50;
      html += '<div class="wish-row" data-bid="' + esc(String(e.bid)) + '">' +
        '<div class="wish-row-main">' +
        '<div class="wish-row-title">' + esc(e.title || '未知书目') + '</div>' +
        '<div class="wish-row-chap">第 ' + chap + ' 章 <span class="wish-row-sub">你那么可爱，' + low + '-' + high + ' 章一起送你！</span></div>' +
        '</div>' +
        '<span class="wish-status ' + stCls + '">' + st + '</span>' +
        '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.wish-row').forEach(r => r.addEventListener('click', () => {
      const bid = r.dataset.bid;
      $('#wishOverlay').classList.remove('show');
      if (bookById[bid]) openBook(bookById[bid]);
      else resolveBook(bid);
    }));
  }
}

// ===== 主题切换（与 tv_p 联动，持久化到 localStorage） =====
(function initTheme() {
  const appWrap = document.getElementById('app');
  const themeBtn = document.getElementById('themeBtn');
  const saved = localStorage.getItem('books_theme');
  if (saved === 'dark' || saved === 'light') appWrap.setAttribute('data-theme', saved);
  function syncThemeBtn() {
    const theme = appWrap.getAttribute('data-theme');
    themeBtn.innerHTML = theme === 'dark'
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#f0a500"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f0a500" stroke-width="2" fill="none"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#0f3460"/></svg>';
  }
  syncThemeBtn();
  themeBtn.addEventListener('click', function () {
    const cur = appWrap.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    appWrap.setAttribute('data-theme', next);
    localStorage.setItem('books_theme', next);
    syncThemeBtn();
  });
})();

// ===== 浮窗菜单（与 app 家族一致） =====
(function initFloatMenu() {
  const btn = document.getElementById('floatBtn');
  const menu = document.getElementById('floatMenu');
  if (!btn || !menu) return;
  btn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('show'); });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target !== btn) menu.classList.remove('show'); });
})();

init();
</script>

<script>
// ===== 会员登录（Waline 弹窗，与 reader.html 一致） =====
(function(){
  var overlay = document.getElementById('commentOverlay');
  var userArea = document.getElementById('userArea');
  var closeBtn = document.getElementById('commentClose');
  if (userArea) userArea.addEventListener('click', function(){ if (overlay) overlay.classList.add('active'); });
  if (closeBtn) closeBtn.addEventListener('click', function(){ if (overlay) overlay.classList.remove('active'); });
  if (overlay) overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.classList.remove('active'); });
  var DEF_AV = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%23e6e6e6'/><g fill='none' stroke='%23888' stroke-width='1.5'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></g></svg>";
  function refreshUser(){
    var ua = document.getElementById('userAvatar');
    try {
      var v = localStorage.getItem('WALINE_USER');
      var u = v ? JSON.parse(v) : null;
      if (ua) ua.src = (u && (u.display_name || u.nick || u.name) && u.avatar) ? u.avatar : DEF_AV;
    } catch(e){ if (ua) ua.src = DEF_AV; }
  }
  refreshUser();
  try {
    import('./lib/waline.js').then(function(mod){
      try {
        window.__wl = mod.init({
          el: '#walineContainer',
          serverURL: 'https://waline.snowhoo.net',
          lang: 'zh-CN',
          avatar: 'mp',
          pageview: false,
          path: '/app_n/books.html',
          locale: { placeholder: '登录后留言…', comment: '留言' },
          onLogin: function(user){ try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e){} refreshUser(); try { if (typeof syncUserData === 'function') syncUserData(); } catch(e){} },
          onLogout: function(){ try { localStorage.removeItem('WALINE_USER'); localStorage.removeItem('@waline/user'); } catch(e){} refreshUser(); }
        });
      } catch(e){ console.warn('[会员] Waline init error:', e); }
    }).catch(function(e){ console.warn('[会员] Waline import error:', e); });
  } catch(e){ console.warn('[会员] Waline 初始化失败:', e); }
})();

// ===== 讯飞 TTS 朗读当前章（与 reader.html 一致） =====
(function(){
  function loadTTS(cb){
    var s = document.createElement('script');
    s.src = 'tts.js?ts=' + Date.now();
    s.onload = function(){ cb && cb(); };
    s.onerror = function(){ console.warn('[TTS] tts.js 加载失败，朗读条不可用'); };
    document.head.appendChild(s);
  }
  loadTTS(function(){
    var mount = document.getElementById('ttsBarMount');
    if (mount) { TTS.setAccent('#ec4899'); TTS.mount(mount); }
    TTS.setProvider(function(){
      if (!currentBook) return { items: [] };
      var n = currentBook.chapter_count || 0;
      var start = (typeof curIdx === 'number' && curIdx >= 0) ? curIdx : 0;
      var items = [];
      for (var i = start; i < n; i++) {
        var raw = currentShards[i] || '';
        if (!raw) break;
        var nl = raw.indexOf('\n');
        var title = nl >= 0 ? raw.slice(0, nl) : ('第' + (i + 1) + '章');
        var text = nl >= 0 ? raw.slice(nl + 1) : '';
        text = (text || '').replace(/\u00a0/g, ' ').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        if (!text) continue;
        items.push({ title: title, text: (title ? title + '。' : '') + text });
      }
      return { items: items, label: currentBook.title || '书架' };
    });
    // TTS 自动翻章：第 itemIdx 篇对应章 curIdx + itemIdx
    TTS.onItemChange(function(itemIdx){
      var target = curIdx + itemIdx;
      var n = (currentBook && currentBook.chapter_count) || 0;
      if (target >= 0 && target < n && target !== curIdx) {
        window._ttsAuto = true;
        openChapter(target).finally(function(){ window._ttsAuto = false; });
      }
    });
    // 后台自动暂停：WebView 切后台时朗读持续下载流量，隐藏即停止
    document.addEventListener('visibilitychange', function(){
      if (document.hidden && window.TTS && TTS.isSpeaking && TTS.isSpeaking()) TTS.stop();
    });
  });
})();
</script>
