---
layout: false
---
<title>考勤登记</title>
<style>
/* ============ 主题变量（与 app 家族一致，改 --accent 即可换主色） ============ */
:root{
  --accent:#4f46e5;
  --accent-soft:rgba(79,70,229,.12);
  --bg:#f4f5f9;
  --bg-surface:#fff;
  --text:#1f2233;
  --text-secondary:#4b5162;
  --text-muted:#8b90a0;
  --border:rgba(0,0,0,.09);
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --warn:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);
}
#app{min-height:100vh;background:var(--bg);color:var(--text);padding-bottom:24px}

/* ============ 顶栏（三段式：左 logo+公司，中 标题，右 设置+登录） ============ */
#topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;
  padding:10px 16px;
  background:var(--bg-surface);border-bottom:1px solid var(--border);
}
.tb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);font-size:1.05rem;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.tb-right{display:flex;align-items:center;justify-content:flex-end;flex:1}
.tb-logo{height:30px;width:auto;display:block}
.tb-company{font-size:1rem;font-weight:600;white-space:nowrap}
/* ---- 顶栏右侧：设置图标 + Waline 登录头像 ---- */
.top-actions{position:relative;display:flex;align-items:center;gap:10px}
.icon-btn{
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);
  color:var(--text-secondary);cursor:pointer;
}
.icon-btn svg{width:18px;height:18px}
.icon-btn.disabled,.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.avatar-btn{
  width:34px;height:34px;border-radius:50%;border:1px dashed var(--border);
  background:var(--bg-surface);color:var(--text-muted);cursor:pointer;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;padding:0;line-height:1;
}
.avatar-btn.on{border-style:solid;border-color:var(--accent)}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.avatar-fallback{line-height:1}
.settings-menu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:240px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);padding:6px;z-index:60;
}
.settings-menu[hidden]{display:none}
.settings-item{
  display:block;width:100%;text-align:left;padding:10px 12px;border:none;background:transparent;
  border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text);font-family:inherit;white-space:nowrap;
}
.settings-item:hover{background:var(--accent-soft);color:var(--accent)}

/* ============ 区域卡片 ============ */
.wrap{max-width:760px;margin:0 auto;padding:5px 5px;display:flex;flex-direction:column;gap:5px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:5px 10px;border-bottom:1px solid var(--border)}
.card-head .idx{
  width:22px;height:22px;flex:0 0 22px;border-radius:50%;
  background:#16a34a;color:#fff;font-size:.75rem;font-weight:600;   /* 默认：添加态=绿 */
  display:flex;align-items:center;justify-content:center;
}
body.edit-mode .idx{ background:#f97316; }                          /* 修改态=橙 */
.card-head h2{margin:0;font-size:.95rem;font-weight:600}
/* ---------- 自定义弹窗（替代原生 prompt/alert） ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-mask[hidden]{display:none}
.modal{background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(360px,90vw);padding:20px;animation:modalIn .15s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-title{font-size:1rem;font-weight:600;margin-bottom:10px}
.modal-msg{font-size:.9rem;color:var(--text-muted);margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.modal-input-wrap{margin-bottom:14px}
.modal-input-wrap input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.95rem;background:var(--bg);color:var(--text);outline:none}
.modal-input-wrap input:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.modal-actions button{padding:9px 18px;border:none;border-radius:10px;cursor:pointer;font-size:.9rem}
.modal-actions .btn-ok{background:var(--accent);color:#fff;font-weight:600}
.modal-actions .btn-ok:hover{filter:brightness(.95)}
.modal-actions .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--text)}
.modal-actions .btn-cancel:hover{background:var(--bg)}
.people-modal{width:min(680px,94vw);padding:18px}
.people-table-wrap{max-height:52vh;overflow:auto;margin:6px 0;border:1px solid var(--border);border-radius:10px}
.people-table{width:100%;border-collapse:collapse;font-size:.78rem}
.people-table th,.people-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:5px 8px;text-align:left;white-space:nowrap}
.people-table th{background:var(--bg-surface);color:var(--text-secondary);font-weight:600;position:sticky;top:0}
.people-table tr:last-child td{border-bottom:none}
.people-table td:last-child,.people-table th:last-child{border-right:none}
.people-table .muted{color:var(--text-muted)}
#secAction .card-head{background:#e9ecf1}
.card-head .hint{margin-left:auto;font-size:.78rem;color:var(--text-muted)}
.card-body{padding:10px}

/* ---- 区域一：人员（组别下拉内嵌标题行 + 大号姓名卡） ---- */
.gsel{
  padding:0px 5px;border-radius:10px;font-size:.82rem;
  border:1px solid var(--border);background:var(--bg-surface);color:var(--text);
  outline:none;font-family:inherit;min-width:110px;
}
.gsel:focus{border-color:var(--accent)}
.card-head .gsel{margin-left:auto}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  min-width:88px;padding:5px 16px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--border);background:transparent;color:var(--text-secondary);
  font-size:1rem;font-weight:500;text-align:center;
  transition:background .15s,color .15s,border-color .15s;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
/* 类别选中双色：加班=绿，其它=橙 */
.chip.on.c-green{background:#16a34a;border-color:#16a34a;color:#fff}
.chip.on.c-orange{background:#f97316;border-color:#f97316;color:#fff}
.head-actions{display:flex;align-items:center;gap:12px}
.head-actions .count{font-size:.78rem;color:var(--text-muted)}
.link{border:none;background:transparent;color:var(--accent);font-size:.82rem;cursor:pointer;padding:0}
.people-empty{color:var(--text-muted);font-size:.82rem;margin:0}

/* ---- 区域二：类别（复用 .chips / .chip，与人员选择同款式样） ---- */

/* ---- 区域三：内容（日期/时间段/小时数/说明 四项同一行，窄屏自动折行） ---- */
[hidden]{display:none!important}
.form-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px}
.form-row > .field,.form-row > .sub-row{margin-bottom:0}
.sub-row{display:flex;align-items:center;gap:8px}
.sub-row > .field{flex:1}

.field{display:flex;align-items:center;gap:8px}
.field > label{flex:0 0 auto;margin:0;font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.field input,.field textarea,.field select{
  flex:1;min-width:0;width:auto;padding:8px 10px;border-radius:10px;font-size:.85rem;
  border:1px solid var(--border);background:transparent;color:var(--text);outline:none;
  font-family:inherit;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
/* 各项宽度：日期/小时数定宽，时间段与说明弹性填充，宽屏同一行、窄屏折行 */
#rowDate{flex:0 0 auto}
#rowDate input{flex:0 0 118px}
#rangeBlock{flex:1 1 300px}
#rowNote{flex:1 1 140px}
#rowNote input{min-width:80px}
.time-row{flex:1;display:flex;align-items:center;gap:6px}
.time-row select{flex:1 1 66px;min-width:60px}
.time-row .sep{color:var(--text-muted);font-size:.82rem;flex:0 0 auto}
#fHours{font-size:.92rem;font-weight:600;color:var(--text-secondary);white-space:nowrap;min-width:6em;display:inline-block;text-align:left}
#fHours.bad{color:var(--warn);font-weight:500}
.tip{font-size:.78rem;color:var(--text-muted);margin:0}

/* ---- 区域四：记录 ---- */
.summary{
  font-size:.82rem;color:var(--text-secondary);line-height:1.5;
  background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:12px 0;
}
.save-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-top:12px}
.save-row .summary{margin:0;flex:1 1 240px;min-width:0}
.pv-empty{color:var(--warn)}
.preset-box{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px 10px;margin-top:12px}
.preset-label{font-size:.8rem;color:var(--text-secondary);white-space:nowrap;line-height:30px}
.preset-list{display:flex;flex-wrap:wrap;gap:8px}
.preset-item{
  padding:7px 13px;border:1px solid var(--border);border-radius:999px;cursor:pointer;
  background:var(--bg-surface);color:var(--text-secondary);font-size:.82rem;font-family:inherit;
  transition:background .15s,color .15s,border-color .15s;
}
.preset-item:hover,.preset-item:active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.preset-empty{font-size:.8rem;color:var(--text-muted);line-height:30px}
.warn{color:var(--warn)}
.pv-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.pv-row + .pv-row{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.pv-row > span{border-left:1px solid var(--border);padding-left:8px}
.pv-row > span:first-child{border-left:0;padding-left:0}
/* 预览列对齐：同一预览内 类别/日期/时段/小时/说明 逐行一致，仅"姓名"长度不同 → 给姓名列固定宽度即可让后续各列对齐 */
.pv-i{flex:0 0 1.8em;color:var(--text-muted);font-variant-numeric:tabular-nums}
.pv-n{flex:0 0 4.5em;color:var(--text);font-weight:600;white-space:nowrap}
.pv-c{color:var(--accent)}
.pv-c.pv-green{color:#16a34a}
.pv-c.pv-orange{color:#f97316}
.pv-d,.pv-t,.pv-h{color:var(--text-secondary);font-variant-numeric:tabular-nums}
.pv-note{color:var(--text-muted)}
#submitBtn{
  flex:0 0 auto;min-width:120px;padding:12px 22px;border:none;border-radius:12px;cursor:pointer;
  background:#16a34a;color:#fff;font-size:.95rem;font-weight:600;   /* 默认：添加（绿） */
}
#submitBtn.edit-mode{background:#f97316;}                           /* 修改模式：橙 */
#submitBtn:disabled{opacity:.45;cursor:not-allowed}
.records{display:block;overflow-x:auto}
.rec-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rec-count{margin-right:auto;font-size:.78rem;color:var(--text-muted)}
.btn-rec-submit{
  padding:8px 18px;border:none;border-radius:10px;cursor:pointer;
  background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;
}
.btn-rec-submit:disabled{opacity:.45;cursor:not-allowed}
.btn-rec-action{
  padding:8px 18px;border:1px solid var(--border);border-radius:10px;cursor:pointer;
  background:var(--bg-surface);color:var(--text-secondary);font-size:.85rem;font-weight:600;font-family:inherit;
}
.btn-rec-action:disabled{opacity:.45;cursor:not-allowed}
.rec-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:640px}
.rec-table th,.rec-table td{border:1px solid var(--border);padding:6px 8px;vertical-align:middle}
.rec-table th{background:var(--bg-surface);color:var(--text-secondary);font-weight:600;text-align:left}
.rec-table td{color:var(--text)}
.rec-table .c-check,.rec-table .c-del{width:1%;text-align:center;white-space:nowrap}
.rec-table .c-idx{width:36px;text-align:center;color:var(--text-muted)}
.rec-table .c-who{font-weight:600;white-space:normal}
.rec-table .c-cat{color:var(--accent);white-space:nowrap}
.rec-table .c-cat.c-green{color:#16a34a}
.rec-table .c-cat.c-orange{color:#f97316}
.rec-table .c-date,.rec-table .c-time,.rec-table .c-hours{white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-table .c-ottype{white-space:nowrap;font-weight:600}
.rec-table .ot-holiday{color:#dc2626}
.rec-table .ot-weekend{color:#2563eb}
.rec-table .ot-normal{color:#64748b}
.rec-table .c-note{white-space:normal;min-width:120px}
.rec-table .c-status{white-space:nowrap}
.rec-table .muted{color:var(--text-muted)}
.rec-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.rec-status{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-tj{background:var(--border);color:var(--text-secondary)}
.st-sh{background:rgba(59,130,246,.15);color:#3b82f6}
.st-sp{background:rgba(245,158,11,.15);color:#f59e0b}
.st-ok{background:rgba(34,197,94,.15);color:#22c55e}
.rec-del{border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:.9rem;padding:0 4px}
.rec-actions{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.rec-edit{border:none;background:transparent;color:var(--accent);cursor:pointer;font-size:.82rem;padding:0 4px;display:inline-flex;align-items:center}
.rec-edit svg{width:14px;height:14px;display:block}
.empty{color:var(--text-muted);font-size:.82rem;text-align:center;margin:6px 0}
@media print{
  #topbar,.card:not(#secAction){display:none!important}
  #secAction{box-shadow:none;border:none;margin:0}
  .rec-toolbar{display:none!important}
  .rec-table th.c-check,.rec-table td.c-check,.rec-table .c-del{display:none!important}
}
</style>
</head>
<body>
<div id="app" data-theme="light">

  <header id="topbar">
    <div class="tb-left">
      <img src="logo.png" alt="logo" class="tb-logo" onerror="this.style.display='none'">
      <span class="tb-company" id="companyName">苏州晶讯科技股份有限公司</span>
    </div>
    <div class="tb-center">考勤登记管理系统</div>
    <div class="tb-right">
      <div class="top-actions">
        <button id="setBtn" class="icon-btn" disabled title="设置（登录后可用）" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="avatarBtn" class="avatar-btn" title="点击登录 Waline">
          <span class="avatar-fallback">登录</span>
        </button>
        <div class="settings-menu" id="settingsMenu" hidden>
          <button class="settings-item" id="syncHolidayBtn">从 timor.tech API 获取节假日 写进 Waline</button>
          <button class="settings-item" id="peopleConfigBtn">人员配置（管理 Waline 中的人员）</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Waline 登录挂载点（隐藏，仅用于驱动登录态，不显示评论界面） -->
  <div id="walineLoginMount" style="position:absolute;left:-99999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"></div>

  <div class="wrap">

    <!-- ============ 区域一：选择人员 ============ -->
    <section class="card" id="secPeople">
      <div class="card-head">
        <span class="idx">1</span>
        <h2>选择人员</h2>
        <div class="head-actions">
          <button class="link" id="selAll">全选</button>
          <button class="link" id="selNone">清空</button>
          <span class="count" id="peopleCount">已选 0 人</span>
        </div>
        <select id="groupSel" class="gsel" title="考勤组别"></select>
      </div>
      <div class="card-body">
        <div class="chips" id="peopleList"></div>
      </div>
    </section>

    <!-- ============ 区域二：选择类别 ============ -->
    <section class="card" id="secCat" hidden>
      <div class="card-head">
        <span class="idx">2</span>
        <h2>选择类别</h2>
        <span class="tip" id="catTip">请先选择类别。</span>
        <span class="hint" id="catHint">未选类别</span>
      </div>
      <div class="card-body">
        <div class="chips" id="catGrid"></div>
      </div>
    </section>

    <!-- ============ 区域三：考勤内容 ============ -->
    <section class="card" id="secContent" hidden>
      <div class="card-head">
        <span class="idx">3</span>
        <h2>考勤内容</h2>
      </div>
      <div class="card-body">
        <div class="form-row">

          <div class="field" id="rowDate">
            <label for="fDate">时间</label>
            <input type="date" id="fDate">
          </div>

          <!-- 时间段 + 小时数自动计算（≥0.5 小时） -->
          <div class="sub-row" id="rangeBlock" hidden>
            <div class="field">
              <div class="time-row">
                <select id="fStart"></select>
                <span class="sep">至</span>
                <select id="fEnd"></select>
              </div>
            </div>
            <span id="fHours"></span>
          </div>

          <div class="field" id="rowNote">
            <input type="text" id="fNote" placeholder="备注事由…">
          </div>

        </div>

        <!-- 常用说明：按钮列表，点击即以追加方式填入备注事由（A+B+B 可多次叠加） -->
        <div class="preset-box">
          <span class="preset-label">常用说明：</span>
          <div class="preset-list" id="presetList"></div>
        </div>
        <!-- 待保存内容预览 + 保存（同行，底部对齐） -->
        <div class="save-row">
          <div class="summary pv-empty" id="summary">尚未选择人员与类别</div>
          <button id="submitBtn" disabled>添加</button>
        </div>
      </div>
    </section>

    <!-- ============ 区域四：提交与记录 ============ -->
    <section class="card" id="secAction">
      <div class="card-body">
        <div class="rec-toolbar">
          <span class="rec-count" id="recCount">本月考勤记录 共 0 条</span>
          <button id="submitRecordsBtn" class="btn-rec-submit" disabled>提交</button>
          <button id="reviewBtn" class="btn-rec-action" disabled>审核</button>
          <button id="approveBtn" class="btn-rec-action" disabled>批准</button>
          <button id="printBtn" class="btn-rec-action" disabled>打印</button>
        </div>
        <div class="records" id="records">
          <p class="empty">暂无记录</p>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
/* =====================================================================
   考勤登记 —— 框架版（二稿）
   四区域：1 选择人员  2 选择类别  3 考勤内容  4 提交与记录
   - PEOPLE / GROUPS / CATS 为占位数据源，接后端时替换即可。
   - 加班/调休/年假/病假/事假/其它 = 选择时间段（≥0.5 小时），小时数自动计算。
   - 记录暂存在 localStorage，submit() 内留 TODO 未接后端。
   ===================================================================== */

function $(s){ return document.querySelector(s); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toMin(t){ var p = t.split(':'); return parseInt(p[0],10) * 60 + parseInt(p[1],10); }
function dateStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
/* 节假日兜底表（2026，依据国务院放假安排 / timor.tech）；登录后若有 Waline 数据则覆盖 */
function expandRanges(ranges){
  var out = [];
  ranges.forEach(function(r){
    var s = r[0].split('-'), e = r[1].split('-');
    var d0 = new Date(+s[0], +s[1]-1, +s[2]), d1 = new Date(+e[0], +e[1]-1, +e[2]);
    for (var d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)) out.push(dateStr(d));
  });
  return out;
}
var FALLBACK_HOLIDAYS = {
  year: 2026,
  holidays: expandRanges([
    ['2026-01-01','2026-01-03'], ['2026-02-15','2026-02-23'], ['2026-04-04','2026-04-06'],
    ['2026-05-01','2026-05-05'], ['2026-06-19','2026-06-21'], ['2026-09-25','2026-09-27'],
    ['2026-10-01','2026-10-07']
  ]),
  makeup: ['2026-01-04','2026-02-14','2026-02-28','2026-05-09','2026-09-20','2026-10-10']  // 调休补班（上班日）
};
var HOLIDAYS = { year: 2026, holidays: FALLBACK_HOLIDAYS.holidays.slice(), makeup: FALLBACK_HOLIDAYS.makeup.slice() };
/* 加班类别：国假（法定假日）/ 双休（正常周末）/ 平时（工作日，含调休补班上班） */
function calcOtType(date){
  if (!date) return '平时';
  if (HOLIDAYS.holidays.indexOf(date) >= 0) return '国假';
  if (HOLIDAYS.makeup.indexOf(date) >= 0) return '平时';   // 调休补班=工作日
  var w = new Date(date + 'T00:00:00').getDay();
  return (w === 0 || w === 6) ? '双休' : '平时';
}

/* ---------- 半点刻度：00:00 ~ 23:30 共 48 档，分钟只给 00 / 30 ---------- */
function buildTimeSlots(sel){
  var cur = sel.value;
  sel.innerHTML = '<option value="">--:--</option>';
  for (var m = 0; m < 24 * 60; m += 30){
    var v = String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
    var o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
  sel.value = cur;                 // 重建后还原原值（若有）
}

/* ---------- 视图状态：按「是否选人 / 是否选类别」逐级显示区域，并显示前恢复默认 ---------- */
function applyView(){
  var showCat     = selPeople.size > 0;          // 选人 → 显示 选择类别
  var showContent = showCat && !!curCat;         // 选类别 → 显示 考勤内容

  // 任何隐藏/显示前恢复默认状态：被隐藏层级的下游一并归零
  if (!showCat)     curCat = null;              // 隐藏「选择类别」→ 取消类别选中
  if (!showContent){                            // 隐藏「考勤内容」→ 归零内容字段
    $('#fDate').value      = todayStr();
    $('#fStart').value     = '';
    $('#fEnd').value       = '';
    $('#fHours').textContent = '';
    $('#fNote').value      = '';
  }

  $('#secCat').hidden     = !showCat;
  $('#secContent').hidden = !showContent;

  renderCats();
  $('#rangeBlock').hidden = !curCat;
  if (curCat){
    $('#catHint').textContent = curCat.name;
    $('#catTip').textContent  = curCat.tip;
  } else {
    $('#catHint').textContent = '未选类别';
    $('#catTip').textContent  = '请先选择类别。';
  }
  updateRange();
  renderPresets();          // 切换类别时同步切换常用说明列表
  refresh();
}

/* 时间段 -> 分钟差（跨天自动 +24h） */
function rangeMinutes(){
  var s = $('#fStart').value, e = $('#fEnd').value;
  if (!s || !e) return null;
  var d = toMin(e) - toMin(s);
  if (d <= 0) d += 24 * 60;          // 结束早于开始 = 跨天
  return d;
}

/* 小时数自动计算 + 最少半小时校验 */
function updateRange(){
  var hoursEl = $('#fHours');
  if (!curCat){ refresh(); return; }

  var m = rangeMinutes();
  if (m === null){
    hoursEl.textContent = '';
    hoursEl.className = '';
  } else if (m < MIN_MINUTES){
    hoursEl.textContent = '时段不足 0.5 小时';
    hoursEl.className = 'bad';
  } else {
    hoursEl.className = '';
    hoursEl.textContent = (Math.round((m / 60) * 100) / 100) + ' 小时';
  }
  refresh();
}

function currentAmountText(){
  if (!curCat) return '';
  var s = $('#fStart').value, e = $('#fEnd').value;
  if (!s || !e) return '（未选时间段）';
  return s + ' - ' + e;
}

function rangeOK(){
  if (!curCat) return false;
  var m = rangeMinutes();
  return m !== null && m >= MIN_MINUTES;
}

/* ---------- 区域四：汇总 / 记录 ---------- */
function refresh(){

  if (!selPeople.size || !curCat){
    $('#summary').innerHTML = '<div class="pv-empty">尚未选择人员与类别</div>';
    return;

  /* 预览：一人一行 —— 序号 | 姓名 | 类别 | 日期 | 时段 | 共 X 小时 | 说明 */
  var date = $('#fDate').value || todayStr();
  var m    = rangeMinutes();
  var spanHtml, amtHtml = '';
  if (m === null) spanHtml = '<span class="warn">未选时段</span>';
  else spanHtml = esc($('#fStart').value) + ' - ' + esc($('#fEnd').value);
  amtHtml = (m !== null) ? '共 ' + (Math.round((m / 60) * 100) / 100) + ' 小时' : '';
  var note = $('#fNote').value.trim();

  $('#summary').innerHTML = Array.from(selPeople).map(function(n, i){
    return '<div class="pv-row">' +
      '<span class="pv-i">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="pv-n">' + esc(n) + '</span>' +

      '<span class="pv-t">' + spanHtml + '</span>' +

      '</div>';
  }).join('');
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

var STATUS_CLASS = { '待提交':'st-tj', '待审核':'st-sh', '待批准':'st-sp', '待审批':'st-sp', '完成':'st-ok' };

function saveRecords(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch(e){} }
function loadRecords(){
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) records = JSON.parse(raw) || []; } catch(e){ records = []; }
}

/* 保存按钮随模式切换：新增=「添加」(绿) / 修改=「修改」(橙)；并同步步骤圈字(1/2/3)配色 */
function refreshSaveBtn(){
  var b = $('#submitBtn');
  var edit = editIndex !== null;
  if (!edit){
    b.textContent = '添加';
    b.classList.remove('edit-mode');
  } else {
    b.textContent = '修改';
    b.classList.add('edit-mode');
  }
  document.body.classList.toggle('edit-mode', edit);   // 步骤圈字：添加=绿 / 修改=橙
}
function submit(){
  if (!selPeople.size || !curCat || !rangeOK()) return;

  var date   = $('#fDate').value || todayStr();
  var detail = currentAmountText();
  var hours  = curCat.mode === 'range' ? Math.round((rangeMinutes() / 60) * 100) / 100 : null;
  var note   = $('#fNote').value.trim();

  /* 修改模式：原地更新该条记录，人员/状态/时间戳保持不变，仅改 日期/时段/类别/说明 */
  if (editIndex !== null){
    var old = records[editIndex];
    records[editIndex] = {
      date: date,
      otType: calcOtType(date),
      catId: curCat.id,
      catName: curCat.name,
      color: curCat.color,
      mode: curCat.mode,
      people: old.people,
      detail: detail,
      hours: hours,
      note: note,
      status: old.status,
      ts: old.ts
    };
    editIndex = null;
    refreshSaveBtn();
    saveRecords();
    renderRecords();
    syncRecordsToWaline();
    selPeople.clear(); renderPeople();
    curCat = null; applyView();        // 同新增：保存后整体归位
    return;
  }

  /* 一人一条记录：任意列内容不同即分行，便于后续导入二维数据库 */
  var newRecs = Array.from(selPeople).map(function(name){
    return {
      date:    date,
      otType:  calcOtType(date),
      catId:   curCat.id,
      catName: curCat.name,
      color:   curCat.color,
      mode:    curCat.mode,
      people:  [name],
      detail:  detail,
      hours:   hours,

/* 自定义弹窗：替代原生 prompt/alert */
function showModal(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var mask = $('#modalMask');
    var cancel = $('#modalCancel');
    var inp = $('#modalInput');
    var wrap = $('#modalInputWrap');
    $('#modalTitle').textContent = opts.title || '';
    $('#modalMsg').textContent   = opts.message || '';
    if (opts.password){ wrap.hidden = false; inp.value = ''; inp.type = 'password'; inp.placeholder = ''; }
    else if (opts.input){ wrap.hidden = false; inp.value = ''; inp.type = 'text'; inp.placeholder = opts.input; }
    else { wrap.hidden = true; }
    cancel.hidden = !!opts.hideCancel;
    $('#modalOk').textContent = opts.okText || '确定';
    cancel.textContent = opts.cancelText || '取消';
    function finish(val){
      document.removeEventListener('keydown', onKey);
      mask.hidden = true;
      $('#modalOk').onclick = null;
      cancel.onclick = null;
      mask.onclick = null;
      resolve(val);
    }
    function onKey(ev){ if (ev.key === 'Escape') finish((opts.password || opts.input) ? null : false); }
    $('#modalOk').onclick = function(){ finish((opts.password || opts.input) ? inp.value : true); };
    cancel.onclick = function(){ finish((opts.password || opts.input) ? null : false); };
    mask.onclick = function(ev){ if (ev.target === mask) finish((opts.password || opts.input) ? null : false); };
    document.addEventListener('keydown', onKey);
    mask.hidden = false;
    if (opts.password || opts.input) setTimeout(function(){ inp.focus(); }, 0);
  });
}
function askPassword(title){
  return showModal({ title: title, password: true, okText: '确定', cancelText: '取消' });
}
function showAlert(message, title){
  return showModal({ title: title || '提示', message: message, okText: '确定', hideCancel: true });
}
function askText(title, placeholder){
  return showModal({ title: title, input: placeholder || '', okText: '确定', cancelText: '取消' });
}
/* 角色密码校验：审核 / 批准（自定义弹窗） */
async function confirmRole(role){
  var label = role === 'review' ? '审核' : '批准';
  var pwd = await askPassword('请输入' + label + '密码');
  if (pwd === null) return false;            // 取消
  var exp = role === 'review' ? PWD_REVIEW : PWD_APPROVE;
  if (pwd !== exp){ await showAlert('密码错误'); return false; }
  return true;
}
/* 删除权限：待提交直接删（无需密码）；其余按密码层级判定 */
function canDelete(status, pwd){
  if (status === '待提交') return true;                                 // 无需密码
  if (pwd === PWD_ADMIN) return true;                                  // 管理员：全部
  if (status === '待审核') return pwd === PWD_REVIEW || pwd === PWD_APPROVE;
  if (status === '待批准') return pwd === PWD_APPROVE;                  // 审核密码无权删待批准
  return false;                                                        // 完成 仅管理员可删
}

/* ---------- Waline 读写（匿名模式：数据读写均匿名、无需登录；登录仅用于管控「设置」入口。读取=公开 GET + 8s 超时 + 健壮解析） ---------- */

/* 读取登录用户：与 Waline 客户端同套存储键（WALINE_USER / @waline/user / waline_user），兼容 OAuth 重定向后写入 */
/* Waline 登录组件：用官方库驱动登录态，避免手写 OAuth 导致回调后登录态无法回写 localStorage */
var walineInstance = null;
function initWaline(){
  if (!CLOUD_BASE) return;
  import('./lib/waline.js').then(function(mod){
    try {
      walineInstance = mod.init({
        el: '#walineLoginMount',
        serverURL: WALINE_SERVER,
        lang: 'zh-CN',
        login: 'enable',
        onLogin: onWalineLogin,
        onLogout: onWalineLogout
      });
    } catch(e){ console.warn('[Waline] init 失败', e); }
  }).catch(function(e){ console.warn('[Waline] 库加载失败（请通过 http 访问本页，file:// 下 ES module 受限）', e); });
}
function onWalineLogin(user){
  try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e){}
  applyUser(user);
  loadPeople(); loadHolidays(); loadRecordsFromWaline();
}
function onWalineLogout(){
  try { localStorage.removeItem('WALINE_USER'); } catch(e){}
  try { localStorage.removeItem('@waline/user'); } catch(e){}
  try { localStorage.removeItem('waline_user'); } catch(e){}
  try { sessionStorage.removeItem('WALINE_USER'); } catch(e){}
  try { sessionStorage.removeItem('@waline/user'); } catch(e){}
  setLoggedOut();
}
/* 触发登录：优先用库的 login()（若有），否则走定制登录页跳转（与库内部一致：/ui/login?lng=&redirect=） */
function doLogin(){
  if (walineInstance && typeof walineInstance.login === 'function'){ walineInstance.login(); return; }
  if (!CLOUD_BASE){ showAlert('请先在脚本顶部配置 WALINE_SERVER'); return; }
  var back = location.href.split('#')[0];
  location.href = CLOUD_BASE.replace(/\/$/, '') + '/ui/login?lng=zh-CN&redirect=' + encodeURIComponent(back);
}

function getWalineUser(){
  try {
    var keys = ['WALINE_USER', '@waline/user', 'waline_user'];
    var user = null;
    for (var i = 0; i < keys.length; i++){
      try { var v = localStorage.getItem(keys[i]); if (v){ user = JSON.parse(v); if (user && (user.display_name || user.nick || user.name)) break; } } catch(e){ user = null; }
    }
    if (!user){ try { var sv = sessionStorage.getItem('WALINE_USER') || sessionStorage.getItem('@waline/user'); if (sv){ user = JSON.parse(sv); if (!user || !(user.display_name || user.nick || user.name)) user = null; } } catch(e){ user = null; } }
    if (!user) return null;
    user.display_name = (user.display_name || user.nick || user.name || '').trim();
    if (!user.display_name) return null;
    user.email = user.email || user.mail || '';
    user.token = user.token || '';
    return user;
  } catch(e){ return null; }
}
function walineToken(u){
  var t = (u && u.token) || '';
  if (!t){ try { var s = JSON.parse(localStorage.getItem('WALINE_USER') || '{}'); if (s.token) t = s.token; } catch(e){} }
  return t;
}
/* 健壮解析：去除 Waline 管理后台可能的 HTML/markdown 污染，定位 JSON 大括号并解析 */
function robustParse(raw){
  if (!raw) return null;
  var s = String(raw).replace(/<[^>]*>/g, '').replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  var st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch(e){ return null; }
}
/* 拉取某 path 下最新一条有效记录（带 8s 超时），返回 { oid, obj } 或 null */
function fetchCloudRecord(path){
  var p = fetch(CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(path), { credentials: 'include' })
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(resp){
      var records = (resp.data && resp.data.data) || [];
      var best = null;
      for (var i = 0; i < records.length; i++){
        var rec = records[i];
        var obj = robustParse(rec.orig || rec.comment || '');
        if (obj && obj.v === 1){
          var oid = parseInt(rec.objectId, 10) || 0;
          if (!best || oid > best.oid) best = { oid: oid, obj: obj };
        }
      }
      return best;
    });
  var timer = new Promise(function(res, rej){ setTimeout(function(){ rej('timeout'); }, 8000); });
  return Promise.race([p, timer]).then(function(b){ return b; }).catch(function(){ return null; });
}
/* 匿名写入：Waline 开放匿名评论，数据写库无需登录（登录仅管控设置入口）。
   匿名评论需 nick+mail，使用固定匿名身份；每次均以 POST 新建一条（匿名无法持 token 做 PUT 更新），
   读取端 fetchCloudRecord 按 objectId 取最新一条，重复条目不影响读取。 */
var ANON_NICK = '考勤系统';
var ANON_MAIL = 'noreply@waline.snowhoo.net';
function pushCloudRecord(path, obj, oidRef){
  if (!CLOUD_BASE) return Promise.resolve(null);
  var payload = JSON.stringify({ comment: JSON.stringify(obj), url: path, nick: ANON_NICK, mail: ANON_MAIL, link: '', ua: navigator.userAgent });
  return fetch(CLOUD_BASE + '/api/comment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, credentials: 'include' })
    .then(function(r){ return r.json().then(function(j){ if (r.ok && j && j.data && j.data.objectId && oidRef) oidRef.oid = parseInt(j.data.objectId, 10); return r; }); })
    .then(function(r){ return r.ok ? (oidRef || {}) : null; })
    .catch(function(){ return null; });
}

/* 节假日：从 Waline 读取（公开接口，匿名）覆盖兜底表，供加班类别计算 */
async function loadHolidays(){
  var best = await fetchCloudRecord(HOLIDAY_PATH);
  if (best && best.obj && best.obj.holidays){
    HOLIDAYS = {
      year: best.obj.year || HOLIDAYS.year,
      holidays: (best.obj.holidays || []).map(function(h){ return h.date || h; }),
      makeup:   (best.obj.makeup   || []).map(function(m){ return m.date || m; })
    };
  }
}
/* 考勤记录：整体作为一条 JSON 匿名写入 Waline（RECORDS_PATH），每次新建一条，读取取最新 */
var RECORDS_PATH = '/kaoqing/records';
var recordsOid = { oid: 0 };
async function syncRecordsToWaline(){
  var cur = await fetchCloudRecord(RECORDS_PATH);
  if (cur) recordsOid.oid = cur.oid;
  var payload = { v: 1, type: 'records', updatedAt: Date.now(), records: records };
  await pushCloudRecord(RECORDS_PATH, payload, recordsOid);
}
/* 读取后：云端有记录则以云为准；本地有记录且云端空则上传 */
async function loadRecordsFromWaline(){
  var best = await fetchCloudRecord(RECORDS_PATH);
  if (best && best.obj && best.obj.records && best.obj.records.length){
    recordsOid.oid = best.oid;
    records = best.obj.records;
    saveRecords(); renderRecords();
  } else if (records.length){
    await syncRecordsToWaline();
  }
}

/* 从 timor.tech 获取当年（可改）节假日，整理后写入 Waline（更新优先，避免重复） */
var holidayOid = { oid: 0 };
async function syncHolidays(){
  closeSettings();
  if (!CLOUD_BASE){ showAlert('请先在脚本顶部配置 WALINE_SERVER'); return; }
  var year = new Date().getFullYear();
  var txt = await askText('获取节假日年份', '默认 ' + year + '，可修改');
  if (txt === null) return;
  txt = (txt || '').trim();
  if (txt){ if (/^\d{4}$/.test(txt)) year = parseInt(txt, 10); else { showAlert('年份格式不正确（应为 4 位数字）'); return; } }

  var res;
  try {
    var r = await fetch('https://timor.tech/api/holiday/year/' + year + '/?type=Y');
    res = await r.json();
  } catch(e){ showAlert('获取 timor.tech 失败：' + e.message); return; }
  if (!res || res.code !== 0){ showAlert('timor.tech 返回异常，可能该年数据尚未发布'); return; }

  var holidays = [], makeup = [];
  if (res.holiday) Object.keys(res.holiday).forEach(function(k){
    var it = res.holiday[k];
    var item = { date: it.date || (year + '-' + k), name: it.name, wage: it.wage };
    if (it.holiday === true) holidays.push(item);   // 国假/休息日
    else makeup.push(item);                          // 调休补班（holiday:false）
  });

  var cur = await fetchCloudRecord(HOLIDAY_PATH);
  var isUpdate = !!(cur && cur.oid);
  if (cur) holidayOid.oid = cur.oid;
  var payload = { v: 1, type: 'holiday', year: year, updatedAt: Date.now(), holidays: holidays, makeup: makeup };
  HOLIDAYS = { year: year, holidays: holidays.map(function(h){ return h.date; }), makeup: makeup.map(function(m){ return m.date; }) };
  var res2 = await pushCloudRecord(HOLIDAY_PATH, payload, holidayOid);
  if (res2){
    showAlert('已写入 Waline\n路径：' + HOLIDAY_PATH + '\n' + year + ' 年：国假/休息 ' + holidays.length + ' 天，调休补班 ' + makeup.length + ' 天。' + (isUpdate ? '\n（已覆盖更新既有记录）' : '\n（已新建记录）'));
  } else {
    showAlert('写入 Waline 失败，请检查网络或权限');
  }
}
$('#syncHolidayBtn').addEventListener('click', syncHolidays);

/* ---------- 人员配置：从 Waline 读取替换前端人员；写入 13 人 → Waline ---------- */
var peopleOid = { oid: 0 };
function rebuildGroups(){
  var seen = {}; var gs = [];
  PEOPLE_FULL.forEach(function(p){ if (p.group && !seen[p.group]){ seen[p.group] = true; gs.push(p.group); } });
  GROUPS = ['全部'].concat(gs);
}
/* 读取 Waline 中的人员，成功则替换前端 PEOPLE；无 Waline / 未登录 / 失败则保留种子 */
async function loadPeople(){
  var best = await fetchCloudRecord(PEOPLE_PATH);
  if (best && best.obj && best.obj.people && best.obj.people.length){
    peopleOid.oid = best.oid;
    PEOPLE_FULL = best.obj.people;
    PEOPLE = PEOPLE_FULL.map(function(p){ return { n:p.name, g:p.group }; });
    rebuildGroups(); renderGroups(); renderPeople(); applyView();
  }
}
/* 把内置 13 人（含 8 字段）写入 Waline（更新优先），并立即以该数据刷新前端 */
async function syncPeople(){
  closeSettings();
  if (!CLOUD_BASE){ showAlert('请先在脚本顶部配置 WALINE_SERVER'); return; }
  var cur = await fetchCloudRecord(PEOPLE_PATH);
  var isUpdate = !!(cur && cur.oid);
  if (cur) peopleOid.oid = cur.oid;
  var payload = { v: 1, type: 'people', updatedAt: Date.now(), people: SEED_PEOPLE_FULL };
  var res = await pushCloudRecord(PEOPLE_PATH, payload, peopleOid);
  if (res){
    PEOPLE_FULL = SEED_PEOPLE_FULL.slice();
    PEOPLE = PEOPLE_FULL.map(function(p){ return { n:p.name, g:p.group }; });
    rebuildGroups(); renderGroups(); renderPeople(); applyView();
    showAlert('已写入 Waline\n路径：' + PEOPLE_PATH + '\n共 ' + SEED_PEOPLE_FULL.length + ' 人（含 id/姓名/性别/手机号/一级部门/二级部门/考勤组/权限）。\n性别、手机号留空，可在 Waline 后台补充。' + (isUpdate ? '\n（已覆盖更新既有记录）' : '\n（已新建记录）'));
  } else {
    showAlert('写入 Waline 失败，请检查网络或权限');
  }
}
function renderPeopleTable(list){
  var cols = ['ID','姓名','性别','手机号','一级部门','二级部门','考勤组','权限'];
  var html = '<thead><tr>' + cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
  list.forEach(function(p){
    html += '<tr>' + [p.id,p.name,p.gender,p.phone,p.dept1,p.dept2,p.group,p.permission]
      .map(function(v){ return '<td>' + (v === '' || v == null ? '<span class="muted">—</span>' : String(v)) + '</td>'; }).join('') + '</tr>';
  });
  html += '</tbody>';
  $('#peopleTable').innerHTML = html;
}
async function openPeopleConfig(){
  closeSettings();
  if (!CLOUD_BASE){ showAlert('请先在脚本顶部配置 WALINE_SERVER'); return; }
  var best = null;
  try { best = await fetchCloudRecord(PEOPLE_PATH); } catch(e){ best = null; }
  var list = (best && best.obj && best.obj.people && best.obj.people.length) ? best.obj.people : PEOPLE_FULL;
  renderPeopleTable(list);
  $('#peopleMask').hidden = false;
}
$('#peopleConfigBtn').addEventListener('click', openPeopleConfig);
$('#peopleSync').addEventListener('click', syncPeople);
$('#peopleClose').addEventListener('click', function(){ $('#peopleMask').hidden = true; });
$('#peopleMask').addEventListener('click', function(e){ if (e.target === $('#peopleMask')) $('#peopleMask').hidden = true; });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('#peopleMask').hidden) $('#peopleMask').hidden = true;
});

/* ---------- 初始化 ---------- */
(function init(){
  $('#fDate').value = todayStr();
  buildTimeSlots($('#fStart'));
  buildTimeSlots($('#fEnd'));
  renderGroups();
  renderPeople();
  applyView();
  loadRecords();
  renderRecords();
  renderPresets();
  refreshSaveBtn();          // 初始：新增模式「添加」(绿)
  $('#companyName').textContent = COMPANY_NAME;
  // 打开页面即直接读取 Waline 同步人员 / 节假日 / 考勤记录（读为公开接口，无需登录）
  loadPeople();
  loadHolidays();
  loadRecordsFromWaline();
  initWaline();             // 初始化 Waline 登录组件（驱动 onLogin 回写登录态）
  checkLogin();              // 检测 Waline 登录态（登录后进一步用云端对齐 + 激活设置）
})();
</script>
