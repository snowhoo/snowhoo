---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Hexo 文章阅读器</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

#app{position:relative;width:100%;height:100%;overflow:hidden}

.card{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.25,.46,.45,.94),opacity .38s}
.card.left{transform:translateX(-100%);opacity:0;pointer-events:none}
.card.center{transform:translateX(0);opacity:1;z-index:2}
.card.right{transform:translateX(100%);opacity:0;pointer-events:none}

.image-gallery{position:relative;width:100%;flex-shrink:0;overflow:hidden;background:#000}
.image-gallery .gallery-track{display:flex;transition:transform .3s ease;height:calc(100vh / 4);width:100%}
.image-gallery .gallery-track img{flex:0 0 100%;height:100%;object-fit:cover}
.image-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10}
.image-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.image-dot.active{background:#fff;width:14px;border-radius:2px}

.card-title{flex-shrink:0;padding:14px 18px 10px;background:#fff;border-bottom:1px solid #f0f0f0}
.card-title h1{font-size:1.2rem;font-weight:500;line-height:1.35;color:#222;margin-bottom:4px}
.card-title .meta{font-size:.78rem;color:#999}

.card-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 60px;background:#fafafa}
.card-content::-webkit-scrollbar{width:0}
.card-content .body p{line-height:1.5;margin-bottom:10px;font-size:1.1rem;font-weight:300;color:#333}
.card-content .body .no-content{text-align:center;color:#999;padding:40px 0;font-size:.9rem}
.card-content .body strong,.card-content .body b{font-weight:500;color:#222}

/* 底部导航右侧浮窗 */
.reader-float-wrap{position:relative;display:flex;align-items:center}
.reader-float-btn{width:32px;height:32px;border-radius:50%;background:#e94560;color:#fff;font-size:.65rem;font-weight:600;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;transition:transform .2s,background .2s}
.reader-float-btn:active{transform:scale(.92)}
.reader-float-btn:hover{background:#d63850}

.theme-btn{width:32px;height:32px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:16px;height:16px}

/* 分类筛选菜单 */
.cat-wrap{position:relative;display:flex;align-items:center}
.cat-btn{border:none;background:transparent;color:#666;font-size:.72rem;cursor:pointer;outline:none;padding:2px 4px;white-space:nowrap}
.cat-btn:active{opacity:.6}
.cat-menu{position:absolute;bottom:28px;left:0;z-index:200;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden;opacity:0;transform:translateY(6px) scale(.95);pointer-events:none;transition:opacity .15s ease,transform .15s ease;transform-origin:bottom left;min-width:80px;max-height:240px;overflow-y:auto}
.cat-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.cat-menu::-webkit-scrollbar{width:0}
.cat-menu-item{display:block;width:100%;padding:8px 14px;border:none;background:none;color:#333;font-size:.75rem;cursor:pointer;text-align:left;white-space:nowrap;transition:background .15s}
.cat-menu-item:hover{background:#f5f5f5}
.cat-menu-item.active{color:#e94560;font-weight:500}

@media(prefers-color-scheme:dark){
  .cat-btn{color:#999}
  .cat-menu{background:#1e1e1e}
  .cat-menu-item{color:#ccc}
  .cat-menu-item:hover{background:#2a2a2a}
  .cat-menu-item.active{color:#e94560}
}
[data-theme="dark"]{
  .cat-btn{color:#999}
  .cat-menu{background:#1e1e1e}
  .cat-menu-item{color:#ccc}
  .cat-menu-item:hover{background:#2a2a2a}
  .cat-menu-item.active{color:#e94560}
}

.reader-float-menu{position:absolute;bottom:40px;right:0;z-index:200;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:opacity .2s ease,transform .2s ease;transform-origin:bottom right}
.reader-float-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.reader-float-menu a{display:flex;align-items:center;padding:10px 16px;color:#333;text-decoration:none;font-size:.82rem;font-weight:500;white-space:nowrap;transition:background .2s}
.reader-float-menu a:hover{background:#f5f5f5}
.menu-indicator{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:6px;vertical-align:middle}
.menu-indicator.dot{width:8px;height:8px;border-radius:50%}
.menu-indicator.circulated{width:18px;height:18px;border-radius:50%;color:#fff;font-size:.6rem;font-weight:600;line-height:18px;text-align:center}

@media(prefers-color-scheme:dark){
  .reader-float-menu{background:#1e1e1e}
  .reader-float-menu a{color:#ddd}
  .reader-float-menu a:hover{background:#2a2a2a}
}

/* Lightbox 图片放大 */
.lightbox{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .3s ease}
.lightbox.show{display:flex;opacity:1}
.lightbox .lightbox-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;touch-action:pan-y}
.lightbox .lightbox-img-wrap img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6);transform:scale(.9);transition:transform .3s ease;pointer-events:none}
.lightbox.show .lightbox-img-wrap img{transform:scale(1)}
.lightbox .close-btn{position:absolute;top:20px;right:20px;width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:50%;border:none;color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:10}
.lightbox .close-btn:hover{background:rgba(255,255,255,.3)}
.lightbox .lb-nav{position:absolute;top:0;bottom:0;width:40%;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:2rem;user-select:none;transition:color .2s}
.lightbox .lb-nav:hover{color:rgba(255,255,255,.9)}
.lightbox .lb-nav.lb-prev{left:0}
.lightbox .lb-nav.lb-next{right:0}
.lightbox .lb-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:.8rem;background:rgba(0,0,0,.4);padding:3px 12px;border-radius:12px;z-index:10;pointer-events:none}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:44px;background:#fff;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:.8rem;user-select:none;-webkit-user-select:none}
.bottom-nav .page-btn{display:flex;align-items:center;gap:4px;padding:4px 16px;border-radius:4px;cursor:pointer;color:#666}
.bottom-nav .page-btn:active{background:rgba(0,0,0,.05)}
.page-nav-group{display:flex;align-items:center;gap:2px}
.page-nav-btn{padding:4px 6px;cursor:pointer;color:#999;font-size:.72rem;user-select:none}
.page-nav-btn:active{background:rgba(0,0,0,.05)}

/* 功能图标 - 浮动在导航栏上方 */
.function-icons{position:fixed;bottom:48px;left:12px;z-index:99;display:flex;align-items:center;gap:16px;padding:6px 0;background:rgba(0,0,0,0);pointer-events:auto}
.func-btn{width:24px;height:24px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.func-btn:active{transform:scale(.92)}
.func-btn svg{width:18px;height:18px;fill:#999}

.swipe-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:rgba(0,0,0,.55);color:#fff;padding:6px 16px;border-radius:20px;font-size:.75rem;opacity:1;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.swipe-hint.hidden{opacity:0}

.loading-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:#764ba2;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:.9rem;color:#999}
.loading-sub{font-size:.78rem;color:#bbb;margin-top:6px}

@media(min-width:769px){
  #app{max-width:480px;margin:0 auto;border-left:1px solid #eee;border-right:1px solid #eee}
}

@media(prefers-color-scheme:dark){
  .card-title{background:#1a1a1a;border-color:#333}
  .card-title h1{color:#eee}
  .card-title .meta{color:#666}
  .card-content{background:#121212}
  .card-content .body p{color:#ccc}
  .card-content .body strong,.card-content .body b{color:#eee}
  .bottom-nav{background:#1a1a1a;border-color:#333}
  .bottom-nav .page-btn{color:#999}
  .bottom-nav .page-btn:active{background:rgba(255,255,255,.08)}
  .page-nav-btn{color:#666}
  .page-nav-btn:active{background:rgba(255,255,255,.08)}
  .reader-float-menu{background:#1e1e1e}
  .reader-float-menu a{color:#ddd}
  .reader-float-menu a:hover{background:#2a2a2a}
}
[data-theme="dark"]{
  .card-title{background:#1a1a1a;border-color:#333}
  .card-title h1{color:#eee}
  .card-title .meta{color:#666}
  .card-content{background:#121212}
  .card-content .body p{color:#ccc}
  .card-content .body strong,.card-content .body b{color:#eee}
  .bottom-nav{background:#1a1a1a;border-color:#333}
  .bottom-nav .page-btn{color:#999}
  .bottom-nav .page-btn:active{background:rgba(255,255,255,.08)}
  .page-nav-btn{color:#666}
  .page-nav-btn:active{background:rgba(255,255,255,.08)}
  .reader-float-menu{background:#1e1e1e}
  .reader-float-menu a{color:#ddd}
  .reader-float-menu a:hover{background:#2a2a2a}
}
</style>

<script>
const OWNER = 'snowhoo';
const REPO = 'snowhoo';
const BRANCH = 'source';
const POSTS_PATH = 'source/_posts';

let POSTS = [];
let currentIndex = 0;
let currentCategory = '';
const STORAGE_KEY = 'reader_page_idx';
const CAT_KEY = 'reader_cat';
let startX = 0, startY = 0, moveX = 0, moveY = 0;
let isDragging = false;
let hintVisible = true;
const app = document.getElementById('app');
const pageBtn = document.getElementById('pageBtn');
const hintEl = document.getElementById('hint');
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const loadingSub = document.getElementById('loadingSub');
const catBtn = document.getElementById('catBtn');
const catMenu = document.getElementById('catMenu');

// ===== 获取文章列表（从同域名 /posts.json 读取） =====
async function fetchFileList() {
  const resp = await fetch('/posts.json');
  if (!resp.ok) throw new Error('获取文章列表失败 (HTTP ' + resp.status + ')');
  const names = await resp.json();
  return names.map(name => ({ name, type: 'file' }));
}

async function fetchRawContent(filename, signal) {
  // 从同域名加载（构建时复制到 public/_posts/）
  const url = `/_posts/${encodeURIComponent(filename)}`;
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error('读取 ' + filename + ' 失败');
  return await resp.text();
}

// ===== Front-matter 解析 =====
function parseFrontMatter(content) {
  let data = {};
  let body = content;
  if (body.startsWith('---')) {
    const lines = body.split('\n');
    const endIdx = lines.findIndex((l, i) => i > 0 && l.trim().startsWith('---'));
    if (endIdx !== -1) {
      const head = lines.slice(1, endIdx);
      const closeLine = lines[endIdx].trim();
      const restAfterClose = closeLine.slice(3); // 提取 "---" 之后的内容
      const bodyLines = lines.slice(endIdx + 1);
      if (restAfterClose) bodyLines.unshift(restAfterClose);
      body = bodyLines.join('\n').trim();
      let currentKey = null, currentArr = [];
      head.forEach(line => {
        const arrMatch = line.match(/^\s+-\s+(.+)$/);
        if (arrMatch && currentKey) { currentArr.push(arrMatch[1].trim()); return; }
        if (currentKey && currentArr.length > 0) { data[currentKey] = currentArr; currentArr = []; }
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.substring(0, colonIdx).trim();
          const val = line.substring(colonIdx + 1).trim();
          if (val) {
            data[key] = val.replace(/^["']|["']$/g, '');
            currentKey = null;
          } else {
            currentKey = key;
            currentArr = [];
          }
        }
      });
      if (currentKey && currentArr.length > 0) data[currentKey] = currentArr;
    }
  }
  return { data, body };
}

// ===== 提取正文中的图片 =====
function extractImages(body) {
  const imgs = [];
  // 匹配 Markdown 图片语法 ![]()
  const mdRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
  let match;
  while ((match = mdRegex.exec(body)) !== null) {
    if (imgs.indexOf(match[2]) === -1) imgs.push(match[2]);
  }
  // 匹配 HTML <img> 标签
  const htmlRegex = /<img[^>]+src="([^"]+)"[^>]*>/g;
  while ((match = htmlRegex.exec(body)) !== null) {
    if (imgs.indexOf(match[1]) === -1) imgs.push(match[1]);
  }
  return imgs;
}

// ===== Markdown 转 HTML（只保留粗体，清除其他格式） =====
function mdToText(md) {
  return md
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '')
    .replace(/<img[^>]+>/g, '')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1')
    .replace(/#{1,6}\s+(.+)$/gm, '$1')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/^-\s+(.+)$/gm, '$1')
    .replace(/<\/?span[^>]*>/g, '')
    .replace(/<\/?font[^>]*>/g, '')
    .replace(/<\/?em[^>]*>/g, '')
    .replace(/<\/?i[^>]*>/g, '')
    .replace(/\s*style\s*=\s*["'][^"']*["']/gi, '')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>').replace(/$/, '</p>');
}

// ===== 图片路径解析 =====
function resolveImageUrl(src) {
  // 绝对URL → 直接使用
  if (src.startsWith('http://') || src.startsWith('https://')) return src;
  // 站内路径 → 直接使用（部署到 Pages 后 images 在站内根路径下）
  if (src.startsWith('/')) return src;
  // 相对路径 → 使用 GitHub raw 原始文件地址
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${POSTS_PATH}/${src}`;
}

// ===== 分类筛选 =====
function getFilteredPosts() {
  if (!currentCategory) return POSTS;
  if (currentCategory === '__uncategorized__') {
    return POSTS.filter(function(p) {
      var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
      return cList.length === 0;
    });
  }
  return POSTS.filter(function(p) {
    var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
    return cList.some(function(c) { return c === currentCategory; });
  });
}

function buildCategoryList() {
  var cats = {};
  var uncategorized = 0;
  POSTS.forEach(function(p) {
    var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
    if (cList.length === 0) {
      uncategorized++;
    } else {
      cList.forEach(function(c) {
        if (c) cats[c] = (cats[c] || 0) + 1;
      });
    }
  });
  var keys = Object.keys(cats).sort();
  catMenu.innerHTML = '';
  // 全部选项
  var allItem = document.createElement('button');
  allItem.className = 'cat-menu-item' + (!currentCategory ? ' active' : '');
  allItem.textContent = '全部 (' + POSTS.length + ')';
  allItem.dataset.value = '';
  allItem.addEventListener('click', function() { selectCategory(this.dataset.value); });
  catMenu.appendChild(allItem);
  // 分类选项
  keys.forEach(function(k) {
    var item = document.createElement('button');
    item.className = 'cat-menu-item' + (currentCategory === k ? ' active' : '');
    item.textContent = k + ' (' + cats[k] + ')';
    item.dataset.value = k;
    item.addEventListener('click', function() { selectCategory(this.dataset.value); });
    catMenu.appendChild(item);
  });
  // 未分类选项
  if (uncategorized > 0) {
    var uncatItem = document.createElement('button');
    uncatItem.className = 'cat-menu-item' + (currentCategory === '__uncategorized__' ? ' active' : '');
    uncatItem.textContent = '未分类 (' + uncategorized + ')';
    uncatItem.dataset.value = '__uncategorized__';
    uncatItem.addEventListener('click', function() { selectCategory(this.dataset.value); });
    catMenu.appendChild(uncatItem);
  }
  catBtn.textContent = currentCategory === '__uncategorized__' ? '未分类' : (currentCategory || '全部');
}

function selectCategory(val) {
  currentCategory = val;
  localStorage.setItem(CAT_KEY, currentCategory);
  catMenu.classList.remove('show');
  catBtn.textContent = currentCategory === '__uncategorized__' ? '未分类' : (currentCategory || '全部');
  // 更新菜单项高亮
  var items = catMenu.querySelectorAll('.cat-menu-item');
  items.forEach(function(item) { item.classList.toggle('active', item.dataset.value === currentCategory); });
  // 重绘卡片
  currentIndex = 0;
  app.innerHTML = '';
  createPageNav();
  createCards();
  updateCards();
}

// ===== 兼容性 polyfill：Promise.allSettled（微信/QQ X5 内核不支持） =====
if (typeof Promise.allSettled !== 'function') {
  Promise.allSettled = function(promises) {
    return Promise.all(promises.map(function(p) {
      return Promise.resolve(p).then(function(value) {
        return { status: 'fulfilled', value: value };
      }, function(reason) {
        return { status: 'rejected', reason: reason };
      });
    }));
  };
}

// ===== 主流程（分批加载，渐进渲染） =====
async function main() {
  try {
    const files = await fetchFileList();
    const mdFiles = files
      .filter(f => f.name.endsWith('.md') && f.type === 'file')
      .map(f => f.name)
      .sort()
      .reverse();
    
    const total = mdFiles.length;
    loadingText.textContent = '共 ' + total + ' 篇文章，正在读取...';
    
    const BATCH_SIZE = 5;
    POSTS = [];
    let loadedCount = 0;
    let initialized = false;
    let firstBatch = true;
    
    for (let i = 0; i < total; i += BATCH_SIZE) {
      const batch = mdFiles.slice(i, i + BATCH_SIZE);
      console.log('加载批次: ' + (i / BATCH_SIZE + 1) + ', 文件: ' + batch[0]?.slice(0, 20) + '...');
      
      // 并行读取当前批次（用 allSettled 避免单个失败卡死）
      const results = await Promise.allSettled(batch.map(async (filename) => {
        loadedCount++;
        if (loadingSub) loadingSub.textContent = loadedCount + ' / ' + total + '  ' + filename.slice(0, 30);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        try {
          const raw = await fetchRawContent(filename, controller.signal);
          const { data, body } = parseFrontMatter(raw);
          if (data.title) {
            // 提取图片，并将封面图放在最前面
            let images = extractImages(body);
            if (data.cover && !images.includes(data.cover)) {
              images.unshift(data.cover);
            }
            return {
              title: data.title,
              date: data.date ? data.date.split(' ')[0] : '',
              cover: data.cover || '',
              images: images,
              categories: Array.isArray(data.categories) ? data.categories : (data.categories ? [data.categories] : []),
              content: body
            };
          }
        } catch (e) {
          console.warn('跳过 ' + filename + ': ' + e.message);
        } finally {
          clearTimeout(timeoutId);
        }
        return null;
      }));
      
      // 过滤出成功的文章
      const validPosts = results
        .filter(r => r.status === 'fulfilled' && r.value !== null)
        .map(r => r.value);
      POSTS.push(...validPosts);
      
      if (firstBatch) {
        // 第一批：按日期排序后统一渲染，绑定事件，隐藏 loading
        POSTS.sort((a, b) => {
          const da = new Date(a.date), db = new Date(b.date);
          return db - da || (da ? 1 : -1);
        });
        app.innerHTML = '';
        createPageNav();
        // 恢复保存的页码
        var savedIdx = localStorage.getItem(STORAGE_KEY);
        if (savedIdx !== null) {
          var n = parseInt(savedIdx, 10);
          if (n >= 0 && n < POSTS.length) currentIndex = n;
        }
        // 先构建分类列表（恢复保存的分类），再创建卡片
        buildCategoryList();
        createCards();
        bindEvents();
        initialized = true;
        updateCards();
        
        firstBatch = false;
        loadingEl.classList.add('hide');
        setTimeout(() => loadingEl.remove(), 500);
        await new Promise(r => setTimeout(r, 50));
      } else {
        // 后续批次：只更新进度，不重新渲染（保持已有卡片可见）
        // 全部加载完成后一次排序重绘
      }
    }
    
    // 全部加载完成：按日期排序并重新渲染
    POSTS.sort((a, b) => {
      const da = new Date(a.date), db = new Date(b.date);
      return db - da || (da ? 1 : -1);
    });
    app.innerHTML = '';
    createPageNav();
    // 恢复保存的页码
    var savedIdx = localStorage.getItem(STORAGE_KEY);
    if (savedIdx !== null) {
      var n = parseInt(savedIdx, 10);
      if (n >= 0 && n < POSTS.length) currentIndex = n;
    }
    // 构建分类列表（需先恢复保存的分类）
    buildCategoryList();
    createCards();
    updateCards();
    
    // 更新进度提示
    if (loadingSub) loadingSub.textContent = '全部加载完成，共 ' + POSTS.length + ' 篇文章';
    setTimeout(() => { if (loadingText) loadingText.textContent = '完成'; }, 100);
    setTimeout(() => { hintEl.classList.add('hidden'); hintVisible = false; }, 5000);
  } catch (e) {
    console.error('main() 错误:', e);
    if (loadingText) loadingText.textContent = '加载失败: ' + e.message;
    console.error(e);
  }
}

function createCards() {
  var posts = getFilteredPosts();
  posts.forEach(function(post, i) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    if (i < currentIndex) card.classList.add('left');
    if (i === currentIndex) card.classList.add('center');
    if (i > currentIndex) card.classList.add('right');

    // Image gallery
    const galleryDiv = document.createElement('div');
    galleryDiv.className = 'image-gallery';
    galleryDiv.style.height = 'calc(100vh / 4)';
    
    if (post.images.length > 0) {
      const track = document.createElement('div');
      track.className = 'gallery-track';
      post.images.forEach(function(src, idx) {
        const img = document.createElement('img');
        img.src = 'https://picsum.photos/seed/reader_' + i + '_' + idx + '/800/400';
        img.alt = post.title;
        img.draggable = false;
        img.style.cursor = 'zoom-in';
        img.dataset.listIdx = idx;
        img.onclick = function(e) {
          e.stopPropagation();
          var list = post.images.map(function(s) { return resolveImageUrl(s); });
          openLightbox(list, idx);
        };
        // Load real image
        img.dataset.src = resolveImageUrl(src);
        var loader = new Image();
        loader.onload = function() { img.src = img.dataset.src; };
        loader.src = img.dataset.src;
        track.appendChild(img);
      });
      galleryDiv.appendChild(track);
      
      if (post.images.length > 1) {
        const dots = document.createElement('div');
        dots.className = 'image-dots';
        post.images.forEach((_, j) => {
          const dot = document.createElement('div');
          dot.className = 'image-dot' + (j === 0 ? ' active' : '');
          dots.appendChild(dot);
        });
        galleryDiv.appendChild(dots);
        
        let imgIndex = 0, imgStartX = 0, imgPageWidth = 0, imgStartX2 = 0;
        // 缓存图片实际渲染宽度
        function getImgWidth() {
          const first = track.firstElementChild;
          return first ? first.getBoundingClientRect().width : galleryDiv.getBoundingClientRect().width;
        }
        galleryDiv.addEventListener('touchstart', e => {
          e.stopPropagation();
          imgStartX = e.touches[0].clientX;
          imgPageWidth = getImgWidth();
          track.style.transition = 'none';
        }, { passive: true });
        galleryDiv.addEventListener('touchmove', e => {
          e.stopPropagation();
          const dx = e.touches[0].clientX - imgStartX;
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth + dx) + 'px)';
        }, { passive: true });
        galleryDiv.addEventListener('touchend', e => {
          e.stopPropagation();
          const diff = e.changedTouches[0].clientX - imgStartX;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          // 回到touchend时重新获取精确宽度（防止布局变化）
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
        // 鼠标拖拽图片翻页（PC端）
        galleryDiv.addEventListener('mousedown', e => {
          e.stopPropagation();
          imgStartX2 = e.clientX;
          imgPageWidth = getImgWidth();
          track.style.transition = 'none';
        });
        galleryDiv.addEventListener('mousemove', e => {
          if (imgStartX2 === 0) return;
          e.stopPropagation();
          const dx = e.clientX - imgStartX2;
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth + dx) + 'px)';
        });
        galleryDiv.addEventListener('mouseup', e => {
          if (imgStartX2 === 0) return;
          e.stopPropagation();
          const diff = e.clientX - imgStartX2;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          imgStartX2 = 0;
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
        galleryDiv.addEventListener('mouseleave', e => {
          if (imgStartX2 === 0) return;
          const diff = e.clientX - imgStartX2;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          imgStartX2 = 0;
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
      }
    } else {
      const track = document.createElement('div');
      track.className = 'gallery-track';
      const img = document.createElement('img');
      img.src = 'https://picsum.photos/seed/reader_' + i + '/800/400';
      img.alt = post.title;
      img.draggable = false;
      img.style.cursor = 'zoom-in';
      img.onclick = function(e) {
        e.stopPropagation();
        openLightbox([img.src], 0);
      };
      track.appendChild(img);
      galleryDiv.appendChild(track);
    }

    // Title
    const titleDiv = document.createElement('div');
    titleDiv.className = 'card-title';
    titleDiv.innerHTML = '<h1>' + escapeHtml(post.title) + '</h1><div class="meta">' + post.date + '</div>';

    // Content
    const contentDiv = document.createElement('div');
    contentDiv.className = 'card-content';
    var bodyHtml = mdToText(post.content);
    if (!bodyHtml.replace(/<[^>]+>/g, '').trim()) bodyHtml = '<p class="no-content">\u6682\u65E0\u6B63\u6587<br><br>\u6709\u65F6\u5019<br>\u9002\u5F53\u7559\u767D\u6BD4\u6587\u5B57<br>\u66F4\u5177\u5185\u6DB5<br>\u800C\u6C89\u9ED8\u6BD4\u5450\u558A<br>\u66F4\u5F70\u663E\u529B\u91CF</p>';
    contentDiv.innerHTML = '<div class="body">' + bodyHtml + '</div>';

    card.appendChild(galleryDiv);
    card.appendChild(titleDiv);
    card.appendChild(contentDiv);
    app.appendChild(card);
  });
}

function updateCards() {
  var total = getFilteredPosts().length;

  const cards = app.querySelectorAll('.card');
  cards.forEach((card, i) => {
    card.className = 'card';
    if (i < currentIndex) card.classList.add('left');
    if (i === currentIndex) card.classList.add('center');
    if (i > currentIndex) card.classList.add('right');
  });

    hintEl.classList.remove('hidden');
    setTimeout(() => { hintEl.classList.add('hidden'); hintVisible = false; }, 3000);

function bindEvents() {
  app.addEventListener('touchstart', onTouchStart, { passive: true });
  app.addEventListener('touchmove', onTouchMove, { passive: false });
  app.addEventListener('touchend', onTouchEnd);
  app.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  document.addEventListener('keydown', onKeyDown);
}

function onTouchStart(e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isDragging = true; }
function onTouchMove(e) {
  if (!isDragging) return;
  moveX = e.touches[0].clientX - startX;
  moveY = e.touches[0].clientY - startY;
  if (Math.abs(moveX) > Math.abs(moveY)) e.preventDefault();
}
function onTouchEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  const threshold = 60;
  if (moveX < -threshold && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (moveX > threshold && currentIndex > 0) { currentIndex--; updateCards(); }
  moveX = 0; moveY = 0;
}
function onMouseDown(e) { startX = e.clientX; startY = e.clientY; isDragging = true; app.style.cursor = 'grabbing'; }
function onMouseMove(e) {
  if (!isDragging) return;
  moveX = e.clientX - startX;
  moveY = e.clientY - startY;
  if (Math.abs(moveX) > Math.abs(moveY)) e.preventDefault();
}
function onMouseUp(e) {
  if (!isDragging) return;
  isDragging = false;
  app.style.cursor = '';
  const threshold = 60;
  if (moveX < -threshold && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (moveX > threshold && currentIndex > 0) { currentIndex--; updateCards(); }
  moveX = 0; moveY = 0;
}
function onKeyDown(e) {
  if (e.key === 'ArrowRight' && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateCards(); }
}

function escapeHtml(str) {

}

const lbNext = document.getElementById('lbNext');
const lbCounter = document.getElementById('lbCounter');

var lbIndex = 0;

function renderLightbox() {
  if (!lbImages.length) return;
  lightboxImg.src = lbImages[lbIndex];
  lbPrev.style.display = lbIndex > 0 ? 'flex' : 'none';
  lbNext.style.display = lbIndex < lbImages.length - 1 ? 'flex' : 'none';
  lbCounter.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
}

function openLightbox(list, idx) {
  lbImages = list;
  lbIndex = idx;
  renderLightbox();
  lightbox.classList.add('show');
}

function closeLightbox() {
  lightbox.classList.remove('show');
  setTimeout(function() { lightboxImg.src = ''; }, 300);
}

function lbPrevImg() {
  if (lbIndex > 0) { lbIndex--; renderLightbox(); }
}

function lbNextImg() {
  if (lbIndex < lbImages.length - 1) { lbIndex++; renderLightbox(); }
}

document.addEventListener('keydown', function(e) {
  if (!lightbox.classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();

});

    circle.textContent = p.icon;
    var label = document.createElement('span');
    label.style.cssText = 'font-size:.7rem;color:#666';
    label.textContent = p.label;
    item.appendChild(circle);
    item.appendChild(label);
    item.onclick = function() {
      closePanel();
      var ct = t + '\n' + (s || '') + '\n' + url;
      if (p.action === 'wechat') {
        copyText(ct, '\u94FE\u63A5\u5DF2\u590D\u5236\uFF0C\u6253\u5F00\u5FAE\u4FE1\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB');
      } else if (p.action === 'moments') {
        copyText(ct, '\u94FE\u63A5\u5DF2\u590D\u5236\uFF0C\u6253\u5F00\u5FAE\u4FE1\u7C98\u8D34\u5206\u4EAB\u5230\u670B\u53CB\u5708');
      } else if (p.action === 'copy') {
        copyText(ct, '\u5DF2\u590D\u5236\u94FE\u63A5\uFF0C\u53EF\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB');
      } else {
        window.open(p.url, '_blank');
      }
    };
    grid.appendChild(item);
  });
  panel.appendChild(grid);
  var cancel = document.createElement('div');
  cancel.style.cssText = 'text-align:center;padding-top:12px;margin-top:12px;border-top:1px solid #eee;color:#999;font-size:.8rem;cursor:pointer';
  cancel.textContent = '\u53D6\u6D88';
  cancel.onclick = closePanel;
  panel.appendChild(cancel);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  requestAnimationFrame(function() { overlay.style.opacity = '1'; panel.style.transform = 'translateY(0)'; });
  function closePanel() {
    overlay.style.opacity = '0'; panel.style.transform = 'translateY(100%)';
    setTimeout(function() { overlay.remove(); }, 250);
  }
  overlay.onclick = function(e) { if (e.target === overlay) closePanel(); };
}
function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { showTip(msg); }).catch(function() { copyFallback(text, msg); });
  } else {
    copyFallback(text, msg);
  }
}
function copyFallback(text, msg) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showTip(msg); } catch(e) {}
  document.body.removeChild(ta);
}
function showTip(msg) {
  msg = msg || '\u5DF2\u590D\u5236\u94FE\u63A5\uFF0C\u53EF\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB';
  var tip = document.createElement('div');
  tip.textContent = msg;
  tip.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:.78rem;opacity:1;transition:opacity .3s;white-space:nowrap';
  document.body.appendChild(tip);
  setTimeout(function() { tip.style.opacity = '0'; setTimeout(function() { tip.remove(); }, 300); }, 2000);
}
document.getElementById('shareBtn').onclick = shareArticle;

main();
</script>
