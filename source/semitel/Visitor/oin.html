<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="registrar.config.js"></script>
<script>
/* 公司名称/logo：读配置渲染页头品牌行（未配置则不显示） */
(function(){
  /* 提前与云端 Waline 建立连接（DNS+TLS 与表单填写并行，提交时省去握手时间） */
  try {
    var _srv = (window.CLOUD_WALINE || '').trim() || 'https://waline.snowhoo.net';
    var _l = document.createElement('link'); _l.rel = 'preconnect'; _l.href = _srv; _l.crossOrigin = '';
    document.head.appendChild(_l);
  } catch(e){}
  function renderBrand(){
    var n = (window.COMPANY_NAME || '').trim(), l = (window.COMPANY_LOGO || '').trim();
    if (!n && !l) return;
    var hd = document.getElementById('pageHead'); if (!hd) return;
    var b = document.createElement('div'); b.className = 'brand';
    if (l){ var im = document.createElement('img'); im.className = 'brand-logo'; im.src = l; im.alt = '';
      im.onerror = function(){ im.style.display = 'none'; }; b.appendChild(im); }
    if (n){ var sp = document.createElement('span'); sp.className = 'brand-name'; sp.textContent = n; b.appendChild(sp); }
    hd.insertBefore(b, hd.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderBrand);
  else renderBrand();
})();
</script>
<title>访客登记</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --ink:#1f2733; --sub:#6b7785;
    --line:#e2e8f0; --brand:#2563eb; --brand2:#1d4ed8; --ok:#16a34a; --err:#dc2626;
    --pass:#1d4ed8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{max-width:100%;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));}
  header.top{text-align:center;padding:0px}
  header.top h1{font-size:22px;margin:20px 0 0;letter-spacing:2px;font-weight:700}
  header.top p{margin:6px 0 0;color:var(--sub);font-size:13px;letter-spacing:1px}
  header.top .tabs{display:flex;width:100%;margin-top:14px;padding:4px;background:#eef2f7;border-radius:12px}
  header.top .tab{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;height:52px;
    border-radius:9px;font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;text-decoration:none;
    color:var(--sub);background:transparent;transition:.15s}
  header.top .tab:hover{color:var(--brand)}
  header.top .tab.active{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(15,23,42,.18);cursor:default}
  header.top .tab[data-tab="reg"].active{background:#16a34a;color:#fff}
  header.top .tab-hint{margin:10px 0 10px;font-size:12px;color:var(--sub);text-align:center;letter-spacing:1px}
  /* 已发访客证子页签：自动识别 / 手动查询 */
  .subtabs{display:flex;margin:10px 0 16px;padding:3px;background:#eef2f7;border-radius:10px}
  .subtab{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;height:40px;
    border-radius:8px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;
    transition:background .15s,color .15s;user-select:none}
  .subtab:hover{color:var(--brand)}
  .subtab.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.12);cursor:default}
  header.top .brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px}
  header.top .brand-logo{height:32px;object-fit:contain}
  header.top .brand-name{font-size:17px;font-weight:700;letter-spacing:0px}
  .pass-top .pt-logo{height:26px;max-width:110px;object-fit:contain;display:block}
  .card{}
  .field{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .field input[type=text],.field input[type=tel]{flex:1;min-width:0;width:auto;height:44px;font-size:16px;padding:0 14px;
    border:1px solid var(--line);border-radius:12px;background:#fbfdff;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s}
  .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.15);background:#fff}
  .field input.invalid{border-color:var(--err);box-shadow:0 0 0 3px rgba(220,38,38,.15);background:#fff}
  .field .ferr{flex-basis:100%;margin-top:0px;font-size:12px;color:var(--err);line-height:1.4}
  .reasons{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* 勾选框标签：独立完整样式 */
  .chk{display:flex;width:auto;margin:0;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line);
    border-radius:12px;background:#fbfdff;cursor:pointer;user-select:none;font-size:15px;transition:border-color .15s,background .15s}
  .chk input{width:20px;height:20px;accent-color:var(--brand)}
  .chk.on{border-color:var(--brand);background:#eef4ff}
  .submit{width:100%;height:52px;margin-top:4px;border:none;border-radius:14px;
    background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;font-size:17px;font-weight:700;
    letter-spacing:3px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.35);transition:transform .08s,opacity .15s}
  .submit:active{transform:translateY(1px)}
  #submitBtn{background:linear-gradient(180deg,#16a34a,#16a34a);box-shadow:0 0px 0px rgba(22,163,74,.35)}
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;text-align:center;justify-content: space-around}
  .msg:empty{display:none}   /* 无提示时不占位 */
  /* 访客离厂页签：查询输入框与查询按钮同行，按钮缩小 */
  #leaveView .lf-row{display:flex;gap:10px;align-items:stretch;margin:0px 0 14px}
  #leaveView #q{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 14px;font-size:15px;background:#fff;box-sizing:border-box;outline:none}
  #leaveSubmitBtn{width:auto;height:46px;margin-top:0;padding:0 22px;font-size:15px;letter-spacing:1px;flex-shrink:0;
    background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:none}
  .msg.ok{/*color:var(--ok)*/} .msg.err{/*color:var(--err)*/}

  /* 访客通行卡（胸卡样式） */
  .pass{max-width:100%;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(29,78,216,.25);border:1px solid #d7e0f5}
  .pass-top{background:linear-gradient(135deg,var(--pass),#3b82f6);color:#fff;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:center}
  .pass-top .t1{font-size:16px;font-weight:700;letter-spacing:1px}
  .pass-sub{text-align:center;padding:10px 18px 0;font-size:12px;color:#6b7785;letter-spacing:2px}
  .pass-title{display:flex;flex-direction:column;line-height:1.8}
  .pass-title .zh{font-size:15px;font-weight:700;color:var(--ink)}
  .pass-title .en{font-size:11px;color:#6b7785;letter-spacing:2px}
  .pass-body{padding:18px}
  .pass-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .pass-photo{flex:0 0 auto;width:92px;height:116px;border-radius:10px;background:#eef2f7;
    border:1px dashed #c4cedd;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#9aa7b8;overflow:hidden}
  .pass-photo svg{width:48px;height:48px;display:block}
  .pass-photo .ph-txt{font-size:11px;margin-top:6px;letter-spacing:1px;color:#9aa7b8}
  /* 性别着色：由身份证第17位判定，无法判断时保持原样（无 g-* 类）。淡彩50%透明度，避免过重 */
  .pass-photo.g-female{background:rgba(249,168,212,.2);border-color:#fbcfe8;color:rgba(236,72,153,.2)}
  .pass-photo.g-female .ph-txt{color:rgba(236,72,153,.2)}
  .pass-photo.g-male{background:rgba(147,197,253,.2);border-color:#bfdbfe;color:rgba(37,99,235,.2)}
  .pass-photo.g-male .ph-txt{color:rgba(37,99,235,.2)}
  .pass-idbox{flex:1;min-width:0}
  .pass-idbox .nm{font-size:24px;font-weight:800;line-height:1.2;word-break:break-all}
  .pass-idbox .un{font-size:13px;color:var(--sub);margin-top:5px;word-break:break-all}
  .pass-idbox .pid{font-size:12px;color:var(--sub);margin-top:7px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .pass-info{border-top:1px dashed var(--line);padding-top:0px}
  .pass-info .row{display:flex;font-size:14px;padding:5px 0;border-bottom:1px solid #f1f5f9}
  .pass-info .row .k{color:var(--sub);width:74px;flex:0 0 auto}
  .pass-info .row .v{flex:1;text-align:right;word-break:break-all}
  .pass-id{margin-top:14px;background:#f1f5fb;border-radius:10px;padding:10px 12px;text-align:center}
  .pass-id .lbl{font-size:11px;color:var(--sub);letter-spacing:1px}
  .pass-id .num{font-size:18px;font-weight:800;letter-spacing:1px;color:var(--pass);font-family:ui-monospace,Menlo,Consolas,monospace}
  .pass-bar{display:block;margin:14px auto 0;max-width:300px;height:auto}
  .pass-tip{text-align:center;color:var(--pass);font-size:13px;font-weight:600;padding:12px 16px 4px}
  .pass-note{text-align:center;color:var(--sub);font-size:11px;letter-spacing:1px;padding:0 16px 14px;opacity:.85}
  .hint{margin-top:16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
  /* 等待遮罩 + 模拟进度条：提交等待期间的视觉反馈，避免误以为卡死（与 out/oout 同款） */
  .wait-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:99}
  .wait-mask.show{display:flex}
  .wait-mask .wm-box{background:#fff;border-radius:14px;padding:20px 22px;width:270px;text-align:center;
    box-shadow:0 10px 30px rgba(15,23,42,.25)}
  .wait-mask .wm-txt{font-size:14px;color:var(--ink);font-weight:600;min-height:20px}
  .wait-mask .wm-sub{font-size:12px;color:var(--sub);margin-top:4px;min-height:16px}
  .wait-mask .wm-bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:12px}
  .wait-mask .wm-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));
    border-radius:999px;transition:width .25s ease}
  /* 自写确认弹窗（替代原生 confirm） */
  .cf-box{width:290px;text-align:left;padding:22px}
  .cf-box .cf-msg{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5}
  .cf-box .cf-sub{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
  .cf-box .cf-btns{display:flex;gap:10px;margin-top:18px}
  .cf-box .cf-btns button{flex:1;height:40px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .cf-box .cf-no{background:#eef2f7;color:var(--ink)}
  .cf-box .cf-yes{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}

/* 我的访客证：本机已登记缓存（localStorage），卡片化 + 按钮签离 */
.mypass-wrap{}
.mypass-list{display:flex;flex-direction:column;gap:14px}
.mypass-item{position:relative}
.mypass-item .pass{position:relative}
.mypass-item.done .pass{filter:grayscale(1);opacity:.82}
.mypass-bar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);z-index:6;color:#dc2626;border:4px solid #dc2626;border-radius:12px;padding:6px 20px;font-size:24px;font-weight:800;letter-spacing:6px;opacity:.85;pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.1);text-shadow:0 0 2px rgba(220,38,38,.35)}
.mypass-co{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 12px;border:1px solid #16a34a;border-radius:8px;background:#fff;color:#16a34a;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;box-sizing:border-box}
.mypass-co:disabled{opacity:.6;cursor:not-allowed}
.mypass-item .pass-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
/* 「正在访问」按钮 + 「离厂请点击」提示：呼吸跳动动画 */
.co-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.co-tip{font-size:10px;color:#16a34a;letter-spacing:1px}
.co-tip .co-ico{width:11px;height:11px;vertical-align:-1.5px;margin-right:1px}
.mypass-co.co-pulse{animation:coPulse 2.4s ease-in-out infinite}
@keyframes coPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(22,163,74,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 7px rgba(22,163,74,0)}}
@keyframes coBlink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<script>
/* 条码组件：页面打开后后台无感懒加载，不阻塞表单提交 */
var _bcLoading = false, _bcQueue = [];
function ensureBarcodeLib(cb){
  if (window.JsBarcode){ cb(); return; }
  _bcQueue.push(cb);
  if (_bcLoading) return;
  _bcLoading = true;
  var s = document.createElement('script');
  s.src = 'JsBarcode.all.min.js'; s.async = true;
  s.onload = function(){ var q = _bcQueue; _bcQueue = []; q.forEach(function(fn){ try{ fn(); }catch(e){} }); };
  s.onerror = function(){ /* 加载失败则条码留空 */ };
  document.head.appendChild(s);
}
/* 打开即后台拉取（非阻塞） */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ ensureBarcodeLib(function(){}); });
else ensureBarcodeLib(function(){});
</script>
</head>
<body>
<div class="app">
  <header class="top" id="pageHead">
    <div class="tabs">
      <div class="tab active" data-tab="reg">访客登记</div>
      <div class="tab" data-tab="issued">已发访客证</div>
    </div>
    <p class="tab-hint" id="tabHint">请如实填写以下信息</p>
  </header>

  <div class="card" id="formCard">
    <form id="f" autocomplete="off">
      <div class="field">
        <input type="text" id="name" placeholder="请输入姓名" maxlength="20">
      </div>
      <div class="field">
        <input type="text" id="idNumber" placeholder="请输入身份证号" maxlength="18" inputmode="text" autocapitalize="characters">
        <span class="ferr" id="idErr"></span>
      </div>
      <div class="field">
        <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
      </div>
      <div class="field">
        <input type="text" id="unit" placeholder="请输入来访单位（选填）" maxlength="40">
      </div>
      <div class="field">
        <input type="text" id="visitPerson" placeholder="请输入被拜访人姓名" maxlength="20">
      </div>
      <div class="field">
        <div class="reasons" id="reasons">
          <label class="chk"><input type="checkbox" value="商务洽谈">商务洽谈</label>
          <label class="chk"><input type="checkbox" value="业务交流">业务交流</label>
          <label class="chk"><input type="checkbox" value="私人拜访">私人拜访</label>
          <label class="chk"><input type="checkbox" value="已有预约">已有预约</label>
          <label class="chk"><input type="checkbox" value="行政监督">行政监督</label>
          <label class="chk"><input type="checkbox" value="其它拜访">其它拜访</label>
        </div>
      </div>
      <button type="submit" class="submit" id="submitBtn">提交登记</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div id="issuedWrap" style="display:none">
    <div class="subtabs">
      <div class="subtab active" data-sub="auto">自动识别</div>
      <div class="subtab" data-sub="manual">手动查询</div>
    </div>
    <div id="myPasses"></div>
    <div id="leaveView" style="display:none">
      <form id="lf" autocomplete="off">
        <div class="lf-row">
          <input type="text" id="q" placeholder="" maxlength="40">
          <button type="submit" class="submit" id="leaveSubmitBtn">查询</button>
        </div>
        <div class="msg" id="leaveMsg"></div>
      </form>
      <div id="result"></div>
      <p class="hint">离厂登记将记录离开时间，完成访客出入闭环。</p>
    </div>
  </div>
</div>

<script>
/* ====== 在线 Waline 连接配置（外网，固定云端地址） ====== */
var WALINE_SERVER = (window.CLOUD_WALINE || '').trim() || 'https://waline.snowhoo.net';  // 优先取配置
var CLOUD_BASE    = WALINE_SERVER;
var RECORDS_PATH  = '/visitor/records';
var ANON_NICK     = '访客登记';
var ANON_MAIL     = 'visitor@local';

/* 实例预热：页面打开即后台发一次轻量 GET，提前唤醒云端 serverless 实例，
   访客填完表单提交时命中热实例，避开数秒级冷启动。失败静默，不影响使用。
   ⚠ 2026-10-05：pageSize 必须用 100，绝不能用 1 —— 本地 waline-mini 对某个 path
   在进程内「首次请求的 pageSize」有粘性，发过 1 会把该 path 永久锁成每页1条。 */
try {
  fetch(CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(RECORDS_PATH)
    + '&page=1&pageSize=100&sortBy=insertedAt_desc&lang=zh-CN', { cache: 'no-store' })
    .catch(function(){});
} catch(e){}

/* ====== PII 轻量可逆加密（仅混淆，非强加密；在线存密文，本地同步时还原） ====== */
var PII_KEY = 'Vt9@Kq3#';
function xorStr(s, key){ var o=''; for (var i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length)); return o; }
function obfPII(s){ if(!s) return s; try { return btoa(unescape(encodeURIComponent(xorStr(s, PII_KEY)))); } catch(e){ return s; } }
function deobfPII(s){ if(!s) return s; try { return xorStr(decodeURIComponent(escape(atob(s))), PII_KEY); } catch(e){ return s; } }

/* ====== 工具 ====== */
function robustParse(raw){
  if (!raw) return null;
  var s = String(raw).replace(/<[^>]*>/g, '').replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  var st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch(e){ return null; }
}
function setMsg(t, cls){ var m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }
function fmtTime(ts){
  if (!ts) return '';
  var d = new Date(ts);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 由 id 反推访问时间：v + 16 位微秒时间戳 -> 毫秒；旧格式/非法 id 返回 0 */
function idToTime(id){
  if (!id || id.charAt(0) !== 'v') return 0;
  var d = id.slice(1);
  if (!/^\d{16}$/.test(d)) return 0;
  return parseInt(d, 10) / 1000;
}
function visitTimeOf(v){ return idToTime(v && v.id) || (v && v.enterTime) || (v && v.createdAt) || 0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* PII 脱敏：身份证保留前6后4，手机保留前3后4 */
function maskId(s){ s=String(s==null?'':s); if(s.length<10) return s; var mid=''; for(var i=0;i<s.length-10;i++) mid+='*'; return s.slice(0,6)+mid+s.slice(-4); }
function maskPhone(s){ s=String(s==null?'':s); if(s.length<7) return s; return s.slice(0,3)+'****'+s.slice(-4); }
/* 身份证合法性校验：18位格式 + 地区码 + 出生日期 + MOD 11-2 校验位。
   返回 true 或 具体错误文案（字符串）。 */
function validIdCard(id){
  id = String(id == null ? '' : id).trim().toUpperCase();
  if (!id) return '请填写身份证号';
  if (!/^\d{17}[\dX]$/.test(id)) return '身份证号应为18位（末位可为数字或X）';
  var prov = id.slice(0, 2);
  if (!/^(1[1-5]|2[1-3]|3[1-7]|4[1-6]|5[0-4]|6[1-5]|7[1]|8[12]|91)$/.test(prov)) return '身份证地区码无效';
  var y = +id.slice(6, 10), m = +id.slice(10, 12), d = +id.slice(12, 14);
  if (m < 1 || m > 12) return '出生月份无效';
  var dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '出生日期无效';
  var now = new Date(); now.setHours(0, 0, 0, 0);
  if (dt.getTime() > now.getTime()) return '出生日期不能是未来';
  var w = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
  var c = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
  var s = 0;
  for (var i = 0; i < 17; i++) s += (+id.charAt(i)) * w[i];
  if (c[s % 11] !== id.charAt(17)) return '身份证校验位错误，请核对';
  return true;
}
/* ID：v + 16 位时间戳（毫秒时间戳 ×1000 + 亚毫秒微秒尾数，构成 16 位微秒时间戳） */
function genId(){
  var micro = Date.now() * 1000 + Math.floor((performance.now() % 1) * 1000);
  return 'v' + String(micro);
}

/* ====== 写入在线 Waline（匿名 POST，无 Authorization；命中限流自动退避重试） ====== */
async function postComment(rec, opt){
  opt = opt || {};
  var statusCb = opt.status || function(){};
  var delays = [0, 20, 20, 20];
  for (var i = 0; i < delays.length; i++){
    if (i > 0){
      await new Promise(function(res){ setTimeout(res, delays[i] * 1000); });
      statusCb('提交较频繁，系统限流中，正在自动重试（' + i + '/3）…');
    }
    try {
      var body = { comment: JSON.stringify(rec), url: RECORDS_PATH, nick: rec.name || ANON_NICK, mail: ANON_MAIL, link: '', ua: navigator.userAgent };
      var resp = await fetch(CLOUD_BASE + '/api/comment?lang=zh-CN', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var j = await resp.json().catch(function(){ return {}; });
      if (j && j.errno && j.errno !== 0){
        if ((j.errmsg||'').indexOf('太快') >= 0) continue;
        throw new Error('保存失败（' + j.errno + (j.errmsg ? '：' + j.errmsg : '') + '）');
      }
      if (!resp.ok) throw new Error('网络错误 HTTP ' + resp.status);
      return (j.data && j.data.objectId) || 0;
    } catch(e){
      if ((e.message||'').indexOf('太快') >= 0) continue;
      throw e;
    }
  }
  throw new Error('提交过于频繁，请稍候约 1 分钟后再试');
}

/* ====== 读取全部访客（GET，按 id 去重保留最新版本；墓碑=删除） ====== */
async function fetchAllComments(path){
  /* 根因已定位（2026-10-05）：waline-mini 对某个 path 在进程内「首次请求的 pageSize」有粘性，
     一旦有人发过 pageSize=1，该 path 就被服务端永久锁成每页1条（count 仍报全量），
     之后传 pageSize=100 也被忽略 —— 表现即「查询后只剩一条」。此前的 pageSize=1 兜底等于自己下毒。
     根治：本函数严禁 pageSize=1，始终 pageSize=100，数据>100 才翻页。若仍见首页1条但 count>1，
     说明该 path 已被外源 ps=1 毒化，需重启 waline-mini 清毒（本函数不再尝试用 ps=1 自救）。 */
  var PAGE = 100;
  async function _page(page){
    var url = CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(path)
            + '&page=' + page + '&pageSize=' + PAGE + '&sortBy=insertedAt_desc&lang=zh-CN';
    var r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var resp = await r.json();
    return { dd: (resp.data && resp.data.data) || [], total: (resp.data && resp.data.count) || 0 };
  }
  var out = [], page = 1, guard = 0;
  while (true){
    var r = await _page(page);
    if (page === 1 && r.total > 1 && r.dd.length === 1){
      console.warn('[fetchAllComments] path=' + path + ' 疑似被 pageSize=1 毒化（首页1条/count=' + r.total + '），请重启 waline-mini 清除进程内粘性缓存');
    }
    out = out.concat(r.dd);
    if (r.dd.length < PAGE || out.length >= r.total) break;   // 取全或末页
    if (++guard > 50) break;                                  // 安全阀，防异常死循环
    page++;
  }
  return out;
}
async function loadVisitors(){
  var all = await fetchAllComments(RECORDS_PATH);
  var map = {};
  all.forEach(function(c){
    var rec = robustParse(c.orig || c.comment || '');
    if (!rec || rec.type !== 'visitor' || !rec.id) return;
    var oid = parseInt(c.objectId, 10) || 0;
    if (!map[rec.id] || oid > map[rec.id].oid) map[rec.id] = { oid: oid, rec: rec };
  });
  var list = [];
  for (var id in map){ if (!map[id].rec.deleted) list.push(map[id].rec); }
  list.sort(function(a,b){ return visitTimeOf(b) - visitTimeOf(a); });
  return list;
}

/* 由身份证号第17位判断性别：奇=男(1) 偶=女(2) 无法判断=0 */
function genderFromId(raw){
  if (typeof raw !== 'string') return 0;
  var s = raw.trim();
  if (s.length !== 18) return 0;
  var d = s.charAt(16);
  if (d < '0' || d > '9') return 0;
  return (parseInt(d, 10) % 2 === 1) ? 1 : 2;
}

/* ====== 我的访客证：本机已登记缓存（localStorage），自动载入 / 卡片化 / 按钮签离 ====== */
var PASS_KEY = 'visitor_local_passes';
var FRESH_PASS = {};   /* 本会话刚提交的访客证 id -> 时间戳；跳过联网校验，避免刚写入尚未可读被误清缓存 */
function getPasses(){ try { return JSON.parse(localStorage.getItem(PASS_KEY) || '[]') || []; } catch(e){ return []; } }
function savePasses(list){ try { localStorage.setItem(PASS_KEY, JSON.stringify(list)); } catch(e){} }
function cachePass(rec){
  var list = getPasses();
  if (list.some(function(r){ return r.id === rec.id; })) return;            /* 同 id 去重 */
  list.push(rec);
  savePasses(list);
}
function removePass(id){ savePasses(getPasses().filter(function(r){ return r.id !== id; })); }
function passById(id){ return getPasses().filter(function(r){ return r.id === id; })[0]; }

/* 云端 PII 存密文，显示时需 deobfPII 还原；本地版直接用明文（见本地 in.html） */
function dispId(r){ return deobfPII(r.idNumber); }
function dispPhone(r){ return deobfPII(r.phone); }

/* 载入前联网校验每张访客证真实状态，防止「已在别处签离 / 已被删除」被错误载入：
   按 rec.id 去 waline 找最新版本 -> 已签离(已离)或已删(墓碑/查无)则清缓存不显示，在访则保留。
   查询失败(网络异常)降级为本地判定，不阻断本机已登记的正常显示。 */
var PASS_VERIFY_MAXPAGES = 20, PASS_PAGE_SIZE = 100;
async function fetchLatestById(id){
  var page = 1;
  while (page <= PASS_VERIFY_MAXPAGES){
    var url = CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(RECORDS_PATH)
      + '&page=' + page + '&pageSize=' + PASS_PAGE_SIZE + '&sortBy=insertedAt_desc&lang=zh-CN';
    var resp, j;
    try { resp = await fetch(url, { cache: 'no-store' }); j = await resp.json().catch(function(){ return {}; }); }
    catch(e){ return { err: true }; }
    var arr = (j && j.data && j.data.data) || [];
    var hit = null, hitU = -1;
    for (var i = 0; i < arr.length; i++){
      var c = arr[i];
      var rec = robustParse(c.comment);
      if (!rec || rec.id !== id) continue;
      if (c.deleted || rec.deleted) return { deleted: true };   /* 墓碑删除 */
      var u = rec.updatedAt || 0;
      if (u > hitU){ hitU = u; hit = rec; }
    }
    if (hit) return { rec: hit };
    var cnt = (j && j.data && j.data.count) || 0;
    if (!arr.length || page * PASS_PAGE_SIZE >= cnt) break;
    page++;
  }
  return { notFound: true };   /* 查无此 id：已真删，或超出扫描范围 */
}
/* 真实状态口径：status 优先，leaveTime 兜底（与全端一致） */
function isLeft(rec){ return rec.status ? (rec.status === '已离') : !!rec.leaveTime; }
async function verifyPasses(list){
  return await Promise.all(list.map(async function(rec){
    var st;
    try { st = await fetchLatestById(rec.id); } catch(e){ st = { err: true }; }
    if (st.err) return { rec: rec, keep: true };                       /* 网络异常：保留本地判定 */
    if (st.notFound || st.deleted){
      if (FRESH_PASS[rec.id]) return { rec: rec, keep: true };   /* 本会话刚提交，暂按在访保留 */
      return { rec: rec, keep: false };   /* 已删：清缓存 */
    }
    if (isLeft(st.rec)) return { rec: rec, keep: false };              /* 已签离：清缓存 */
    return { rec: rec, keep: true };
  }));
}

document.getElementById('lf').addEventListener('submit', async function(ev){

  /* 数量上子页签：找到 N 条在访记录显示「手动查询（N）」，无结果/失败恢复「手动查询」 */
  function updateManualSub(n){
    var s = document.querySelector('.subtab[data-sub="manual"]');
    if (s) s.textContent = n > 0 ? ('手动查询（' + n + '）') : '手动查询';
  }
  function showMatched(matched){
    if (!matched.length){ updateManualSub(0); setLeaveMsg('未找到匹配的访客记录', 'err'); renderResult([]); return; }
    var show = matched.filter(function(v){ return !isLeft(v); });   /* 已离厂记录不列出 */
    if (!show.length){ updateManualSub(0); setLeaveMsg('匹配记录均已离厂，无需重复签离', 'err'); renderResult([]); }
    else { updateManualSub(show.length); setLeaveMsg('', ''); renderResult(show); }   /* 清掉上一轮操作残留提示 */
  }
  try {
    /* 查询只读数据库（云端为准），绝不读本机缓存：缓存副本 status 冻结在登记时刻，
       拿来查询会掩盖恢复在访 / 别处签离等真实状态。读缓存是「已发访客证」页签的场景。 */
    VISITORS = await loadVisitors();
    showMatched(matchAll(VISITORS));
  } catch(e){
    updateManualSub(0);
    setLeaveMsg('查询失败：' + (e.message || e), 'err');
    renderResult([]);
  }
  hideMask();
  btn.disabled = false;
});

/* 离厂查询结果：与「已发访客证」共用 passItemHtml 一套卡片 */
function byIdFromVisitors(id){ return VISITORS.filter(function(x){ return x.id === id; })[0]; }
function renderResult(list){
  var box = document.getElementById('result');
  if (!list.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="mypass-list">' + list.map(function(v){
    return passItemHtml(v, isLeft(v));
  }).join('') + '</div>';
  drawBarcodes(box, byIdFromVisitors);
}

/* 统一签离委托：两页签所有「正在访问」按钮（data-leave）都走 doLeave */
document.addEventListener('click', function(e){
  var t = e.target;
    if (t && t.dataset && t.dataset.leave){
      appConfirm('确认是否离厂？', '将记录离开时间。').then(function(ok){ if (ok) doLeave(t.dataset.leave); });
    }
});

/* 统一签离写入：已发访客证 / 离厂查询 共用；数据源优先查询结果，兜底本机缓存 */
async function doLeave(id){
  var v = byIdFromVisitors(id) || passById(id);
  if (!v) return;
  var btn = document.querySelector('.mypass-co[data-leave="' + id + '"]');
  if (btn){ btn.disabled = true; btn.textContent = '签离中…'; }
  setLeaveMsg('登记离厂中…', '');
  showMask('正在登记离厂…', '正在写入记录');
  var now = Date.now();
  var rec = {
    type:'visitor', id:id, name:v.name, idNumber:v.idNumber, phone:v.phone, unit:v.unit,
    visitPerson:v.visitPerson, registrar:v.registrar, reasons:v.reasons,
    enterTime:v.enterTime, leaveTime:now, status:'已离',
    createdAt:v.createdAt||now, updatedAt:now
  };
  try {
    await postComment(rec, { status: function(t){ setLeaveMsg(t, ''); setMaskTxt(t, '系统限流退避中，请稍候'); } });
    v.status = '已离'; v.leaveTime = now;
    /* 就地盖章：直接用已更新状态的内存记录 v，不依赖 byIdFromVisitors/passById
       （已发访客证页签 VISITORS 为空、缓存即将移除，旧取数方式会拿不到 rec 导致早退卡「签离中…」） */
    markLeftCard(id, function(){ return v; });
    removePass(id);
    hideMask();   /* 卡片就地盖章已是明确反馈，不再弹文字提示 */
  } catch(err){
    hideMask();
    setLeaveMsg(err.message || '离厂登记失败', 'err');
    if (btn){ btn.disabled = false; btn.textContent = '正在访问'; }
  }
}

/* 提交成功后重置登记表单（字段清空、按钮恢复、错误提示清除），切回「访客登记」页签时为干净状态 */
function resetForm(){
  var f = document.getElementById('f');
  if (f) f.reset();
  reasonsBox.querySelectorAll('.chk.on').forEach(function(c){ c.classList.remove('on'); });
  var b = document.getElementById('submitBtn'); if (b) b.disabled = false;
  setMsg('', '');
}

/* 页签切换：访客登记(表单) / 已发访客证(子页签：自动识别 + 手动查询) */
function showTab(which){
  var regTab = document.querySelector('.tab[data-tab="reg"]');
  var issTab = document.querySelector('.tab[data-tab="issued"]');
  var formCard = document.getElementById('formCard');
  var issuedWrap = document.getElementById('issuedWrap');
  var hint = document.getElementById('tabHint');
  if (!formCard || !issuedWrap) return;
  if (which === 'issued'){
    formCard.style.display = 'none'; issuedWrap.style.display = '';
    if (regTab) regTab.classList.remove('active');
    if (issTab) issTab.classList.add('active');
    showIssuedSub(currentSub);
  } else {
    formCard.style.display = ''; issuedWrap.style.display = 'none';
    if (issTab) issTab.classList.remove('active');
    if (regTab) regTab.classList.add('active');
    if (hint) hint.textContent = '请如实填写以下信息';
  }
}
/* 已发访客证子页签：auto=自动识别(本机缓存列表) / manual=手动查询(证号/姓名/手机号) */
var currentSub = 'auto';
function showIssuedSub(which){
  currentSub = (which === 'manual') ? 'manual' : 'auto';
  document.querySelectorAll('.subtab').forEach(function(st){
    st.classList.toggle('active', st.dataset.sub === currentSub);
  });
  var mp = document.getElementById('myPasses');
  var lv = document.getElementById('leaveView');
  var hint = document.getElementById('tabHint');
  if (currentSub === 'manual'){
    if (mp) mp.style.display = 'none';
    if (lv) lv.style.display = '';
    if (hint) hint.textContent = '输入访客证号 / 完整姓名 / 手机号（至少后四位）';
  } else {
    if (lv) lv.style.display = 'none';
    if (hint) hint.textContent = '本机已登记的访客证';
    renderMyPasses();   /* 自动识别：缓存列表由 renderMyPasses 控制显隐 */
  }
}
var _regTab = document.querySelector('.tab[data-tab="reg"]');
var _issTab = document.querySelector('.tab[data-tab="issued"]');
if (_regTab) _regTab.addEventListener('click', function(){ showTab('reg'); });
if (_issTab) _issTab.addEventListener('click', function(){ showTab('issued'); });
document.querySelectorAll('.subtab').forEach(function(st){
  st.addEventListener('click', function(){ showIssuedSub(st.dataset.sub); });
});
showTab(getPasses().length ? 'issued' : 'reg');   /* 有缓存直接定位已发页签，否则登记页 */
</script>

<!-- 等待遮罩：模拟进度条（快→慢→爬行，永不到 100%，完成后直接充满） -->
<div class="wait-mask" id="waitMask">
  <div class="wm-box">
    <div class="wm-txt" id="wmTxt">处理中…</div>
    <div class="wm-sub" id="wmSub">正在与服务器通信</div>
    <div class="wm-bar"><i id="wmBar"></i></div>
  </div>
</div>
<script>
var _wmTimer = null;
function showMask(txt, sub){
  var m = document.getElementById('waitMask');
  if (!m) return;
  document.getElementById('wmTxt').textContent = txt || '处理中…';
  document.getElementById('wmSub').textContent = sub || '正在与服务器通信';
  var bar = document.getElementById('wmBar');
  bar.style.width = '0';
  m.classList.add('show');
  clearInterval(_wmTimer);
  var p = 0;
  _wmTimer = setInterval(function(){
    p += (p < 55 ? 8 : (p < 80 ? 2.5 : 0.6));   /* 快→慢→爬行，停在 92% 内等待真实完成 */
    if (p > 92) p = 92;
    bar.style.width = p + '%';
  }, 200);
}
function setMaskTxt(t, sub){
  document.getElementById('wmTxt').textContent = t;
  if (sub !== undefined) document.getElementById('wmSub').textContent = sub;
}
function hideMask(){
  clearInterval(_wmTimer); _wmTimer = null;
  var bar = document.getElementById('wmBar');
  bar.style.width = '100%';                    /* 完成时充满，视觉收尾 */
  setTimeout(function(){
    document.getElementById('waitMask').classList.remove('show');
    bar.style.width = '0';
  }, 250);
}
/* 自写确认弹窗（替代原生 confirm）：appConfirm(msg, sub) → Promise<boolean> */
function appConfirm(msg, sub){
  return new Promise(function(res){
    var m = document.getElementById('confirmMask');
    if (!m){
      m = document.createElement('div');
      m.id = 'confirmMask';
      m.className = 'wait-mask';
      m.innerHTML = '<div class="wm-box cf-box">'
        + '<div class="cf-msg"></div><div class="cf-sub"></div>'
        + '<div class="cf-btns"><button type="button" class="cf-no">取消</button>'
        + '<button type="button" class="cf-yes">确定</button></div></div>';
      document.body.appendChild(m);
    }
    m.querySelector('.cf-msg').textContent = msg;
    var sm = m.querySelector('.cf-sub');
    sm.textContent = sub || '';
    sm.style.display = sub ? '' : 'none';
    m.classList.add('show');
    function done(v){ m.classList.remove('show'); res(v); }
    m.querySelector('.cf-yes').onclick = function(){ done(true); };
    m.querySelector('.cf-no').onclick = function(){ done(false); };
    m.onclick = function(e){ if (e.target === m) done(false); };
  });
}
</script>
</body>
