---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>访客登记</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --ink:#1f2733; --sub:#6b7785;
    --line:#e2e8f0; --brand:#2563eb; --brand2:#1d4ed8; --ok:#16a34a; --err:#dc2626;
    --pass:#1d4ed8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));}
  header.top{text-align:center;padding:14px 0 10px}
  header.top h1{font-size:22px;margin:0;letter-spacing:2px;font-weight:700}
  header.top p{margin:6px 0 0;color:var(--sub);font-size:13px;letter-spacing:1px}
  .card{}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .field label .req{color:var(--err);margin-left:2px}
  .field input[type=text],.field input[type=tel]{width:100%;height:48px;font-size:16px;padding:0 14px;
    border:1px solid var(--line);border-radius:12px;background:#fbfdff;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s}
  .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.15);background:#fff}
  .field input.invalid{border-color:var(--err);box-shadow:0 0 0 3px rgba(220,38,38,.15);background:#fff}
  .field .ferr{display:block;margin-top:6px;font-size:12px;color:var(--err);line-height:1.4}
  .reasons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line);
    border-radius:12px;background:#fbfdff;cursor:pointer;user-select:none;font-size:15px;transition:border-color .15s,background .15s}
  .chk input{width:20px;height:20px;accent-color:var(--brand)}
  .chk.on{border-color:var(--brand);background:#eef4ff}
  .submit{width:100%;height:52px;margin-top:4px;border:none;border-radius:14px;
    background:linear-gradient(180deg,var(--brand),var(--brand2));color:#fff;font-size:17px;font-weight:700;
    letter-spacing:3px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.35);transition:transform .08s,opacity .15s}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;min-height:20px;font-size:14px;text-align:center}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}

  /* 访客通行卡（胸卡样式） */
  .pass{max-width:340px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(29,78,216,.25);border:1px solid #d7e0f5}
  .pass-top{background:linear-gradient(135deg,var(--pass),#3b82f6);color:#fff;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:center}
  .pass-top .t1{font-size:16px;font-weight:700;letter-spacing:2px}
  .pass-top .t2{font-size:12px;opacity:.9}
  .pass-body{padding:18px}
  .pass-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .pass-photo{flex:0 0 auto;width:92px;height:116px;border-radius:10px;background:#eef2f7;
    border:1px dashed #c4cedd;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#9aa7b8;overflow:hidden}
  .pass-photo svg{width:48px;height:48px;display:block}
  .pass-photo .ph-txt{font-size:11px;margin-top:6px;letter-spacing:1px;color:#9aa7b8}
  .pass-idbox{flex:1;min-width:0}
  .pass-idbox .nm{font-size:24px;font-weight:800;line-height:1.2;word-break:break-all}
  .pass-idbox .un{font-size:13px;color:var(--sub);margin-top:5px;word-break:break-all}
  .pass-idbox .pid{font-size:12px;color:var(--sub);margin-top:7px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .pass-info{border-top:1px dashed var(--line);padding-top:12px}
  .pass-info .row{display:flex;font-size:14px;padding:5px 0;border-bottom:1px solid #f1f5f9}
  .pass-info .row .k{color:var(--sub);width:74px;flex:0 0 auto}
  .pass-info .row .v{flex:1;text-align:right;word-break:break-all}
  .pass-id{margin-top:14px;background:#f1f5fb;border-radius:10px;padding:10px 12px;text-align:center}
  .pass-id .lbl{font-size:11px;color:var(--sub);letter-spacing:1px}
  .pass-id .num{font-size:18px;font-weight:800;letter-spacing:1px;color:var(--pass);font-family:ui-monospace,Menlo,Consolas,monospace}
  .pass-bar{display:block;margin:14px auto 0;max-width:300px;height:auto}
  .pass-tip{text-align:center;color:var(--pass);font-size:13px;font-weight:600;padding:12px 16px 4px}
  .pass-note{text-align:center;color:var(--sub);font-size:11px;letter-spacing:1px;padding:0 16px 14px;opacity:.85}
  .again{display:block;max-width:340px;margin:18px auto 0;width:100%;height:48px;border:1px solid var(--brand);
    border-radius:12px;background:#fff;color:var(--brand);font-size:15px;font-weight:600;cursor:pointer}
  .hint{margin-top:16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
  /* 长按保存访客证：全屏遮罩 + 长按图片存相册 */
  .card-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;
    flex-direction:column;z-index:50;padding:18px}
  .card-overlay img{max-width:86%;max-height:60%;border-radius:12px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .card-overlay .co-tip{color:#fff;font-size:13px;margin-top:14px;text-align:center;line-height:1.6}
  .card-overlay .co-dl{margin-top:14px;color:#fff;background:var(--brand);padding:10px 22px;border-radius:10px;
    font-size:14px;text-decoration:none}
  .card-overlay .co-close{margin-top:10px;color:#cbd5e1;background:transparent;border:1px solid #64748b;
    padding:8px 20px;border-radius:10px;font-size:13px;cursor:pointer}
</style>
<script>
/* 条码组件：页面打开后后台无感懒加载，不阻塞表单提交 */
var _bcLoading = false, _bcQueue = [];
function ensureBarcodeLib(cb){
  if (window.JsBarcode){ cb(); return; }
  _bcQueue.push(cb);
  if (_bcLoading) return;
  _bcLoading = true;
  var s = document.createElement('script');
  s.src = 'JsBarcode.all.min.js'; s.async = true;
  s.onload = function(){ var q = _bcQueue; _bcQueue = []; q.forEach(function(fn){ try{ fn(); }catch(e){} }); };
  s.onerror = function(){ /* 加载失败则条码留空 */ };
  document.head.appendChild(s);
}
/* 打开即后台拉取（非阻塞） */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ ensureBarcodeLib(function(){}); });
else ensureBarcodeLib(function(){});
</script>
</head>
<body>
<div class="app">
  <header class="top" id="pageHead">
    <h1>访客登记</h1>
    <p>请如实填写以下信息</p>
  </header>

  <div class="card" id="formCard">
    <form id="f" autocomplete="off">
      <div class="field">
        <label>访客姓名<span class="req">*</span></label>
        <input type="text" id="name" placeholder="请输入姓名" maxlength="20">
      </div>
      <div class="field">
        <label>身份证号<span class="req">*</span></label>
        <input type="text" id="idNumber" placeholder="请输入身份证号" maxlength="18" inputmode="text" autocapitalize="characters">
        <span class="ferr" id="idErr"></span>
      </div>
      <div class="field">
        <label>手机号码<span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
      </div>
      <div class="field">
        <label>单位</label>
        <input type="text" id="unit" placeholder="请输入来访单位（选填）" maxlength="40">
      </div>
      <div class="field">
        <label>拜访人<span class="req">*</span></label>
        <input type="text" id="visitPerson" placeholder="请输入被拜访人姓名" maxlength="20">
      </div>
      <div class="field">
        <label>来访事由<span class="req">*</span></label>
        <div class="reasons" id="reasons">
          <label class="chk"><input type="checkbox" value="商务拜访">商务拜访</label>
          <label class="chk"><input type="checkbox" value="业务拜访">业务拜访</label>
          <label class="chk"><input type="checkbox" value="私人拜访">私人拜访</label>
          <label class="chk"><input type="checkbox" value="预约拜访">预约拜访</label>
          <label class="chk"><input type="checkbox" value="其它拜访">其它拜访</label>
        </div>
      </div>
      <button type="submit" class="submit" id="submitBtn">提交登记</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <p class="hint">提交即完成登记。</p>
</div>

<script>
/* ====== 在线 Waline 连接配置（外网，固定云端地址） ====== */
var WALINE_SERVER = 'https://waline.snowhoo.net';
var CLOUD_BASE    = WALINE_SERVER;
var RECORDS_PATH  = '/visitor/records';
var ANON_NICK     = '访客登记';
var ANON_MAIL     = 'visitor@local';

/* ====== PII 轻量可逆加密（仅混淆，非强加密；在线存密文，本地同步时还原） ====== */
var PII_KEY = 'Vt9@Kq3#';
function xorStr(s, key){ var o=''; for (var i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length)); return o; }
function obfPII(s){ if(!s) return s; try { return btoa(unescape(encodeURIComponent(xorStr(s, PII_KEY)))); } catch(e){ return s; } }
function deobfPII(s){ if(!s) return s; try { return xorStr(decodeURIComponent(escape(atob(s))), PII_KEY); } catch(e){ return s; } }

/* ====== 工具 ====== */
function robustParse(raw){
  if (!raw) return null;
  var s = String(raw).replace(/<[^>]*>/g, '').replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  var st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch(e){ return null; }
}
function setMsg(t, cls){ var m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }
function fmtTime(ts){
  if (!ts) return '';
  var d = new Date(ts);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 由 id 反推访问时间：v + 16 位微秒时间戳 -> 毫秒；旧格式/非法 id 返回 0 */
function idToTime(id){
  if (!id || id.charAt(0) !== 'v') return 0;
  var d = id.slice(1);
  if (!/^\d{16}$/.test(d)) return 0;
  return parseInt(d, 10) / 1000;
}
function visitTimeOf(v){ return idToTime(v && v.id) || (v && v.enterTime) || (v && v.createdAt) || 0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* PII 脱敏：身份证保留前6后4，手机保留前3后4 */
function maskId(s){ s=String(s==null?'':s); if(s.length<10) return s; var mid=''; for(var i=0;i<s.length-10;i++) mid+='*'; return s.slice(0,6)+mid+s.slice(-4); }
function maskPhone(s){ s=String(s==null?'':s); if(s.length<7) return s; return s.slice(0,3)+'****'+s.slice(-4); }
/* 身份证合法性校验：18位格式 + 地区码 + 出生日期 + MOD 11-2 校验位。
   返回 true 或 具体错误文案（字符串）。 */
function validIdCard(id){
  id = String(id == null ? '' : id).trim().toUpperCase();
  if (!id) return '请填写身份证号';
  if (!/^\d{17}[\dX]$/.test(id)) return '身份证号应为18位（末位可为数字或X）';
  var prov = id.slice(0, 2);
  if (!/^(1[1-5]|2[1-3]|3[1-7]|4[1-6]|5[0-4]|6[1-5]|7[1]|8[12]|91)$/.test(prov)) return '身份证地区码无效';
  var y = +id.slice(6, 10), m = +id.slice(10, 12), d = +id.slice(12, 14);
  if (m < 1 || m > 12) return '出生月份无效';
  var dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return '出生日期无效';
  var now = new Date(); now.setHours(0, 0, 0, 0);
  if (dt.getTime() > now.getTime()) return '出生日期不能是未来';
  var w = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
  var c = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
  var s = 0;
  for (var i = 0; i < 17; i++) s += (+id.charAt(i)) * w[i];
  if (c[s % 11] !== id.charAt(17)) return '身份证校验位错误，请核对';
  return true;
}
/* ID：v + 16 位时间戳（毫秒时间戳 ×1000 + 亚毫秒微秒尾数，构成 16 位微秒时间戳） */
function genId(){
  var micro = Date.now() * 1000 + Math.floor((performance.now() % 1) * 1000);
  return 'v' + String(micro);
}

/* ====== 写入在线 Waline（匿名 POST，无 Authorization；命中限流自动退避重试） ====== */
async function postComment(rec, opt){
  opt = opt || {};
  var statusCb = opt.status || function(){};
  var delays = [0, 20, 20, 20];
  for (var i = 0; i < delays.length; i++){
    if (i > 0){
      await new Promise(function(res){ setTimeout(res, delays[i] * 1000); });
      statusCb('提交较频繁，系统限流中，正在自动重试（' + i + '/3）…');
    }
    try {
      var body = { comment: JSON.stringify(rec), url: RECORDS_PATH, nick: rec.name || ANON_NICK, mail: ANON_MAIL, link: '', ua: navigator.userAgent };
      var resp = await fetch(CLOUD_BASE + '/api/comment?lang=zh-CN', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var j = await resp.json().catch(function(){ return {}; });
      if (j && j.errno && j.errno !== 0){
        if ((j.errmsg||'').indexOf('太快') >= 0) continue;
        throw new Error('保存失败（' + j.errno + (j.errmsg ? '：' + j.errmsg : '') + '）');
      }
      if (!resp.ok) throw new Error('网络错误 HTTP ' + resp.status);
      return (j.data && j.data.objectId) || 0;
    } catch(e){
      if ((e.message||'').indexOf('太快') >= 0) continue;
      throw e;
    }
  }
  throw new Error('提交过于频繁，请稍候约 1 分钟后再试');
}

/* ====== 表单交互 ====== */
var reasonsBox = document.getElementById('reasons');
reasonsBox.addEventListener('change', function(e){
  if (e.target && e.target.type === 'checkbox') e.target.closest('.chk').classList.toggle('on', e.target.checked);
});

/* 身份证：实时校验反馈 */
var idInput = document.getElementById('idNumber');
var idErr = document.getElementById('idErr');
function showIdErr(msg){ idErr.textContent = msg || ''; idInput.classList.toggle('invalid', !!msg); }
idInput.addEventListener('input', function(){
  var v = idInput.value;
  if (/x$/.test(v)) idInput.value = v.slice(0, -1) + 'X'; /* 末位 x 自动转大写 */
  if (idErr.textContent) showIdErr('');                  /* 重新输入即清除错误提示 */
});
idInput.addEventListener('blur', function(){
  var v = idInput.value.trim();
  if (!v){ showIdErr(''); return; }
  var r = validIdCard(v);
  showIdErr(r === true ? '' : r);
});

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var name = document.getElementById('name').value.trim();
  var idNumber = document.getElementById('idNumber').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var unit = document.getElementById('unit').value.trim();
  var visitPerson = document.getElementById('visitPerson').value.trim();
  var reasons = Array.prototype.slice.call(reasonsBox.querySelectorAll('input:checked')).map(function(c){ return c.value; });

  if (!name){ setMsg('请填写访客姓名', 'err'); return; }
  if (!idNumber){ setMsg('请填写身份证号', 'err'); return; }
  var idCheck = validIdCard(idNumber);
  if (idCheck !== true){ setMsg(idCheck, 'err'); showIdErr(idCheck); return; }
  if (!/^\d{11}$/.test(phone)){ setMsg('请填写正确的 11 位手机号', 'err'); return; }
  if (!visitPerson){ setMsg('请填写拜访人', 'err'); return; }
  if (!reasons.length){ setMsg('请至少勾选一项来访事由', 'err'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; setMsg('提交中…', '');

  var now = Date.now();
  /* 身份证号/手机号在线端加密存储，本地同步时再还原 */
  var rec = {
    type: 'visitor', id: genId(), name: name, idNumber: obfPII(idNumber), phone: obfPII(phone), unit: unit,
    visitPerson: visitPerson, reasons: reasons,
    leaveTime: null, status: '在访', createdAt: now, updatedAt: now
  };
  try {
    await postComment(rec, { status: setMsg });
    showBadge(rec);
  } catch(err){
    setMsg(err.message || '提交失败，请重试', 'err');
    btn.disabled = false;
  }
});

/* 访客证长按保存图片：html2canvas 懒加载（与 JsBarcode 同策略，离线可用），
   生成后弹出遮罩，移动端长按图片即可存入相册，桌面端提供「下载图片」。 */
var _h2cLoading = false, _h2cQueue = [];
function ensureHtml2Canvas(cb){
  if (window.html2canvas){ cb(); return; }
  _h2cQueue.push(cb);
  if (_h2cLoading) return;
  _h2cLoading = true;
  var s = document.createElement('script');
  s.src = 'html2canvas.min.js'; s.async = true;
  s.onload = function(){ var q = _h2cQueue; _h2cQueue = []; q.forEach(function(fn){ try{ fn(); }catch(e){} }); };
  s.onerror = function(){ alert('图片组件加载失败，请改用截屏保存'); };
  document.head.appendChild(s);
}
function bindLongPress(el, onLong){
  if (!el) return;
  var timer = null;
  function clear(){ if (timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('touchstart', function(){ clear(); timer = setTimeout(function(){ timer = null; onLong(); }, 600); }, { passive: true });
  el.addEventListener('touchend', clear);
  el.addEventListener('touchmove', clear);
  el.addEventListener('touchcancel', clear);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); onLong(); }); /* 桌面端右键亦可触发 */
}
function showCardOverlay(dataUrl){
  var ov = document.getElementById('cardOverlay');
  if (!ov){
    ov = document.createElement('div'); ov.id = 'cardOverlay'; ov.className = 'card-overlay';
    ov.innerHTML = '<img id="coImg" alt="访客证">' +
      '<div class="co-tip">长按上方图片即可保存到手机相册（iOS / 安卓通用）</div>' +
      '<a id="coDl" class="co-dl" download="访客证.png">下载图片</a>' +
      '<button id="coClose" class="co-close" type="button">关闭</button>';
    document.body.appendChild(ov);
  }
  document.getElementById('coImg').src = dataUrl;
  document.getElementById('coDl').href = dataUrl;
  ov.style.display = 'flex';
  document.getElementById('coClose').onclick = function(){ ov.style.display = 'none'; };
}
function saveCardImage(card){
  ensureHtml2Canvas(function(){
    if (!window.html2canvas){ alert('图片组件加载失败，请改用截屏保存'); return; }
    html2canvas(card, { backgroundColor: null, scale: 2, logging: false }).then(function(cv){
      try { showCardOverlay(cv.toDataURL('image/png')); }
      catch(e){ alert('生成图片失败，请改用截屏保存'); }
    }).catch(function(){ alert('生成图片失败，请改用截屏保存'); });
  });
}
function enableCardSave(){
  var card = document.querySelector('.pass');
  if (card && !card._lpBound){ card._lpBound = true; bindLongPress(card, function(){ saveCardImage(card); }); }
}

function showBadge(rec){
  var hd = document.getElementById('pageHead'); if (hd) hd.style.display = 'none'; /* 访客单生成后隐藏页头 */
  var reasons = (rec.reasons || []).join('、') || '—';
  var html =
    '<div class="pass">' +
      '<div class="pass-top"><span class="t1">访客通行卡</span><span class="t2">VISITOR PASS</span></div>' +
      '<div class="pass-body">' +
        '<div class="pass-head">' +
          '<div class="pass-photo">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/>' +
            '<path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4z"/></svg>' +
            '<span class="ph-txt">证件照片</span>' +
          '</div>' +
          '<div class="pass-idbox"><div class="nm">' + esc(rec.name) + '</div>' +
          '<div class="un">' + (rec.unit ? esc(rec.unit) : '来访人员') + '</div>' +
          '<div class="pid">证件号 ' + esc(maskId(deobfPII(rec.idNumber))) + '</div></div>' +
        '</div>' +
        '<div class="pass-info">' +
          '<div class="row"><span class="k">拜访</span><span class="v">' + esc(rec.visitPerson) + '</span></div>' +
          '<div class="row"><span class="k">事由</span><span class="v">' + esc(reasons) + '</span></div>' +
          '<div class="row"><span class="k">访问时间</span><span class="v">' + esc(fmtTime(visitTimeOf(rec))) + '</span></div>' +
          (rec.registrar ? '<div class="row"><span class="k">登记人</span><span class="v">' + esc(rec.registrar) + '</span></div>' : '') +
          '<div class="row"><span class="k">手机</span><span class="v">'+esc(maskPhone(deobfPII(rec.phone)))+'</span></div>' +
        '</div>' +
        '<div class="pass-id"><div class="lbl">访客流水号</div><div class="num">' + esc(rec.id) + '</div></div>' +
        '<svg class="pass-bar" id="passBar"></svg>' +
      '</div>' +
      '<div class="pass-tip">请截屏保存，入闸时向安保出示此卡</div>' +
      '<div class="pass-note">个人信息已脱敏</div>' +
    '</div>' +
    '<button class="again" id="againBtn">再登记一位</button>';
  document.getElementById('formCard').innerHTML = html;
  ensureBarcodeLib(function(){
    try {
      JsBarcode('#passBar', rec.id, {
        format: 'CODE128', width: 2, height: 48,
        displayValue: true, fontSize: 13, margin: 0,
        lineColor: '#1f2733', background: '#ffffff'
      });
    } catch (e) { /* 条码库缺失则忽略，保留空白占位 */ }
  });
  document.getElementById('againBtn').addEventListener('click', function(){ location.reload(); });
  enableCardSave();
}
</script>
</body>
</html>
