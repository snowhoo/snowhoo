<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端访客同步</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#fff;color:#1f2733;-webkit-font-smoothing:antialiased}
  .wrap{padding:8px 14px}
  .msg{margin:0;font-size:14px;min-height:18px}
  .msg.ok{color:#16a34a} .msg.err{color:#dc2626}
</style>
</head>
<body>
<div class="wrap"><div class="msg" id="msg">准备读取云端记录…</div></div>

<script src="registrar.config.js"></script>
<script>
/* ====== 在线 Waline 连接配置（外网，固定云端地址） ====== */
var CLOUD_BASE    = (window.CLOUD_WALINE || '').trim() || 'https://waline.snowhoo.net';  // 优先取配置
var RECORDS_PATH  = '/visitor/records';

/* ====== 云端回写模式（?push=1）：main 编辑签离时经此中转 POST，本页与云端 Waline 同源无跨域 ====== */
var IS_PUSH = /[?&]push=1/.test(location.search);
var ADM_SEED = 'Vs#9kQ~';
var ADM_OBF  = 'MwppUQkWHT88SnMiBAQfQm1QIWhQGyINb0ZgCj0fdVUdNRpgAEIJKgAcMiBHXzQFKm8kVlwCFzUnGHFbLgs1bzRGCQ==';
function admToken(){
  var bin = atob(ADM_OBF);
  var s = '';
  for (var i = 0; i < bin.length; i++) s += String.fromCharCode(bin.charCodeAt(i) ^ ADM_SEED.charCodeAt(i % ADM_SEED.length));
  return s;
}

/* ====== 工具 ====== */
function robustParse(raw){
  if (!raw) return null;
  var s = String(raw).replace(/<[^>]*>/g, '').replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  var st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch(e){ return null; }
}
function setMsg(t, cls){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(cls||''); }
function idToTime(id){
  if (!id || id.charAt(0) !== 'v') return 0;
  var d = id.slice(1);
  if (!/^\d{16}$/.test(d)) return 0;
  return parseInt(d, 10) / 1000;
}
function visitTimeOf(v){ return idToTime(v && v.id) || (v && v.enterTime) || (v && v.createdAt) || 0; }

/* ====== 读取在线 Waline（匿名 GET；CORS 已验证 *） ====== */
async function fetchAllComments(path){
  var out=[], page=1;
  while(true){
    var url = CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(path)
            + '&page=' + page + '&pageSize=100&sortBy=insertedAt_desc&lang=zh-CN';
    var r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var resp = await r.json();
    var dd = (resp.data && resp.data.data) || [];
    if (!dd.length) break;
    out = out.concat(dd);
    var totalPages = (resp.data && resp.data.totalPages) || 0;
    if (totalPages && page >= totalPages) break;
    if (dd.length < 100) break;
    page++;
  }
  return out;
}
async function loadVisitors(){
  var all = await fetchAllComments(RECORDS_PATH);
  var map = {};
  all.forEach(function(c){
    var rec = robustParse(c.orig || c.comment || '');
    if (!rec || rec.type !== 'visitor' || !rec.id) return;
    var oid = parseInt(c.objectId, 10) || 0;
    if (!map[rec.id] || oid > map[rec.id].oid) map[rec.id] = { oid: oid, rec: rec };
  });
  var list = [];
  for (var id in map){ if (!map[id].rec.deleted) list.push(map[id].rec); }
  list.sort(function(a,b){ return visitTimeOf(b) - visitTimeOf(a); });
  return list;
}

/* ====== 主流程：读云端 → postMessage 回传父页 main ====== */
async function run(){
  try {
    setMsg('正在读取云端记录…', '');
    var list = await loadVisitors();
    if (!list.length){ setMsg('云端暂无访客记录', 'ok'); return; }
    try { window.parent.postMessage({ type: 'visitor-sync', recs: list }, '*'); } catch(e){}
    setMsg('已回传 ' + list.length + ' 条记录到本地管理页', 'ok');
  } catch(e){
    setMsg('读取失败：' + (e.message || e), 'err');
  }
}
if (IS_PUSH){
  /* 回写模式：等 main 发来加密记录 → 同源 POST 云端 → 回传结果 */
  try { window.parent.postMessage({ type: 'otol-ready' }, '*'); } catch(e){}
  window.addEventListener('message', async function(e){
    if (!e.data || e.data.type !== 'visitor-leave-push' || !e.data.rec) return;
    try {
      var rec = e.data.rec;
      /* 按流水号找该记录在云端的最新版本，原地 PUT 更新（管理员令牌），不追加新版本 */
      var all = await fetchAllComments(RECORDS_PATH);
      var oid = 0;
      all.forEach(function(c){
        var r = robustParse(c.orig || c.comment || '');
        if (r && r.type === 'visitor' && r.id === rec.id){
          var o = parseInt(c.objectId, 10) || 0;
          if (o > oid) oid = o;
        }
      });
      var resp;
      if (oid){
        resp = await fetch(CLOUD_BASE + '/api/comment/' + oid, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + admToken() },
          body: JSON.stringify({ comment: JSON.stringify(rec) })   /* 与 books.html 同款：仅更新 comment，其余字段服务端保留 */
        });
      } else {
        /* 云端无此记录（理论不会发生）→ 退回新建 */
        var body = { comment: JSON.stringify(rec), url: RECORDS_PATH, nick: rec.name || '访客登记', mail: 'visitor@local', link: '', ua: navigator.userAgent };
        resp = await fetch(CLOUD_BASE + '/api/comment?lang=zh-CN', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + admToken() },
          body: JSON.stringify(body)
        });
      }
      var j = await resp.json().catch(function(){ return {}; });
      if (j && j.errno && j.errno !== 0) throw new Error('云端拒绝（' + j.errno + (j.errmsg ? '：' + j.errmsg : '') + '）');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      setMsg(oid ? '云端签离已更新（原地 PUT，版本数不变）' : '云端签离已回写（新建）', 'ok');
      try { window.parent.postMessage({ type: 'visitor-leave-push-result', ok: true }, '*'); } catch(e2){}
    } catch(err){
      setMsg('云端回写失败：' + (err.message || err), 'err');
      try { window.parent.postMessage({ type: 'visitor-leave-push-result', ok: false, error: (err.message || err) }, '*'); } catch(e2){}
    }
  });
} else {
  run();
}
</script>
</body>
</html>
