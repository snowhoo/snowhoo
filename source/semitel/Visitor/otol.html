---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端访客同步</title>
<style>
  :root{ --bg:#eef2f7; --card:#fff; --ink:#1f2733; --sub:#6b7785; --line:#e2e8f0; --brand:#2563eb; --ok:#16a34a; --err:#dc2626; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:2px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .msg{margin:10px 0;font-size:14px;min-height:18px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn,#d97706)}
  .btn{display:inline-block;border:none;border-radius:10px;height:44px;padding:0 18px;font-size:15px;font-weight:600;
    background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;line-height:44px}
  .btn:active{transform:translateY(1px)}
  .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
  code{background:#f1f5fb;padding:2px 6px;border-radius:6px;font-size:12px}
  /* iframe 内嵌模式（被本地 main 嵌入）：去卡片/去边距，与 main 视觉融合 */
  body.embed{background:#fff}
  body.embed .wrap{max-width:none;margin:0;padding:8px 14px}
  body.embed h1,body.embed .sub{display:none}
  body.embed .card{border:none;padding:0;margin:0}
  body.embed #box{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>云端访客同步</h1>
  <p class="sub">读取在线 Waline 中的访客记录，打包后跳转到本地管理页写入本地数据库。</p>

  <div class="card">
    <div id="box">
      <p class="note">页面打开后会自动从云端读取记录。如需自定义本地管理页地址，可在网址后加 <code>?target=http://本机IP:8080/main.html</code>。</p>
    </div>
    <div class="msg" id="msg">准备读取云端记录…</div>
  </div>
</div>

<script>
/* ====== 在线 Waline 连接配置（外网，固定云端地址） ====== */
var WALINE_SERVER = 'https://waline.snowhoo.net';
var CLOUD_BASE    = WALINE_SERVER;
var RECORDS_PATH  = '/visitor/records';

/* ====== 工具 ====== */
function robustParse(raw){
  if (!raw) return null;
  var s = String(raw).replace(/<[^>]*>/g, '').replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  var st = s.indexOf('{'), en = s.lastIndexOf('}');
  if (st >= 0 && en > st) s = s.slice(st, en + 1);
  try { return JSON.parse(s); } catch(e){ return null; }
}
function setMsg(t, cls){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(cls||''); }
function idToTime(id){
  if (!id || id.charAt(0) !== 'v') return 0;
  var d = id.slice(1);
  if (!/^\d{16}$/.test(d)) return 0;
  return parseInt(d, 10) / 1000;
}
function visitTimeOf(v){ return idToTime(v && v.id) || (v && v.enterTime) || (v && v.createdAt) || 0; }

/* ====== 读取在线 Waline（匿名 GET，无 Authorization；CORS 已验证 *） ====== */
async function fetchAllComments(path){
  var out=[], page=1;
  while(true){
    var url = CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(path)
            + '&page=' + page + '&pageSize=100&sortBy=insertedAt_desc&lang=zh-CN';
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var resp = await r.json();
    var dd = (resp.data && resp.data.data) || [];
    if (!dd.length) break;
    out = out.concat(dd);
    var totalPages = (resp.data && resp.data.totalPages) || 0;
    if (totalPages && page >= totalPages) break;
    if (dd.length < 100) break;
    page++;
  }
  return out;
}
async function loadVisitors(){
  var all = await fetchAllComments(RECORDS_PATH);
  var map = {};
  all.forEach(function(c){
    var rec = robustParse(c.orig || c.comment || '');
    if (!rec || rec.type !== 'visitor' || !rec.id) return;
    var oid = parseInt(c.objectId, 10) || 0;
    if (!map[rec.id] || oid > map[rec.id].oid) map[rec.id] = { oid: oid, rec: rec };
  });
  var list = [];
  for (var id in map){ if (!map[id].rec.deleted) list.push(map[id].rec); }
  list.sort(function(a,b){ return visitTimeOf(b) - visitTimeOf(a); });
  return list;
}

function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }

async function run(){
  var isEmbed = !!(window.parent && window.parent !== window.self);  // 被本地 main 以 iframe 嵌入
  try {
    setMsg('正在读取云端记录…', '');
    var list = await loadVisitors();
    if (!list.length){ setMsg('云端暂无访客记录', 'ok'); if (isEmbed) document.body.className = 'embed'; return; }

    /* iframe 内嵌模式（主路径）：postMessage 回传父页 main，不跳转、不弹窗、不丢本地页状态 */
    if (isEmbed){
      document.body.className = 'embed';
      try { window.parent.postMessage({ type: 'visitor-sync', recs: list }, '*'); } catch(e){}
      setMsg('已回传 ' + list.length + ' 条记录到本地管理页', 'ok');
      return;
    }

    /* 弹窗模式（兼容旧 window.open 入口）：postMessage 回传并自动关窗 */
    if (window.opener && !window.opener.closed){
      window.opener.postMessage({ type: 'visitor-sync', recs: list }, '*');
      setMsg('已回传 ' + list.length + ' 条记录到本地管理页，本窗口将自动关闭', 'ok');
      setTimeout(function(){ window.close(); }, 800);
      return;
    }

    /* 直接打开模式（向后兼容）：走 URL 片段跳转本地 main */
    var b64 = b64enc(JSON.stringify(list));
    var params = new URLSearchParams(location.search);
    var target = params.get('target') || 'http://localhost:8080/main.html';
    var url = target + '#sync=' + b64;

    var warn = b64.length > 60000
      ? '<p class="msg warn">数据量较大（'+b64.length+' 字符），部分浏览器可能截断链接；建议缩短同步间隔、多次同步。</p>'
      : '';
    document.getElementById('box').innerHTML =
      '<p>已从云端读取 <b>'+list.length+'</b> 条访客记录。</p>' + warn +
      '<p class="note">即将跳转到本地管理页 <code>'+esc(target)+'</code> 并写入本地数据库，请保持本地管理页打开直至同步完成。</p>' +
      '<a class="btn" id="goBtn" href="'+esc(url)+'">立即跳转本地管理页</a>';
    setMsg('读取完成，正在跳转本地管理页…', 'ok');
    location.href = url;
  } catch(e){
    setMsg('读取失败：' + (e.message || e), 'err');
  }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

run();
</script>
</body>
</html>
