---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>首页</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

/* ===== 图片区域 75vh ===== */
.image-area{position:relative;height:75vh;overflow:hidden;background:#f0f0f0}
.image-area img{width:100%;height:100%;object-fit:cover;display:block}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.image-area .welcome{position:absolute;bottom:24px;left:24px;color:#fff;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.image-area .welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}

/* ===== 底部面板 ===== */
.bottom-panel{position:relative;height:25vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;z-index:2}

/* 分类菜单 */
.category-list{display:flex;gap:10px;margin-bottom:16px;flex-wrap:nowrap}
.category-item{padding:7px 18px;border-radius:20px;font-size:.82rem;color:#888;background:#f5f5f5;cursor:pointer;transition:all .25s;user-select:none;-webkit-user-select:none;white-space:nowrap;border:1px solid transparent}
.category-item:active{transform:scale(.94)}
.category-item.active{color:#fff;background:#e94560;border-color:#e94560;font-weight:500;box-shadow:0 2px 10px rgba(233,69,96,.25)}

/* 进入按钮 */
.enter-btn{width:100%;max-width:300px;padding:13px 0;border:none;border-radius:12px;font-size:.95rem;font-weight:500;color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;background:#e94560;box-shadow:0 4px 16px rgba(233,69,96,.28);letter-spacing:1px}
.enter-btn:active{transform:scale(.96)}
</style>
</head>
<body>

<div class="image-area">
  <img id="bgImage" src="" alt="">
  <div class="gradient"></div>
  <div class="welcome">
    探索
    <small>choose your journey</small>
  </div>
</div>

<div class="bottom-panel">
  <div class="category-list" id="categoryList">
    <div class="category-item active" data-url="https://snowhoo.net/reader.html">小红故事</div>
    <div class="category-item" data-url="https://snowhoo.net/js/sevencolor/1/yedu_p.html">夜读</div>
    <div class="category-item" data-url="https://snowhoo.net/js/sevencolor/1/zjsz_p.html">照见苏州</div>
    <div class="category-item" data-url="https://snowhoo.net/app/DaliyNews_p.html">新闻</div>
  </div>
  <button class="enter-btn" id="enterBtn">进 入</button>
</div>

<script>
// 随机图片
document.getElementById('bgImage').src = 'https://picsum.photos/1280/960?random=' + Date.now();

// 分类选择
var items = document.querySelectorAll('.category-item');
var activeUrl = items[0].dataset.url;

items.forEach(function(el) {
  el.addEventListener('click', function() {
    items.forEach(function(i) { i.classList.remove('active'); });
    el.classList.add('active');
    activeUrl = el.dataset.url;
  });
});

// 进入按钮
document.getElementById('enterBtn').addEventListener('click', function() {
  if (activeUrl) window.location.href = activeUrl;
});
</script>
</body>
</html>
