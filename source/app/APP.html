---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|一九七九年 春天</title>
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

/* ===== 图片区域 70vh ===== */
.image-area{position:relative;height:70vh;overflow:hidden;background:#1a1a1a}
.image-area img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s ease}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.image-area .welcome{position:absolute;bottom:24px;left:24px;color:#fff;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;animation:welcomePulse 2.5s ease-in-out infinite}
@keyframes welcomePulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.image-area .welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}

/* 左上角圈字 */
.top-left-badges{position:absolute;top:46px;left:16px;z-index:5;display:flex;gap:14px}
.top-left-badges .badge{color:rgba(255,255,255,.65);font-size:.68rem;font-weight:300;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer;transition:all .3s;letter-spacing:1px;border:none;background:none;padding:0;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.top-left-badges .badge-icon{font-size:1rem;line-height:1;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:3px 5px;margin-bottom:1px}
.top-left-badges .badge.selected{color:#ffd700;font-weight:400;text-shadow:0 0 10px rgba(255,215,0,.4)}
.top-left-badges .badge.selected .badge-icon{border-color:rgba(255,215,0,.5)}

/* 右上角logo */
.top-right-logo{position:absolute;top:46px;right:16px;z-index:5;width:110px}
.top-right-logo img{width:100%;height:auto;display:block;border-radius:8px}

/* 黄历面板 - 竖版 */
.almanac{position:absolute;bottom:16px;right:16px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:16px;padding:0;color:#fff;min-width:90px;text-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;transition:all .35s ease}
.almanac.hidden{opacity:0;pointer-events:none;transform:scale(.8)}
/* 日历折叠图标 */
.almanac-mini{position:absolute;bottom:16px;right:16px;z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);display:none;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;cursor:pointer;transition:all .35s ease;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.almanac-mini.show{display:flex}
.almanac-mini:active{transform:scale(.88)}
.almanac .al-day{font-size:2.5rem;font-weight:600;line-height:1;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.almanac .al-body{display:flex;flex-direction:column;align-items:center;gap:5px}
.almanac .al-month{font-size:.72rem;font-weight:500;letter-spacing:.3px;opacity:.9;line-height:1.2}
.almanac .al-weekday{font-size:.65rem;font-weight:400;opacity:.75;line-height:1.2}
.almanac .al-lunar{font-size:.6rem;opacity:.7;line-height:1.3;margin-top:1px}
.almanac .al-zodiac{margin-top:4px;padding:2px 10px;border-radius:6px;font-size:.55rem;background:rgba(255,255,255,.12);letter-spacing:1px}

/* ===== 底部面板 ===== */
.bottom-panel{position:relative;height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0px;background:#fff url('xzbg.png') center/cover no-repeat;z-index:2}

/* 浮动奔跑图片 */
.runner-float{position:absolute;top:-16px;left:0;z-index:5;pointer-events:none;animation:float 3s ease-in-out infinite}
.runner-float img{height:40px;width:auto;display:block}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}

/* 年度进度条 */
.year-bar{position:absolute;top:0;left:0;right:0;height:5px;background:#f0f0f0;overflow:visible}
.year-bar-fill{height:100%;background:linear-gradient(90deg,#e94560,#ff8c00);transition:width .6s ease;border-radius:0 2px 2px 0;position:relative}
.year-bar-text{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#bbb;white-space:nowrap;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.year-bar-text .runner{width:14px;height:14px;flex-shrink:0;animation:run .6s steps(2) infinite}
@keyframes run{0%{transform:translateY(0)}50%{transform:translateY(-2px)}100%{transform:translateY(0)}}

/* 分类圆形按钮 */
.category-list{display:flex;gap:0;align-items:center;margin-top:6px;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;justify-content:flex-start;padding:0 4px}
.category-list::-webkit-scrollbar{display:none}
.category-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .25s;user-select:none;-webkit-user-select:none;border:none;background:none;padding:0;flex:0 0 25%;min-width:0}
.category-item:first-child .circle{width:64px;height:64px;font-size:1rem}
.category-item:active{transform:scale(.88)}
.category-item .circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .25s,box-shadow .25s}
.category-item.active .circle{transform:scale(1.0);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.category-item .label{font-size:.75rem;color:#888;font-weight:300}
.category-item.active .label{color:#333;font-weight:400}
.category-hint{text-align:center;margin-top:14px;font-size:.68rem;color:#bbb;letter-spacing:1px;line-height:1.5}
.category-hint .hint-en{font-size:.55rem;color:#ccc;letter-spacing:2px;font-weight:300}
.xz-man{position:absolute;bottom:25px;left:25px;height:50px;width:auto;pointer-events:none;z-index:3;animation:xzFloat 3s ease-in-out infinite}
@keyframes xzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* 评论登录头像 */
.comment-avatar{position:absolute;bottom:20px;right:20px;width:32px;height:32px;border-radius:50%;z-index:3;cursor:pointer;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.2);transition:border-color .3s;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
.comment-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.comment-avatar svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 诗/今 内容展示区 - 圈字下方 */
.content-area{position:absolute;top:50%;left:50%;z-index:5;width:310px;max-height:calc(70vh - 160px);overflow-y:auto;text-align:center;transform:translate(-50%,-50%);transition:opacity .5s ease;opacity:0;visibility:hidden}
.content-area.show{opacity:1;visibility:visible}
.content-area::-webkit-scrollbar{width:0}
.content-area .content-line{font-size:.88rem;line-height:1.5;color:#fff;font-weight:400;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.content-area .content-title{font-size:1.05rem;font-weight:700;color:#fff;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-bottom:2px}
.content-area .content-author{font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .content-source{font-size:.65rem;color:rgba(255,255,255,.7);margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
.content-area .loading-hint{font-size:.82rem;color:#fff;font-weight:400;text-shadow:0 1px 4px rgba(0,0,0,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.content-area .history-item{font-size:.78rem;line-height:1.6;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-family:"KaiTi","STKaiti","楷体",serif;display:flex}
.content-area .history-item .hyear{flex-shrink:0;width:4.8em;color:rgba(255,255,255,.6);font-size:.7rem;font-family:sans-serif}

/* 星座转盘样式 */
.zodiac-wheel{position:relative;width:320px;height:320px;margin:8px auto 0;cursor:pointer;touch-action:none}
.zodiac-item{position:absolute;text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%);width:80px;line-height:1.3;transition:all .35s;cursor:pointer;user-select:none;-webkit-user-select:none}
.zodiac-item .zn{font-size:.7rem;font-weight:300;display:block;transition:all .35s;line-height:1.4}
.zodiac-item .zn .zn-date{opacity:.55;font-size:.55rem}
.zodiac-item.selected .zn{color:#ff8c00}
.zodiac-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:160px;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;line-height:1.7}
.zodiac-center .zc-name{font-size:1.05rem;font-weight:700;display:block;margin-bottom:6px;color:#ff8c00;letter-spacing:1px}
.zodiac-center .zc-line{font-size:.72rem;opacity:1;display:block;white-space:nowrap;color:#fff}
.zodiac-center .zc-sub{font-size:.65rem;opacity:.55;display:block;white-space:nowrap;color:rgba(255,255,255,.9)}

/* 星座星空背景覆盖层 */
.stars-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:url('bg-stars.jpg') center/cover no-repeat;opacity:0;transition:opacity .6s ease;pointer-events:none;z-index:1}
.stars-overlay.show{opacity:1}

/* 评论弹窗 */
.comment-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;display:flex;align-items:flex-end}
.comment-overlay.active{opacity:1;visibility:visible}
.comment-panel{background:#fff;width:100%;max-height:85vh;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s ease-out}
.comment-overlay.active .comment-panel{transform:translateY(0)}
.comment-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid #eee;flex-shrink:0}
.comment-panel-header .cp-title{font-size:.9rem;font-weight:600;color:#333}
.comment-panel-header .cp-close{font-size:1.2rem;color:#999;cursor:pointer;padding:4px;line-height:1;border:none;background:none}
.comment-panel-body{flex:1;overflow-y:auto;padding:8px 16px;min-height:200px;max-height:calc(85vh - 50px);-webkit-overflow-scrolling:touch}

/* 积分系统 */
.points-badge{position:absolute;bottom:10px;left:25px;font-size:.6rem;color:#1a1a1a;white-space:nowrap;letter-spacing:.5px;z-index:3;pointer-events:none;font-weight:300}
.xp-float{position:absolute;bottom:5px;left:80px;z-index:4;font-size:.7rem;color:#1a1a1a;pointer-events:none;white-space:nowrap;opacity:0;transition:all .6s ease-out;line-height:1.4;font-weight:400}
.xp-float.show{opacity:1;transform:translateY(-20px)}
.xp-float .xp-sub{font-size:.6rem;opacity:.7;display:block;font-weight:300}

/* 任务红点 */
.task-dot{position:absolute;top:-8px;right:-8px;background:#e94560;color:#fff;font-size:.5rem;min-width:15px;height:15px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:700;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}

/* 今日修炼任务菜单 */
.task-menu{position:absolute;bottom:20px;right:64px;z-index:3}
.task-menu-btn{font-size:.58rem;color:#ff8c00;cursor:pointer;padding:3px 8px;border:1px solid rgba(255,140,0,.3);border-radius:10px;background:rgba(255,255,255,.88);white-space:nowrap;transition:all .3s;font-weight:400;letter-spacing:.3px;line-height:1.4;user-select:none;-webkit-user-select:none}
.task-menu-btn.completed{color:#22c55e;border-color:rgba(34,197,94,.35)}
.task-menu-dropdown{position:absolute;bottom:calc(100% + 6px);right:0;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:210px;padding:6px 0;display:none;z-index:10}
.task-menu-dropdown.show{display:block}
.task-item{display:flex;align-items:center;padding:7px 12px;font-size:.7rem;color:#333;line-height:1.4;gap:4px}
.task-item .task-check{color:#22c55e;flex-shrink:0;width:14px;text-align:center;font-size:.65rem}
.task-item .task-name{flex-shrink:0}
.task-item .task-points{color:#ff8c00;flex-shrink:0;margin-left:2px}
.task-item .task-count{margin-left:auto;color:#aaa;font-size:.62rem;flex-shrink:0}
.task-item.completed{color:#22c55e}
.task-item.completed .task-points{color:#22c55e}
</style>
</head>
<body>

<div class="image-area">
  <img id="bgImage" src="" alt="">
  <div class="stars-overlay" id="starsOverlay"></div>
  <div class="gradient"></div>
  <div class="top-left-badges">
    <span class="badge" id="poetryBtn"><span class="badge-icon">≡</span>诗词<span class="task-dot" id="poetryDot"></span></span>
    <span class="badge" id="historyBtn"><span class="badge-icon">◎</span>今日<span class="task-dot" id="historyDot"></span></span>
    <span class="badge" id="constellationBtn"><span class="badge-icon">✦</span>星座<span class="task-dot" id="constellationDot"></span></span>
  </div>
  <div class="content-area" id="contentArea"></div>
  <div class="top-right-logo"><img src="../images/logo.png" alt="logo"></div>
  <div class="welcome">
    探索
    <small>choose your journey</small>
    <span class="task-dot" id="exploreDot"></span>
  </div>
  <div class="almanac" id="almanac">
    <div class="al-day" id="alDay"></div>
    <div class="al-body">
      <div class="al-month" id="alMonth"></div>
      <div class="al-weekday" id="alWeekday"></div>
      <div class="al-lunar" id="alLunar"></div>
      <div class="al-zodiac" id="alZodiac"></div>
    </div>
  </div>
  <div class="almanac-mini" id="almanacMini">📅</div>
</div>

<div class="bottom-panel">
  <div class="year-bar"><div class="year-bar-fill" id="yearFill"></div><div class="runner-float" id="runnerFloat"><img src="../images/run.png" alt="奔跑"></div></div>
  <div class="year-bar-text"><svg class="runner" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M8 21l3-6 3 3 4-8"/><path d="M14 10l3-3 3 2"/><path d="M5 18l3-6 3 3"/></svg><span id="yearText"></span></div>
  <div class="category-list" id="categoryList">
    <button class="category-item active" data-url="https://snowhoo.net/app/reader.html">
      <span class="circle" style="background:#e94560">小红<br>故事</span>
	  <span class="label">&nbsp;</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/yedu_p.html">
      <span class="circle" style="background:#764ba2">夜</span>
      <span class="label">夜&nbsp;&nbsp;&nbsp;&nbsp;读</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/zjsz_p.html">
      <span class="circle" style="background:#3b82f6">照</span>
      <span class="label">照见苏州</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/DaliyNews_p.html">
      <span class="circle" style="background:#ff8c00">新</span>
      <span class="label">新&nbsp;&nbsp;&nbsp;&nbsp;闻</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/tv_p.html">
      <span class="circle" style="background:#22c55e">播</span>
      <span class="label">播&nbsp;&nbsp;&nbsp;&nbsp;霸</span>
    </button>
  </div>

  <div class="xp-float" id="xpFloat"></div>

    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </div>
  <div class="task-menu">
    <div class="task-menu-btn" id="taskMenuBtn">今日修炼任务</div>
    <div class="task-menu-dropdown" id="taskMenuDropdown"></div>
  </div>
</div>

<!-- 评论弹窗 -->
<div class="comment-overlay" id="commentOverlay">
  <div class="comment-panel">
    <div class="comment-panel-header">
      <span class="cp-title">留言</span>
      <button class="cp-close" id="commentClose">&times;</button>
    </div>
    <div class="comment-panel-body" id="walineContainer"></div>
  </div>
</div>

<script>
// 年度进度
(function() {
  var now = new Date();
  var yr = now.getFullYear();
  var start = new Date(yr, 0, 1);
  var diff = now - start;
  var day = Math.floor(diff / 86400000) + 1;
  var total = (yr % 400 === 0 || (yr % 4 === 0 && yr % 100 !== 0)) ? 366 : 365;
  var pct = Math.min(day / total, 1);
  document.getElementById('yearFill').style.width = (pct * 100) + '%';
  document.getElementById('yearText').textContent = '把梦想写进日程 [ ' + yr + '已过' + Math.round(pct * 100) + '% ]';
  document.getElementById('runnerFloat').style.left = (pct * 100) + '%';
})();

// 随机图片
document.getElementById('bgImage').src = 'https://picsum.photos/1280/960?random=' + Date.now();

// 点击探索换图
document.querySelector('.welcome').addEventListener('click', function() {
  var area = document.getElementById('contentArea');
  var img = document.getElementById('bgImage');
  // 收起所有展开面板（通过 class 控制）
  area.classList.remove('show');
  area.innerHTML = '<div class="loading-spinner"></div><div class="loading-hint">正在探索...</div>';
  area.style.left = '50%';
  area.style.transform = 'translate(-50%, -50%)';
  area.style.width = 'auto';
  area.style.textAlign = 'center';
  area._activeBtn = null;
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  // 加载新图片
  img.src = 'https://picsum.photos/1280/960?random=' + Date.now();
  img.onload = function() {
    area.classList.remove('show');
  };
});

// ===== 黄历 =====
(function() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('alDay').textContent = d;
  document.getElementById('alMonth').textContent = y + '年' + m + '月';
  document.getElementById('alWeekday').textContent = weekdays[now.getDay()];

  // 农历数据表 1900-2100 (每月大小月+闰月)

function toggleContent(btnId, url, renderFn) {
  var btn = document.getElementById(btnId);
  var area = document.getElementById('contentArea');
  var bg = document.getElementById('bgImage');
  if (area._activeBtn === btnId && area.classList.contains('show')) {
    area.classList.remove('show');
    btn.classList.remove('selected');
    area._activeBtn = null;
    return;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');
  // 切到非星座面板：还原原随机图
  if (area._activeBtn === 'constellationBtn') {
    document.getElementById('starsOverlay').classList.remove('show');
  }
  // 恢复默认位置（诗/今内容居中）
  area.style.left = '50%';
  area.style.transform = 'translate(-50%, -50%)';
  area.style.width = '310px';
  area.style.textAlign = 'center';
  // 生成唯一标记，防止异步回调覆盖
  var _reqId = Date.now() + '_' + Math.random();
  area._toggleReqId = _reqId;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = renderFn(data);
    area.classList.add('show');
    area._activeBtn = btnId;
  }).catch(function(){
    if (area._toggleReqId !== _reqId) return;
    area.innerHTML = '<div class="content-line">暂无内容</div>';
    area.classList.add('show');
    area._activeBtn = btnId;
  });
}

                }
              }
            }
          } catch(e) {}
        }
      }
      if (!user) return null;
      // 兼容不同字段名 (Waline v3 UserInfo: display_name, email, avatar, token, objectId, type, url)
      user.display_name = user.display_name || user.nick || user.name || '';
      user.avatar = user.avatar || user.objectURL || user.avator || '';
      user.email = user.email || user.mail || '';
      return user;
    } catch(e) { return null; }
  },

  loadFromServer: function() {
    var self = this;
    var user = this.getWalineUser();
    if (!user) { this.updateBadge(); this.updateTaskDots(); this.updateTaskMenu(); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET','https://waline.snowhoo.net/api/comment?path=/app-game/actions&pageSize=200');
    xhr.onload = function() {
      try {
        var data = JSON.parse(xhr.responseText);
        self.processRecords(data.data || [], user);
      } catch(e) {}
      self.updateBadge();
      self.updateTaskDots();
      self.updateTaskMenu();
    };
    xhr.onerror = function() { self.updateBadge(); self.updateTaskDots(); self.updateTaskMenu(); };
    xhr.send();
  },

  processRecords: function(records, user) {
    var today = new Date().toDateString();
    this.todayCounts = {};
    this.totalPoints = 0;
    for (var i = 0; i < records.length; i++) {
      try {
        var r = records[i];
        var action = JSON.parse(r.comment);
        if ((r.mail||'') !== (user.email||'')) continue;
        this.totalPoints += action.points || 0;
        var d = new Date(r.insertedAt || r.createdAt || r.time).toDateString();
        if (d === today) {
          this.todayCounts[action.key] = (this.todayCounts[action.key] || 0) + 1;
        }
      } catch(e) {}
    }
  },

  doAction: function(key) {
    var act = this.actions[key];
    if (!act) return;
    var user = this.getWalineUser();
    if (!user) {
      this.showXp('+0 经验','请登录赚取修炼经验');
      return;
    }
    var count = this.todayCounts[key] || 0;
    if (count >= act.max) {
      this.showXp('+0 经验','今日此项修炼已毕');
      return;
    }
    this.todayCounts[key] = count + 1;
    this.totalPoints += act.points;
    this.updateBadge();
    this.updateTaskDots();
    this.updateTaskMenu();
    this.showXp('+'+act.points+' 经验','');
    this.syncToWaline(key,act.points,user);
  },

  updateBadge: function() { document.getElementById('pointsBadge').textContent = '✦ '+this.totalPoints; },

  updateTaskDots: function() {
    var dotIds = {poetry:'poetryDot',history:'historyDot',constellation:'constellationDot',explore:'exploreDot'};
    for (var key in dotIds) {
      var el = document.getElementById(dotIds[key]);
      if (!el) continue;
      var act = this.actions[key];
      var count = this.todayCounts[key] || 0;
      var remaining = act.max - count;
      if (remaining > 0) {
        el.textContent = remaining;
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }
  },

  updateTaskMenu: function() {
    var btn = document.getElementById('taskMenuBtn');
    var dropdown = document.getElementById('taskMenuDropdown');
    if (!btn || !dropdown) return;
    var allDone = true;
    var html = '';
    var order = ['poetry','history','constellation','explore'];
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      var act = this.actions[key];
      var count = this.todayCounts[key] || 0;
      var done = count >= act.max;
      if (!done) allDone = false;
      html += '<div class="task-item' + (done ? ' completed' : '') + '">'
        + '<span class="task-check">' + (done ? '✓' : '') + '</span>'
        + '<span class="task-name">' + act.taskName + '（' + act.name + '）</span>'
        + '<span class="task-points">+' + act.points + '经验值</span>'
        + '<span class="task-count">' + count + '/' + act.max + '</span>'
        + '</div>';
    }
    dropdown.innerHTML = html;
    btn.textContent = allDone ? '今日修炼已毕' : '今日修炼任务';
    btn.classList.toggle('completed', allDone);
  },

  showXp: function(main,sub) {
    var el = document.getElementById('xpFloat');
    el.innerHTML = main + (sub ? '<span class="xp-sub">'+sub+'</span>' : '');
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function(){el.classList.remove('show')},2200);
  },

  syncToWaline: function(key,points,user) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('POST','https://waline.snowhoo.net/api/comment');
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.send(JSON.stringify({
        comment: JSON.stringify({action:key,points:points,time:new Date().toISOString()}),
        url: '/app-game/actions',
        nick: user.display_name || '游客',
        mail: user.email || ''
      }));
    } catch(e){}
  }
};
GAME.init();

// ===== Waline 评论 =====
var walineInstance = null;
var commentOverlay = document.getElementById('commentOverlay');
var commentContainer = document.getElementById('walineContainer');

document.getElementById('commentAvatar').addEventListener('click', function() {
  commentOverlay.classList.add('active');
  if (!walineInstance) {
    commentContainer.innerHTML = '<div style="text-align:center;padding:40px 0;color:#999;font-size:.82rem">加载中...</div>';
    import('https://unpkg.com/@waline/client@v3/dist/waline.js').then(function(mod) {
      try {
        walineInstance = mod.init({
          el: '#walineContainer',
          serverURL: 'https://waline.snowhoo.net',
          lang: 'zh-CN',
          avatar: 'mp',
          pageview: false,
          locale: {
            placeholder: '说点什么吧...',
            comment: '留言'
          },
          onLogin: function(user) {
            // 登录后立即更新头像和积分系统
            GAME.updateAvatar();
            GAME.loadFromServer();
          }
        });
        // Waline 初始化后重新检查用户信息，更新头像和积分
        setTimeout(function(){GAME.updateAvatar();GAME.loadFromServer();},500);
      } catch(e) {
        commentContainer.innerHTML = '<div style="text-align:center;padding:40px 0;color:#999;font-size:.82rem">评论加载失败，请刷新重试</div>';
        console.error('Waline init error:', e);
      }
    }).catch(function() {
      commentContainer.innerHTML = '<div style="text-align:center;padding:40px 0;color:#999;font-size:.82rem">评论组件加载失败，请检查网络后重试</div>';
    });
  }
});

document.getElementById('commentClose').addEventListener('click', function() {
  commentOverlay.classList.remove('active');
});

commentOverlay.addEventListener('click', function(e) {
  if (e.target === commentOverlay) {
    commentOverlay.classList.remove('active');
  }
});

(function(){

    mini.classList.add('show');
