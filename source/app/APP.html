<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|一九七九年 春天</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

/* ===== 图片区域 70vh ===== */
.image-area{position:relative;height:70vh;overflow:hidden;background:#f0f0f0}
.image-area img{width:100%;height:100%;object-fit:cover;display:block}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.image-area .welcome{position:absolute;bottom:24px;left:24px;color:#fff;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.image-area .welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}

/* 左上角圈字 */
.top-left-badges{position:absolute;top:46px;left:16px;z-index:5;display:flex;gap:10px}
.top-left-badges .badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.top-left-badges .badge.selected{background:rgba(233,69,96,.65);border-color:rgba(233,69,96,.8);transform:scale(1.08)}

/* 右上角logo */
.top-right-logo{position:absolute;top:46px;right:16px;z-index:5;width:90px}
.top-right-logo img{width:100%;height:auto;display:block;border-radius:8px}

/* 黄历面板 - 竖版 */
.almanac{position:absolute;bottom:16px;right:16px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:16px;padding:0;color:#fff;min-width:90px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.almanac .al-day{font-size:2.8rem;font-weight:700;line-height:1;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.almanac .al-body{display:flex;flex-direction:column;align-items:center;gap:5px}
.almanac .al-month{font-size:.72rem;font-weight:500;letter-spacing:.3px;opacity:.9;line-height:1.2}
.almanac .al-weekday{font-size:.65rem;font-weight:400;opacity:.75;line-height:1.2}
.almanac .al-lunar{font-size:.6rem;opacity:.7;line-height:1.3;margin-top:1px}
.almanac .al-zodiac{margin-top:4px;padding:2px 10px;border-radius:6px;font-size:.55rem;background:rgba(255,255,255,.12);letter-spacing:1px}

/* ===== 底部面板 ===== */
.bottom-panel{position:relative;height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0px;background:#fff;z-index:2}

/* 浮动奔跑图片 */
.runner-float{position:absolute;top:-16px;left:0;z-index:5;pointer-events:none;animation:float 3s ease-in-out infinite}
.runner-float img{height:40px;width:auto;display:block}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}

/* 年度进度条 */
.year-bar{position:absolute;top:0;left:0;right:0;height:5px;background:#f0f0f0;overflow:visible}
.year-bar-fill{height:100%;background:linear-gradient(90deg,#e94560,#ff8c00);transition:width .6s ease;border-radius:0 2px 2px 0;position:relative}
.year-bar-text{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#bbb;white-space:nowrap;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.year-bar-text .runner{width:14px;height:14px;flex-shrink:0;animation:run .6s steps(2) infinite}
@keyframes run{0%{transform:translateY(0)}50%{transform:translateY(-2px)}100%{transform:translateY(0)}}

/* 分类圆形按钮 */
.category-list{display:flex;gap:0;align-items:center;justify-content:space-evenly;margin-top:-10px;width:100%}
.category-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .25s;user-select:none;-webkit-user-select:none;border:none;background:none;padding:0}
.category-item:active{transform:scale(.88)}
.category-item .circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .25s,box-shadow .25s}
.category-item.active .circle{transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.category-item .label{font-size:.75rem;color:#888;font-weight:400}
.category-item.active .label{color:#333;font-weight:500}

/* 诗/今 内容展示区 - 圈字下方 */
.content-area{position:absolute;top:102px;left:16px;z-index:5;width:310px;max-height:calc(70vh - 160px);overflow-y:auto;text-align:left}
.content-area::-webkit-scrollbar{width:0}
.content-area .content-line{font-size:.88rem;line-height:1.5;color:#fff;font-weight:400;font-family:"KaiTi","STKaiti","楷体",serif;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.content-area .content-source{font-size:.65rem;color:rgba(255,255,255,.7);margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.content-area .history-item{font-size:.78rem;line-height:1.6;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);font-family:"KaiTi","STKaiti","楷体",serif}
.content-area .history-item .hyear{display:inline-block;min-width:3.2em;color:rgba(255,255,255,.6);font-size:.7rem;font-family:sans-serif}

/* 星座转盘样式 */
.zodiac-wheel{position:relative;width:290px;height:290px;margin:8px auto 0;cursor:pointer;touch-action:none}
.zodiac-item{position:absolute;text-align:center;color:rgba(255,255,255,.5);text-shadow:0 1px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%);width:72px;line-height:1.2;transition:all .35s;cursor:pointer;user-select:none;-webkit-user-select:none}
.zodiac-item .zn{font-size:.6rem;font-weight:400;display:block;transition:all .35s}
.zodiac-item.selected .zn{font-size:.75rem;font-weight:700;color:#ff8c00}
.zodiac-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;line-height:1.6}
.zodiac-center .zc-name{font-size:.85rem;font-weight:700;display:block;margin-bottom:4px;color:#ff8c00;letter-spacing:1px}
.zodiac-center .zc-line{font-size:.56rem;opacity:.85;display:block}
.zodiac-center .zc-sub{font-size:.5rem;opacity:.6;display:block}
</style>
</head>

<script>
// 年度进度
(function() {
  var now = new Date();
  var yr = now.getFullYear();
  var start = new Date(yr, 0, 1);
  var diff = now - start;
  var day = Math.floor(diff / 86400000) + 1;
  var total = (yr % 400 === 0 || (yr % 4 === 0 && yr % 100 !== 0)) ? 366 : 365;
  var pct = Math.min(day / total, 1);
  document.getElementById('yearFill').style.width = (pct * 100) + '%';
  document.getElementById('yearText').textContent = '把梦想写进日程 [ ' + yr + '已过' + Math.round(pct * 100) + '% ]';
  document.getElementById('runnerFloat').style.left = (pct * 100) + '%';
})();

// 随机图片
document.getElementById('bgImage').src = 'https://picsum.photos/1280/960?random=' + Date.now();

// 点击背景图换一张
document.getElementById('bgImage').addEventListener('click', function() {
  this.src = 'https://picsum.photos/1280/960?random=' + Date.now();
});

// ===== 黄历 =====
(function() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('alDay').textContent = d;
  document.getElementById('alMonth').textContent = y + '年' + m + '月';
  document.getElementById('alWeekday').textContent = weekdays[now.getDay()];

  // 农历数据表 1900-2100 (每月大小月+闰月)
  var lInfo = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];
  // 天干 地支 生肖
  var tg = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var dz = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var sx = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  var lm = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  var ld = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','廿十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

  function sol2lunar(y,m,d) {
    var idx = y - 1900;
    if (idx < 0 || idx >= lInfo.length) return null;
    // 计算到1900年1月31日(农历正月初一)的天数差
    var base = new Date(1900,0,31);
    var offset = Math.floor((new Date(y,m-1,d) - base) / 86400000);
    // 先减掉1900年到y-1年每个整年的天数
    var i, j, yearDays, monthDays, leapMonth, leapDays;
    for (i = 0; i < idx; i++) {
      leapMonth = lInfo[i] & 0xf;
      yearDays = 0;
      for (j = 0; j < 12; j++) {
        yearDays += lInfo[i] >> (4 + j) & 1 ? 30 : 29;
      }
      if (leapMonth > 0) {
        yearDays += lInfo[i] >> 16 & 1 ? 30 : 29;
      }
      offset -= yearDays;
    }
    // 现在offset是目标年在农历中的第几天(从正月初一开始)
    // 遍历目标年y的每个月(含闰月)
    leapMonth = lInfo[idx] & 0xf;
    leapDays = lInfo[idx] >> 16 & 1 ? 30 : 29;
    var total = 12 + (leapMonth > 0 ? 1 : 0);
    yearDays = 0;
    for (i = 0; i < total; i++) {
      if (leapMonth > 0 && i === leapMonth) {
        monthDays = leapDays;
      } else if (leapMonth > 0 && i > leapMonth) {
        monthDays = lInfo[idx] >> (4 + i - 1) & 1 ? 30 : 29;
      } else {
        monthDays = lInfo[idx] >> (4 + i) & 1 ? 30 : 29;
      }
      if (offset < yearDays + monthDays) break;
      yearDays += monthDays;
    }
    if (i >= total) return null;
    var day = offset - yearDays + 1;
    var mon, isLeap = false;
    if (leapMonth > 0 && i === leapMonth) {
      mon = leapMonth; isLeap = true;
    } else if (leapMonth > 0 && i > leapMonth) {
      mon = i;
    } else {
      mon = i + 1;
    }
    return { m: mon, d: day, isLeap: isLeap };
  }

  var lr = sol2lunar(y,m,d);
  if (lr) {
    var ganZhiYear = tg[(y - 4) % 10] + dz[(y - 4) % 12];
    var lunarStr = (lr.isLeap ? '闰' : '') + lm[lr.m - 1] + '月' + ld[lr.d - 1];
    document.getElementById('alLunar').textContent = '农历' + ganZhiYear + '年 ' + lunarStr;
    document.getElementById('alZodiac').textContent = '生肖 ' + sx[(y - 4) % 12];
  }
})();

// 分类点击直接跳转
var items = document.querySelectorAll('.category-item');
items.forEach(function(el) {
  el.addEventListener('click', function() {
    window.location.href = el.dataset.url;
  });
});

// 点击"诗"展示每日诗词，"今"展示历史上的今天
function toggleContent(btnId, url, renderFn) {
  var btn = document.getElementById(btnId);
  var area = document.getElementById('contentArea');
  if (area._activeBtn === btnId && area.style.display !== 'none') {
    area.style.display = 'none';
    btn.classList.remove('selected');
    area._activeBtn = null;
    return;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');
  // 恢复默认位置（诗/今内容左对齐）
  area.style.left = '16px';
  area.style.transform = 'none';
  area.style.width = '310px';
  area.style.textAlign = 'left';
  fetch(url).then(function(r){return r.json()}).then(function(data){
    area.innerHTML = renderFn(data);
    area.style.display = 'block';
    area._activeBtn = btnId;
  }).catch(function(){
    area.innerHTML = '<div class="content-line">暂无内容</div>';
    area.style.display = 'block';
    area._activeBtn = btnId;
  });
}

document.getElementById('poetryBtn').addEventListener('click', function() {
  toggleContent('poetryBtn', '../js/DailyPoetry.json', function(data) {
    return '<div class="content-line">' + data.line + '</div>'
         + '<div class="content-source">—— ' + data.dynasty + ' · ' + data.author + '《' + data.title + '》</div>';
  });
});

document.getElementById('historyBtn').addEventListener('click', function() {
  toggleContent('historyBtn', '../js/HistoryToday.json', function(data) {
    var html = '';
    data.events.forEach(function(e) {
      html += '<div class="history-item"><span class="hyear">' + e.year + '年</span> ' + e.text + '</div>';
    });
    return html;
  });
});

// 星座按钮
document.getElementById('constellationBtn').addEventListener('click', function() {
  var btn = document.getElementById('constellationBtn');
  var area = document.getElementById('contentArea');
  if (area._activeBtn === 'constellationBtn' && area.style.display !== 'none') {
    area.style.display = 'none';
    btn.classList.remove('selected');
    area._activeBtn = null;
    return;
  }
  document.querySelectorAll('.badge').forEach(function(b){b.classList.remove('selected')});
  btn.classList.add('selected');
  area.innerHTML = '<div class="content-line" style="font-size:.72rem;opacity:.6">加载中...</div>';
  area.style.display = 'block';
  area._activeBtn = 'constellationBtn';
  // 居中显示
  area.style.left = '50%';
  area.style.transform = 'translateX(-50%)';
  area.style.width = '290px';
  area.style.textAlign = 'center';
  fetch('https://www.52api.cn/api/constellation?key=G84cVgxx8BqrzOEPUZlpRSK41r').then(function(r){return r.json()}).then(function(data){
    if (data.code !== 200 || !data.data) {
      area.innerHTML = '<div class="content-line" style="font-size:.72rem;opacity:.6">星座数据加载失败</div>';
      return;
    }
    var signs = {Aries:{cn:'白羊座',emoji:'♈'},Taurus:{cn:'金牛座',emoji:'♉'},Gemini:{cn:'双子座',emoji:'♊'},Cancer:{cn:'巨蟹座',emoji:'♋'},Leo:{cn:'狮子座',emoji:'♌'},Virgo:{cn:'处女座',emoji:'♍'},Libra:{cn:'天秤座',emoji:'♎'},Scorpio:{cn:'天蝎座',emoji:'♏'},Sagittarius:{cn:'射手座',emoji:'♐'},Capricorn:{cn:'摩羯座',emoji:'♑'},Aquarius:{cn:'水瓶座',emoji:'♒'},Pisces:{cn:'双鱼座',emoji:'♓'}};
    var order = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    // 提取数据
    var items = [];
    order.forEach(function(key){
      var s = data.data[key];
      if (!s || !s.detail || !s.detail.today) return;
      var td = s.detail.today;
      var info = td.info || [];
      var d = {key:key, cn:signs[key].cn, emoji:signs[key].emoji, overall:'', love:'', wealth:'', work:'', lucky:'', color:'', star:'', time:''};
      info.forEach(function(v){
        if (v.indexOf('综合运势') === 0) d.overall = v.replace('综合运势：','');
        if (v.indexOf('爱情运势') === 0) d.love = v.replace('爱情运势：','');
        if (v.indexOf('财富运势') === 0) d.wealth = v.replace('财富运势：','');
        if (v.indexOf('工作运势') === 0) d.work = v.replace('工作运势：','');
        if (v.indexOf('幸运数字') === 0) d.lucky = v.replace('幸运数字：','');
        if (v.indexOf('幸运颜色') === 0) d.color = v.replace('幸运颜色：','');
        if (v.indexOf('贵人星座') === 0) d.star = v.replace('贵人星座：','');
        if (v.indexOf('幸运时间') === 0) d.time = v.replace('幸运时间：','');
      });
      items.push(d);
    });
    // 构建转盘
    var cx = 145, cy = 145, r = 110;
    var html = '<div class="zodiac-wheel">';
    // 中心信息面板
    html += '<div class="zodiac-center">'
          + '<span class="zc-name">' + items[0].cn + '</span>'
          + '<span class="zc-line">综合' + items[0].overall + ' 爱情' + items[0].love + ' 财富' + items[0].wealth + ' 工作' + items[0].work + '</span>'
          + '<span class="zc-line">幸运数' + items[0].lucky + ' ' + items[0].color + '</span>'
          + '<span class="zc-sub">贵人星座 ' + items[0].star + '</span>'
          + '<span class="zc-sub">幸运时间 ' + items[0].time + '</span>'
          + '</div>';
    for (var i = 0; i < items.length; i++) {
      var d = items[i];
      var angle = i * 30 - 90;
      var rad = angle * Math.PI / 180;
      var x = cx + r * Math.cos(rad);
      var y = cy + r * Math.sin(rad);
      var rot = i * 30;
      html += '<div class="zodiac-item" data-index="' + i + '" style="left:' + x.toFixed(0) + 'px;top:' + y.toFixed(0) + 'px">'
        + '<span class="zn" style="transform:rotate(' + rot + 'deg)">' + d.emoji + ' ' + d.cn + '</span>'
        + '</div>';
    }
    html += '</div>';
    area.innerHTML = html;
    area._activeBtn = 'constellationBtn';
    // ===== 转盘交互 =====
    var wheel = area.querySelector('.zodiac-wheel');
    var centerEl = area.querySelector('.zodiac-center');
    var zodiacItems = area.querySelectorAll('.zodiac-item');
    var centerName = area.querySelector('.zc-name');
    var centerLines = area.querySelectorAll('.zc-line');
    var centerSubs = area.querySelectorAll('.zc-sub');
    var currentAngle = 0, startX, startY, startAngle = 0;
    var isDragging = false;
    // 默认选中第一个
    zodiacItems[0].classList.add('selected');
    function updateCenter(idx) {
      var d = items[idx];
      centerName.textContent = d.cn;
      centerLines[0].textContent = '综合' + d.overall + ' 爱情' + d.love + ' 财富' + d.wealth + ' 工作' + d.work;
      centerLines[1].textContent = '幸运数' + d.lucky + ' ' + d.color;
      centerSubs[0].textContent = '贵人星座 ' + d.star;
      centerSubs[1].textContent = '幸运时间 ' + d.time;
    }
    function selectItem(idx) {
      zodiacItems.forEach(function(el){el.classList.remove('selected')});
      zodiacItems[idx].classList.add('selected');
      updateCenter(idx);
    }
    function snapToNearest() {
      var rawIdx = -currentAngle / 30;
      var nearest = ((Math.round(rawIdx) % 12) + 12) % 12;
      currentAngle = -Math.round(rawIdx) * 30;
      wheel.style.transition = 'transform .35s ease-out';
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transition = 'transform .35s ease-out';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
      selectItem(nearest);
    }
    function getClientXY(e) {
      if (e.type.indexOf('touch') === 0) {
        return {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }
      return {x: e.clientX, y: e.clientY};
    }
    function onStart(e) {
      isDragging = true;
      var c = getClientXY(e);
      startX = c.x;
      startY = c.y;
      startAngle = currentAngle;
      wheel.style.transition = 'none';
      centerEl.style.transition = 'none';
    }
    function onMove(e) {
      if (!isDragging) return;
      var c = getClientXY(e);
      var dx = c.x - startX;
      currentAngle = startAngle + dx * 0.5;
      wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
      centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
    }
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      snapToNearest();
    }
    // 鼠标事件
    wheel.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    // 触摸事件
    wheel.addEventListener('touchstart', onStart, {passive: true});
    document.addEventListener('touchmove', onMove, {passive: true});
    document.addEventListener('touchend', onEnd);
    // 点击选择
    zodiacItems.forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.index);
        currentAngle = -idx * 30;
        wheel.style.transition = 'transform .35s ease-out';
        wheel.style.transform = 'rotate(' + currentAngle + 'deg)';
        centerEl.style.transition = 'transform .35s ease-out';
        centerEl.style.transform = 'translate(-50%,-50%) rotate(' + (-currentAngle) + 'deg)';
        selectItem(idx);
      });
    });
  }).catch(function(){
    area.innerHTML = '<div class="content-line" style="font-size:.72rem;opacity:.6">网络请求失败，请稍后重试</div>';
    area._activeBtn = 'constellationBtn';
  });
});
// 默认加载诗
document.getElementById('poetryBtn').click();
</script>
</body>
</html>
