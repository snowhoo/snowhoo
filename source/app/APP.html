---
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|一九七九年 春天</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

/* ===== 图片区域 70vh ===== */
.image-area{position:relative;height:70vh;overflow:hidden;background:#f0f0f0}
.image-area img{width:100%;height:100%;object-fit:cover;display:block}
.image-area .gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.image-area .welcome{position:absolute;bottom:24px;left:24px;color:#fff;font-size:1.6rem;font-weight:300;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.image-area .welcome small{display:block;font-size:.75rem;font-weight:400;opacity:.7;margin-top:6px;letter-spacing:1px}

/* ===== 底部面板 ===== */
.bottom-panel{position:relative;height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;background:#fff;z-index:2}

/* 年度进度条 */
.year-bar{position:absolute;top:0;left:0;right:0;height:5px;background:#f0f0f0;overflow:hidden}
.year-bar-fill{height:100%;background:linear-gradient(90deg,#e94560,#ff8c00);transition:width .6s ease;border-radius:0 2px 2px 0}
.year-bar-text{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#bbb;white-space:nowrap;letter-spacing:.5px}

/* 分类圆形按钮 */
.category-list{display:flex;gap:20px;align-items:center;justify-content:center;margin-top:-10px}
.category-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .25s;user-select:none;-webkit-user-select:none;border:none;background:none;padding:0}
.category-item:active{transform:scale(.88)}
.category-item .circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .25s,box-shadow .25s}
.category-item.active .circle{transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.category-item .label{font-size:.75rem;color:#888;font-weight:400}
.category-item.active .label{color:#333;font-weight:500}
</style>
</head>
<body>

<div class="image-area">
  <img id="bgImage" src="" alt="">
  <div class="gradient"></div>
  <div class="welcome">
    探索
    <small>choose your journey</small>
  </div>
</div>

<div class="bottom-panel">
  <div class="year-bar"><div class="year-bar-fill" id="yearFill"></div></div>
  <div class="year-bar-text" id="yearText"></div>
  <div class="category-list" id="categoryList">
    <button class="category-item active" data-url="https://snowhoo.net/app/reader.html">
      <span class="circle" style="background:#e94560">小</span>
      <span class="label">小红故事</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/yedu_p.html">
      <span class="circle" style="background:#764ba2">夜</span>
      <span class="label">夜读</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/zjsz_p.html">
      <span class="circle" style="background:#3b82f6">照</span>
      <span class="label">照见苏州</span>
    </button>
    <button class="category-item" data-url="https://snowhoo.net/app/DaliyNews_p.html">
      <span class="circle" style="background:#ff8c00">新</span>
      <span class="label">新闻</span>
    </button>
  </div>
</div>

<script>
// 年度进度
(function() {
  var now = new Date();
  var yr = now.getFullYear();
  var start = new Date(yr, 0, 1);
  var diff = now - start;
  var day = Math.floor(diff / 86400000) + 1;
  var total = (yr % 400 === 0 || (yr % 4 === 0 && yr % 100 !== 0)) ? 366 : 365;
  var pct = Math.min(day / total, 1);
  document.getElementById('yearFill').style.width = (pct * 100) + '%';
  document.getElementById('yearText').textContent = '把梦想写进日程 [ ' + yr + '已过' + Math.round(pct * 100) + '% ]';
})();

// 随机图片
document.getElementById('bgImage').src = 'https://picsum.photos/1280/960?random=' + Date.now();

// 分类点击直接跳转
var items = document.querySelectorAll('.category-item');
items.forEach(function(el) {
  el.addEventListener('click', function() {
    window.location.href = el.dataset.url;
  });
});
</script>
</body>
</html>
