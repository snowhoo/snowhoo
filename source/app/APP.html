  // 更新日期卡片（黄历）锁状态：已登录+数据就绪+已解锁 → 可缩小/展开；否则加锁遮罩
  _updateAlmanacLock: function() {
    var al = document.getElementById('almanac');
    if (!al) return;
    var user = this.getWalineUser();
    var locked = !(this.loaded && user && this.almanacUnlocked);
    if (this._noDbData) locked = true;
    al.classList.toggle('locked', locked);
    var ov = al.querySelector('.lock-overlay');
    if (locked) {
      if (!ov) {
        ov = document.createElement('span');
        ov.className = 'lock-overlay';
        ov.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
        al.appendChild(ov);
      }
    } else if (ov) {
      ov.remove();
    }
  },

  // 更新 LOGO 锁状态：已登录+数据就绪+已解锁 → 正常显示（可自由收起/展开）；否则加锁
  _updateLogoLock: function() {
    var lg = document.getElementById('topRightLogo');
    if (!lg) return;
    var user = this.getWalineUser();
    var locked = !(this.loaded && user && this.logoUnlocked);
    if (this._noDbData) locked = true;
    lg.classList.toggle('locked', locked);
    var ov = lg.querySelector('.lock-overlay');
    if (locked) {
      // 锁定状态下强制完整显示 LOGO（带锁），不处于收起边条态
      var lm = document.getElementById('logoMini');
      if (lm) lm.classList.remove('show');
      lg.classList.remove('hidden');
      if (!ov) {
        ov = document.createElement('span');
        ov.className = 'lock-overlay';
        ov.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
        lg.appendChild(ov);
      }
    } else if (ov) {
      ov.remove();
    }
  },

  // 更新奔跑的人锁状态：已登录+数据就绪+已解锁 → 解锁（此时显示日程徽章入口）；否则加锁
  _updateRunnerLock: function() {
    var rf = document.getElementById('runnerFloat');
    if (!rf) return;
    var user = this.getWalineUser();
    var locked = !(this.loaded && user && this.runnerUnlocked);
    if (this._noDbData) locked = true;
    rf.classList.toggle('locked', locked);
    // 日程徽章：奔跑人解锁才显示（唯一入口），锁定/登出时隐藏并收起日程面板
    var pb = document.getElementById('planBtn');
    if (pb) {
      pb.style.display = locked ? 'none' : 'flex';
      if (locked) {
        pb.classList.remove('selected');
        var pp = document.getElementById('planPanel');
        if (pp) pp.classList.remove('show');
      }
    }
  },

  // 更新 5 个栏目按钮锁状态（story小红故事/yedu夜读/zjsz照见苏州/news新闻/tv播霸）
  _updateCategoryLocks: function() {
    var map = { story: 'storyBtn', yedu: 'yeduBtn', zjsz: 'zjszBtn', news: 'newsBtn', tv: 'tvBtn' };
    for (var k in map) {
      var el = document.getElementById(map[k]);
      if (!el) continue;
      var unlocked = this.loaded && this.getWalineUser() && this[k + 'Unlocked'];
      if (unlocked) el.classList.remove('locked');
      else el.classList.add('locked');
    }
  },

  // 根据等级数值返回对应显示文字
  getLevelName: function(lv) {
    if (typeof LEVEL_CONFIG !== 'undefined' && LEVEL_CONFIG[lv]) return LEVEL_CONFIG[lv].name;
    if (typeof LEVEL_TABLE !== 'undefined' && LEVEL_TABLE[lv]) return LEVEL_TABLE[lv];
    return '凡人';
  },

  // 更新左下角境界显示（打坐人物上方）
  updateLevelDisplay: function() {
    var el = document.getElementById('xzLevel');
    if (!el) return;
    var user = this.getWalineUser();
    // 数据未加载完成时不显示（同红点/真气值行为）
    if (!this.loaded || !user) {
      el.style.display = 'none';
    } else {
      el.textContent = this.getLevelName(this.level);
      el.style.display = '';
    }
  },

  // 通用写入：将完整游戏状态（含解锁标记）保存到 Waline（有记录 PUT 更新，无记录 POST 创建）
  _writeState: function(user, commentObj, successMsg) {
    var self = this;
    // 写库动作执行：此时才进入"真气融合中"，不再由调用方前置设置
    this.setSyncState('saving');
    var payload = JSON.stringify({
      comment: JSON.stringify(commentObj),
      url: '/app-game/actions',
      nick: user.display_name || '游客',
      mail: user.email || ''
    });
    var token = user.token || '';
    if (!token) { try { var s = JSON.parse(localStorage.getItem('WALINE_USER')||'{}'); if(s.token) token=s.token; } catch(e){} }
    var headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var request;
    if (this._gameObjectId) {
      // 已有记录 → PUT 更新
      request = fetch('https://waline.snowhoo.net/api/comment/' + this._gameObjectId, {
        method: 'PUT',
        headers: headers,
        body: payload
      });
    } else {
      // 无记录 → POST 创建新记录（带 auth，确保有所属用户）
      request = fetch('https://waline.snowhoo.net/api/comment', {
        method: 'POST',
        headers: headers,
        body: payload
      }).then(function(r){
        if (r.ok) {
          return r.json().then(function(j){
            if (j.data && j.data.objectId) {
              self._gameObjectId = parseInt(j.data.objectId,10);
            }
            return r;
          });
        }
        return r;
      });
    }
    return request.then(function(r){
      if (r.ok) {
        console.log('[GAME]', successMsg);
        return self.loadFromServer(user).then(function(){ return true; });
      } else {
        self.syncError = true;
        return r.text().then(function(t){ console.warn('[GAME] Waline 同步失败', r.status, t); return false; });
      }
    }).catch(function(e){
      self.syncError = true;
      console.warn('[GAME] Waline 同步网络失败:', e);
      return false;
    }).then(function(ok){
      if (!ok) {
        self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
        self.syncError = false;
        self._beforePoints = undefined;
        self.setSyncState('idle');
        self.updateBadge();
        self.updateTaskDots();
      }
      return !!ok;
    });
  },

  // 归一化剩余次数：确保所有任务都有值（缺失时用配置的 max 补全），首次修炼/解锁时防止写入空对象
  _normalizeRemaining: function(base) {
    var src = base || this.todayCounts || {};
    var out = {};
    if (!window.GAME_CONFIG) {
      for (var k in src) out[k] = src[k];
      return out;
    }
    for (var i = 0; i < GAME_CONFIG.length; i++) {
      var ck = GAME_CONFIG[i].key;
      out[ck] = (typeof src[ck] === 'number') ? src[ck] : GAME_CONFIG[i].max;
    }
    return out;
  },

  // 从数据库读取当前用户的真实记录（只读，不更新 UI），返回 Promise<{foundId, data}>
  // 写入前必须先调此方法拿真实数据，再基于真实数据处理后写入，防止覆盖其他端的最新数据
  _fetchCurrentRecord: function(user) {
    var self = this;
    var userNick = user.display_name || '';
    var p = fetch('https://waline.snowhoo.net/api/comment?path=/app-game/actions')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(resp) {
        var records = (resp.data && resp.data.data) || [];
        var foundId = 0, foundData = null;
        for (var i = 0; i < records.length; i++) {
          try {
            var r = records[i];
            if ((r.nick || '') !== userNick) continue;
            var raw = r.orig || r.comment || '';
            var data = self.parseGameRecord(raw);
            if (data && typeof data.points === 'number' && data.todayRemaining) {
              var id = parseInt(r.objectId, 10) || 0;
              if (id > foundId) { foundId = id; foundData = data; }
            }
          } catch(e) {}
        }
        return { foundId: foundId, data: foundData };
      });
    // 8 秒超时兜底：防止网络挂起导致状态机永久卡在 loading/saving
    var timer = new Promise(function(resolve, reject) {
      setTimeout(function(){ reject(new Error('读取超时')); }, 8000);
    });
    return Promise.race([p, timer]);
  },

  syncToWaline: function(key,points,user) {
    try {
      if (!user || !user.display_name) return Promise.resolve(false);
      var self = this;
      return this.performCultivate(key, user, {points: points});
    } catch(e){ console.warn('[GAME] Waline 同步异常:', e); return Promise.resolve(false); }
  },

  // 核心修炼：读库真实数据 → 基于真实值计算 → 写库（PUT/POST）→ 读回确认
  // 返回 Promise<boolean>：写库成功 true，失败 false（失败时已显示心魔困扰）
  performCultivate: function(key, user, opts) {
    var self = this;
    opts = opts || {};
    // 记录操作前真气快照（与手动修炼 doAction 一致），读回后按实际增益显示 +真气
    this._beforePoints = this.totalPoints;
    // 读库阶段：真气恢复中（saving 由 _writeState 在真正写库时设置）
    this.setSyncState('loading');
    return this._fetchCurrentRecord(user).then(function(res) {
      var basePoints = res.data ? res.data.points : 0;
      var baseRemaining = (res.data && res.data.todayRemaining) ? res.data.todayRemaining : {};
      var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : self.level;
      var baseAuto = res.data ? (res.data.autoUnlocked ? 1 : 0) : self.autoUnlocked;
      var baseOneKey = res.data ? (res.data.oneKeyUnlocked ? 1 : 0) : self.oneKeyUnlocked;
      var baseAlmanac = res.data ? (res.data.almanacUnlocked ? 1 : 0) : self.almanacUnlocked;
      var baseLogo = res.data ? (res.data.logoUnlocked ? 1 : 0) : self.logoUnlocked;
      // 找到真实记录 → 用其 objectId，确保 PUT 更新同一条（不产生新记录）
      if (res.foundId) self._gameObjectId = res.foundId;
      // 单次经验值（可覆盖：一键批量用自身计算，正常修炼按境界查表）
      var points = (opts.points !== undefined) ? opts.points : self.getActionPoints(key);
      // 基于真实数据计算
      var newPoints = basePoints + points;
      var newRemaining = self._normalizeRemaining(baseRemaining);
      if (typeof newRemaining[key] === 'number') newRemaining[key]--;
      var now = new Date();
      var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      // 写入（成功后再回读确认，更新 UI）
      return self._writeState(user, {
        points: newPoints,
        todayRemaining: newRemaining,
        nick: user.display_name,
        level: baseLevel,
        date: today,
        autoUnlocked: baseAuto,
        oneKeyUnlocked: baseOneKey,
        almanacUnlocked: baseAlmanac,
        logoUnlocked: baseLogo,
        runnerUnlocked: (res.data && res.data.runnerUnlocked) ? 1 : self.runnerUnlocked,
        storyUnlocked: (res.data && res.data.storyUnlocked) ? 1 : self.storyUnlocked,
        yeduUnlocked: (res.data && res.data.yeduUnlocked) ? 1 : self.yeduUnlocked,
        zjszUnlocked: (res.data && res.data.zjszUnlocked) ? 1 : self.zjszUnlocked,
        newsUnlocked: (res.data && res.data.newsUnlocked) ? 1 : self.newsUnlocked,
        tvUnlocked: (res.data && res.data.tvUnlocked) ? 1 : self.tvUnlocked
      }, '真气值已同步到 Waline: ' + key + ' +' + points);
    }).catch(function(e) {
      // 写入前读取真实数据失败 → 无法保证写入正确性，阻止写入
      console.warn('[GAME] 写入前读取真实数据失败:', e);
      self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      self.setSyncState('idle');
      self.updateBadge();
      self.updateTaskDots();
      return false;
    });
  },

  // 面板数据加载完成通知（自动修炼模式下由面板函数调用，替代 doAction）
  _autoPanelLoaded: function(key, ok) {
    // key 匹配当前期望的任务才响应（避免上一步迟到的回调误触发下一步）
    if (this._autoPanelCb && this._autoPanelKey === key) {
      var cb = this._autoPanelCb;
      this._autoPanelCb = null;
      this._autoPanelKey = null;
      cb(ok);
    }
  },

  // 解锁功能：消耗真气一次性解锁"自动"/"一键"/"日期卡片"
  unlockFeature: function(feature) {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    var cfg = (typeof UNLOCK_CONFIG !== 'undefined') ? UNLOCK_CONFIG : {auto:888, oneKey:999, almanac:666, logo:777, story:111, yedu:222, zjsz:333, news:444, tv:555, runner:1000};
    var cost = cfg[feature];
    if (!cost) return;
    var names = {auto:'自动', oneKey:'一键', almanac:'日期卡片', logo:'LOGO', story:'小红故事', yedu:'夜读', zjsz:'照见苏州', news:'新闻', tv:'播霸', runner:'奔跑'};
    var name = names[feature] || feature;
    // 5 个栏目（参照自动修炼锁定，解锁后正常跳转）
    var catKeys = ['story','yedu','zjsz','news','tv'];
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    var self = this;
    // 1. 立即弹询问窗口（不先读库），确认后窗口不关闭，读写信息直接在窗口内显示
    self._showUnlockFlow(cost, {
      onConfirm: function(setStatus) {
        // 确认后再校验登录状态（未登录 → 窗口提示，无法注入真气破除封印）
        var user = self.getWalineUser();
        if (!user) {
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
          setStatus('隐匿身份', '隐匿身份，无法注入真气破除封印!');
          return;
        }
        // 2. 确认后读数据库真实数据（真气值/解锁状态以数据库为准，防止多端数据过期）
        setStatus('⚡ 破除封印', '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseAuto = res.data ? (res.data.autoUnlocked ? 1 : 0) : 0;
          var baseOneKey = res.data ? (res.data.oneKeyUnlocked ? 1 : 0) : 0;
          var baseAlmanac = res.data ? (res.data.almanacUnlocked ? 1 : 0) : 0;
          var baseLogo = res.data ? (res.data.logoUnlocked ? 1 : 0) : 0;
          var baseRunner = res.data ? (res.data.runnerUnlocked ? 1 : 0) : 0;
          var baseCats = {};
          for (var ci = 0; ci < catKeys.length; ci++) {
            baseCats[catKeys[ci]] = res.data ? (res.data[catKeys[ci] + 'Unlocked'] ? 1 : 0) : 0;
          }
          var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : self.level;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 以下所有"不能解锁"的场景：直接回 idle 并恢复按钮文本，不写库
          // 结果直接在窗口内显示（原页面提示保留照旧）
          // 已解锁（以数据库为准）→ 同步内存标记并提示
          if (feature === 'auto' && baseAuto) {
            self.autoUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"自动" 已解锁');
            self._updateQuickBtns(true);
            setStatus('无需破除封印', '"自动" 功能已解锁');
            return;
          }
          if (feature === 'oneKey' && baseOneKey) {
            self.oneKeyUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"一键" 已解锁');
            self._updateQuickBtns(true);
            setStatus('无需破除封印', '"一键" 功能已解锁');
            return;
          }
          if (feature === 'almanac' && baseAlmanac) {
            self.almanacUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"日期卡片" 已解锁');
            self._updateAlmanacLock();
            setStatus('无需破除封印', '"日期卡片" 功能已解锁');
            return;
          }
          if (feature === 'logo' && baseLogo) {
            self.logoUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"LOGO" 已解锁');
            self._updateLogoLock();
            setStatus('无需破除封印', '"LOGO" 功能已解锁');
            return;
          }
          if (feature === 'runner' && baseRunner) {
            self.runnerUnlocked = 1;
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '"奔跑" 已解锁');
            self._updateRunnerLock();
            setStatus('无需破除封印', '"奔跑" 功能已解锁');
            return;
          }
          // 5 个栏目：已解锁（以数据库为准）→ 同步内存标记并提示
          for (var ci2 = 0; ci2 < catKeys.length; ci2++) {
            var ck = catKeys[ci2];
            if (feature === ck && baseCats[ck]) {
              self[ck + 'Unlocked'] = 1;
              self.setSyncState('idle');
              self.updateTaskMenuBtn();
              self.showXp('', '"' + names[ck] + '" 已解锁');
              self._updateCategoryLocks();
              setStatus('无需破除封印', '"' + names[ck] + '" 功能已解锁');
              return;
            }
          }
          // "一键"需先解锁"自动"
          if (feature === 'oneKey' && !baseAuto) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '需先解锁"自动"功能!');
            setStatus('无法破除封印', '需先解锁"自动"功能!');
            return;
          }
          // 真气不足（以数据库真实值为准）→ 不允许解锁
          if (basePoints < cost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破除封印需要 ' + cost + ' 真气！');
            setStatus('无法破除封印', '真气不足，破除封印需要 ' + cost + ' 真气！');
            return;
          }
          // 3. 写库（saving 由 _writeState 内部在写库动作执行时设置）
          //    注意：不在此处修改 self.xxxUnlocked，也不立即解锁——
          //    解锁状态以写库成功后读库返回的数据为准（processRecords 从数据库读回并更新 UI）
          setStatus('⚡ 破除封印', '正在融合真气..');
          var newPoints = basePoints - cost;
          var newAuto = (feature === 'auto') ? 1 : baseAuto;
          var newOneKey = (feature === 'oneKey') ? 1 : baseOneKey;
          var newAlmanac = (feature === 'almanac') ? 1 : baseAlmanac;
          var newLogo = (feature === 'logo') ? 1 : baseLogo;
          var newRunner = (feature === 'runner') ? 1 : baseRunner;
          var newCats = {};
          for (var ci3 = 0; ci3 < catKeys.length; ci3++) {
            newCats[catKeys[ci3]] = (feature === catKeys[ci3]) ? 1 : baseCats[catKeys[ci3]];
          }
          // 记录解锁成功后的提示（由 processRecords 在写库读回确认后显示，与修炼 +真气 一致）
          self._pendingUnlockMsg = '-' + cost + ' 真气，封印已破！';
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          // 4. 写入（成功后再回读确认，由 processRecords 根据数据库数据更新解锁状态）
          self._writeState(user, {
            points: newPoints,
            todayRemaining: self._normalizeRemaining(res.data ? res.data.todayRemaining : null),
            nick: user.display_name,
            level: baseLevel,
            date: today,
            autoUnlocked: newAuto,
            oneKeyUnlocked: newOneKey,
            almanacUnlocked: newAlmanac,
            logoUnlocked: newLogo,
            runnerUnlocked: newRunner,
            storyUnlocked: newCats.story,
            yeduUnlocked: newCats.yedu,
            zjszUnlocked: newCats.zjsz,
            newsUnlocked: newCats.news,
            tvUnlocked: newCats.tv
          }, '已解锁"' + name + '"功能').then(function(ok) {
            // 结果直接在窗口内显示（页面成功提示照旧由 processRecords 驱动）
            setStatus(ok ? '✓ 封印已破' : '心魔困扰', ok ? ('解锁成功！-' + cost + ' 真气，封印已破！') : '正遭受心魔困扰，点击恢复心神!');
          });
        }).catch(function(e) {
          // 确认后读取真实数据失败/超时 → 无法保证解锁正确性，窗口提示并回 idle
          console.warn('[GAME] 解锁前读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    });
  },

  // 境界突破流程弹窗：询问 → 确认后窗口不关闭，读库/写库进度与结果直接在窗口内显示（暗绿色主题）
  // opts.onConfirm(setStatus)：用户点"破境"后调用；setStatus(title, text) 更新窗口内容
  _showUpgradeFlow: function(cost, nextName, opts) {
    return new Promise(function(resolve) {
      var mask = document.getElementById('upgradeConfirm');
      var title = document.getElementById('upgradeConfirmTitle');
      var text = document.getElementById('upgradeConfirmText');
      var okBtn = document.getElementById('upgradeConfirmOk');
      var cancelBtn = document.getElementById('upgradeConfirmCancel');
      // 弹层元素缺失时兜底用原生 confirm
      if (!mask || !title || !text || !okBtn || !cancelBtn) {
        if (opts && opts.onConfirm) {
          if (window.confirm('消耗 ' + cost + ' 真气，破境至【' + nextName + '】？')) opts.onConfirm(function(){});
        }
        resolve(true);
        return;
      }
      // 询问态
      title.textContent = '⚡ 境界突破';
      text.textContent = '消耗 ' + cost + ' 真气，破境至【' + nextName + '】？';
      okBtn.textContent = '破境';
      cancelBtn.style.display = '';
      mask.classList.add('show');
      var settled = false;
      function finish(v) {
        if (settled) return;
        settled = true;
        mask.classList.remove('show');
        cancelBtn.style.display = '';
        okBtn.textContent = '破境';
        okBtn.removeEventListener('click', onOk);
        okBtn.removeEventListener('click', onClose);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(v);
      }
      function onOk() {
        // 确认 → 窗口不关闭，转为流程态：隐藏"再想想"，按钮变"知道了"
        okBtn.removeEventListener('click', onOk);
        cancelBtn.style.display = 'none';
        okBtn.textContent = '知道了';
        okBtn.addEventListener('click', onClose);
        if (opts && opts.onConfirm) {
          opts.onConfirm(function(t, x) {
            if (settled) return;
            if (t !== undefined) title.textContent = t;
            if (x !== undefined) text.textContent = x;
          });
        }
      }
      function onClose() { finish(true); }
      function onCancel() { finish(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  },

  // 手动升级境界：扣真气 → level+1 → 写库 → 读回确认 → 显示【境界突破】
  upgradeLevel: function() {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    var user = this.getWalineUser();
    if (!user) {
      this.showXp('', '请勿隐匿身份，否则您无法修炼');
      return;
    }
    if (!this.loaded) {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法升级..' : '真气融合中，无法升级..');
      return;
    }
    // 检查 LEVEL_CONFIG 是否存在
    if (typeof LEVEL_CONFIG === 'undefined') {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    var self = this;
    // 用内存境界推算下一档（本地配置用于询问文案；确认后读库再以数据库为准复核）
    var nextLv0 = self.level + 1;
    if (!LEVEL_CONFIG[nextLv0]) {
      this.showXp('', '已达最高境界【化神大圆满】');
      return;
    }
    var preCost = LEVEL_CONFIG[nextLv0].cost;
    var preName = LEVEL_CONFIG[nextLv0].name;
    // 1. 立即弹询问窗口（暗绿色，不先读库），确认后窗口不关闭，读写信息直接在窗口内显示
    self._showUpgradeFlow(preCost, preName, {
      onConfirm: function(setStatus) {
        // 2. 确认后读数据库真实数据（真气/level 以数据库为准）
        setStatus('⚡ 境界突破', '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseLevel = res.data && typeof res.data.level === 'number' ? res.data.level : self.level;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 检查等级上限（以数据库为准，已是最高境界）
          var nextLv = baseLevel + 1;
          if (!LEVEL_CONFIG[nextLv]) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '已达最高境界【化神大圆满】');
            setStatus('已达最高境界', '已臻【化神大圆满】，无法继续突破');
            return;
          }
          var realCost = LEVEL_CONFIG[nextLv].cost;
          var nextName = LEVEL_CONFIG[nextLv].name;
          // 真气不足 → 窗口提示（原页面提示保留照旧）
          if (basePoints < realCost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破境【' + nextName + '】需 ' + realCost + ' 真气');
            setStatus('无法突破', '真气不足，破境【' + nextName + '】需 ' + realCost + ' 真气');
            return;
          }
          // 3. 写库（saving 由 _writeState 内部在写库动作执行时设置）
          setStatus('⚡ 境界突破', '正在融合真气..');
          var newPoints = basePoints - realCost;
          var newLevel = nextLv;
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          // 升级后剩余次数按新境界 times 全量恢复（体力已恢复）
          var newRemaining = self.buildRemainingForLevel(newLevel);
          self._writeState(user, {
            points: newPoints,
            todayRemaining: newRemaining,
            nick: user.display_name,
            level: newLevel,
            date: today,
            autoUnlocked: self.autoUnlocked,
            oneKeyUnlocked: self.oneKeyUnlocked,
            almanacUnlocked: self.almanacUnlocked,
            logoUnlocked: self.logoUnlocked,
            runnerUnlocked: self.runnerUnlocked,
            storyUnlocked: self.storyUnlocked,
            yeduUnlocked: self.yeduUnlocked,
            zjszUnlocked: self.zjszUnlocked,
            newsUnlocked: self.newsUnlocked,
            tvUnlocked: self.tvUnlocked
          }, '境界提升至【' + nextName + '】').then(function(ok) {
            // 不前置显示升级提示，由 processRecords 读回确认后展示（与修炼+真气同一时序）
            self._pendingUpgradeMsg = { name: nextName, cost: realCost };
            // 结果直接在窗口内显示（暗绿色窗口）
            setStatus(ok ? '✓ 突破成功' : '心魔困扰', ok ? ('境界提升至【' + nextName + '】！-' + realCost + ' 真气，体力恢复！') : '正遭受心魔困扰，点击恢复心神!');
          });
        }).catch(function(e) {
          // 确认后读取真实数据失败/超时 → 无法保证升级正确性，窗口提示并回 idle
          console.warn('[GAME] 升级前读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          self.updateTaskMenuBtn();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    });
  },

  // 双击背景图破除隐藏结界：扣随机真气 → 成功后保存当前背景图到相册
  // 流程与其它解锁完全一致：先弹询问窗 → 确认后窗口不关闭 → 读库校验（登录/真气不足）→ 扣真气写库 → 读回确认 → 保存图片
  // 参数与文案由 game-config.js 的 BG_UNLOCK_CONFIG 配置（不记录解锁状态、不限次数）
  unlockBackground: function() {
    if (this._autoMode || this._oneKeyMode) return; // 自动/一键修炼中屏蔽
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    var cfg = (typeof BG_UNLOCK_CONFIG !== 'undefined') ? BG_UNLOCK_CONFIG : {};
    var min = (typeof cfg.min === 'number') ? cfg.min : 5;
    var max = (typeof cfg.max === 'number') ? cfg.max : 10;
    if (max < min) max = min;
    var cost = min + Math.floor(Math.random() * (max - min + 1)); // min~max 随机
    var qTitle = cfg.title || '🗝 隐藏结界';
    var qText = (cfg.text || '发现隐藏结界，注入 {cost} 真气破除结界？').replace('{cost}', cost);
    var qOk = cfg.okText || '破除';
    var doneTitle = cfg.doneTitle || '✓ 结界已破';
    var doneText = (cfg.doneText || '结界破除！-{cost} 真气，图片已保存到相册').replace('{cost}', cost);
    var self = this;
    // 1. 立即弹询问窗口（自定义文案：隐藏结界），确认后窗口不关闭
    self._showUnlockFlow(cost, {
      title: qTitle,
      text: qText,
      okText: qOk,
      onConfirm: function(setStatus) {
        // 确认后再校验登录状态（未登录 → 窗口提示，无法注入真气）
        var user = self.getWalineUser();
        if (!user) {
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
          setStatus('隐匿身份', '隐匿身份，无法注入真气破除结界!');
          return;
        }
        // 2. 读数据库真实数据（真气值以数据库为准）
        setStatus(qTitle, '正在恢复真气..');
        self.setSyncState('loading');
        self._fetchCurrentRecord(user).then(function(res) {
          var basePoints = res.data ? res.data.points : 0;
          var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : self.level;
          if (res.foundId) self._gameObjectId = res.foundId;
          // 真气不足（以数据库真实值为准）→ 窗口提示，不写库
          if (basePoints < cost) {
            self.setSyncState('idle');
            self.updateTaskMenuBtn();
            self.showXp('', '真气不足，破除结界需要 ' + cost + ' 真气！');
            setStatus('无法破除结界', '真气不足，破除结界需要 ' + cost + ' 真气！');
            return;
          }
          // 3. 写库：扣随机真气，解锁状态字段保留数据库原值（结界不记录解锁状态、不限次数）
          setStatus(qTitle, '正在融合真气..');
          var now = new Date();
          var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
          var newPoints = basePoints - cost;
          var newRemaining = self._normalizeRemaining(res.data ? res.data.todayRemaining : null);
          self._writeState(user, {
            points: newPoints,
            todayRemaining: newRemaining,
            nick: user.display_name,
            level: baseLevel,
            date: today,
            autoUnlocked: (res.data && res.data.autoUnlocked) ? 1 : self.autoUnlocked,
            oneKeyUnlocked: (res.data && res.data.oneKeyUnlocked) ? 1 : self.oneKeyUnlocked,
            almanacUnlocked: (res.data && res.data.almanacUnlocked) ? 1 : self.almanacUnlocked,
            logoUnlocked: (res.data && res.data.logoUnlocked) ? 1 : self.logoUnlocked,
            runnerUnlocked: (res.data && res.data.runnerUnlocked) ? 1 : self.runnerUnlocked,
            storyUnlocked: (res.data && res.data.storyUnlocked) ? 1 : self.storyUnlocked,
            yeduUnlocked: (res.data && res.data.yeduUnlocked) ? 1 : self.yeduUnlocked,
            zjszUnlocked: (res.data && res.data.zjszUnlocked) ? 1 : self.zjszUnlocked,
            newsUnlocked: (res.data && res.data.newsUnlocked) ? 1 : self.newsUnlocked,
            tvUnlocked: (res.data && res.data.tvUnlocked) ? 1 : self.tvUnlocked
          }, '破除结界 -' + cost + ' 真气').then(function(ok) {
            if (!ok) {
              setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
              return;
            }
            // 成功 → 窗口提示 + 保存图片到相册
            setStatus(doneTitle, doneText);
            self.saveBgImage();
          });
        }).catch(function(e) {
          console.warn('[GAME] 破除结界读取真实数据失败:', e);
          self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
          self.setSyncState('idle');
          self.updateBadge();
          self.updateTaskDots();
          setStatus('心魔困扰', '正遭受心魔困扰，点击恢复心神!');
        });
      }
    });
  },

  // 是否运行在 App 内嵌 WebView 中（UA 自动识别 + 配置关键字）
  // WebView 无下载处理器：a[download] 下载会导致 App 退出/无反应，需走长按保存
  _isInAppWebView: function() {
    var ua = (navigator.userAgent || '').toLowerCase();
    // 通用 WebView 标识（Android: "; wv"；iOS WKWebView: "Mobile/...Safari" 无标识，靠关键字补）
    if (/\bwv\b|webview|wkwebview/.test(ua)) return true;
    // 配置关键字（game-config.js 的 WEBVIEW_UA_KEYWORDS，App 壳自定义 UA 标识）
    var kws = (typeof WEBVIEW_UA_KEYWORDS !== 'undefined' && WEBVIEW_UA_KEYWORDS.length) ? WEBVIEW_UA_KEYWORDS : [];
    for (var i = 0; i < kws.length; i++) {
      if (kws[i] && ua.indexOf(String(kws[i]).toLowerCase()) >= 0) return true;
    }
    return false;
  },

  // 全屏预览当前图片 + 长按保存到相册（WebView 环境专用，替代 a[download] 下载，避免退出 App）
  _showBgPreview: function(blob) {
    var name = 'bg-' + Date.now() + '.jpg';
    var reader = new FileReader();
    reader.onload = function() {
      var mask = document.createElement('div');
      mask.className = 'bg-save-mask';
      mask.innerHTML =
        '<div class="bg-save-tip">长按图片保存到相册</div>' +
        '<img class="bg-save-img" src="' + reader.result + '" alt="背景图" draggable="false">' +
        '<button class="bg-save-close">关闭</button>';
      document.body.appendChild(mask);
      var close = mask.querySelector('.bg-save-close');
      close.addEventListener('click', function(){ mask.remove(); });
      mask.addEventListener('click', function(e){ if (e.target === mask) mask.remove(); });
    };
    reader.readAsDataURL(blob);
  },

  // 保存当前背景图：用 canvas 捕获页面正在显示的图片（保证与页面看到的一致，不重新请求）
  // 浏览器：优先 Web Share API（移动端可直接存相册），否则 a[download] + blob 直接下载（不跳转浏览器）
  // App WebView：禁用 a[download]（会退出 App）→ 优先系统分享，否则全屏预览 + 长按保存到相册
  saveBgImage: function() {
    var img = document.getElementById('bgImage');
    if (!img || !img.src) return;
    var self = this;
    var name = 'bg-' + Date.now() + '.jpg';
    var inWebView = this._isInAppWebView();
    function downloadBlob(blob, n) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = n;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    }
    function shareOrDownload(blob, n) {
      // App WebView：优先原生桥保存到系统相册（最可靠，替代长按/下载，不会退出 App）
      if (inWebView && window.AndroidBridge && typeof window.AndroidBridge.save === 'function') {
        var rd = new FileReader();
        rd.onload = function() {
          try { window.AndroidBridge.save(rd.result, n); }
          catch (e) { self._showBgPreview(blob); }
        };
        rd.readAsDataURL(blob);
        return;
      }
      // 移动端优先系统分享（可存相册）
      if (navigator.canShare && navigator.share) {
        var file = new File([blob], n, { type: blob.type || 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          // WebView 里分享面板取消/失败 → 回退预览长按保存；浏览器取消则静默
          navigator.share({ files: [file], title: '背景图' })
            .catch(function(){ if (inWebView) self._showBgPreview(blob); });
          return;
        }
      }
      if (inWebView) {
        // WebView：不用 a[download]（会导致退出 App），改全屏预览长按保存
        self._showBgPreview(blob);
      } else {
        // 直接下载（blob 本地数据，不跳转、不会被刷新成其他图）
        downloadBlob(blob, n);
      }
    }
    // canvas 捕获当前已显示的图片 → toBlob（crossOrigin=anonymous 已保证画布不被污染）
    try {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      if (!c.width || !c.height) { fallbackSave(); return; }
      var ctx = c.getContext('2d');
      if (!ctx) { fallbackSave(); return; }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob) {
        if (blob) { shareOrDownload(blob, name); }
        else { fallbackSave(); }
      }, 'image/jpeg', 0.92);
    } catch (e) {
      fallbackSave();
    }
    function fallbackSave() {
      if (inWebView) {
        // WebView 极端兜底：直接展示原始图 URL 的全屏预览，长按保存
        var mask = document.createElement('div');
        mask.className = 'bg-save-mask';
        mask.innerHTML =
          '<div class="bg-save-tip">长按图片保存到相册</div>' +
          '<img class="bg-save-img" src="' + img.src + '" alt="背景图" draggable="false">' +
          '<button class="bg-save-close">关闭</button>';
        document.body.appendChild(mask);
        mask.querySelector('.bg-save-close').addEventListener('click', function(){ mask.remove(); });
        mask.addEventListener('click', function(e){ if (e.target === mask) mask.remove(); });
        return;
      }
      // 浏览器兜底：下载当前图片 URL（极端情况才会走，picsum 可能因 random 参数重新生成图）
      var a = document.createElement('a');
      a.href = img.src;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  },

  // 自动修炼：与手动修炼一致——展开面板（真实加载数据）→ 数据加载完成 → 读库→写库→读回确认
  // 依次展开诗词/今日/星座/探索，有剩余次数则循环；每次写库完成后才进入下一动作
  autoCultivate: function() {
    if (this._autoMode || this._oneKeyMode) return;
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    // 未解锁 → 走解锁流程（登录/加载校验在确认后统一处理，未登录也先弹确认再提示）
    if (!this.autoUnlocked) { this.unlockFeature('auto'); return; }
    var user = this.getWalineUser();
    if (!user) {
      this.showXp('', '请勿隐匿身份，否则您无法修炼');
      return;
    }
    if (!this.loaded) {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    var self = this;
    this._autoMode = true;
    // 全屏透明遮罩：覆盖所有页面功能
    this.showModeMask();
    // 上方提示（autoHint）始终显示"自动修炼中.."；其余提示与手动修炼完全一致（原位置原内容）
    var hint = document.getElementById('autoHint');
    if (hint) { hint.textContent = '⚡ 自动修炼中..'; hint.style.display = 'block'; }
    // 任务顺序（按配置）
    var keys = [];
    if (window.GAME_CONFIG) {
      for (var i = 0; i < GAME_CONFIG.length; i++) keys.push(GAME_CONFIG[i].key);
    } else { keys = ['poetry','history','constellation','explore']; }
    function openPanel(key) {
      if (key === 'poetry') { togglePoetry(); }
      else if (key === 'history') { toggleHistory(); }
      else if (key === 'constellation') { document.getElementById('constellationBtn').click(); }
      else if (key === 'explore') { document.querySelector('.welcome').click(); }
    }
    function step() {
      if (!self._autoMode) return;
      // 找下一个有剩余次数且经验>0 的任务
      var next = null;
      for (var j = 0; j < keys.length; j++) {
        var k = keys[j];
        var rem = self.todayCounts[k] || 0;
        var pts = self.getActionPoints(k);
        if (rem > 0 && pts > 0) { next = k; break; }
      }
      if (!next) {
        // 全部完成
        self._autoMode = false;
        self._autoPanelCb = null;
        self._autoPanelKey = null;
        self.hideModeMask();
        self.setSyncState('idle');
        self.updateTaskMenuBtn();
        var h2 = document.getElementById('autoHint');
        if (h2) {
          h2.textContent = '自动修炼完成！';
          setTimeout(function(){ h2.style.display = 'none'; }, 2200);
        }
        return;
      }
      // 展开面板（真实加载数据），等待加载完成回调（带超时，失败/超时跳过该任务）
      self._autoPanelKey = next;
      var done = false;
      var timer = setTimeout(function() {
        if (done) return;
        done = true;
        self._autoPanelCb = null;
        self._autoPanelKey = null;
        setTimeout(step, 120); // 加载超时：跳过该任务继续
      }, 15000);
      self._autoPanelCb = function(ok) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (!ok) { setTimeout(step, 120); return; } // 面板加载失败：跳过
        // 数据加载完成 → 修炼（读库→写库→读回确认），写库完成后进入下一动作
        self.performCultivate(next, user, {}).then(function(ok2) {
          if (!ok2) {
            // 写库失败：停止自动修炼（错误提示已由 _writeState 显示）
            self._autoMode = false;
            self._autoPanelCb = null;
            self._autoPanelKey = null;
            self.hideModeMask();
            self.setSyncState('idle');
            var h3 = document.getElementById('autoHint');
            if (h3) h3.style.display = 'none';
            self.updateBadge();
            self.updateTaskDots();
            return;
          }
          setTimeout(step, 120);
        });
      };
      // 主动打开面板（放行入口拦截）
      self._autoPanelOpen = true;
      openPanel(next);
      self._autoPanelOpen = false;
    }
    step();
  },

  // 一键修炼：计算所有可修炼任务的次数与经验，汇总后一次写入数据库
  oneKeyCultivate: function() {
    if (this._autoMode || this._oneKeyMode) return;
    if (this.syncState !== 'idle') {
      this.showXp('', this.syncState === 'loading' ? '真气恢复中，无法修炼..' : '真气融合中，无法修炼..');
      return;
    }
    // 未解锁 → 走解锁流程（登录/加载校验在确认后统一处理，未登录也先弹确认再提示）
    if (!this.oneKeyUnlocked) { this.unlockFeature('oneKey'); return; }
    var user = this.getWalineUser();
    if (!user) {
      this.showXp('', '请勿隐匿身份，否则您无法修炼');
      return;
    }
    if (!this.loaded) {
      this.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      return;
    }
    var self = this;
    this._oneKeyMode = true;
    // 全屏透明遮罩：覆盖所有页面功能；提示显示在按钮上方 autoHint
    this.showModeMask();
    var hint = document.getElementById('autoHint');
    if (hint) { hint.textContent = '⚡ 一键修炼中..'; hint.style.display = 'block'; }
    // 读库真实数据 → 汇总次数与经验 → 一次写入
    this._fetchCurrentRecord(user).then(function(res) {
      var basePoints = res.data ? res.data.points : 0;
      var baseRemaining = (res.data && res.data.todayRemaining) ? res.data.todayRemaining : null;
      var baseLevel = (res.data && typeof res.data.level === 'number') ? res.data.level : self.level;
      var baseAuto = res.data ? (res.data.autoUnlocked ? 1 : 0) : self.autoUnlocked;
      var baseOneKey = res.data ? (res.data.oneKeyUnlocked ? 1 : 0) : self.oneKeyUnlocked;
      var baseAlmanac = res.data ? (res.data.almanacUnlocked ? 1 : 0) : self.almanacUnlocked;
      var baseLogo = res.data ? (res.data.logoUnlocked ? 1 : 0) : self.logoUnlocked;
      if (res.foundId) self._gameObjectId = res.foundId;
      // 基于数据库真实剩余次数汇总（缺失任务用当前境界 times 补全）
      var rem = self._normalizeRemaining(baseRemaining);
      var lvCfg = (typeof LEVEL_CONFIG !== 'undefined' && LEVEL_CONFIG[baseLevel]) ? LEVEL_CONFIG[baseLevel] : null;
      var totalGain = 0;
      var newRemaining = {};
      var keys = [];
      if (window.GAME_CONFIG) { for (var i = 0; i < GAME_CONFIG.length; i++) keys.push(GAME_CONFIG[i].key); }
      else keys = ['poetry','history','constellation','explore'];
      for (var j = 0; j < keys.length; j++) {
        var k = keys[j];
        var r = rem[k] || 0;
        var pts = (lvCfg && lvCfg.points && typeof lvCfg.points[k] === 'number') ? lvCfg.points[k] : 0;
        if (pts > 0 && r > 0) {
          totalGain += r * pts;
          newRemaining[k] = 0; // 一键修炼：清空该任务今日剩余
        } else {
          newRemaining[k] = r;
        }
      }
      if (totalGain <= 0) {
        // 今日已无可修炼任务
        self._oneKeyMode = false;
        self.hideModeMask();
        self.setSyncState('idle');
        self.updateTaskMenuBtn();
        var h0 = document.getElementById('autoHint');
        if (h0) {
          h0.textContent = '今日已无可修炼任务';
          setTimeout(function(){ h0.style.display = 'none'; }, 2200);
        }
        return;
      }
      var now = new Date();
      var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      // 一次写入（成功读回确认后 processRecords 更新 UI）
      self._writeState(user, {
        points: basePoints + totalGain,
        todayRemaining: newRemaining,
        nick: user.display_name,
        level: baseLevel,
        date: today,
        autoUnlocked: baseAuto,
        oneKeyUnlocked: baseOneKey,
        almanacUnlocked: baseAlmanac,
        logoUnlocked: baseLogo,
        runnerUnlocked: (res.data && res.data.runnerUnlocked) ? 1 : self.runnerUnlocked,
        storyUnlocked: (res.data && res.data.storyUnlocked) ? 1 : self.storyUnlocked,
        yeduUnlocked: (res.data && res.data.yeduUnlocked) ? 1 : self.yeduUnlocked,
        zjszUnlocked: (res.data && res.data.zjszUnlocked) ? 1 : self.zjszUnlocked,
        newsUnlocked: (res.data && res.data.newsUnlocked) ? 1 : self.newsUnlocked,
        tvUnlocked: (res.data && res.data.tvUnlocked) ? 1 : self.tvUnlocked
      }, '一键修炼完成 +' + totalGain + ' 真气').then(function(ok) {
        self._oneKeyMode = false;
        self.hideModeMask();
        if (ok) {
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
          var h1 = document.getElementById('autoHint');
          if (h1) {
            h1.textContent = '+' + totalGain + ' 真气，一键修炼完成！';
            setTimeout(function(){ h1.style.display = 'none'; }, 2200);
          }
        } else {
          // 写库失败：错误提示已由 _writeState 显示
          var h1b = document.getElementById('autoHint');
          if (h1b) h1b.style.display = 'none';
          self.setSyncState('idle');
          self.updateTaskMenuBtn();
        }
      });
    }).catch(function(e) {
      console.warn('[GAME] 一键修炼读取真实数据失败:', e);
      self._oneKeyMode = false;
      self.hideModeMask();
      var h1c = document.getElementById('autoHint');
      if (h1c) h1c.style.display = 'none';
      self.showTaskMenuError('正遭受心魔困扰，点击恢复心神!');
      self.setSyncState('idle');
      self.updateBadge();
      self.updateTaskDots();
    });
  }
};
GAME.init();

// ===== 日程计划面板（PlanSvc：本地存储为主 + 已登录 Waline 自动同步） =====
var PlanSvc = (function(){
  var LS_KEY = 'snowhoo_plan_data';      // 本地全部日程 { 'YYYY-MM-DD': [ {id,time,text,done} ] }
  var LS_SAVED = 'snowhoo_plan_savedAt'; // 本地最后保存时间戳
  var LS_OID = 'snowhoo_plan_oid';       // 云端评论 objectId（可重新获取）
  var CLOUD_BASE = 'https://waline.snowhoo.net';
  var CLOUD_PATH_BASE = '/app-plan/';

  var data = {};
  var curDate = '';
  var syncTimer = null, toastTimer = null;

  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function weekCN(d){ return '日一二三四五六'[d.getDay()]; }
  function parseDate(s){ var p = String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
  function $(id){ return document.getElementById(id); }

  // ---------- 本地存储 ----------
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj === 'object' && !Array.isArray(obj)) data = obj;
      }
    }catch(e){ data = {}; }
  }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
  function savedAt(){ try{ return parseInt(localStorage.getItem(LS_SAVED) || '0', 10) || 0; }catch(e){ return 0; } }
  function setSavedAt(ts){ try{ localStorage.setItem(LS_SAVED, String(ts)); }catch(e){} }
  function cloudOid(){ try{ return parseInt(localStorage.getItem(LS_OID) || '0', 10) || 0; }catch(e){ return 0; } }
  function setCloudOid(id){ try{ localStorage.setItem(LS_OID, id ? String(id) : ''); }catch(e){} }

  // ---------- Waline 用户（与 GAME.getWalineUser 同套逻辑） ----------
  function getWalineUser(){
    try{
      var keys = ['WALINE_USER','@waline/user','waline_user'];
      var user = null;
      for (var i = 0; i < keys.length; i++) {
        try{
          var val = localStorage.getItem(keys[i]);
          if (val) {
            user = JSON.parse(val);
            if (user && (user.display_name || user.nick || user.name)) break;
          }
        }catch(e){ user = null; }
      }
      if (!user) {
        try{
          var sv = sessionStorage.getItem('WALINE_USER') || sessionStorage.getItem('@waline/user');
          if (sv) { user = JSON.parse(sv); if (!user || !(user.display_name || user.nick || user.name)) user = null; }
        }catch(e){ user = null; }
      }
      if (!user) return null;
      user.display_name = user.display_name || user.nick || user.name || '';
      user.display_name = user.display_name.trim();
      if (!user.display_name) return null;
      user.email = user.email || user.mail || '';
      return user;
    }catch(e){ return null; }
  }
  // 云端按用户区分 path（email 优先，保证唯一）
  function cloudPath(u){
    var key = (u.email || u.display_name || 'guest').trim();
    return CLOUD_PATH_BASE + encodeURIComponent(key);
  }
  // 健壮解析（兼容 Waline 管理后台 markdown 渲染污染，同 GAME.parseGameRecord）
  function parsePlan(raw){
    if (!raw) return null;
    var s = String(raw).replace(/<[^>]*>/g, '')
      .replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'")
      .replace(/&quot;/g, '"').replace(/&#34;/g, '"')
      .replace(/&amp;/g, '&').replace(/&#38;/g, '&')
      .replace(/&lt;/g, '<').replace(/&#60;/g, '<')
      .replace(/&gt;/g, '>').replace(/&#62;/g, '>');
    var start = s.indexOf('{');
    var end = s.lastIndexOf('}');
    if (start >= 0 && end > start) s = s.slice(start, end + 1);
    try { return JSON.parse(s); } catch(e){ return null; }
  }

  // ---------- 云端同步 ----------
  function setTip(txt){ var el = $('planSyncTip'); if (el) el.textContent = txt || ''; }
  function updateSyncTip(){
    var u = getWalineUser();
    if (u) setTip('已登录：' + u.display_name + ' · 计划自动同步云端');
    else setTip('未登录 · 计划仅保存在本机');
  }
  // 拉取云端最新记录（含 objectId），失败返回 null
  function fetchCloud(u){
    var p = fetch(CLOUD_BASE + '/api/comment?path=' + encodeURIComponent(cloudPath(u)))
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(resp){
        var records = (resp.data && resp.data.data) || [];
        var found = null;
        for (var i = 0; i < records.length; i++) {
          try{
            var rec = records[i];
            var obj = parsePlan(rec.orig || rec.comment || '');
            if (obj && obj.v === 1 && obj.data && typeof obj.data === 'object') {
              var oid = parseInt(rec.objectId, 10) || 0;
              if (!found || oid > found.oid) found = { oid: oid, updatedAt: +obj.updatedAt || 0, data: obj.data };
            }
          }catch(e){}
        }
        return found;
      });
    var timer = new Promise(function(resolve, reject){ setTimeout(function(){ reject(new Error('超时')); }, 8000); });
    return Promise.race([p, timer]).catch(function(e){ console.warn('[计划] 拉取云端失败:', e); return null; });
  }
  // 同步：云端更新则采用；否则把本地推到云端
  function syncNow(){
    var u = getWalineUser();
    if (!u) { setCloudOid(0); return; }
    var token = u.token || '';
    if (!token) { try{ var s = JSON.parse(localStorage.getItem('WALINE_USER')||'{}'); if (s.token) token = s.token; }catch(e){} }
    fetchCloud(u).then(function(res){
      var cloud = (res && res.data) ? res : null;
      if (cloud && cloud.updatedAt > savedAt()) {
        // 云端更新 → 采用云端
        data = cloud.data;
        saveLocal();
        setSavedAt(cloud.updatedAt);
        setCloudOid(cloud.oid);
        setTip('已采用云端最新计划');
        render();
        setTimeout(function(){ updateSyncTip(); }, 2000);
        return;
      }
      // 本地更新 → 推云端
      setTip('正在同步…');
      var payload = JSON.stringify({
        comment: JSON.stringify({ v: 1, updatedAt: Date.now(), data: data }),
        url: cloudPath(u),
        nick: u.display_name || '游客',
        mail: u.email || ''
      });
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var oid = cloud ? cloud.oid : cloudOid();
      var req;
      if (oid) {
        req = fetch(CLOUD_BASE + '/api/comment/' + oid, { method: 'PUT', headers: headers, body: payload });
      } else {
        req = fetch(CLOUD_BASE + '/api/comment', { method: 'POST', headers: headers, body: payload })
          .then(function(r){
            return r.json().then(function(j){
              if (r.ok && j.data && j.data.objectId) setCloudOid(parseInt(j.data.objectId, 10));
              return r;
            });
          });
      }
      return req.then(function(r){
        if (r.ok) {
          setSavedAt(Date.now());
          setTip('已同步到云端');
        } else {
          setTip('云端同步失败 · 计划已保存在本机');
        }
        setTimeout(function(){ updateSyncTip(); }, 2000);
      }).catch(function(e){
        console.warn('[计划] 云端同步网络失败:', e);
        setTip('云端同步失败 · 计划已保存在本机');
        setTimeout(function(){ updateSyncTip(); }, 2000);
      });
    });
  }
  function syncSoon(){
    if (!getWalineUser()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 800);
  }

  // ---------- 渲染 ----------
  function listFor(date){ return data[date] || (data[date] = []); }
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function render(){
    var items = listFor(curDate).slice().sort(function(a, b){
      var ta = a.time || '99:99', tb = b.time || '99:99';
      if (ta === tb) return (a.id||0) - (b.id||0);
      return ta < tb ? -1 : 1;
    });
    var list = $('planList');
    var empty = $('planEmptyTip');
    list.innerHTML = '';
    var done = 0;
    items.forEach(function(it){
      if (it.done) done++;
      var li = document.createElement('div');
      li.className = 'plan-item' + (it.done ? ' done' : '');
      li.dataset.id = it.id;
      li.innerHTML =
        '<button class="plan-done-btn" data-act="toggle"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>' +
        '<span class="plan-time">' + (it.time ? escapeHtml(it.time) : '全天') + '</span>' +
        '<span class="plan-text">' + escapeHtml(it.text) + '</span>' +
        '<button class="plan-del-btn" data-act="del">×</button>';
      list.appendChild(li);
    });
    empty.style.display = items.length ? 'none' : 'block';
    var stat = $('planStatBar');
    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    stat.innerHTML = '今日 ' + items.length + ' 项' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      '<span class="plan-stat-done">已完成 ' + done + ' 项</span>';
    // 日期栏：单行 "2026年8月1日 周六"
    var d = parseDate(curDate);
    $('planDateMain').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 周' + weekCN(d);
  }

  // ---------- 交互 ----------
  function addItem(){
    var textEl = $('planText');
    var timeEl = $('planTime');
    var text = (textEl.value || '').trim();
    if (!text) { toast('请输入计划内容'); textEl.focus(); return; }
    listFor(curDate).push({
      id: Date.now() + Math.floor(Math.random() * 1000),
      time: timeEl.value || '',
      text: text.slice(0, 60),
      done: false
    });
    textEl.value = '';
    saveLocal(); setSavedAt(Date.now());
    render();
    syncSoon();
  }
  function toggleDone(id){
    var items = listFor(curDate);
    for (var i = 0; i < items.length; i++) {
      if (items[i].id == id) { items[i].done = !items[i].done; break; }
    }
    saveLocal(); setSavedAt(Date.now());
    render();
    syncSoon();
  }
  function delItem(id){
    var items = listFor(curDate);
    for (var i = 0; i < items.length; i++) {
      if (items[i].id == id) { items.splice(i, 1); break; }
    }
    saveLocal(); setSavedAt(Date.now());
    render();
    syncSoon();
    toast('已删除');
  }
  function shiftDate(delta){
    var d = parseDate(curDate);
    d.setDate(d.getDate() + delta);
    curDate = todayStr(d);
    render();
  }
  function toast(msg){
    var t = document.querySelector('.plan-toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'plan-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  // ---------- 初始化 ----------
  function init(){
    loadLocal();
    curDate = todayStr();
    updateSyncTip();
    render();

    $('planPrevDay').addEventListener('click', function(){ shiftDate(-1); });
    $('planNextDay').addEventListener('click', function(){ shiftDate(1); });
    $('planTodayBtn').addEventListener('click', function(){ curDate = todayStr(); render(); });
    var picker = $('planDatePicker');
    $('planDateCenter').addEventListener('click', function(){
      picker.value = curDate;
      try { picker.showPicker && picker.showPicker(); } catch(e){}
      picker.click();
    });
    picker.addEventListener('change', function(){
      if (picker.value) { curDate = picker.value; render(); }
    });
    $('planAddBtn').addEventListener('click', addItem);
    $('planText').addEventListener('keydown', function(e){
      if (e.key === 'Enter') addItem();
    });
    $('planList').addEventListener('click', function(e){
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var li = btn.closest('.plan-item');
      var id = li ? li.dataset.id : null;
      if (id == null) return;
      if (btn.dataset.act === 'toggle') toggleDone(id);
      else if (btn.dataset.act === 'del') delItem(id);
    });
  }

  return { init: init, render: render, updateSyncTip: updateSyncTip, syncNow: syncNow, getWalineUser: getWalineUser };
})();
PlanSvc.init();

// 打开/关闭日程面板（与诗词/今日/星座同一区域互斥切换，参照诗词面板：互斥关闭其它层 + 修炼中屏蔽）
function togglePlan() {
  if (GAME._autoMode || GAME._oneKeyMode) return; // 修炼中屏蔽
  var panel = document.getElementById('planPanel');
  var btn = document.getElementById('planBtn');
  if (!panel || !btn) return;
  // 关闭面板（与诗词一致：再点徽章/奔跑小人/右上角 × 关闭）
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    btn.classList.remove('selected');
    return;
  }
  cancelAllRequests();
  closeAllOverlays();
  // 清理中央内容区（诗词/今日/星座）与徽章选中态
  var area = document.getElementById('contentArea');
  if (area) { area.classList.remove('show'); area._activeBtn = null; }
  document.querySelectorAll('.badge').forEach(function(b){ b.classList.remove('selected'); });
  btn.classList.add('selected');
  panel.classList.add('show');
  PlanSvc.updateSyncTip();
  PlanSvc.render();
  if (PlanSvc.getWalineUser()) PlanSvc.syncNow();
}
document.getElementById('planBtn').addEventListener('click', togglePlan);

var walineInstance = null;
var commentOverlay = document.getElementById('commentOverlay');

// 初始化 Waline（页面加载时就初始化，非延迟加载）
// 这样登录重定向回来时 Waline 能立刻检测到用户
(function initWalineEarly() {
  import('https://unpkg.com/@waline/client@v3/dist/waline.js').then(function(mod) {
    try {
      walineInstance = mod.init({
        el: '#walineContainer',
        serverURL: 'https://waline.snowhoo.net',
        lang: 'zh-CN',
        avatar: 'mp',
        pageview: false,
        locale: {
          placeholder: '说点什么吧...',
          comment: '留言'
        },
        onLogin: function(user) {
          // 保存用户信息到 localStorage
          var gu = {
            display_name: user.display_name || user.nick || user.name || '',
            avatar: user.avatar || user.objectURL || user.avator || '',
            email: user.email || user.mail || ''
          };
          try { localStorage.setItem('GAME_USER', JSON.stringify(gu)); } catch(e) {}
          try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e) {}
          // 更新头像，然后让 checkLogin 自动检测用户变化并加载数据
          if (window.GAME) {
            GAME.updateAvatar(user);
            commentOverlay.classList.remove('active');
            // 不直接调 loadFromServer，走 checkLogin 统一路径
            // 避免与 init/定时器 双重调用导致 race condition
            GAME.checkLogin();
          }
        },
        onLogout: function() {
          try { localStorage.removeItem('GAME_USER'); } catch(e) {}
          try { localStorage.removeItem('WALINE_USER'); } catch(e) {}
          if (window.GAME) {
            // 不设 lastUser，让 checkLogin 自然检测到 user→null 的变化进入登出分支
            GAME.checkLogin();
          }
        }
      });
      console.log('[GAME] Waline init OK');
    } catch(e) {
      console.error('[GAME] Waline init error:', e);
    }
  }).catch(function(e) {
    console.error('[GAME] Waline import error:', e);
  });
})();

document.getElementById('commentAvatar').addEventListener('click', function() {
  commentOverlay.classList.add('active');
});

document.getElementById('commentClose').addEventListener('click', function() {
  commentOverlay.classList.remove('active');

// 日历折叠切换（未解锁时点击走解锁流程，解锁后方可随意缩小/展开）
(function(){
  var almanac = document.getElementById('almanac');
  var mini = document.getElementById('almanacMini');
  almanac.addEventListener('click', function(){
    if (GAME._autoMode || GAME._oneKeyMode) return; // 修炼中屏蔽
    // 未解锁 → 走解锁流程（登录/加载校验在确认后统一处理，未登录也先弹确认再提示）
    if (!GAME.almanacUnlocked) {
      GAME.unlockFeature('almanac');
      return;
    }
    // 已解锁 → 缩小：向右侧收起为同高边条（宽5、透明度90、内含 <）
    mini.style.height = almanac.offsetHeight + 'px';
    almanac.classList.add('hidden');
    mini.classList.add('show');
  });
  mini.addEventListener('click', function(){
    mini.classList.remove('show');
    almanac.classList.remove('hidden');
  });
})();

// LOGO 点击：未解锁 → 走解锁流程（消耗 777 真气破除封印）；已解锁 → 向右侧收起为同高边条（与日期卡片一致）
(function(){
  var logo = document.getElementById('topRightLogo');
  if (!logo) return;
  var logoMini = document.getElementById('logoMini');
  logo.addEventListener('click', function(){
    if (GAME._autoMode || GAME._oneKeyMode) return; // 修炼中屏蔽
    // 未解锁 → 走解锁流程（登录/加载校验在确认后统一处理，未登录也先弹确认再提示）
    if (!GAME.logoUnlocked) {
      GAME.unlockFeature('logo');
      return;
    }
    // 已解锁 → 向右侧收起为同高边条（宽5、透明度50、内含 <）
    if (logoMini) logoMini.style.height = logo.offsetHeight + 'px';
    logo.classList.add('hidden');
    if (logoMini) logoMini.classList.add('show');
  });
  // 点击边条 → 展开 LOGO
  if (logoMini) {
    logoMini.addEventListener('click', function(){
      logoMini.classList.remove('show');
      logo.classList.remove('hidden');
    });
  }
})();

// 奔跑的人：未解锁 → 走解锁流程（消耗 1000 真气破除封印）；已解锁 → 无入口作用（日程入口为解锁后显示的「日程」徽章）
(function(){
  var runner = document.getElementById('runnerFloat');
  if (!runner) return;
  runner.addEventListener('click', function(){
    if (GAME._autoMode || GAME._oneKeyMode) return; // 修炼中屏蔽
    if (!GAME.runnerUnlocked) {
      GAME.unlockFeature('runner');
    }
    // 已解锁：奔跑人不作入口，日程面板仅通过「日程」徽章打开
  });
})();

// 双击背景图：发现隐藏结界 → 破除结界（扣 5-10 随机真气）→ 保存图片到相册
(function(){
  var bg = document.getElementById('bgImage');
  if (!bg) return;
  var lastClick = 0;
  bg.addEventListener('click', function(){
    if (GAME._autoMode || GAME._oneKeyMode) return; // 修炼中屏蔽
    var now = Date.now();
    if (lastClick && now - lastClick < 400) {
      lastClick = 0; // 双击 → 破除结界
      GAME.unlockBackground();
    } else {
      lastClick = now;
    }
  });
})();
</script>
<!-- 破除封印确认弹层（自定义，兼容移动端禁 confirm 环境） -->
<div class="confirm-mask" id="unlockConfirm">
  <div class="confirm-box">
    <div class="confirm-title" id="unlockConfirmTitle">⚡ 破除封印</div>
    <div class="confirm-text" id="unlockConfirmText"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" id="unlockConfirmCancel">再想想</button>
      <button class="confirm-btn ok" id="unlockConfirmOk">破除</button>
    </div>
  </div>
</div>
<!-- 境界突破确认弹层（自定义暗绿色，兼容移动端禁 confirm 环境） -->
<div class="confirm-mask green" id="upgradeConfirm">
  <div class="confirm-box">
    <div class="confirm-title" id="upgradeConfirmTitle">⚡ 境界突破</div>
    <div class="confirm-text" id="upgradeConfirmText"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" id="upgradeConfirmCancel">再想想</button>
      <button class="confirm-btn ok" id="upgradeConfirmOk">破境</button>
    </div>
  </div>
</div>
<!-- 单按钮提示弹层（解锁校验失败等提示，直接在窗口内显示） -->
<div class="confirm-mask" id="tipConfirm">
  <div class="confirm-box">
    <div class="confirm-title" id="tipConfirmTitle"></div>
    <div class="confirm-text" id="tipConfirmText"></div>
    <div class="confirm-btns">
      <button class="confirm-btn ok" id="tipConfirmOk">知道了</button>
    </div>
  </div>
</div>
<script>
// 翻页保护：排除左右边缘系统返回手势（防横滑切页/退出），离开页面恢复
(function(){
  function lockEdge(lock){ try{ if(window.AppBridge && window.AppBridge.setEdgeLock) window.AppBridge.setEdgeLock(lock ? '1' : '0'); }catch(e){} }
  function guardBack(g){ try{ if(window.AppBridge && window.AppBridge.setBackGuard) window.AppBridge.setBackGuard(g ? '1' : '0'); }catch(e){} }
  lockEdge(true);
  guardBack(true);
  window.addEventListener('pagehide', function(){ lockEdge(false); guardBack(false); });
})();
</script>
