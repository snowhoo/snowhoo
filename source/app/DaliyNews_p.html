layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小红故事|新闻</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fafafa;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

/* 加载动画 */
.loading-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:999;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:#ff8c00;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:.9rem;color:#999}

#app{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;padding-top:40px}

/* ===== 顶部栏目Tab栏 ===== */
.column-tabs{flex-shrink:0;display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0;scrollbar-width:none;-webkit-overflow-scrolling:touch;z-index:10;padding:0 4px}
.column-tabs::-webkit-scrollbar{display:none}
.column-tab{flex-shrink:0;padding:10px 14px;font-size:.85rem;color:#666;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;user-select:none;-webkit-user-select:none}
.column-tab:active{background:rgba(0,0,0,.04)}
.column-tab.active{color:#ff8c00;border-bottom-color:#ff8c00;font-weight:500}

/* 日期栏 */
.date-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:#fafafa;font-size:.75rem;color:#999;border-bottom:1px solid #f0f0f0}
.date-bar .count{font-size:.72rem}

/* ===== 新闻列表 ===== */
.news-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 60px;background:#fafafa}
.news-list::-webkit-scrollbar{width:0}

.news-item{display:flex;gap:12px;padding:12px;margin-bottom:8px;background:#fff;border-radius:10px;transition:transform .15s;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.news-item:active{transform:scale(.98)}
.news-item-img{flex-shrink:0;width:100px;height:70px;border-radius:6px;overflow:hidden;background:#f0f0f0}
.news-item-img img{width:100%;height:100%;object-fit:cover;display:block}
.news-item-img .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#ddd}
.news-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.news-item-title{font-size:.92rem;font-weight:500;line-height:1.35;color:#222;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-item-brief{font-size:.78rem;color:#888;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-item-meta{display:flex;align-items:center;gap:8px;font-size:.7rem;color:#bbb;margin-top:2px}
.news-item-meta .source{color:#ff8c00}

/* 展开全文 */
.news-item.expanded .news-item-title{-webkit-line-clamp:unset;display:block;overflow:visible}
.news-item.expanded .news-item-brief{-webkit-line-clamp:unset;display:block;overflow:visible}

/* 日期下拉菜单 */
.date-bar{cursor:pointer;position:relative}
.date-dropdown{display:none;position:absolute;top:100%;left:10px;right:auto;z-index:50;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;white-space:nowrap}
.date-dropdown.show{display:block}
.date-dropdown-item{padding:10px 16px;font-size:.82rem;color:#333;cursor:pointer;transition:background .15s}
.date-dropdown-item:active{background:#f5f5f5}
.date-dropdown-item.active{color:#ff8c00;font-weight:500}
.date-dropdown-item .check{float:right;color:#ff8c00;display:none;margin-left:12px}
.date-dropdown-item.active .check{display:inline}

/* 空状态 / 加载失败 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#bbb;font-size:.9rem;text-align:center;gap:8px}
.empty-state .icon{font-size:2.5rem;margin-bottom:4px}

/* ===== 底部导航 ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:44px;background:#fff;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:.8rem;user-select:none;-webkit-user-select:none}
.bottom-nav .page-btn{display:flex;align-items:center;gap:4px;padding:4px 16px;border-radius:4px;cursor:pointer;color:#666}
.bottom-nav .page-btn:active{background:rgba(0,0,0,.05)}
.page-nav-group{display:flex;align-items:center;gap:2px}
.page-nav-btn{padding:4px 6px;cursor:pointer;color:#999;font-size:.72rem;user-select:none}
.page-nav-btn:active{background:rgba(0,0,0,.05)}

.theme-btn{width:32px;height:32px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:16px;height:16px}

/* 功能图标 - 浮动在导航栏上方 */
.function-icons{position:fixed;bottom:48px;left:12px;z-index:99;display:flex;align-items:center;gap:16px;padding:6px 0;background:rgba(0,0,0,0);pointer-events:auto}
.func-btn{width:24px;height:24px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.func-btn:active{transform:scale(.92)}
.func-btn svg{width:18px;height:18px;fill:#999}

/* 浮窗菜单 */
.dn-float-wrap{position:relative;display:flex;align-items:center}
.dn-float-btn{width:32px;height:32px;border-radius:50%;background:#ff8c00;color:#fff;font-size:.65rem;font-weight:600;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;transition:transform .2s,background .2s}
.dn-float-btn:active{transform:scale(.92)}
.dn-float-btn:hover{background:#e67e00}
.dn-float-menu{position:absolute;bottom:40px;right:0;z-index:200;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:opacity .2s ease,transform .2s ease;transform-origin:bottom right}
.dn-float-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.dn-float-menu a{display:flex;align-items:center;padding:10px 16px;color:#333;text-decoration:none;font-size:.82rem;font-weight:500;white-space:nowrap;transition:background .2s}
.dn-float-menu a:hover{background:#f5f5f5}
.menu-indicator{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:6px;vertical-align:middle}
.menu-indicator.dot{width:8px;height:8px;border-radius:50%}
.menu-indicator.circulated{width:18px;height:18px;border-radius:50%;color:#fff;font-size:.6rem;font-weight:600;line-height:18px;text-align:center}
/* 菜单锁定 + 传送回修真小世界（统一类名，跨页同名无冲突） */
.menu-item.locked{opacity:.5;filter:grayscale(1)}
.menu-lock-icon{margin-left:8px;font-size:.72rem}
.menu-home{border-top:1px solid rgba(128,128,128,.35)}
.menu-lock-tip{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:99999;background:rgba(40,32,20,.9);color:#fff;font-size:.75rem;padding:8px 16px;border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.menu-lock-tip.show{opacity:1}

/* ===== 响应式 ===== */
@media(min-width:769px){
  #app{max-width:480px;margin:0 auto;border-left:1px solid #eee;border-right:1px solid #eee}
}

/* ===== 暗色主题 ===== */
@media(prefers-color-scheme:dark){
  .column-tabs{background:#1a1a1a;border-color:#333}
  .column-tab{color:#888}
  .column-tab.active{color:#ff8c00}
  .date-bar{background:#181818;border-color:#333;color:#666}
  .news-list{background:#121212}
  .news-item{background:#1a1a1a}
  .news-item-title{color:#eee}
  .news-item-brief{color:#888}
  .news-item-meta{color:#555}
  .bottom-nav{background:#1a1a1a;border-color:#333}
  .bottom-nav .page-btn{color:#999}
  .bottom-nav .page-btn:active{background:rgba(255,255,255,.08)}
  .page-nav-btn{color:#666}
  .page-nav-btn:active{background:rgba(255,255,255,.08)}
  .empty-state{color:#666}
  .dn-float-menu{background:#1e1e1e}
  .dn-float-menu a{color:#ddd}
  .dn-float-menu a:hover{background:#2a2a2a}
  .date-dropdown{background:#1e1e1e}
  .date-dropdown-item{color:#ddd}
  .date-dropdown-item:active{background:#2a2a2a}
  .date-dropdown-item.active{color:#ff8c00}
}
[data-theme="dark"]{
  .column-tabs{background:#1a1a1a;border-color:#333}
  .column-tab{color:#888}
  .column-tab.active{color:#ff8c00}
  .date-bar{background:#181818;border-color:#333;color:#666}
  .news-list{background:#121212}
  .news-item{background:#1a1a1a}
  .news-item-title{color:#eee}
  .news-item-brief{color:#888}
  .news-item-meta{color:#555}
  .bottom-nav{background:#1a1a1a;border-color:#333}
  .bottom-nav .page-btn{color:#999}
  .bottom-nav .page-btn:active{background:rgba(255,255,255,.08)}
  .page-nav-btn{color:#666}
  .page-nav-btn:active{background:rgba(255,255,255,.08)}
  .empty-state{color:#666}
  .dn-float-menu{background:#1e1e1e}
  .dn-float-menu a{color:#ddd}
  .dn-float-menu a:hover{background:#2a2a2a}
  .date-dropdown{background:#1e1e1e}
  .date-dropdown-item{color:#ddd}
  .date-dropdown-item:active{background:#2a2a2a}
  .date-dropdown-item.active{color:#ff8c00}
}
/* 图片查看器 */
.img-viewer{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(0,0,0,.85);cursor:pointer;align-items:center;justify-content:center}
.img-viewer.show{display:flex}
.img-viewer img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:4px}
.img-viewer .close{position:fixed;top:16px;right:20px;color:#fff;font-size:1.5rem;cursor:pointer;z-index:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.3)}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">正在加载新闻...</div>
</div>

<div id="app">
  <div class="column-tabs" id="columnTabs"></div>
  <div class="date-bar" id="dateBar">
    <span id="dateLabel"></span>
    <span class="count" id="countLabel"></span>
    <div class="date-dropdown" id="dateDropdown"></div>
  </div>
  <div class="news-list" id="newsList"></div>
</div>

<div class="bottom-nav" id="bottomNav">
  <div style="display:flex;align-items:center;gap:20px">
    <button class="theme-btn" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#0f3460"/></svg></button>
    
  </div>

    <button class="dn-float-btn" id="dnFloatBtn">新闻</button>

</div>
<div class="function-icons">
  <button class="func-btn" title="收藏"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></button>
  <button class="func-btn" title="评论"><svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg></button>
  <button class="func-btn" title="点赞"><svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg></button>
  <button class="func-btn" id="shareBtn" title="转发"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></button>
</div>

<script>
(function() {
  'use strict';

  var today = new Date();
  function padNum(n) { return n < 10 ? '0' + n : '' + n; }
  var dateStr = today.getFullYear() + '' + padNum(today.getMonth()+1) + '' + padNum(today.getDate());
  var dataBase = 'news_CCTV/' + dateStr + '/';

  // 栏目定义（按菜单栏顺序）
  var COLUMNS = ['新闻','国内','国际','经济','社会','法治','文娱','科技','生活','军事'];
  var DISPLAY = ['综合新闻','国内','国际','经济','社会','法治','文娱','科技','生活','军事'];
  var currentColumn = 0;
  var allData = {};       // columnName -> items[]
  var loaded = false;
  var loadingCount = 0;

  var app = document.getElementById('app');
  var loadingEl = document.getElementById('loading');
  var columnTabsEl = document.getElementById('columnTabs');
  var dateBar = document.getElementById('dateBar');
  var dateLabel = document.getElementById('dateLabel');
  var countLabel = document.getElementById('countLabel');
  var newsList = document.getElementById('newsList');

  // ===== 主题 =====
  function detectTheme() {
    var saved = localStorage.getItem('dalynews_theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeBtn(saved);
      return;
    }
    try {
      var pt = window.parent.document.documentElement.getAttribute('data-theme');
      if (pt === 'dark' || pt === 'light') {
        document.documentElement.setAttribute('data-theme', pt);
        updateThemeBtn(pt);
        return;
      }
    } catch(e) {}
    var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = isDark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeBtn(theme);
  }
  function updateThemeBtn(theme) {
    var btn = document.getElementById('themeBtn');
    if (theme === 'dark') {
      btn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#f0a500"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f0a500" stroke-width="2" fill="none"/></svg>';
    } else {
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#0f3460"/></svg>';
    }
  }
  detectTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    var saved = localStorage.getItem('dalynews_theme');
    if (!saved) detectTheme();
  });
  document.getElementById('themeBtn').addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('dalynews_theme', next);
    updateThemeBtn(next);
  });

  // ===== 数据加载 =====
  function loadAll() {
    loadingCount = COLUMNS.length;
    COLUMNS.forEach(function(col) {
      fetch(dataBase + encodeURIComponent(col) + '.json')
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          allData[col] = data.items || [];
          checkLoaded();
        })
        .catch(function(e) {
          console.warn('[' + col + '] ' + e.message);
          allData[col] = [];
          checkLoaded();
        });
    });
  }

  function checkLoaded() {
    loadingCount--;
    if (loadingCount > 0) return;
    loaded = true;
    // 设置日期（使用当前选中的日期）
    var d = new Date(parseInt(currentDateStr.slice(0,4)), parseInt(currentDateStr.slice(4,6))-1, parseInt(currentDateStr.slice(6,8)));
    var dStr = d.getFullYear() + '\u5E74' + (d.getMonth()+1) + '\u6708' + d.getDate() + '\u65E5';
    var weekdays = ['\u5468\u65E5','\u5468\u4E00','\u5468\u4E8C','\u5468\u4E09','\u5468\u56DB','\u5468\u4E94','\u5468\u516D'];
    dateLabel.textContent = dStr + ' ' + weekdays[d.getDay()];
    renderTabs();
    renderList(0);
    document.title = '小红故事|新闻 – ' + DISPLAY[0];
    loadingEl.classList.add('hide');
    setTimeout(function() { loadingEl.remove(); }, 500);
  }

  // ===== 标签栏 =====
  function renderTabs() {
    columnTabsEl.innerHTML = '';
    COLUMNS.forEach(function(col, idx) {
      var tab = document.createElement('span');
      tab.className = 'column-tab' + (idx === 0 ? ' active' : '');
      tab.textContent = DISPLAY[idx];
      tab.dataset.idx = idx;
      tab.addEventListener('click', function() {
        switchColumn(parseInt(this.dataset.idx, 10));
      });
      columnTabsEl.appendChild(tab);
    });
  }

  function switchColumn(idx) {
    if (idx === currentColumn) return;
    currentColumn = idx;
    // 更新tab样式
    var tabs = columnTabsEl.querySelectorAll('.column-tab');
    tabs.forEach(function(t, i) {
      t.className = 'column-tab' + (i === idx ? ' active' : '');
    });
    // 滚动tab到可视区域
    if (tabs[idx]) tabs[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    document.title = '小红故事|新闻 – ' + DISPLAY[idx];
    renderList(idx);
    newsList.scrollTop = 0;
  }

  // ===== 渲染列表 =====
  function renderList(colIdx) {
    var col = COLUMNS[colIdx];
    var items = allData[col] || [];
    countLabel.textContent = items.length + '\u6761\u65B0\u95FB';

    if (!items.length) {
      newsList.innerHTML = '<div class="empty-state"><div class="icon">&#x1F4F0;</div><div>\u6682\u65E0\u65B0\u95FB</div></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var title = item.title || '';
      var brief = item.brief || '';
      var time = item.dateTime || '';
      var imgUrl = item.image || '';
      var link = item.url || '';
      var timeStr = time.length >= 16 ? time.slice(11, 16) : (time.length >= 10 ? time.slice(5, 10) : '');
      var safeLink = escapeHtml(link);
      var safeTitle = escapeHtml(title);
      var safeBrief = escapeHtml(brief);
      var safeCol = escapeHtml(DISPLAY[colIdx]);
      var safeTime = escapeHtml(timeStr);

      html += '<div class="news-item" data-url="' + safeLink + '">';
      if (imgUrl) {
        html += '<div class="news-item-img"><img src="' + escapeHtml(imgUrl) + '" alt="" loading="lazy"></div>';
      } else {
        html += '<div class="news-item-img"><div class="no-img">&#x1F4F7;</div></div>';
      }
      html += '<div class="news-item-body">';
      html += '<div class="news-item-title">' + safeTitle + '</div>';
      if (brief) html += '<div class="news-item-brief">' + safeBrief + '</div>';
      html += '<div class="news-item-meta">';
      html += '<span class="source">' + safeCol + '</span>';
      if (safeTime) html += '<span>' + safeTime + '</span>';
      html += '</div></div></div>';
    }
    newsList.innerHTML = html;

    // 图片加载失败时显示占位，点击放大
    newsList.querySelectorAll('.news-item-img img').forEach(function(img) {
      img.addEventListener('error', function() {
        var p = this.parentElement;
        if (p) p.innerHTML = '<div class="no-img">&#x1F4F7;</div>';
      });
      img.addEventListener('click', function(e) {
        e.stopPropagation();
        var src = this.src;
        if (src) {
          document.getElementById('imgViewerSrc').src = src;
          document.getElementById('imgViewer').classList.add('show');
        }
      });
    });

    // 绑定点击事件 - 展开全文
    var items_el = newsList.querySelectorAll('.news-item');
    for (var j = 0; j < items_el.length; j++) {
      (function(el) {
        el.addEventListener('click', function(e) {
          // 点击图片区域不触发展开
          if (e.target.closest('.news-item-img')) return;
          this.classList.toggle('expanded');
          var t = this.querySelector('.news-item-title');
          document.title = '小红故事|新闻 – ' + (t ? t.textContent : '') + ' – ' + DISPLAY[currentColumn];
        });
      })(items_el[j]);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== 浮窗菜单 =====
  var dnFloatBtn = document.getElementById('dnFloatBtn');
  var dnFloatMenu = document.getElementById('dnFloatMenu');
  dnFloatBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    dnFloatMenu.classList.toggle('show');
  });
  document.addEventListener('click', function() {
    dnFloatMenu.classList.remove('show');
  });
  dnFloatMenu.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  // ===== 分享功能 =====
  function shareArticle() {
    var col = COLUMNS[currentColumn];
    var items = allData[col] || [];
    if (!items.length) return;
    var title = '新闻 - ' + DISPLAY[currentColumn];
    var firstItem = items[0];
    var summary = (firstItem.title || '') + ' ' + (firstItem.brief || '');
    summary = summary.substring(0, 120);
    var imgUrl = firstItem.image || '';
    var pageUrl = window.location.href;
    var shareData = { title: title, text: title + '\n' + summary, url: pageUrl };
    if (typeof navigator.share === 'function') {
      navigator.share(shareData).catch(function() {});
      return;
    }
    showSharePanel(title, summary, imgUrl, pageUrl);
  }
  function showSharePanel(t, s, img, url) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:9998;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center';
    var panel = document.createElement('div');
    panel.style.cssText = 'background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:480px;padding:16px 20px 28px;transform:translateY(100%);transition:transform .25s ease';
    var h = document.createElement('div');
    h.style.cssText = 'text-align:center;font-size:.85rem;color:#666;padding-bottom:14px;border-bottom:1px solid #eee;margin-bottom:14px';
    h.textContent = '\u5206\u4EAB\u5230';
    panel.appendChild(h);
    var platforms = [
      { label: '\u5FAE\u4FE1', color: '#07c160', icon: '\u4FE1', action: 'wechat' },
      { label: '\u670B\u53CB\u5708', color: '#07c160', icon: '\u5708', action: 'moments' },
      { label: '\u5FAE\u535A', color: '#e6162d', icon: '\u5FAE', url: 'https://service.weibo.com/share/share.php?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(t + (s ? ' - ' + s : '')) + '&pic=' + encodeURIComponent(img) },
      { label: 'QQ', color: '#12b7f5', icon: 'Q', url: 'https://connect.qq.com/widget/shareqq/index.html?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(t) + '&desc=' + encodeURIComponent(s || t) },
      { label: 'QQ\u7A7A\u95F4', color: '#fec944', icon: '\u7A7A', url: 'https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(t) + '&pics=' + encodeURIComponent(img) + '&desc=' + encodeURIComponent(s || '') },
      { label: '\u590D\u5236\u94FE\u63A5', color: '#666', icon: '\u590D', action: 'copy' }
    ];
    var grid = document.createElement('div');
    grid.style.cssText = 'display:flex;justify-content:space-around;padding:6px 0';
    platforms.forEach(function(p) {
      var item = document.createElement('div');
      item.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 8px';
      var circle = document.createElement('div');
      circle.style.cssText = 'width:44px;height:44px;border-radius:50%;background:' + p.color + ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:600';
      circle.textContent = p.icon;
      var label = document.createElement('span');
      label.style.cssText = 'font-size:.7rem;color:#666';
      label.textContent = p.label;
      item.appendChild(circle);
      item.appendChild(label);
      item.onclick = function() {
        closePanel();
        var ct = t + '\n' + (s || '') + '\n' + url;
        if (p.action === 'wechat') {
          copyText(ct, '\u94FE\u63A5\u5DF2\u590D\u5236\uFF0C\u6253\u5F00\u5FAE\u4FE1\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB');
        } else if (p.action === 'moments') {
          copyText(ct, '\u94FE\u63A5\u5DF2\u590D\u5236\uFF0C\u6253\u5F00\u5FAE\u4FE1\u7C98\u8D34\u5206\u4EAB\u5230\u670B\u53CB\u5708');
        } else if (p.action === 'copy') {
          copyText(ct, '\u5DF2\u590D\u5236\u94FE\u63A5\uFF0C\u53EF\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB');
        } else {
          window.open(p.url, '_blank');
        }
      };
      grid.appendChild(item);
    });
    panel.appendChild(grid);
    var cancel = document.createElement('div');
    cancel.style.cssText = 'text-align:center;padding-top:12px;margin-top:12px;border-top:1px solid #eee;color:#999;font-size:.8rem;cursor:pointer';
    cancel.textContent = '\u53D6\u6D88';
    cancel.onclick = closePanel;
    panel.appendChild(cancel);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    requestAnimationFrame(function() { overlay.style.opacity = '1'; panel.style.transform = 'translateY(0)'; });
    function closePanel() {
      overlay.style.opacity = '0'; panel.style.transform = 'translateY(100%)';
      setTimeout(function() { overlay.remove(); }, 250);
    }
    overlay.onclick = function(e) { if (e.target === overlay) closePanel(); };
  }
  function copyText(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { showTip(msg); }).catch(function() { copyFallback(text, msg); });
    } else {
      copyFallback(text, msg);
    }
  }
  function copyFallback(text, msg) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showTip(msg); } catch(e) {}
    document.body.removeChild(ta);
  }
  function showTip(msg) {
    msg = msg || '\u5DF2\u590D\u5236\u94FE\u63A5\uFF0C\u53EF\u7C98\u8D34\u5206\u4EAB\u7ED9\u597D\u53CB';
    var tip = document.createElement('div');
    tip.textContent = msg;
    tip.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:.78rem;opacity:1;transition:opacity .3s;white-space:nowrap';
    document.body.appendChild(tip);
    setTimeout(function() { tip.style.opacity = '0'; setTimeout(function() { tip.remove(); }, 300); }, 2000);
  }
  document.getElementById('shareBtn').onclick = shareArticle;

  // ===== 左右滑动切换分类 =====
  var swipeStartX = 0, swipeStartY = 0;
  newsList.addEventListener('touchstart', function(e) {
    swipeStartX = e.changedTouches[0].screenX;
    swipeStartY = e.changedTouches[0].screenY;
  }, {passive: true});
  newsList.addEventListener('touchmove', function(e) {
    // 横向滑动时阻止浏览器默认（避免与系统边缘返回手势抢手指），纵向滚动不受影响
    var dx = e.touches[0].screenX - swipeStartX;
    var dy = e.touches[0].screenY - swipeStartY;
    if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
  }, {passive: false});
  newsList.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].screenX - swipeStartX;
    var dy = e.changedTouches[0].screenY - swipeStartY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && currentColumn < COLUMNS.length - 1) {
        switchColumn(currentColumn + 1);
      } else if (dx > 0 && currentColumn > 0) {
        switchColumn(currentColumn - 1);
      }
    }
  }, {passive: true});

  // ===== 日期选择 =====
  var dateDropdown = document.getElementById('dateDropdown');
  var availableDates = [];
  var currentDateStr = dateStr;

  // 生成最近7天日期列表（不依赖网络请求）
  function scanAvailableDates() {
    for (var i = 0; i < 7; i++) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var ds = d.getFullYear() + padNum(d.getMonth()+1) + padNum(d.getDate());
      availableDates.push(ds);
    }
    availableDates.sort().reverse();
  }

  function renderDateDropdown() {
    dateDropdown.innerHTML = '';
    for (var i = 0; i < availableDates.length; i++) {
      var ds = availableDates[i];
      var d = new Date(parseInt(ds.slice(0,4)), parseInt(ds.slice(4,6))-1, parseInt(ds.slice(6,8)));
      var label = d.getFullYear() + '\u5E74' + (d.getMonth()+1) + '\u6708' + d.getDate() + '\u65E5';
      var weekdays = ['\u5468\u65E5','\u5468\u4E00','\u5468\u4E8C','\u5468\u4E09','\u5468\u56DB','\u5468\u4E94','\u5468\u516D'];
      label += ' ' + weekdays[d.getDay()];
      var item = document.createElement('div');
      item.className = 'date-dropdown-item' + (ds === currentDateStr ? ' active' : '');
      item.innerHTML = label + '<span class="check">&#x2713;</span>';
      item.dataset.ds = ds;
      item.addEventListener('click', function(e) {
        e.stopPropagation();
        var ds = this.dataset.ds;
        if (ds === currentDateStr) { hideDateDropdown(); return; }
        switchDate(ds);
      });
      dateDropdown.appendChild(item);
    }
  }

  function switchDate(ds) {
    currentDateStr = ds;
    dataBase = 'news_CCTV/' + ds + '/';
    allData = {};
    currentColumn = 0;
    document.title = '小红故事|新闻 – ' + DISPLAY[0];
    loaded = false;
    hideDateDropdown();
    // 更新日期栏
    var d = new Date(parseInt(ds.slice(0,4)), parseInt(ds.slice(4,6))-1, parseInt(ds.slice(6,8)));
    var dStr = d.getFullYear() + '\u5E74' + (d.getMonth()+1) + '\u6708' + d.getDate() + '\u65E5';
    var weekdays = ['\u5468\u65E5','\u5468\u4E00','\u5468\u4E8C','\u5468\u4E09','\u5468\u56DB','\u5468\u4E94','\u5468\u516D'];
    dateLabel.textContent = dStr + ' ' + weekdays[d.getDay()];
    countLabel.textContent = '\u52A0\u8F7D\u4E2D...';
    newsList.innerHTML = '<div class="empty-state"><div class="icon">&#x23F3;</div><div>\u52A0\u8F7D\u4E2D...</div></div>';
    renderDateDropdown();
    loadAll();
  }

  function showDateDropdown() {
    renderDateDropdown();
    dateDropdown.classList.add('show');
  }

  function hideDateDropdown() {
    dateDropdown.classList.remove('show');
  }

  dateLabel.addEventListener('click', function(e) {
    e.stopPropagation();
    if (dateDropdown.classList.contains('show')) {
      hideDateDropdown();
    } else {
      showDateDropdown();
    }
  });
  document.addEventListener('click', function() {
    hideDateDropdown();
  });

  // 扫描可用日期
  scanAvailableDates();

  // ===== 图片查看器 =====
  var imgViewer = document.createElement('div');
  imgViewer.className = 'img-viewer';
  imgViewer.id = 'imgViewer';
  imgViewer.innerHTML = '<span class="close" id="imgViewerClose">&times;</span><img id="imgViewerSrc" src="" alt="">';
  document.body.appendChild(imgViewer);
  imgViewer.onclick = function(e) {
    if (e.target === imgViewer || e.target.id === 'imgViewerClose') {
      this.classList.remove('show');
    }
  };

  // ===== 启动 =====
  loadAll();

})();
</script>

<script>
// 边缘手势锁：排除左右边缘系统返回手势（防横滑翻页误触退出），离开页面恢复
(function(){
  function lockEdge(lock){ try{ if(window.AppBridge && window.AppBridge.setEdgeLock) window.AppBridge.setEdgeLock(lock ? '1' : '0'); }catch(e){} }
  function guardBack(g){ try{ if(window.AppBridge && window.AppBridge.setBackGuard) window.AppBridge.setBackGuard(g ? '1' : '0'); }catch(e){} }
  lockEdge(true);
  guardBack(true);
  window.addEventListener('pagehide', function(){ lockEdge(false); guardBack(false); });
})();
</script>
<script>
// 菜单解锁：栏目传送项按登录信息解锁（未登录置灰+提示），传送回修真小世界不锁定
(function(){
  function getWalineUser(){
    try{
      var keys = ['WALINE_USER','@waline/user','waline_user'];
      for (var i = 0; i < keys.length; i++) {
        try{ var v = localStorage.getItem(keys[i]); if (v) { var u = JSON.parse(v); if (u && (u.display_name || u.nick || u.name)) return u; } }catch(e){}
      }
      try{ var sv = sessionStorage.getItem('WALINE_USER') || sessionStorage.getItem('@waline/user');
        if (sv) { var u2 = JSON.parse(sv); if (u2 && (u2.display_name || u2.nick || u2.name)) return u2; } }catch(e){}
    }catch(e){}
    return null;
  }
  function tip(msg){
    var t = document.getElementById('menuLockTip');
    if (!t) { t = document.createElement('div'); t.id = 'menuLockTip'; t.className = 'menu-lock-tip'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  var menu = document.getElementById('dnFloatMenu');
  if (menu) {
    var logged = !!getWalineUser();
    var links = menu.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      if (a.classList.contains('menu-home')) continue; // 传送回主页不锁定
      if (logged) continue;                            // 已登录全部解锁
      a.classList.add('locked');
      a.insertAdjacentHTML('beforeend', '<span class="menu-lock-icon">🔒</span>');
      a.addEventListener('click', function(e){ e.preventDefault(); tip('请先在修真小世界登录，解锁全部传送'); });
    }
  }
})();
</script>
