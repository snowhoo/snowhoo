<style>

html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;background:#000;color:#1a1a1a;-webkit-tap-highlight-color:transparent}

.card.left{transform:translateX(-100%);opacity:0;pointer-events:none}

.card.right{transform:translateX(100%);opacity:0;pointer-events:none}

.image-gallery .gallery-track{display:flex;transition:transform .3s ease;height:calc(100vh / 4 + 50px);width:100%}

.image-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10}
.image-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.image-dot.active{background:#fff;width:14px;border-radius:2px}

.card-title{flex-shrink:0;padding:14px 18px 10px;background:#fff;border-bottom:1px solid #f0f0f0}
.card-title h1{font-size:1.2rem;font-weight:500;line-height:1.35;color:#222;margin-bottom:4px}
.card-title .meta{font-size:.78rem;color:#999}

.card-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 108px;background:#fafafa}
.card-content::-webkit-scrollbar{width:0}
.card-content .body p{line-height:1.5;margin-bottom:10px;font-size:1.1rem;font-weight:300;color:#333}
.card-content .body .no-content{text-align:center;color:#999;padding:40px 0;font-size:.9rem}
.card-content .body strong,.card-content .body b{font-weight:500;color:#222}

/* 底部导航右侧浮窗 */
.reader-float-wrap{position:relative;display:flex;align-items:center}
.reader-float-btn{width:36px;height:36px;border-radius:50%;background:#e94560;color:#fff;font-size:.65rem;font-weight:600;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;transition:transform .2s,background .2s}
.reader-float-btn:active{transform:scale(.92)}
.reader-float-btn:hover{background:#d63850}

.theme-btn{width:32px;height:32px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:16px;height:16px}

/* 分类筛选菜单 */
.cat-wrap{position:relative;display:flex;align-items:center}
.cat-btn{border:none;background:transparent;color:#666;font-size:.72rem;cursor:pointer;outline:none;padding:2px 4px;white-space:nowrap}
.cat-btn:active{opacity:.6}
.cat-menu{position:absolute;bottom:28px;left:0;z-index:200;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden;opacity:0;transform:translateY(6px) scale(.95);pointer-events:none;transition:opacity .15s ease,transform .15s ease;transform-origin:bottom left;min-width:80px;max-height:240px;overflow-y:auto}
.cat-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.cat-menu::-webkit-scrollbar{width:0}
.cat-menu-item{display:block;width:100%;padding:8px 14px;border:none;background:none;color:#333;font-size:.75rem;cursor:pointer;text-align:left;white-space:nowrap;transition:background .15s}
.cat-menu-item:hover{background:#f5f5f5}
.cat-menu-item.active{color:#e94560;font-weight:500}

@media(prefers-color-scheme:dark){
  .cat-btn{color:#999}
  .cat-menu{background:#1e1e1e}

  .cat-menu-item.active{color:#e94560}
}
[data-theme="dark"]{
  .cat-btn{color:#999}
  .cat-menu{background:#1e1e1e}
  .cat-menu-item{color:#ccc}
  .cat-menu-item:hover{background:#2a2a2a}

}

.reader-float-menu{position:absolute;bottom:40px;left:0;z-index:200;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;opacity:0;transform:translateY(8px) scale(.95);pointer-events:none;transition:opacity .2s ease,transform .2s ease;transform-origin:bottom left}

<script>
const OWNER = 'snowhoo';
const REPO = 'snowhoo';
const BRANCH = 'source';
const POSTS_PATH = 'source/_posts';

let POSTS = [];
let currentIndex = 0;
let currentCategory = '';
const STORAGE_KEY = 'reader_page_idx';
const CAT_KEY = 'reader_cat';
let startX = 0, startY = 0, moveX = 0, moveY = 0;
let isDragging = false;
let hintVisible = true;
const app = document.getElementById('app');
const pageBtn = document.getElementById('pageBtn');
const hintEl = document.getElementById('hint');
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const loadingSub = document.getElementById('loadingSub');
const catBtn = document.getElementById('catBtn');
const catMenu = document.getElementById('catMenu');

// ===== 获取文章列表（从同域名 /posts.json 读取） =====
async function fetchFileList() {
  const resp = await fetch('/posts.json');
  if (!resp.ok) throw new Error('获取文章列表失败 (HTTP ' + resp.status + ')');
  const names = await resp.json();
  return names.map(name => ({ name, type: 'file' }));
}

async function fetchRawContent(filename, signal) {
  // 从同域名加载（构建时复制到 public/_posts/）
  const url = `/_posts/${encodeURIComponent(filename)}`;
  const resp = await fetch(url, { signal });
  if (!resp.ok) throw new Error('读取 ' + filename + ' 失败');
  return await resp.text();
}

// ===== Front-matter 解析 =====
function parseFrontMatter(content) {
  let data = {};
  let body = content;
  if (body.startsWith('---')) {
    const lines = body.split('\n');
    const endIdx = lines.findIndex((l, i) => i > 0 && l.trim().startsWith('---'));
    if (endIdx !== -1) {
      const head = lines.slice(1, endIdx);
      const closeLine = lines[endIdx].trim();
      const restAfterClose = closeLine.slice(3); // 提取 "---" 之后的内容
      const bodyLines = lines.slice(endIdx + 1);
      if (restAfterClose) bodyLines.unshift(restAfterClose);
      body = bodyLines.join('\n').trim();
      let currentKey = null, currentArr = [];
      head.forEach(line => {
        const arrMatch = line.match(/^\s+-\s+(.+)$/);
        if (arrMatch && currentKey) { currentArr.push(arrMatch[1].trim()); return; }
        if (currentKey && currentArr.length > 0) { data[currentKey] = currentArr; currentArr = []; }
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.substring(0, colonIdx).trim();
          const val = line.substring(colonIdx + 1).trim();
          if (val) {
            data[key] = val.replace(/^["']|["']$/g, '');
            currentKey = null;
          } else {
            currentKey = key;
            currentArr = [];
          }
        }
      });
      if (currentKey && currentArr.length > 0) data[currentKey] = currentArr;
    }
  }
  return { data, body };
}

// ===== 提取正文中的图片 =====
function extractImages(body) {
  const imgs = [];
  // 匹配 Markdown 图片语法 ![]()
  const mdRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
  let match;
  while ((match = mdRegex.exec(body)) !== null) {
    if (imgs.indexOf(match[2]) === -1) imgs.push(match[2]);
  }
  // 匹配 HTML <img> 标签
  const htmlRegex = /<img[^>]+src="([^"]+)"[^>]*>/g;
  while ((match = htmlRegex.exec(body)) !== null) {
    if (imgs.indexOf(match[1]) === -1) imgs.push(match[1]);
  }
  return imgs;
}

// ===== Markdown 转 HTML（只保留粗体，清除其他格式） =====
function mdToText(md) {
  return md
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '')
    .replace(/<img[^>]+>/g, '')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1')
    .replace(/#{1,6}\s+(.+)$/gm, '$1')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/^-\s+(.+)$/gm, '$1')
    .replace(/<\/?span[^>]*>/g, '')
    .replace(/<\/?font[^>]*>/g, '')
    .replace(/<\/?em[^>]*>/g, '')
    .replace(/<\/?i[^>]*>/g, '')
    .replace(/\s*style\s*=\s*["'][^"']*["']/gi, '')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>').replace(/$/, '</p>');
}

// ===== 图片路径解析 =====
function resolveImageUrl(src) {
  // 绝对URL → 直接使用
  if (src.startsWith('http://') || src.startsWith('https://')) return src;
  // 站内路径 → 直接使用（部署到 Pages 后 images 在站内根路径下）
  if (src.startsWith('/')) return src;
  // 相对路径 → 使用 GitHub raw 原始文件地址
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${POSTS_PATH}/${src}`;
}

// ===== 分类筛选 =====
function getFilteredPosts() {
  if (!currentCategory) return POSTS;
  if (currentCategory === '__uncategorized__') {
    return POSTS.filter(function(p) {
      var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
      return cList.length === 0;
    });
  }
  return POSTS.filter(function(p) {
    var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
    return cList.some(function(c) { return c === currentCategory; });
  });
}

function buildCategoryList() {
  var cats = {};
  var uncategorized = 0;
  POSTS.forEach(function(p) {
    var cList = Array.isArray(p.categories) ? p.categories : (p.categories ? [p.categories] : []);
    if (cList.length === 0) {
      uncategorized++;
    } else {
      cList.forEach(function(c) {
        if (c) cats[c] = (cats[c] || 0) + 1;
      });
    }
  });
  var keys = Object.keys(cats).sort();
  catMenu.innerHTML = '';
  // 全部选项
  var allItem = document.createElement('button');
  allItem.className = 'cat-menu-item' + (!currentCategory ? ' active' : '');
  allItem.textContent = '全部 (' + POSTS.length + ')';
  allItem.dataset.value = '';
  allItem.addEventListener('click', function() { selectCategory(this.dataset.value); });
  catMenu.appendChild(allItem);
  // 分类选项
  keys.forEach(function(k) {
    var item = document.createElement('button');
    item.className = 'cat-menu-item' + (currentCategory === k ? ' active' : '');
    item.textContent = k + ' (' + cats[k] + ')';
    item.dataset.value = k;
    item.addEventListener('click', function() { selectCategory(this.dataset.value); });
    catMenu.appendChild(item);
  });
  // 未分类选项
  if (uncategorized > 0) {
    var uncatItem = document.createElement('button');
    uncatItem.className = 'cat-menu-item' + (currentCategory === '__uncategorized__' ? ' active' : '');
    uncatItem.textContent = '未分类 (' + uncategorized + ')';
    uncatItem.dataset.value = '__uncategorized__';
    uncatItem.addEventListener('click', function() { selectCategory(this.dataset.value); });
    catMenu.appendChild(uncatItem);
  }
  catBtn.textContent = currentCategory === '__uncategorized__' ? '未分类' : (currentCategory || '全部');
}

function selectCategory(val) {
  currentCategory = val;
  localStorage.setItem(CAT_KEY, currentCategory);
  catMenu.classList.remove('show');
  catBtn.textContent = currentCategory === '__uncategorized__' ? '未分类' : (currentCategory || '全部');
  // 更新菜单项高亮
  var items = catMenu.querySelectorAll('.cat-menu-item');
  items.forEach(function(item) { item.classList.toggle('active', item.dataset.value === currentCategory); });
  // 重绘卡片
  currentIndex = 0;
  app.innerHTML = '';
  createPageNav();
  createCards();
  updateCards();
}

// ===== 兼容性 polyfill：Promise.allSettled（微信/QQ X5 内核不支持） =====
if (typeof Promise.allSettled !== 'function') {
  Promise.allSettled = function(promises) {
    return Promise.all(promises.map(function(p) {
      return Promise.resolve(p).then(function(value) {
        return { status: 'fulfilled', value: value };
      }, function(reason) {
        return { status: 'rejected', reason: reason };
      });
    }));
  };
}

// ===== 主流程（分批加载，渐进渲染） =====
async function main() {
  try {
    const files = await fetchFileList();
    const mdFiles = files
      .filter(f => f.name.endsWith('.md') && f.type === 'file')
      .map(f => f.name)
      .sort()
      .reverse();
    
    const total = mdFiles.length;
    loadingText.textContent = '共 ' + total + ' 篇文章，正在读取...';
    
    const BATCH_SIZE = 5;
    POSTS = [];
    let loadedCount = 0;
    let initialized = false;
    let firstBatch = true;
    
    for (let i = 0; i < total; i += BATCH_SIZE) {
      const batch = mdFiles.slice(i, i + BATCH_SIZE);
      console.log('加载批次: ' + (i / BATCH_SIZE + 1) + ', 文件: ' + batch[0]?.slice(0, 20) + '...');
      
      // 并行读取当前批次（用 allSettled 避免单个失败卡死）
      const results = await Promise.allSettled(batch.map(async (filename) => {
        loadedCount++;
        if (loadingSub) loadingSub.textContent = loadedCount + ' / ' + total + '  ' + filename.slice(0, 30);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        try {
          const raw = await fetchRawContent(filename, controller.signal);
          const { data, body } = parseFrontMatter(raw);
          if (data.title) {
            // 提取图片，并将封面图放在最前面
            let images = extractImages(body);
            if (data.cover && !images.includes(data.cover)) {
              images.unshift(data.cover);
            }
            return {
              title: data.title,
              date: data.date ? data.date.split(' ')[0] : '',
              cover: data.cover || '',
              images: images,
              categories: Array.isArray(data.categories) ? data.categories : (data.categories ? [data.categories] : []),
              content: body
            };
          }
        } catch (e) {
          console.warn('跳过 ' + filename + ': ' + e.message);
        } finally {
          clearTimeout(timeoutId);
        }
        return null;
      }));
      
      // 过滤出成功的文章
      const validPosts = results
        .filter(r => r.status === 'fulfilled' && r.value !== null)
        .map(r => r.value);
      POSTS.push(...validPosts);
      
      if (firstBatch) {
        // 第一批：按日期排序后统一渲染，绑定事件，隐藏 loading
        POSTS.sort((a, b) => {
          const da = new Date(a.date), db = new Date(b.date);
          return db - da || (da ? 1 : -1);
        });
        app.innerHTML = '';
        createPageNav();
        // 恢复保存的页码
        var savedIdx = localStorage.getItem(STORAGE_KEY);
        if (savedIdx !== null) {
          var n = parseInt(savedIdx, 10);
          if (n >= 0 && n < POSTS.length) currentIndex = n;
        }
        // 先构建分类列表（恢复保存的分类），再创建卡片
        buildCategoryList();
        createCards();
        bindEvents();
        initialized = true;
        updateCards();
        
        firstBatch = false;
        loadingEl.classList.add('hide');
        setTimeout(() => loadingEl.remove(), 500);
        await new Promise(r => setTimeout(r, 50));
      } else {
        // 后续批次：只更新进度，不重新渲染（保持已有卡片可见）
        // 全部加载完成后一次排序重绘
      }
    }
    
    // 全部加载完成：按日期排序并重新渲染
    POSTS.sort((a, b) => {
      const da = new Date(a.date), db = new Date(b.date);
      return db - da || (da ? 1 : -1);
    });
    app.innerHTML = '';
    createPageNav();
    // 恢复保存的页码
    var savedIdx = localStorage.getItem(STORAGE_KEY);
    if (savedIdx !== null) {
      var n = parseInt(savedIdx, 10);
      if (n >= 0 && n < POSTS.length) currentIndex = n;
    }
    // 构建分类列表（需先恢复保存的分类）
    buildCategoryList();
    createCards();
    updateCards();
    
    // 更新进度提示
    if (loadingSub) loadingSub.textContent = '全部加载完成，共 ' + POSTS.length + ' 篇文章';
    setTimeout(() => { if (loadingText) loadingText.textContent = '完成'; }, 100);
    setTimeout(() => { hintEl.classList.add('hidden'); hintVisible = false; }, 5000);
  } catch (e) {
    console.error('main() 错误:', e);
    if (loadingText) loadingText.textContent = '加载失败: ' + e.message;
    console.error(e);
  }
}

function createCards() {
  var posts = getFilteredPosts();
  posts.forEach(function(post, i) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    if (i < currentIndex) card.classList.add('left');
    if (i === currentIndex) card.classList.add('center');
    if (i > currentIndex) card.classList.add('right');

    // Image gallery
    const galleryDiv = document.createElement('div');
    galleryDiv.className = 'image-gallery';
    galleryDiv.style.height = 'calc(100vh / 4 + 50px)';
    
    if (post.images.length > 0) {
      const track = document.createElement('div');
      track.className = 'gallery-track';
      post.images.forEach(function(src, idx) {
        const img = document.createElement('img');
        img.src = 'https://picsum.photos/seed/reader_' + i + '_' + idx + '/800/400';
        img.alt = post.title;
        img.draggable = false;
        img.style.cursor = 'zoom-in';
        img.dataset.listIdx = idx;
        img.onclick = function(e) {
          e.stopPropagation();
          var list = post.images.map(function(s) { return resolveImageUrl(s); });
          openLightbox(list, idx);
        };
        // Load real image
        img.dataset.src = resolveImageUrl(src);
        var loader = new Image();
        loader.onload = function() { img.src = img.dataset.src; };
        loader.src = img.dataset.src;
        track.appendChild(img);
      });
      galleryDiv.appendChild(track);
      
      if (post.images.length > 1) {
        const dots = document.createElement('div');
        dots.className = 'image-dots';
        post.images.forEach((_, j) => {
          const dot = document.createElement('div');
          dot.className = 'image-dot' + (j === 0 ? ' active' : '');
          dots.appendChild(dot);
        });
        galleryDiv.appendChild(dots);
        
        let imgIndex = 0, imgStartX = 0, imgStartY = 0, imgPageWidth = 0, imgStartX2 = 0;
        // 缓存图片实际渲染宽度
        function getImgWidth() {
          const first = track.firstElementChild;
          return first ? first.getBoundingClientRect().width : galleryDiv.getBoundingClientRect().width;
        }
        galleryDiv.addEventListener('touchstart', e => {
          e.stopPropagation();
          imgStartX = e.touches[0].clientX;
          imgStartY = e.touches[0].clientY;
          imgPageWidth = getImgWidth();
          track.style.transition = 'none';
        }, { passive: true });
        galleryDiv.addEventListener('touchmove', e => {
          e.stopPropagation();
          const dx = e.touches[0].clientX - imgStartX;
          const dy = e.touches[0].clientY - imgStartY;
          // 横向滑动时阻止浏览器默认（避免与系统边缘返回手势抢手指），纵向滚动不受影响
          if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth + dx) + 'px)';
        }, { passive: false });
        galleryDiv.addEventListener('touchend', e => {
          e.stopPropagation();
          const diff = e.changedTouches[0].clientX - imgStartX;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          // 回到touchend时重新获取精确宽度（防止布局变化）
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
        // 鼠标拖拽图片翻页（PC端）
        galleryDiv.addEventListener('mousedown', e => {
          e.stopPropagation();
          imgStartX2 = e.clientX;
          imgPageWidth = getImgWidth();
          track.style.transition = 'none';
        });
        galleryDiv.addEventListener('mousemove', e => {
          if (imgStartX2 === 0) return;
          e.stopPropagation();
          const dx = e.clientX - imgStartX2;
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth + dx) + 'px)';
        });
        galleryDiv.addEventListener('mouseup', e => {
          if (imgStartX2 === 0) return;
          e.stopPropagation();
          const diff = e.clientX - imgStartX2;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          imgStartX2 = 0;
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
        galleryDiv.addEventListener('mouseleave', e => {
          if (imgStartX2 === 0) return;
          const diff = e.clientX - imgStartX2;
          if (diff < -30 && imgIndex < post.images.length - 1) imgIndex++;
          else if (diff > 30 && imgIndex > 0) imgIndex--;
          imgPageWidth = getImgWidth();
          track.style.transition = 'transform .3s ease';
          track.style.transform = 'translateX(' + (-imgIndex * imgPageWidth) + 'px)';
          imgStartX2 = 0;
          dots.querySelectorAll('.image-dot').forEach((d, idx) => d.classList.toggle('active', idx === imgIndex));
        });
      }
    } else {
      const track = document.createElement('div');
      track.className = 'gallery-track';
      const img = document.createElement('img');
      img.src = 'https://picsum.photos/seed/reader_' + i + '/800/400';
      img.alt = post.title;
      img.draggable = false;
      img.style.cursor = 'zoom-in';
      img.onclick = function(e) {
        e.stopPropagation();
        openLightbox([img.src], 0);
      };
      track.appendChild(img);
      galleryDiv.appendChild(track);
    }

    // Title
    const titleDiv = document.createElement('div');
    titleDiv.className = 'card-title';
    titleDiv.innerHTML = '<h1>' + escapeHtml(post.title) + '</h1><div class="meta">' + post.date + '</div>';

    // Content
    const contentDiv = document.createElement('div');
    contentDiv.className = 'card-content';
    var bodyHtml = mdToText(post.content);
    if (!bodyHtml.replace(/<[^>]+>/g, '').trim()) bodyHtml = '<p class="no-content">\u6682\u65E0\u6B63\u6587<br><br>\u6709\u65F6\u5019<br>\u9002\u5F53\u7559\u767D\u6BD4\u6587\u5B57<br>\u66F4\u5177\u5185\u6DB5<br>\u800C\u6C89\u9ED8\u6BD4\u5450\u558A<br>\u66F4\u5F70\u663E\u529B\u91CF</p>';
    contentDiv.innerHTML = '<div class="body">' + bodyHtml + '</div>';

    card.appendChild(galleryDiv);
    card.appendChild(titleDiv);
    card.appendChild(contentDiv);
    app.appendChild(card);
  });
}

function createPageNav() {
  pageBtn.textContent = '1 / ' + getFilteredPosts().length;
}
pageBtn.addEventListener('click', function() {
  var total = getFilteredPosts().length;
  if (total === 0) return;
  var input = prompt('输入页码 (1 - ' + total + ')', (currentIndex + 1) + '');
  if (input !== null) {
    var num = parseInt(input, 10);
    if (num >= 1 && num <= total) {
      currentIndex = num - 1;
      updateCards();
    }
  }
});

document.getElementById('firstBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  if (currentIndex > 0) { currentIndex = 0; updateCards(); }
});
document.getElementById('lastBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  var total = getFilteredPosts().length;
  if (currentIndex < total - 1) { currentIndex = total - 1; updateCards(); }
});

function updateCards() {
  var total = getFilteredPosts().length;
  if (total === 0) { pageBtn.textContent = '0 / 0'; return; }
  if (currentIndex >= total) currentIndex = total - 1;
  const cards = app.querySelectorAll('.card');
  cards.forEach((card, i) => {
    card.className = 'card';
    if (i < currentIndex) card.classList.add('left');
    if (i === currentIndex) card.classList.add('center');
    if (i > currentIndex) card.classList.add('right');
  });
  pageBtn.textContent = (currentIndex + 1) + ' / ' + total;
  localStorage.setItem(STORAGE_KEY, currentIndex);
  if (hintVisible) {
    hintEl.classList.remove('hidden');
    setTimeout(() => { hintEl.classList.add('hidden'); hintVisible = false; }, 3000);
  }
  var posts = getFilteredPosts();
  if (posts[currentIndex]) document.title = '小红故事|Blog – ' + escapeHtml(posts[currentIndex].title);
}

function bindEvents() {
  app.addEventListener('touchstart', onTouchStart, { passive: true });
  app.addEventListener('touchmove', onTouchMove, { passive: false });
  app.addEventListener('touchend', onTouchEnd);
  app.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  document.addEventListener('keydown', onKeyDown);
}

function onTouchStart(e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isDragging = true; }
function onTouchMove(e) {
  if (!isDragging) return;
  moveX = e.touches[0].clientX - startX;
  moveY = e.touches[0].clientY - startY;
  if (Math.abs(moveX) > Math.abs(moveY)) e.preventDefault();
}
function onTouchEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  const threshold = 60;
  if (moveX < -threshold && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (moveX > threshold && currentIndex > 0) { currentIndex--; updateCards(); }
  moveX = 0; moveY = 0;
}
function onMouseDown(e) { startX = e.clientX; startY = e.clientY; isDragging = true; app.style.cursor = 'grabbing'; }
function onMouseMove(e) {
  if (!isDragging) return;
  moveX = e.clientX - startX;
  moveY = e.clientY - startY;
  if (Math.abs(moveX) > Math.abs(moveY)) e.preventDefault();
}
function onMouseUp(e) {
  if (!isDragging) return;
  isDragging = false;
  app.style.cursor = '';
  const threshold = 60;
  if (moveX < -threshold && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (moveX > threshold && currentIndex > 0) { currentIndex--; updateCards(); }
  moveX = 0; moveY = 0;
}
function onKeyDown(e) {
  if (e.key === 'ArrowRight' && currentIndex < POSTS.length - 1) { currentIndex++; updateCards(); }
  else if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateCards(); }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Lightbox 图片放大（支持多图左右滑）
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbCounter = document.getElementById('lbCounter');
var lbImages = [];
var lbIndex = 0;

function renderLightbox() {
  if (!lbImages.length) return;
  lightboxImg.src = lbImages[lbIndex];
  lbPrev.style.display = lbIndex > 0 ? 'flex' : 'none';
  lbNext.style.display = lbIndex < lbImages.length - 1 ? 'flex' : 'none';
  lbCounter.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
}

function openLightbox(list, idx) {
  lbImages = list;
  lbIndex = idx;
  renderLightbox();
  lightbox.classList.add('show');
}

function closeLightbox() {
  lightbox.classList.remove('show');
  setTimeout(function() { lightboxImg.src = ''; }, 300);
}

function lbPrevImg() {
  if (lbIndex > 0) { lbIndex--; renderLightbox(); }
}

function lbNextImg() {
  if (lbIndex < lbImages.length - 1) { lbIndex++; renderLightbox(); }
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', function(e) {
  if (e.target === lightbox || e.target === document.getElementById('lbImgWrap')) closeLightbox();
});
lbPrev.addEventListener('click', function(e) { e.stopPropagation(); lbPrevImg(); });
lbNext.addEventListener('click', function(e) { e.stopPropagation(); lbNextImg(); });
document.addEventListener('keydown', function(e) {
  if (!lightbox.classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lbPrevImg();
  else if (e.key === 'ArrowRight') lbNextImg();
});

// Lightbox touch swipe
var lbStartX = 0;
document.getElementById('lbImgWrap').addEventListener('touchstart', function(e) {
  lbStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('lbImgWrap').addEventListener('touchend', function(e) {
  var diff = e.changedTouches[0].clientX - lbStartX;
  if (diff < -40) lbNextImg();
  else if (diff > 40) lbPrevImg();
}, { passive: true });

// 浮窗菜单
var floatBtn = document.getElementById('readerFloatBtn');
var floatMenu = document.getElementById('readerFloatMenu');
floatBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  floatMenu.classList.toggle('show');
});
document.addEventListener('click', function() {
  floatMenu.classList.remove('show');
});
floatMenu.addEventListener('click', function(e) {
  e.stopPropagation();
});

// 分类筛选菜单
catBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  catMenu.classList.toggle('show');
});
document.addEventListener('click', function() {
  catMenu.classList.remove('show');
});
catMenu.addEventListener('click', function(e) {
  e.stopPropagation();
});

// ===== 主题切换 =====
function detectTheme() {
  var stored = localStorage.getItem('reader_theme');
  if (stored === 'dark' || stored === 'light') return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function updateThemeBtn(theme) {
  var btn = document.getElementById('themeBtn');
  if (theme === 'dark') {
    btn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#f0a500"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f0a500" stroke-width="2" fill="none"/></svg>';
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#0f3460"/></svg>';
  }
}

(function initTheme() {
  var theme = detectTheme();
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn(theme);
})();

document.getElementById('themeBtn').addEventListener('click', function() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('reader_theme', next);
  updateThemeBtn(next);
});

// 分享功能（已移除）

main();
</script>

<script>
// 边缘手势锁：排除左右边缘系统返回手势（防横滑翻页误触退出），离开页面恢复
(function(){
  function lockEdge(lock){ try{ if(window.AppBridge && window.AppBridge.setEdgeLock) window.AppBridge.setEdgeLock(lock ? '1' : '0'); }catch(e){} }
  function guardBack(g){ try{ if(window.AppBridge && window.AppBridge.setBackGuard) window.AppBridge.setBackGuard(g ? '1' : '0'); }catch(e){} }
  lockEdge(true);
  guardBack(true);
  window.addEventListener('pagehide', function(){ lockEdge(false); guardBack(false); });
})();
</script>
<script>
// 菜单解锁：按「登录 + 该栏目已真气解锁」判断（读云端 waline 游戏记录），未解锁置灰+提示；传送回修真小世界不锁定
(function(){
  // 仅以 APP 主登录 key WALINE_USER 判定（'@waline/user' 是 Waline 评论组件写入，登出残留会导致误判已登录）
  function getWalineUser(){
    try{
      var v = localStorage.getItem('WALINE_USER') || sessionStorage.getItem('WALINE_USER');
      if (v) { var u = JSON.parse(v); if (u && (u.display_name || u.nick || u.name)) return u; }
    }catch(e){}
    return null;
  }
  // 栏目文件 → 解锁标记 key（与 APP.html 游戏记录字段一致）
  var KEY_BY_FILE = { 'reader.html':'story', 'yedu_p.html':'yedu', 'zjsz_p.html':'zjsz', 'DaliyNews_p.html':'news', 'tv_p.html':'tv' };
  // 健壮解析（兼容 Waline markdown 渲染污染，同 APP.html parseGameRecord）
  function parseGameRecord(raw){
    if (!raw) return null;
    var s = String(raw).replace(/<[^>]*>/g, '')
      .replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
      .replace(/&quot;/g, '"').replace(/&#34;/g, '"')
      .replace(/&amp;/g, '&').replace(/&#38;/g, '&')
      .replace(/&lt;/g, '<').replace(/&#60;/g, '<')
      .replace(/&gt;/g, '>').replace(/&#62;/g, '>');
    var st = s.indexOf('{'); var en = s.lastIndexOf('}');
    if (st >= 0 && en > st) s = s.slice(st, en + 1);
    try { return JSON.parse(s); } catch(e){ return null; }
  }
  function tip(msg){
    var t = document.getElementById('menuLockTip');
    if (!t) { t = document.createElement('div'); t.id = 'menuLockTip'; t.className = 'menu-lock-tip'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  var menu = document.getElementById('readerFloatMenu');
  if (!menu) return;
  var links = Array.prototype.slice.call(menu.querySelectorAll('a.menu-item:not(.menu-home)'));
  function lockItem(a){
    if (a.classList.contains('locked')) return;
    a.classList.add('locked');
    a.insertAdjacentHTML('beforeend', '<span class="menu-lock-icon">🔒</span>');
    a.addEventListener('click', function(e){ if (!a.classList.contains('locked')) return; e.preventDefault(); tip('封印未破!请往修真小世界破除。'); }); // unlockItem 后已解锁，不拦截跳转
  }
  function unlockItem(a){
    a.classList.remove('locked');
    var ic = a.querySelector('.menu-lock-icon');
    if (ic) ic.remove();
  }
  function fileOf(href){ try { var p = String(href).split('/'); return p[p.length - 1]; } catch(e){ return ''; } }
  function lockAll(){ for (var i = 0; i < links.length; i++) lockItem(links[i]); }
  function applyUnlocks(ul){
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var key = KEY_BY_FILE[fileOf(a.getAttribute('href') || '')];
      if (key && ul && ul[key]) unlockItem(a);
    }
  }
  var user = getWalineUser();
  // 登录区：头像（点击弹留言窗）
  var ua = document.getElementById('userAvatar');
  if (ua && user) {
    if (user.avatar) ua.src = user.avatar;
  }
  if (!user) { lockAll(); return; } // 未登录：全部锁定
  // 已登录：保守先全锁，再按云端解锁状态刷新（fetch 失败保持锁定，宁锁勿放）
  lockAll();
  var token = user.token || '';
  var url = 'https://waline.snowhoo.net/api/comment?path=/app-game/actions' + (token ? '&token=' + encodeURIComponent(token) : '');
  fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(resp){
      var records = (resp.data && resp.data.data) || [];
      var found = null, foundOid = 0;
      for (var i = 0; i < records.length; i++) {
        try {
          var rec = records[i];
          if ((rec.nick || '') !== user.display_name) continue;
          var obj = parseGameRecord(rec.orig || rec.comment || '');
          var oid = parseInt(rec.objectId, 10) || 0;
          if (obj && typeof obj.points === 'number' && oid > foundOid) { found = obj; foundOid = oid; }
        } catch(e){}
      }
      if (!found) return null;
      return {
        story: found.storyUnlocked ? 1 : 0,
        yedu: found.yeduUnlocked ? 1 : 0,
        zjsz: found.zjszUnlocked ? 1 : 0,
        news: found.newsUnlocked ? 1 : 0,
        tv: found.tvUnlocked ? 1 : 0
      };
    })
    .then(function(ul){ if (ul) applyUnlocks(ul); })
    .catch(function(e){ console.warn('[菜单解锁] 拉取解锁状态失败，保持锁定:', e); });
})();
</script>

<script>
// 登录留言弹窗（与修真小世界一致）：点头像打开；Waline 留言/登录
(function(){
  var overlay = document.getElementById('commentOverlay');
  var userArea = document.getElementById('userArea');
  var closeBtn = document.getElementById('commentClose');
  if (userArea) userArea.addEventListener('click', function(){ if (overlay) overlay.classList.add('active'); });
  if (closeBtn) closeBtn.addEventListener('click', function(){ if (overlay) overlay.classList.remove('active'); });
  if (overlay) overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.classList.remove('active'); });
  // 刷新底部登录区（头像+用户名）
  function refreshUser(){
    var ua = document.getElementById('userAvatar');
    try {
      var v = localStorage.getItem('WALINE_USER');
      var u = v ? JSON.parse(v) : null;
      if (u && (u.display_name || u.nick || u.name)) {
        if (ua && u.avatar) ua.src = u.avatar;
      } else {
        if (ua) ua.removeAttribute('src');
      }
    } catch(e){}
  }
  refreshUser();
  // Waline 初始化（动态 import，同修真小世界）
  try {
    import('./lib/waline.js').then(function(mod){
      try {
        mod.init({
          el: '#walineContainer',
          serverURL: 'https://waline.snowhoo.net',
          lang: 'zh-CN',
          avatar: 'mp',
          pageview: false,
          locale: { placeholder: '说点什么吧...', comment: '留言' },
          onLogin: function(user){
            try { localStorage.setItem('WALINE_USER', JSON.stringify(user)); } catch(e){}
            refreshUser();
          },
          onLogout: function(){
            try { localStorage.removeItem('WALINE_USER'); localStorage.removeItem('@waline/user'); } catch(e){}
            refreshUser();
          }
        });
      } catch(e){ console.warn('[留言] Waline init error:', e); }
    }).catch(function(e){ console.warn('[留言] Waline import error:', e); });
      } catch(e){ console.warn('[留言] Waline 初始化失败:', e); }
})();
</script>

<!-- 讯飞语音朗读：通用朗读器（时间戳强制最新版，彻底绕开 WebView 顽固缓存） -->
<script>
(function(){
  function loadTTS(cb){
    var s = document.createElement('script');
    s.src = 'tts.js?ts=' + Date.now();
    s.onload = function(){ cb && cb(); };
    s.onerror = function(){ /* 加载失败静默：控制条为空自动隐藏 */ };
    document.head.appendChild(s);
  }
  loadTTS(function(){
    // 朗读控制条挂载到底部状态栏（常驻）：▶ 播放/暂停 · ⏹ 停止 · 语速 · 发音人
    var mount = document.getElementById('ttsBarMount');
    if (mount) TTS.mount(mount);

    // 朗读内容提供函数：从当前文章开始连续向后构建朗读队列
    TTS.setProvider(function(){
      var posts = getFilteredPosts();
      if (!posts.length || !posts[currentIndex]) return [];
      var items = [];
      for (var i = currentIndex; i < posts.length; i++) {
        var p = posts[i];
        var html = mdToText(p.content || '');
        var div = document.createElement('div');
        div.innerHTML = html;
        var text = (div.textContent || '').replace(/\u00a0/g, ' ').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        // 无正文 → 用与页面一致的占位文案；标题始终朗读，不再整篇跳过
        if (!text) {
          text = '暂无正文。有时候，适当留白比文字更具内涵，而沉默比呐喊更彰显力量。';
        }
        var title = p.title || '';
        var t = (title ? title + '。' : '') + text;
        if (!t.trim()) continue;
        items.push({ title: title, text: t });
      }
      return { items: items, label: '小红故事' };
    });

    // 切换到新文章时若正在朗读 → 停止（避免与正在读的内容错位）
    var _rawUpdate = window.updateCards;
    if (typeof _rawUpdate === 'function') {
      window.updateCards = function(){
        var r = _rawUpdate.apply(this, arguments);
        if (window.TTS && TTS.isSpeaking()) TTS.stop();
        return r;
      };
    }

    // 朗读跨篇时自动翻页（保持"看到的=听到的"）：
    // 朗读队列从 currentIndex 开始构建，第 itemIdx 篇对应文章 currentIndex + itemIdx；
    // 用原始 updateCards 翻页（不触发上方"翻页即停朗读"逻辑）
    TTS.onItemChange(function(itemIdx){
      if (!_rawUpdate) return;
      var posts = getFilteredPosts();
      var target = currentIndex + itemIdx;
      if (target >= 0 && target < posts.length && target !== currentIndex) {
        currentIndex = target;
        _rawUpdate();
      }
    });
  });
})();
</script>
